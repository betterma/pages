# 仅在「页面代码」变更时部署 GitHub Pages。
# 云函数高频写入的 watch-*.json / okx favorites 等不会触发构建。
# 业务数据本身由页面通过 GitHub API / raw / OBS 读取，不依赖这次静态部署。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # 云函数 / 页面共享状态（高频）
      - "watch-*.json"
      - "okx/favorites.json"
      - "okx/candles-cache.json"
      # 其它偶发大数据，避免无意义整站重建
      - "**/node_modules/**"
      - "**/*.log"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 整仓静态站（与原先 branch 部署一致）；JSON 仍会打进产物，
          # 只是 JSON-only 的 commit 不再触发本工作流。
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
