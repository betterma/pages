name: Binance Radar Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Binance monitor
        run: node monitor.js
        env:
          GITHUB_REPO: ${{ github.repository }}
          DATA_PATH: watch-data.json
          GITHUB_TOKEN: ${{ github.token }}

      - name: Show token presence for debug
        if: always()
        env:
          GITHUB_REPO: ${{ github.repository }}
          DATA_PATH: watch-data.json
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "GITHUB_REPO=${GITHUB_REPO}"
          echo "DATA_PATH=${DATA_PATH}"
          if [ -n "${GITHUB_TOKEN}" ]; then echo "GITHUB_TOKEN is present"; else echo "GITHUB_TOKEN is missing"; fi
