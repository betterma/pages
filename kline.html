<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>观察池 K 线</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f5f3;
        color: #28323a;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        --float-dock-h: 48px;
        padding-bottom: var(--float-dock-h);
      }
      .page {
        width: min(1400px, calc(100% - 20px));
        margin: 12px auto 24px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      h2.section-title {
        margin: 16px 0 6px;
        font-size: 15px;
      }
      .section-title-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 16px 0 6px;
      }
      .section-title-row .section-title {
        margin: 0;
      }
      .section-title-row .maint-toggle {
        margin-left: auto;
      }
      .ghost-action {
        flex-shrink: 0;
        border: none;
        background: transparent;
        color: #9aa3a0;
        font-size: 11px;
        padding: 0 2px;
        line-height: 1;
        cursor: pointer;
        opacity: 0.72;
      }
      .ghost-action:hover {
        color: #5a6a68;
        opacity: 1;
        background: transparent;
      }
      .ghost-action.is-active {
        color: #2f8f6e;
        opacity: 1;
      }
      .nav-link {
        color: #5a6a68;
        font-size: 13px;
        text-decoration: none;
      }
      .nav-link:hover {
        text-decoration: underline;
      }
      .friend-links {
        position: relative;
        font-size: 13px;
        color: #5a6a68;
      }
      .friend-links > summary {
        list-style: none;
        cursor: pointer;
        user-select: none;
        padding: 4px 2px;
      }
      .friend-links > summary::-webkit-details-marker {
        display: none;
      }
      .friend-links > summary::after {
        content: " ▾";
        font-size: 11px;
        opacity: 0.7;
      }
      .friend-links[open] > summary::after {
        content: " ▴";
      }
      .friend-links-panel {
        position: absolute;
        left: 0;
        top: calc(100% + 4px);
        z-index: 30;
        min-width: 140px;
        padding: 6px;
        border: 1px solid rgba(90, 106, 104, 0.22);
        border-radius: 10px;
        background: rgba(251, 252, 250, 0.96);
        box-shadow: 0 8px 20px rgba(40, 50, 58, 0.1);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .friend-links-panel a {
        color: #28323a;
        text-decoration: none;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 13px;
      }
      .friend-links-panel a:hover {
        background: rgba(90, 106, 104, 0.1);
      }
      body.is-notes-view .page-section,
      body.is-notes-view #hiddenPinTab,
      body.is-notes-view #hiddenPinDrawer,
      body.is-notes-view #pinSelectBtn,
      body.is-notes-view #pinBatchBar,
      body.is-notes-view #pinSortSwitch,
      body.is-notes-view #recentAutoPinSection {
        display: none !important;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mode-switch {
        display: inline-flex;
        align-items: stretch;
        padding: 2px;
        border: 1px solid #d8ddda;
        border-radius: 8px;
        background: #eef1ee;
        flex-shrink: 0;
      }
      .mode-switch button {
        border: none;
        background: transparent;
        color: #78817f;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.2;
        cursor: pointer;
      }
      .mode-switch button:hover {
        color: #3d4a48;
        background: transparent;
      }
      .mode-switch button.is-active {
        background: #fbfcfa;
        color: #28323a;
        box-shadow: 0 1px 2px rgba(40, 50, 48, 0.08);
      }
      .mode-switch button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .pin-sort-switch {
        margin-left: 2px;
      }
      .section-title-row .pin-sort-switch {
        margin-left: 0;
      }
      .recent-auto-pin {
        margin: 0 0 12px;
      }
      .recent-auto-pin[hidden] {
        display: none !important;
      }
      .recent-auto-pin-head {
        font-size: 12px;
        color: #78817f;
        margin: 0 0 6px;
      }
      .recent-auto-pin .kline-card {
        border-color: #2f8f6e;
        box-shadow: 0 0 0 1px rgba(47, 143, 110, 0.18);
      }
      .mode-progress {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(244, 245, 243, 0.55);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
      }
      .mode-progress.is-on {
        opacity: 1;
        pointer-events: auto;
      }
      .mode-progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        z-index: 91;
        background: rgba(216, 221, 218, 0.85);
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
      }
      .mode-progress-bar.is-on {
        opacity: 1;
      }
      .mode-progress-bar > span {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #71a89a, #2f8f6e);
        transition: width 0.28s ease;
      }
      .mode-progress-bar.is-indeterminate > span {
        width: 40%;
        transition: none;
        animation: mode-progress-slide 1s ease-in-out infinite;
      }
      .mode-progress-label {
        font-size: 13px;
        color: #5a6a68;
        background: rgba(251, 252, 250, 0.92);
        border: 1px solid rgba(200, 208, 204, 0.9);
        border-radius: 8px;
        padding: 8px 14px;
        box-shadow: 0 6px 18px rgba(40, 50, 48, 0.08);
      }
      @keyframes mode-progress-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      button {
        border: 1px solid #c9d0d0;
        background: #fbfcfa;
        color: #28323a;
        padding: 8px 13px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #eef1ee;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      select.range-select {
        border: 1px solid #c9d0d0;
        background: #fbfcfa;
        color: #28323a;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        max-width: min(220px, 52vw);
      }
      select.range-select:hover {
        background: #eef1ee;
      }
      select.range-select:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 13px;
        color: #78817f;
        margin-bottom: 10px;
      }
      .status #statusText {
        min-width: 0;
        flex: 1 1 auto;
      }
      .data-as-of {
        flex-shrink: 0;
        font-size: 12px;
        color: #5a6a68;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(113, 139, 136, 0.12);
      }
      .data-as-of:empty {
        display: none;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #a39d95;
        flex-shrink: 0;
      }
      .dot.online {
        background: #718b88;
        box-shadow: 0 0 8px rgba(113, 139, 136, 0.35);
      }
      .dot.offline {
        background: #8d7771;
      }
      .meta {
        color: #78817f;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .pin-meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .pin-meta-row .meta {
        margin-bottom: 0;
        flex: 1;
        min-width: 0;
      }
      .pin-momentum-meta {
        margin: -2px 0 10px;
        font-size: 12px;
        line-height: 1.45;
        color: #3d4a48;
      }
      .pin-momentum-meta[hidden] {
        display: none !important;
      }
      .pin-momentum-meta .mom-label {
        color: #78817f;
      }
      .pin-momentum-meta .mom-hot {
        color: #2f8f6e;
        font-weight: 650;
      }
      .pin-momentum-meta .mom-cool {
        color: #8d7771;
      }
      .kline-card.is-select-mode {
        cursor: pointer;
      }
      .kline-card.is-selected {
        outline: 1px solid rgba(47, 143, 110, 0.55);
        outline-offset: 1px;
      }
      .pin-check {
        position: absolute;
        left: 6px;
        bottom: 6px;
        z-index: 2;
        width: 14px;
        height: 14px;
        margin: 0;
        accent-color: #2f8f6e;
        cursor: pointer;
        opacity: 0.85;
      }
      .kline-card.is-note .pin-check {
        bottom: 26px;
      }
      .pin-batch-bar {
        position: fixed;
        left: 50%;
        bottom: calc(var(--float-dock-h, 48px) + 10px);
        transform: translateX(-50%);
        z-index: 80;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid rgba(200, 208, 204, 0.85);
        background: rgba(251, 252, 250, 0.94);
        color: #5a6a68;
        box-shadow: 0 4px 14px rgba(40, 50, 48, 0.1);
        max-width: calc(100vw - 16px);
      }
      .pin-batch-bar[hidden] {
        display: none !important;
      }
      .pin-batch-bar .pin-batch-count {
        font-size: 11px;
        color: #9aa3a0;
        margin-right: 2px;
        white-space: nowrap;
      }
      .pin-batch-bar button {
        border: none;
        background: transparent;
        color: #5a6a68;
        padding: 3px 6px;
        border-radius: 4px;
        font-size: 11px;
      }
      .pin-batch-bar button:hover {
        background: rgba(90, 106, 104, 0.08);
      }
      .pin-batch-bar button.is-primary {
        color: #2f8f6e;
      }
      .pin-batch-bar button.is-danger {
        color: #a05a52;
      }
      .pin-batch-bar button:disabled {
        opacity: 0.35;
      }
      .pin-meta-row button,
      .maint-panel button {
        flex-shrink: 0;
        font-size: 12px;
        padding: 6px 10px;
      }
      .maint-toggle {
        color: #9aa3a0;
        border: none;
        background: transparent;
        padding: 0 2px;
        font-size: 11px;
        opacity: 0.72;
      }
      .maint-toggle:hover {
        color: #5a6a68;
        opacity: 1;
        background: transparent;
        border: none;
      }
      .maint-toggle[aria-expanded="true"] {
        color: #5a6a68;
        opacity: 1;
        border: none;
        background: transparent;
      }
      .maint-panel {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
        margin: -4px 0 10px;
      }
      .maint-panel[hidden] {
        display: none !important;
      }
      .maint-panel .maint-empty {
        font-size: 12px;
        color: #9aa3a0;
      }
      .maint-panel button.is-danger {
        color: #7a4a42;
        border-color: #d4b8b2;
      }
      .hidden-pin-tab {
        position: fixed;
        top: 42%;
        right: 0;
        z-index: 40;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        letter-spacing: 0.12em;
        border: 1px solid #c9d0d0;
        border-right: 0;
        border-radius: 8px 0 0 8px;
        background: #eef2ef;
        color: #3d4a48;
        padding: 14px 8px;
        font-size: 13px;
        cursor: pointer;
        box-shadow: -2px 2px 10px rgba(40, 50, 48, 0.08);
      }
      .hidden-pin-tab:hover {
        background: #e4ebe6;
      }
      .hidden-pin-tab[data-count="0"] {
        opacity: 0.55;
      }
      .hidden-pin-tab .tab-count {
        display: inline-block;
        margin-top: 8px;
        writing-mode: horizontal-tb;
        font-size: 12px;
        color: #5a6a68;
      }
      .hidden-pin-drawer {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
      }
      .hidden-pin-drawer.is-open {
        pointer-events: auto;
      }
      .hidden-pin-mask {
        position: absolute;
        inset: 0;
        background: rgba(28, 34, 32, 0.35);
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .hidden-pin-drawer.is-open .hidden-pin-mask {
        opacity: 1;
      }
      .hidden-pin-panel {
        position: absolute;
        top: 0;
        right: 0;
        width: min(420px, 92vw);
        height: 100%;
        background: #f4f5f3;
        border-left: 1px solid #d0d6d2;
        box-shadow: -8px 0 28px rgba(20, 28, 26, 0.18);
        transform: translateX(104%);
        transition: transform 0.22s ease;
        display: flex;
        flex-direction: column;
      }
      .hidden-pin-drawer.is-open .hidden-pin-panel {
        transform: translateX(0);
      }
      .hidden-pin-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 14px 10px;
        border-bottom: 1px solid #dce2de;
      }
      .hidden-pin-head h3 {
        margin: 0;
        font-size: 16px;
      }
      .hidden-pin-head p {
        margin: 4px 0 0;
        font-size: 12px;
        color: #78817f;
      }
      .hidden-pin-body {
        flex: 1;
        overflow: auto;
        padding: 12px;
      }
      .hidden-pin-body .kline-grid {
        grid-template-columns: 1fr;
      }
      .hint {
        color: #9aa3a0;
        font-size: 12px;
        margin: -2px 0 10px;
      }
      .kline-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 10px;
      }
      .kline-card {
        position: relative;
        min-width: 0;
        padding: 8px 10px 10px;
        background: #fbfcfa;
        border: 1px solid #d8ddda;
        border-radius: 8px;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        scroll-margin-top: 12px;
      }
      .kline-card.is-pressed {
        transform: scale(0.98);
        box-shadow: 0 0 0 2px rgba(113, 139, 136, 0.35);
      }
      .kline-card.is-favorite {
        border-color: #b7c4b8;
      }
      .kline-card.is-pair {
        border-width: 2px;
        border-color: #1a1a1a;
      }
      .kline-card.is-pin {
        border-color: #5a6a68;
      }
      .kline-card.is-expired {
        opacity: 0.48;
        filter: grayscale(0.55);
      }
      .kline-card.is-expired:hover {
        opacity: 0.72;
      }
      .kline-card.is-position {
        border-color: #6b7f6e;
      }
      .pin-mark,
      .pos-mark {
        position: absolute;
        top: 6px;
        right: 8px;
        color: #5a6a68;
        font-size: 11px;
        line-height: 1;
        pointer-events: none;
      }
      .pos-mark {
        right: 8px;
        top: 22px;
        color: #4f7a6e;
      }
      .notify-float.is-action-log {
        width: min(420px, 100vw);
        max-height: min(42vh, calc(100vh - var(--float-dock-h, 48px) - 8px));
      }
      .action-log-body {
        padding: 8px 10px 10px;
        overflow: auto;
        font-size: 12px;
        line-height: 1.45;
        color: #3d4a48;
        -webkit-overflow-scrolling: touch;
      }
      .action-log-row {
        padding: 4px 0;
        border-bottom: 1px solid rgba(220, 226, 222, 0.45);
      }
      .action-log-row:last-child {
        border-bottom: none;
      }
      .action-log-time {
        color: #9aa3a0;
        margin-right: 6px;
        font-variant-numeric: tabular-nums;
      }
      .action-log-kind {
        color: #78817f;
        margin-right: 4px;
      }
      .action-log-body .notify-coin {
        color: #3d4a48;
        text-decoration: none;
        border-bottom: 1px dotted rgba(90, 106, 104, 0.45);
      }
      .action-log-body .notify-coin:hover {
        color: #2f8f6e;
      }
      .action-log-empty {
        color: #9aa3a0;
        padding: 12px 4px;
      }
      /* Align with WeCom: 5m three-up = green, 15m 2/3 = orange */
      .kline-card-head .symbol-copy.is-streak5 {
        color: #2f8f6e;
      }
      .kline-card-head .symbol-copy.is-heat15 {
        color: #c47a3a;
      }
      .mom-badge {
        position: absolute;
        right: 8px;
        bottom: 8px;
        z-index: 1;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
        line-height: 1.3;
        cursor: help;
        color: #f4f7f5;
        pointer-events: auto;
      }
      .mom-badge.is-streak5 {
        background: rgba(47, 143, 110, 0.92);
      }
      .mom-badge.is-heat15 {
        background: rgba(196, 122, 58, 0.92);
      }
      .price-up-last-mark {
        color: #2f8f6e;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .pin-stats {
        display: block;
        width: 100%;
        margin: 0;
        padding: 0;
        font-size: 10px;
        line-height: 1.4;
        color: #5a6a68;
        font-weight: 400;
        white-space: normal;
      }
      .pin-stats .pin-stat-row {
        display: block;
      }
      .pin-stats .pin-flags {
        margin-top: 1px;
        color: #78817f;
      }
      .pin-stats .pin-flag {
        font-weight: 650;
      }
      .pin-stats .pin-flag.is-remain {
        color: #5a6a68;
      }
      .pin-stats .pin-flag.is-at {
        color: #2f8f6e;
      }
      .pin-stats .pin-flag.is-5m {
        color: #2f8f6e;
      }
      .pin-stats .pin-flag.is-15m {
        color: #c47a3a;
      }
      .pin-stats .pin-flag.is-expired {
        color: #8d7771;
      }
      .kline-card-head.is-pin-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        padding-right: 28px;
      }
      .kline-card-head.is-pin-head .symbol-copy {
        font-size: 13px;
      }
      .kline-card.is-jump-target {
        outline: 2px solid #2f8f6e;
        outline-offset: 2px;
        box-shadow: 0 0 0 4px rgba(47, 143, 110, 0.18);
        transition: outline 0.2s ease, box-shadow 0.2s ease;
      }
      .notify-float {
        position: fixed;
        left: 0;
        right: 0;
        bottom: var(--float-dock-h, 48px);
        z-index: 40;
        width: min(680px, 100vw);
        max-width: 100vw;
        max-height: min(52vh, calc(100vh - var(--float-dock-h, 48px) - 8px));
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(90, 106, 104, 0.22);
        border-bottom: none;
        border-radius: 12px 12px 0 0;
        background: rgba(244, 245, 243, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 -8px 24px rgba(40, 50, 58, 0.1);
      }
      .notify-float[hidden] {
        display: none !important;
      }
      .notify-float.is-momentum {
        width: min(480px, calc(100vw - 24px));
      }
      .notify-float-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid rgba(220, 226, 222, 0.55);
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 12px 12px 0 0;
      }
      .notify-float-head strong {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 650;
      }
      .notify-float-head .notify-time {
        margin-left: 6px;
        font-size: 11px;
        color: #78817f;
        font-weight: 400;
      }
      .notify-float-refresh,
      .notify-float-close {
        border: none;
        background: rgba(90, 106, 104, 0.08);
        color: #5a6a68;
        padding: 4px 10px;
        min-width: 36px;
        min-height: 32px;
        font-size: 14px;
        line-height: 1;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .notify-float-close {
        font-size: 18px;
      }
      .notify-float-refresh:hover,
      .notify-float-close:hover {
        background: rgba(90, 106, 104, 0.16);
      }
      .notify-float-refresh:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .notify-float-body {
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        padding: 10px 12px 12px;
        font-size: 12px;
        line-height: 1.55;

        <div class="notify-col">
          <div class="notify-col-title">盯一下</div>

    <div class="float-tabs" role="tablist" aria-label="浮窗">
      <button
        type="button"

    <script src="./watch-favorites.js"></script>
    <script>
      "use strict";

      const CONFIG = {
        HISTORY_DURATION: 3 * 24 * 60 * 60 * 1000,
        KLINE_RANGE_DAYS_DEFAULT: 3,
        KLINE_RANGE_DAYS_EXTENDED: 10,
        GITHUB_REPO: "betterma/pages",
        GITHUB_PATH: "watch-data.json",
        OBS_BASE: "https://mpctest.obs.cn-north-4.myhuaweicloud.com",
        FAVORITES_PATH: "watch-favorites.json",
        BLACKLIST_PATH: "watch-blacklist.json",
        PINS_PATH: "watch-pins.json",
        MOM_NOTES_PATH: "watch-mom-notes.json",
        POSITIONS_PATH: "watch-positions.json",
        WATCH_POOL_RANK: 30,
        WINDOW_TOLERANCE_MS: 2 * 60 * 1000,
        KLINE_MAX_LIMIT: 1000,
        KLINE_INTERVAL: "4h",
        SIGNAL_INTERVAL: "15m",
        SIGNAL_LIMIT: 200,
        // 卡片 K 线 / 近2h动量 并发（每批同时处理的币数）。
        // 盯一下卡每币最多 3 路请求，过大易触币安限流。
        KLINE_CARD_CONCURRENCY: 10,
        MOMENTUM_FETCH_CONCURRENCY: 12,
        LONG_PRESS_MS: 550,
        MOMENTUM_5M_LIMIT: 5,
        NOTIFY_STATE_PATH: "watch-notify-state.json",
        // WeCom notify runs ~5m; poll often enough without hammering GitHub.
        NOTIFY_POLL_MS: 60 * 1000,
        // Skip focus auto-refresh if data is still fresher than this.
        DATA_FOCUS_REFRESH_MIN_MS: 45 * 1000,
        // 近2h 五段轨迹（15m 回算）+ 爬升判定；可按真实案例调。
        MOMENTUM_TREND: {
          // 15m bars to fetch (need ≥14 closed for 60m of 2h history).
          klineLimit: 24,
          trailPoints: 5,
          // 2h window in 15m bars.
          bars2h: 8,
          // Climb needs Δ = v4 − v0 ≥ this (percentage points).
          // Flat (横盘) uses the same bar: v4 > 0 && abs(Δ) < minDeltaPts.
          minDeltaPts: 1.5,
          // Minimum step between adjacent trail points to count as "up".
          minStepPts: 0.3,
          // Hard veto: peak(v0…v3) − v4 ≥ this → not climb.
          // Note: +5→+8→+13→+11→+12 has peakDrop=1pt → does NOT veto at 2.
          dropFromPeakPts: 2,
        },
      };
      const DURATION_MS = {
        "15m": 15 * 60 * 1000,
        "30m": 30 * 60 * 1000,
        "1h": 60 * 60 * 1000,
        "2h": 2 * 60 * 60 * 1000,
        "4h": 4 * 60 * 60 * 1000,
        "1d": 24 * 60 * 60 * 1000,
      };
      const KLINE_VIEWS = {
        "3d-4h": {
          days: 3,
          chartInterval: "4h",
          label: "近3天 · 4h",
        },
        "10d-4h": {
          days: 10,
          chartInterval: "4h",
          label: "近10天 · 4h",
        },
        "10d-1d": {
          days: 10,
          chartInterval: "1d",
          label: "近10天 · 1天",
        },
      };

      const marketMap = {};
      let history = [];
      let watchPool = new Set();
      let favoriteItems = [];
      let blacklistItems = [];
      let pinItems = [];
      let positionItems = [];
      let lastPinPrices = {};
      let lastPinNotify = null;
      let lastPositionNotify = null;
      let lastMomentumSnapshot = null;
      let notifyFloatRefreshing = false;
      let momentumFloatRefreshing = false;
      let momNoteItems = [];
      let momNotesSaving = false;
      let momNotesExpanded = true;
      const MOM_NOTES_LOCAL_KEY = "kline-mom-notes-v1";
      const MOM_NOTES_MAX = 30;
      const RISING_SNAP_KEY = "kline-rising-snap-v1";
      const RISING_SNAP_SEEDED_KEY = "kline-rising-snap-seeded-v1";
      const ACTION_LOG_KEY = "kline-action-log-v1";
      const ACTION_LOG_MAX = 80;
      const PIN_SORT_KEY = "kline-pin-sort-v1";
      const AUTO_PIN_EVENTS_SEEN_KEY = "kline-auto-pin-events-seen-v1";
      const NEW_AUTO_PIN_MS = 30 * 60 * 1000;
      let pinSortMode = "pin";
      // 默认盯幅；不恢复「爬升」，避免一进页就后台算动量。
      let notifyPollTimer = null;
      let klineAbort = null;
      let loading = false;
      let momentumAbort = null;
      let momentumBusy = false;
      let momentumProgress = { done: 0, total: 0 };
      let lastScoreUniverse = [];
      let lastDataAt = 0;
      let favoriteSaving = false;
      let blacklistSaving = false;
      let pinSaving = false;
      let pinSelectMode = false;
      const selectedPinSymbols = new Set();
      let positionSaving = false;
      let klineViewKey = "3d-4h";
      let notesViewMode = false;
      try {
        notesViewMode =
          new URLSearchParams(window.location.search).get("view") === "notes";
      } catch (error) {
        notesViewMode = false;
      }

      function isNotesView() {
        return !!notesViewMode;
      }

      function syncModeSwitchUi() {
        const watchBtn = document.getElementById("modeWatchBtn");
        const notesBtn = document.getElementById("modeNotesBtn");
        if (watchBtn) {
          watchBtn.classList.toggle("is-active", !notesViewMode);
          watchBtn.setAttribute("aria-pressed", notesViewMode ? "false" : "true");
        }
        if (notesBtn) {
          notesBtn.classList.toggle("is-active", notesViewMode);
          notesBtn.setAttribute("aria-pressed", notesViewMode ? "true" : "false");
        }
      }

      function setModeSwitchBusy(busy) {
        document.querySelectorAll("#modeSwitch button").forEach((btn) => {
          btn.disabled = !!busy;
        });
      }

      function syncNotesViewUrl() {
        try {
          const url = new URL(window.location.href);
          if (notesViewMode) url.searchParams.set("view", "notes");
          else url.searchParams.delete("view");
          window.history.replaceState({}, "", url.pathname + url.search + url.hash);
        } catch (error) {
          /* ignore */
        }
      }

      function applyPageChrome() {
        const notes = isNotesView();
        document.body.classList.toggle("is-notes-view", notes);
        if (notes) {
          pinSelectMode = false;
          selectedPinSymbols.clear();
          updatePinSelectUi();
          closeAllFloatPanels();
          setHiddenPinDrawerOpen(false);
          setMaintPanelOpen(false);
        }
        document.title = notes ? "记一笔追踪" : "观察池 K 线";
        const h1 = document.querySelector(".topbar-left h1");
        if (h1) h1.textContent = notes ? "记一笔追踪" : "币安观察";
        const pinTitle = document.getElementById("pinSectionTitle");
        if (pinTitle) pinTitle.textContent = notes ? "记一笔 K 线" : "盯一下";
        syncModeSwitchUi();
      }

      let modeProgressTimer = null;
      let modeProgressValue = 0;

      function setTopProgress(on, options) {
        const opts = options || {};
        const useOverlay = !!opts.overlay;
        const label = opts.label || "";
        const overlay = document.getElementById("modeProgress");
        const bar = document.getElementById("modeProgressBar");
        const labelEl = document.getElementById("modeProgressLabel");
        const fill = bar && bar.querySelector("span");
        if (labelEl && label) labelEl.textContent = label;
        if (!on) {
          if (modeProgressTimer) {
            clearInterval(modeProgressTimer);
            modeProgressTimer = null;
          }
          modeProgressValue = 100;
          if (fill) {
            bar.classList.remove("is-indeterminate");
            fill.style.width = "100%";
          }
          window.setTimeout(() => {
            if (overlay) {
              overlay.classList.remove("is-on");
              overlay.hidden = true;
              overlay.setAttribute("aria-busy", "false");
            }
            if (bar) {
              bar.classList.remove("is-on", "is-indeterminate");
              bar.hidden = true;
              if (fill) fill.style.width = "0%";
            }
            modeProgressValue = 0;
          }, 220);
          return;
        }
        modeProgressValue = 8;
        if (overlay) {
          if (useOverlay) {
            overlay.hidden = false;
            overlay.setAttribute("aria-busy", "true");
            overlay.classList.add("is-on");
          } else {
            overlay.classList.remove("is-on");
            overlay.hidden = true;
            overlay.setAttribute("aria-busy", "false");
          }
        }
        if (bar) {
          bar.hidden = false;
          bar.classList.add("is-on");
          bar.classList.remove("is-indeterminate");
          if (fill) fill.style.width = `${modeProgressValue}%`;
        }
        if (modeProgressTimer) clearInterval(modeProgressTimer);
        modeProgressTimer = window.setInterval(() => {
          if (modeProgressValue >= 90) return;
          modeProgressValue += Math.max(0.6, (90 - modeProgressValue) * 0.08);
          if (fill) fill.style.width = `${Math.min(90, modeProgressValue)}%`;
        }, 180);
      }

      function setTopProgressValue(ratio, label) {
        const bar = document.getElementById("modeProgressBar");
        const labelEl = document.getElementById("modeProgressLabel");
        const fill = bar && bar.querySelector("span");
        if (labelEl && label) labelEl.textContent = label;
        if (!bar || !fill) return;
        if (modeProgressTimer) {
          clearInterval(modeProgressTimer);
          modeProgressTimer = null;
        }
        bar.hidden = false;
        bar.classList.add("is-on");
        bar.classList.remove("is-indeterminate");
        const pct = Math.max(0, Math.min(100, Math.round(Number(ratio) * 100)));
        modeProgressValue = pct;
        fill.style.width = `${pct}%`;
      }

      function setModeProgress(on, label) {
        setTopProgress(on, { overlay: true, label: label || "正在切换…" });
      }

      async function setNotesView(on, options) {
        const next = !!on;
        if (next === notesViewMode && !(options && options.force)) return;
        notesViewMode = next;
        syncNotesViewUrl();
        closeCardActions(true);
        applyPageChrome();
        if (options && options.skipRender) return;
        setModeSwitchBusy(true);
        setModeProgress(
          true,
          next ? "正在切换到记一笔…" : "正在切换到观察…",
        );
        try {
          setStatus(false, next ? "切换到记一笔..." : "切换到观察...");
          await renderKlines();
          setStatus(true, next ? "已切换到记一笔" : "已切换到观察");
        } catch (error) {
          console.error(error);
          setStatus(false, error.message || "切换模式失败");
        } finally {
          setModeProgress(false);
          setModeSwitchBusy(false);
        }
      }

      function applyNotesViewChrome() {
        applyPageChrome();
      }

      function currentKlineView() {
        return KLINE_VIEWS[klineViewKey] || KLINE_VIEWS["3d-4h"];
      }

      function chartInterval() {
        return currentKlineView().chartInterval;
      }

      function klineRangeDays() {
        return currentKlineView().days;
      }

      function setStatus(ok, text) {
        document.getElementById("statusDot").className =
          `dot ${ok ? "online" : "offline"}`;
        document.getElementById("statusText").textContent = text;
      }

      function formatClock(ts) {
        const value = Number(ts);
        if (!Number.isFinite(value) || value <= 0) return "";
        try {
          return new Date(value).toLocaleTimeString("zh-CN", { hour12: false });
        } catch (error) {
          return "";
        }
      }

      function updateDataAsOf(ts) {
        const at = Number.isFinite(Number(ts)) ? Number(ts) : Date.now();
        lastDataAt = at;
        const el = document.getElementById("dataAsOf");
        if (!el) return;
        const clock = formatClock(at);
        el.textContent = clock ? `数据截至 ${clock}` : "";
        el.title = clock
          ? `行情与 K 线最近一次成功刷新：${new Date(at).toLocaleString("zh-CN", { hour12: false })}`
          : "尚未成功刷新";
      }

      function showToast(message) {
        const existing = document.querySelector(".toast");
        if (existing) existing.remove();
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1600);
      }

      function formatPercent(value) {
        return Number.isFinite(value)
          ? `${value > 0 ? "+" : ""}${value.toFixed(2)}%`
          : "--";
      }

      function noteSymbolList() {
        const seen = new Set();
        const list = [];
        for (const note of momNoteItems || []) {
          const symbol = String(note && note.symbol ? note.symbol : "")
            .trim()
            .toUpperCase();
          if (!symbol || seen.has(symbol)) continue;
          seen.add(symbol);
          list.push(symbol);
        }
        return list;
      }

      /** Same universe as 币安观察 盯一下区 / 近2h·1h 浮窗：未拉黑且当前窗口上涨. */
      function listWindowUpPinSymbols(interval) {
        const iv = interval || CONFIG.KLINE_INTERVAL;
        const blocked = blacklistSymbols();
        return pinItems
          .filter(
            (item) =>
              item &&
              item.symbol &&
              !blocked.has(item.symbol) &&
              hasWindowGain(item.symbol, iv),
          )
          .slice()
          .sort((a, b) => {
            const changeA = pinChangePercent(a);
            const changeB = pinChangePercent(b);
            const hasA = Number.isFinite(changeA);
            const hasB = Number.isFinite(changeB);
            const upA = hasA && changeA > 0 ? 1 : 0;
            const upB = hasB && changeB > 0 ? 1 : 0;
            if (upA !== upB) return upB - upA;
            if (hasA && hasB && changeB !== changeA) return changeB - changeA;
            if (hasA !== hasB) return hasA ? -1 : 1;
            return (b.pinnedAt || 0) - (a.pinnedAt || 0);
          })
          .map((item) => item.symbol);
      }

      async function removeNotesForSymbol(symbol) {
        if (!symbol || momNotesSaving) return false;
        momNotesSaving = true;
        const key = String(symbol).trim().toUpperCase();
        const label = key.replace(/USDT$/i, "");
        try {
          setStatus(false, `正在去掉 ${label} 的记一笔...`);
          const result = await WatchFavorites.patchMomNotes({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.MOM_NOTES_PATH,
            message: `Remove momentum notes ${key}`,
            mutate: (list) =>
              list.filter(
                (note) =>
                  String(note.symbol || "")
                    .trim()
                    .toUpperCase() !== key,
              ),
          });
          momNoteItems = result.notes || [];
          showToast(`已去掉记一笔 ${label}`);
          await renderKlines();
          setStatus(true, `已去掉记一笔 ${label}`);
          return true;
        } catch (error) {
          console.error(error);
          showToast(error.message || "去掉记一笔失败");
          setStatus(false, error.message || "去掉记一笔失败");
          throw error;
        } finally {
          momNotesSaving = false;
        }
      }

      function favoriteSymbols() {
        return WatchFavorites.favoritesToSymbolSet(favoriteItems);
      }

      function blacklistSymbols() {
        return WatchFavorites.blacklistToSymbolSet(blacklistItems);
      }

      function pinSymbols() {
        return WatchFavorites.pinsToSymbolSet(pinItems);
      }

      function positionSymbols() {
        return WatchFavorites.positionsToSymbolSet(positionItems);
      }

      function positionItemBySymbol(symbol) {
        const key = String(symbol || "")
          .trim()
          .toUpperCase();
        return positionItems.find((item) => item.symbol === key) || null;
      }

      function pinItemBySymbol(symbol) {
        const key = String(symbol || "")
          .trim()
          .toUpperCase();
        return pinItems.find((item) => item.symbol === key) || null;
      }

      function pinChangePercent(item) {
        const current = marketMap[item.symbol]?.price;
        const base = Number(item.pinPrice);
        if (
          !Number.isFinite(current) ||
          !Number.isFinite(base) ||
          base === 0
        ) {
          return null;
        }
        return ((current - base) / base) * 100;
      }

      function formatPinPrice(value) {
        if (!Number.isFinite(value)) return "--";
        if (value >= 1000) return value.toFixed(2);
        if (value >= 1) return value.toFixed(4);
        if (value >= 0.01) return value.toFixed(5);
        return value.toPrecision(4);
      }

      function formatRemaining(expiresAt) {
        const ms = Number(expiresAt) - Date.now();
        if (!Number.isFinite(ms)) return "";
        if (ms <= 0) return "已过期";
        const hours = Math.floor(ms / (60 * 60 * 1000));
        const mins = Math.floor((ms % (60 * 60 * 1000)) / (60 * 1000));
        if (hours >= 1) return `剩 ${hours}h${mins ? ` ${mins}m` : ""}`;
        return `剩 ${Math.max(1, mins)}m`;
      }

      function formatRemainCompact(expiresAt) {
        const ms = Number(expiresAt) - Date.now();
        if (!Number.isFinite(ms)) return "--";
        if (ms <= 0) return "已过期";
        const hours = Math.floor(ms / (60 * 60 * 1000));
        const mins = Math.floor((ms % (60 * 60 * 1000)) / (60 * 1000));
        if (hours >= 1) return mins ? `${hours}h${mins}m` : `${hours}h`;
        return `${Math.max(1, mins)}m`;
      }

      function pctClass(value) {
        if (!Number.isFinite(value) || value === 0) return "neutral";
        return value > 0 ? "up" : "price-down";
      }

      function buildPinStatusHtml(pinItem, symbol, flags) {
        const rel = pinChangePercent(pinItem);
        const current = marketMap[symbol]?.price;
        const change24h = marketMap[symbol]?.change24h;
        const expired = WatchFavorites.isPinExpired(pinItem);
        const remain = formatRemainCompact(pinItem.expiresAt);
        const flagParts = [];
        flagParts.push(
          `<span class="pin-flag ${expired ? "is-expired" : "is-remain"}" title="观察剩余时间">${escapeHtml(remain)}</span>`,
        );
        if (flags && flags.priceUpVsLast) {
          flagParts.push(
            `<span class="pin-flag is-at" title="现价高于上次企微推送价">@@@</span>`,
          );
        }
        if (flags && flags.streak5) {
          flagParts.push(
            `<span class="pin-flag is-5m" title="近 3 根已收盘 5m 收盘价连续高于前收">5m</span>`,
          );
        } else if (flags && flags.heat15) {
          flagParts.push(
            `<span class="pin-flag is-15m" title="近 3 根已收盘 15m 至少 2 根收涨">15m</span>`,
          );
        }
        return [
          `<span class="pin-stat-row">盯住价格：${escapeHtml(formatPinPrice(pinItem.pinPrice))}</span>`,
          `<span class="pin-stat-row">现在价格：${escapeHtml(formatPinPrice(current))}</span>`,
          `<span class="pin-stat-row">盯住涨幅：<span class="${pctClass(rel)}">${escapeHtml(formatPercent(rel))}</span></span>`,
          `<span class="pin-stat-row">24h涨幅：<span class="${pctClass(change24h)}">${escapeHtml(formatPercent(change24h))}</span></span>`,
          `<span class="pin-stat-row pin-flags">${flagParts.join(" / ")}</span>`,
        ].join("");
      }

      async function copyName(name) {
        try {
          await navigator.clipboard.writeText(name);
        } catch (error) {
          const textarea = document.createElement("textarea");
          textarea.value = name;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }
        setStatus(true, `${name} 已复制`);
      }

      function klineRangeLabel() {
        return currentKlineView().label;
      }

      function klineLimit(interval) {
        const duration = DURATION_MS[interval];
        if (!duration) return 1;
        const rangeMs = klineRangeDays() * 24 * 60 * 60 * 1000;
        return Math.min(
          CONFIG.KLINE_MAX_LIMIT,
          Math.max(1, Math.ceil(rangeMs / duration)),
        );
      }

      function syncRangeSelect() {
        const select = document.getElementById("rangeSelect");
        if (!select) return;
        if (!KLINE_VIEWS[klineViewKey]) klineViewKey = "3d-4h";
        select.value = klineViewKey;
      }

      function pruneHistory() {
        const cutoff = Date.now() - CONFIG.HISTORY_DURATION;
        history = history.filter((item) => item.timestamp >= cutoff);
      }

      function ranking() {
        const blocked = blacklistSymbols();
        return Object.entries(marketMap)
          .sort((a, b) => b[1].change24h - a[1].change24h)
          .map(([symbol]) => symbol)
          .filter((symbol) => !blocked.has(symbol));
      }

      function getWindowStart(timestamp, duration) {
        return Math.floor(timestamp / duration) * duration;
      }

      function selectEarliestWindowSnapshot(windowStart, duration) {
        const windowEnd = windowStart + duration;
        const strictCandidates = history.filter(
          (snapshot) =>
            snapshot.timestamp >= windowStart &&
            snapshot.timestamp < windowEnd,
        );
        const candidates = strictCandidates.length
          ? strictCandidates
          : history.filter(
              (snapshot) =>
                snapshot.timestamp >= windowStart &&
                snapshot.timestamp <
                  windowEnd + CONFIG.WINDOW_TOLERANCE_MS,
            );
        if (!candidates.length) return null;
        return candidates.reduce((earliest, item) =>
          item.timestamp < earliest.timestamp ? item : earliest,
        );
      }

      function comparison(interval) {
        if (!history.length) return null;
        const duration = DURATION_MS[interval];
        if (!duration) return null;
        const currentWindowStart = getWindowStart(Date.now(), duration);
        return selectEarliestWindowSnapshot(currentWindowStart, duration);
      }

      function windowPriceChange(symbol, interval) {
        const old = comparison(interval);
        const oldPrice = old?.prices?.[symbol];
        const currentPrice = marketMap[symbol]?.price;
        if (
          !Number.isFinite(oldPrice) ||
          !Number.isFinite(currentPrice) ||
          oldPrice === 0
        ) {
          return null;
        }
        return ((currentPrice - oldPrice) / oldPrice) * 100;
      }

      function hasWindowGain(symbol, interval) {
        const change = windowPriceChange(symbol, interval);
        return Number.isFinite(change) && change > 0;
      }

      function updateWatchPool() {
        const list = ranking();
        const blocked = blacklistSymbols();
        if (!list.length) return;
        for (const symbol of [...watchPool]) {
          const rank = list.indexOf(symbol) + 1;
          if (blocked.has(symbol) || !rank || rank > CONFIG.WATCH_POOL_RANK) {
            watchPool.delete(symbol);
          }
        }
        for (const symbol of list.slice(0, CONFIG.WATCH_POOL_RANK)) {
          if (blocked.has(symbol)) continue;
          if (hasWindowGain(symbol, "4h")) watchPool.add(symbol);
        }
      }

      function getRisingSymbols() {
        const interval = CONFIG.KLINE_INTERVAL;
        const blocked = blacklistSymbols();
        const pinned = pinSymbols();
        const list = ranking();
        const ranked = list.filter((symbol) => watchPool.has(symbol));
        const unranked = [...watchPool].filter(
          (symbol) =>
            marketMap[symbol] &&
            !list.includes(symbol) &&
            !blocked.has(symbol),
        );
        return [...ranked, ...unranked].filter(
          (symbol) =>
            !blocked.has(symbol) &&
            !pinned.has(symbol) &&
            hasWindowGain(symbol, interval),
        );
      }

      function readRisingSnapshot() {
        try {
          const raw = localStorage.getItem(RISING_SNAP_KEY);
          const list = raw ? JSON.parse(raw) : [];

      function appendActionLog(kind, symbols, extra) {
        const keys = [...new Set(
          (symbols || [])
            .map((symbol) => String(symbol || "").trim().toUpperCase())
            .filter(Boolean),
        )];
        if (!keys.length) return;
        const entry = {
          at: Date.now(),
          kind: String(kind || ""),
          symbols: keys,
        };
        if (extra && Number.isFinite(extra.price) && extra.price > 0) {
          entry.price = extra.price;
        }
        const next = [entry, ...readActionLog()].slice(0, ACTION_LOG_MAX);
        writeActionLog(next);
        renderActionLogBody();

      function formatActionLogTime(at) {
        const date = new Date(Number(at) || 0);
        if (!Number.isFinite(date.getTime())) return "--:--";
        const hh = String(date.getHours()).padStart(2, "0");
        const mm = String(date.getMinutes()).padStart(2, "0");
        return `${hh}:${mm}`;
      }

      function actionLogKindLabel(kind) {
        if (kind === "auto-pin") return "自动盯";
        if (kind === "buy") return "买";
        if (kind === "sell") return "卖";
        return kind || "动";

      function renderActionLogBody() {

            return `<div class="action-log-row"><span class="action-log-time">${formatActionLogTime(entry.at)}</span><span class="action-log-kind">${escapeHtml(kind)}</span>${names}${price}</div>`;

      /**
       * Strategy A: only auto-pin symbols newly appeared in 窗口上涨
       * vs last snapshot, and not already pinned. First visit seeds
       * baseline without mass-pinning.
       */
      async function autoPinNewRising(risingSymbols) {
        const current = (risingSymbols || []).filter(Boolean);
        const seeded = localStorage.getItem(RISING_SNAP_SEEDED_KEY) === "1";
        if (!seeded) {
          writeRisingSnapshot(current);
          localStorage.setItem(RISING_SNAP_SEEDED_KEY, "1");
          return [];
        }
        const prevSet = new Set(readRisingSnapshot());
        const pinned = pinSymbols();
        const blocked = blacklistSymbols();
        const newcomers = current.filter(
          (symbol) =>
            !prevSet.has(symbol) &&
            !pinned.has(symbol) &&
            !blocked.has(symbol),
        );
        if (!newcomers.length) {
          writeRisingSnapshot(current);
          return [];
        }
        try {
          const result = await WatchFavorites.patchPins({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.PINS_PATH,
            message: `Auto-pin rising ${newcomers.length}`,
            mutate: (list) => {
              let next = list.slice();
              for (const symbol of newcomers) {
                if (WatchFavorites.hasPin(next, symbol)) continue;
                next = WatchFavorites.addPin(
                  next,
                  symbol,
                  marketMap[symbol]?.price,
                  "auto-rising",
                );
              }
              return { list: next, added: true };
            },
          });
          pinItems = result.pins;
          // Snapshot post-pin rising so pinned names leave the baseline.
          writeRisingSnapshot(getRisingSymbols());
          appendActionLog("auto-pin", newcomers);
          return newcomers;
        } catch (error) {
          console.warn("auto-pin rising failed", error);
          writeRisingSnapshot(current);
          return [];
        }
      }

      function getFavoriteRisingSymbols(risingSymbols) {
        const rising = new Set(risingSymbols);
        const blocked = blacklistSymbols();
        const pinned = pinSymbols();
        const interval = CONFIG.KLINE_INTERVAL;
        const favSet = new Set(
          favoriteItems
            .map((item) => item.symbol)
            .filter(
              (symbol) =>
                marketMap[symbol] &&
                !rising.has(symbol) &&
                !blocked.has(symbol) &&
                !pinned.has(symbol) &&
                hasWindowGain(symbol, interval),
            ),
        );
        // Same order as the rising section: 24h change descending.
        return ranking().filter((symbol) => favSet.has(symbol));
      }

      // Favorites that also appear in rising get a black border.
      function buildPairSet(rising) {
        const favSet = favoriteSymbols();
        return new Set(rising.filter((symbol) => favSet.has(symbol)));
      }

      async function loadGithubStorage() {
        const url = `${CONFIG.OBS_BASE}/${CONFIG.GITHUB_PATH}?t=${Date.now()}`;
        const response = await fetch(url, { cache: "no-store" });
        if (response.status === 404) {
          history = [];
          watchPool = new Set();
          favoriteItems = [];
          blacklistItems = [];
          pinItems = [];
          positionItems = [];
          momNoteItems = [];
          return;
        }
        if (!response.ok) {
          throw new Error(`读取 OBS 失败: ${response.status}`);
        }
        const data = await response.json();
        history = Array.isArray(data.history) ? data.history : [];
        watchPool = new Set(
          Array.isArray(data.watchPool) ? data.watchPool : [],
        );
        try {
          const favState = await WatchFavorites.loadFavoritesRaw({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.FAVORITES_PATH,
          });
          favoriteItems = favState.favorites;
        } catch (error) {
          console.warn(error);
          favoriteItems = [];
        }
        try {
          const blackState = await WatchFavorites.loadBlacklistRaw({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.BLACKLIST_PATH,
          });
          blacklistItems = blackState.blacklist;
          const blocked = blacklistSymbols();
          for (const symbol of [...watchPool]) {
            if (blocked.has(symbol)) watchPool.delete(symbol);
          }
        } catch (error) {
          console.warn(error);
          blacklistItems = [];
        }
        try {
          const pinState = await WatchFavorites.loadPinsRaw({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.PINS_PATH,
          });
          pinItems = pinState.pins;
        } catch (error) {
          console.warn(error);
          pinItems = [];
        }
        try {
          const posState = await WatchFavorites.loadPositionsRaw({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.POSITIONS_PATH,
          });
          positionItems = posState.positions;
        } catch (error) {
          console.warn(error);
          positionItems = [];
        }
        try {
          const noteState = await WatchFavorites.loadMomNotesRaw({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.MOM_NOTES_PATH,
          });
          momNoteItems = noteState.notes || [];
          if (!momNoteItems.length) {
            momNoteItems = await migrateLocalMomNotesIfNeeded();
          } else {
            try {
              localStorage.removeItem(MOM_NOTES_LOCAL_KEY);
            } catch (error) {
              /* ignore */
            }
          }
        } catch (error) {
          console.warn(error);
          momNoteItems = [];
        }
        try {
          const notifyState = await loadNotifyState();
          lastPinPrices = notifyState.lastPinPrices || {};
          lastPinNotify = notifyState.lastPinNotify || null;
          lastPositionNotify = notifyState.lastPositionNotify || null;
          mergeCloudAutoPinEvents(notifyState.autoPinEvents || []);
        } catch (error) {
          console.warn(error);
          lastPinPrices = {};
          lastPinNotify = null;
          lastPositionNotify = null;
        }
        pruneHistory();
      }

      async function migrateLocalMomNotesIfNeeded() {

        try {

          local = raw ? JSON.parse(raw) : [];

      function listRecentAutoPins() {
        const now = Date.now();
        const blocked = blacklistSymbols();
        return pinItems
          .filter((item) => {
            if (!item || !item.symbol || blocked.has(item.symbol)) return false;
            const source = String(item.source || "");
            if (source !== "auto-rising" && source !== "auto-cloud") return false;
            const at = Number(item.pinnedAt) || 0;
            return at > 0 && now - at <= NEW_AUTO_PIN_MS;
          })
          .slice()
          .sort((a, b) => (b.pinnedAt || 0) - (a.pinnedAt || 0));

      function syncPinSortUi() {
        document.querySelectorAll("#pinSortSwitch [data-pin-sort]").forEach((btn) => {
          const mode = btn.dataset.pinSort;
          btn.classList.toggle("is-active", mode === pinSortMode);
          if (mode !== "momentum") {

          }

          const done = momentumProgress.done || 0;
          btn.classList.toggle("is-computing", busy);
          btn.disabled = busy;
          btn.textContent =

              ? `爬升 (${done}/${total})`

                ? "爬升 (…)"
                : "爬升";
          btn.title = busy
            ? total > 0
              ? `近2h/1h 计算中 ${done}/${total}`
              : "近2h/1h 计算中"

      function setPinSortMode(mode) {
        const next = mode === "momentum" ? "momentum" : "pin";
        if (next === pinSortMode) return;
        pinSortMode = next;
        try {
          localStorage.setItem(PIN_SORT_KEY, pinSortMode);
        } catch (error) {
          /* ignore */
        }
        syncPinSortUi();
        if (isNotesView() || loading) return;
        if (next === "momentum") {
          void ensureMomentumThenReorder({ force: !lastMomentumSnapshot });
        } else {
          reorderPinGridByPinChange();
        }
      }

      function mergeCloudAutoPinEvents(events) {
        if (!Array.isArray(events) || !events.length) return;
        let seenAt = 0;
        try {
          seenAt = Number(localStorage.getItem(AUTO_PIN_EVENTS_SEEN_KEY) || 0) || 0;
        } catch (error) {
          seenAt = 0;
        }
        const fresh = events
          .filter((item) => item && Number(item.at) > seenAt)
          .slice()
          .sort((a, b) => Number(a.at) - Number(b.at));
        if (!fresh.length) return;
        let maxAt = seenAt;
        for (const event of fresh) {
          const at = Number(event.at) || 0;
          if (at > maxAt) maxAt = at;
          const symbols = Array.isArray(event.symbols) ? event.symbols : [];
          if (!symbols.length) continue;
          // Write with event time so ordering matches cloud.
          const entry = {
            at: at || Date.now(),
            kind: "auto-pin",
            symbols: [
              ...new Set(
                symbols
                  .map((symbol) => String(symbol || "").trim().toUpperCase())
                  .filter(Boolean),
              ),
            ],
          };
          if (!entry.symbols.length) continue;
          const next = [entry, ...readActionLog()].slice(0, ACTION_LOG_MAX);
          writeActionLog(next);
        }
        try {
          localStorage.setItem(AUTO_PIN_EVENTS_SEEN_KEY, String(maxAt));
        } catch (error) {
          /* ignore */
        }
        renderActionLogBody();
      }

      function parseNotifyStateData(data) {
        return {
          lastPinPrices:
            data && typeof data.lastPinPrices === "object"
              ? data.lastPinPrices
              : {},
          lastPinNotify:
            data && data.lastPinNotify && typeof data.lastPinNotify === "object"
              ? data.lastPinNotify
              : null,
          lastPositionNotify:
            data &&
            data.lastPositionNotify &&
            typeof data.lastPositionNotify === "object"
              ? data.lastPositionNotify
              : null,
          autoPinEvents: Array.isArray(data && data.autoPinEvents)
            ? data.autoPinEvents
            : [],
        };
      }

      function notifyContentAt(state) {
        const pin = state && state.lastPinNotify;
        const pos = state && state.lastPositionNotify;
        const pinAt = pin && Number.isFinite(Number(pin.at)) ? Number(pin.at) : 0;
        const posAt = pos && Number.isFinite(Number(pos.at)) ? Number(pos.at) : 0;
        return Math.max(pinAt, posAt);
      }

      function hasNotifyContent(pinNotify, posNotify) {
        const hasPin =
          pinNotify &&
          typeof pinNotify.markdown === "string" &&
          pinNotify.markdown.trim();
        const hasPos =
          posNotify &&
          typeof posNotify.text === "string" &&
          posNotify.text.trim();
        return !!(hasPin || hasPos);
      }

      function applyNotifyState(state, options) {
        const prevAt = notifyContentAt({
          lastPinNotify,
          lastPositionNotify,
        });
        lastPinPrices = (state && state.lastPinPrices) || {};
        lastPinNotify = (state && state.lastPinNotify) || null;
        lastPositionNotify = (state && state.lastPositionNotify) || null;
        const nextAt = notifyContentAt({
          lastPinNotify,
          lastPositionNotify,
        });
        const isNewer = prevAt > 0 && nextAt > prevAt;
        if (isNewer || (options && options.forceOpen)) {
          localStorage.removeItem(notifyDismissStorageKey());
        }
        updateNotifyFloatPanel();
        return { isNewer, at: nextAt };
      }

      async function loadNotifyState() {
        const path = CONFIG.NOTIFY_STATE_PATH;
        const repo = CONFIG.GITHUB_REPO;

        // 1) GitHub Contents API — freshest (no raw CDN lag).
        try {
          const current = await WatchFavorites.fetchJsonFile({ repo, path });
          if (current && current.data) {
            return parseNotifyStateData(current.data);
          }
        } catch (error) {
          console.warn("loadNotifyState via API failed", error);
        }

        // 2) raw pinned to latest main commit sha — bypasses /main CDN cache.
        try {
          const commitSha = await WatchFavorites.getMainCommitSha({ repo });
          const response = await WatchFavorites.fetchRawJsonByCommit({
            repo,
            path,
            commitSha,
          });
          if (response.ok) {
            return parseNotifyStateData(await response.json());
          }
        } catch (error) {
          console.warn("loadNotifyState via commit-raw failed", error);
        }

        // 3) last resort: raw /main with cache buster.
        try {
          const url = `https://raw.githubusercontent.com/${repo}/main/${path}?t=${Date.now()}`;
          const response = await fetch(url, {
            cache: "no-store",
            headers: {
              "Cache-Control": "no-cache",
              Pragma: "no-cache",
            },
          });
          if (!response.ok) {
            return {
              lastPinPrices: {},
              lastPinNotify: null,
              lastPositionNotify: null,
              autoPinEvents: [],
            };
          }
          return parseNotifyStateData(await response.json());
        } catch (error) {
          console.warn("loadNotifyState failed", error);
          return {
            lastPinPrices: {},
            lastPinNotify: null,
            lastPositionNotify: null,
            autoPinEvents: [],
          };
        }
      }

      async function refreshNotifyFloat(options) {
        if (notifyFloatRefreshing) return;
        notifyFloatRefreshing = true;
        const btn = document.getElementById("notifyFloatRefresh");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "…";
        }
        try {
          const state = await loadNotifyState();
          const result = applyNotifyState(state, {
            forceOpen: !!(options && options.forceOpen),
          });
          if (options && options.silent) return result;
          if (result.isNewer) {
            showToast("已更新到最新企微通知");
          } else if (hasNotifyContent(lastPinNotify, lastPositionNotify)) {
            showToast("已是最新企微文案");
          } else {
            showToast("暂无企微通知文案");
          }
          return result;
        } catch (error) {
          console.warn(error);
          if (!(options && options.silent)) {
            showToast(error.message || "刷新企微通知失败");
          }
          return null;
        } finally {
          notifyFloatRefreshing = false;
          if (btn) {
            btn.disabled = false;
            btn.textContent = "刷新";
          }
        }
      }

      function startNotifyPoll() {
        if (notifyPollTimer) return;
        notifyPollTimer = window.setInterval(() => {
          if (document.visibilityState === "hidden") return;
          refreshNotifyFloat({ silent: true });
        }, CONFIG.NOTIFY_POLL_MS);
