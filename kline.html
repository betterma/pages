<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>观察池 K 线</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f5f3;
        color: #28323a;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .page {
        width: min(1400px, calc(100% - 20px));
        margin: 12px auto 24px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      h2.section-title {
        margin: 16px 0 6px;
        font-size: 15px;
      }
      .nav-link {
        color: #5a6a68;
        font-size: 13px;
        text-decoration: none;
      }
      .nav-link:hover {
        text-decoration: underline;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button {
        border: 1px solid #c9d0d0;
        background: #fbfcfa;
        color: #28323a;
        padding: 8px 13px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #eef1ee;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #78817f;
        margin-bottom: 10px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #a39d95;
        flex-shrink: 0;
      }
      .dot.online {
        background: #718b88;
        box-shadow: 0 0 8px rgba(113, 139, 136, 0.35);
      }
      .dot.offline {
        background: #8d7771;
      }
      .meta {
        color: #78817f;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .hint {
        color: #9aa3a0;
        font-size: 12px;
        margin: -2px 0 10px;
      }
      .kline-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 10px;
      }
      .kline-card {
        position: relative;
        min-width: 0;
        padding: 8px 10px 10px;
        background: #fbfcfa;
        border: 1px solid #d8ddda;
        border-radius: 8px;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .kline-card.is-pressed {
        transform: scale(0.98);
        box-shadow: 0 0 0 2px rgba(113, 139, 136, 0.35);
      }
      .kline-card.is-favorite {
        border-color: #b7c4b8;
      }
      .kline-card.is-pair {
        border-width: 2px;
        border-color: var(--pair-color);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--pair-color) 35%, transparent);
      }
      .kline-card.is-early .early-badge {
        position: absolute;
        left: 8px;
        bottom: 8px;
        z-index: 1;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(74, 108, 98, 0.9);
        color: #f4f7f5;
        font-size: 11px;
        line-height: 1.3;
        pointer-events: none;
      }
      .fav-mark {
        position: absolute;
        top: 6px;
        right: 8px;
        color: #7a8f7c;
        font-size: 12px;
        line-height: 1;
        pointer-events: none;
      }
      .blacklist-card-btn {
        border: 0;
        background: transparent;
        color: #9aa3a0;
        padding: 0 2px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        flex-shrink: 0;
      }
      .blacklist-card-btn:hover {
        color: #8d7771;
      }
      .kline-card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 13px;
        padding-right: 14px;
      }
      .kline-card-head .symbol-copy {
        color: inherit;
        font-weight: 700;
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
        font: inherit;
      }
      .kline-card-head .symbol-copy:hover {
        text-decoration: underline;
      }
      .kline-card canvas {
        display: block;
        width: 100%;
        height: 150px;
        pointer-events: none;
      }
      .up {
        color: #4f7a6e;
      }
      .price-down {
        color: #8d7771;
      }
      .neutral {
        color: #78817f;
      }
      .empty {
        padding: 28px 12px;
        text-align: center;
        color: #78817f;
        font-size: 13px;
        background: #fbfcfa;
        border: 1px dashed #d8ddda;
        border-radius: 8px;
      }
      .kline-card .empty {
        padding: 40px 8px;
        border: none;
        background: transparent;
        font-size: 12px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: rgba(40, 50, 58, 0.92);
        color: #f7f8f6;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        z-index: 20;
        pointer-events: none;
      }
      @media (max-width: 768px) {
        .page {
          width: calc(100% - 12px);
          margin: 8px auto 16px;
        }
        h1 {
          font-size: 17px;
        }
        .kline-grid {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
        .kline-card {
          padding: 6px 7px 8px;
        }
        .kline-card-head {
          font-size: 12px;
          margin-bottom: 4px;
        }
        .kline-card canvas {
          height: 120px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div class="topbar-left">
          <h1>观察池 K 线</h1>
          <a class="nav-link" href="./watch.html">冲榜雷达</a>
        </div>
        <div class="topbar-actions">
          <button id="rangeBtn" type="button" title="切换 K 线时间范围（4h 周期不变）">
            近10天K线
          </button>
          <button id="refreshBtn" type="button">刷新</button>
        </div>
      </div>
      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">等待启动...</span>
      </div>
      <p class="hint">长按收藏 · ⊖ 拉黑 · 点名称复制 · 「启动 N」=15m 早期分≥2（启发式，非预测）</p>

      <h2 class="section-title">窗口上涨</h2>
      <div id="risingMeta" class="meta"></div>
      <div id="risingGrid" class="kline-grid"></div>

      <h2 class="section-title">我的收藏</h2>
      <div id="favMeta" class="meta"></div>
      <div id="favGrid" class="kline-grid"></div>
    </div>
    <script src="./watch-favorites.js"></script>
    <script>
      "use strict";

      const CONFIG = {
        HISTORY_DURATION: 3 * 24 * 60 * 60 * 1000,
        KLINE_RANGE_DAYS_DEFAULT: 3,
        KLINE_RANGE_DAYS_EXTENDED: 10,
        GITHUB_REPO: "betterma/pages",
        GITHUB_PATH: "watch-data.json",
        OBS_BASE: "https://mpctest.obs.cn-north-4.myhuaweicloud.com",
        FAVORITES_PATH: "watch-favorites.json",
        BLACKLIST_PATH: "watch-blacklist.json",
        WATCH_POOL_RANK: 30,
        WINDOW_TOLERANCE_MS: 2 * 60 * 1000,
        KLINE_MAX_LIMIT: 1000,
        KLINE_INTERVAL: "4h",
        SIGNAL_INTERVAL: "15m",
        SIGNAL_LIMIT: 200,
        EARLY_SCORE_MIN: 2,
        LONG_PRESS_MS: 450,
      };
      const DURATION_MS = {
        "15m": 15 * 60 * 1000,
        "30m": 30 * 60 * 1000,
        "1h": 60 * 60 * 1000,
        "2h": 2 * 60 * 60 * 1000,
        "4h": 4 * 60 * 60 * 1000,
      };

      const marketMap = {};
      let history = [];
      let watchPool = new Set();
      let favoriteItems = [];
      let blacklistItems = [];
      let klineAbort = null;
      let loading = false;
      let favoriteSaving = false;
      let blacklistSaving = false;
      let klineRangeDays = CONFIG.KLINE_RANGE_DAYS_DEFAULT;

      function setStatus(ok, text) {
        document.getElementById("statusDot").className =
          `dot ${ok ? "online" : "offline"}`;
        document.getElementById("statusText").textContent = text;
      }

      function showToast(message) {
        const existing = document.querySelector(".toast");
        if (existing) existing.remove();
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1600);
      }

      function formatPercent(value) {
        return Number.isFinite(value)
          ? `${value > 0 ? "+" : ""}${value.toFixed(2)}%`
          : "--";
      }

      function favoriteSymbols() {
        return WatchFavorites.favoritesToSymbolSet(favoriteItems);
      }

      function blacklistSymbols() {
        return WatchFavorites.blacklistToSymbolSet(blacklistItems);
      }

      async function copyName(name) {
        try {
          await navigator.clipboard.writeText(name);
        } catch (error) {
          const textarea = document.createElement("textarea");
          textarea.value = name;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }
        setStatus(true, `${name} 已复制`);
      }

      function klineRangeLabel() {
        return `近${klineRangeDays}天`;
      }

      function klineLimit(interval) {
        const duration = DURATION_MS[interval];
        if (!duration) return 1;
        const rangeMs = klineRangeDays * 24 * 60 * 60 * 1000;
        return Math.min(
          CONFIG.KLINE_MAX_LIMIT,
          Math.max(1, Math.ceil(rangeMs / duration)),
        );
      }

      function syncRangeButton() {
        const btn = document.getElementById("rangeBtn");
        const isExtended =
          klineRangeDays === CONFIG.KLINE_RANGE_DAYS_EXTENDED;
        btn.textContent = isExtended ? "近3天K线" : "近10天K线";
        btn.title = isExtended
          ? "切换回近3天 K 线（4h 周期不变）"
          : "切换到近10天 K 线（4h 周期不变）";
      }

      function pruneHistory() {
        const cutoff = Date.now() - CONFIG.HISTORY_DURATION;
        history = history.filter((item) => item.timestamp >= cutoff);
      }

      function ranking() {
        const blocked = blacklistSymbols();
        return Object.entries(marketMap)
          .sort((a, b) => b[1].change24h - a[1].change24h)
          .map(([symbol]) => symbol)
          .filter((symbol) => !blocked.has(symbol));
      }

      function getWindowStart(timestamp, duration) {
        return Math.floor(timestamp / duration) * duration;
      }

      function selectEarliestWindowSnapshot(windowStart, duration) {
        const windowEnd = windowStart + duration;
        const strictCandidates = history.filter(
          (snapshot) =>
            snapshot.timestamp >= windowStart &&
            snapshot.timestamp < windowEnd,
        );
        const candidates = strictCandidates.length
          ? strictCandidates
          : history.filter(
              (snapshot) =>
                snapshot.timestamp >= windowStart &&
                snapshot.timestamp <
                  windowEnd + CONFIG.WINDOW_TOLERANCE_MS,
            );
        if (!candidates.length) return null;
        return candidates.reduce((earliest, item) =>
          item.timestamp < earliest.timestamp ? item : earliest,
        );
      }

      function comparison(interval) {
        if (!history.length) return null;
        const duration = DURATION_MS[interval];
        if (!duration) return null;
        const currentWindowStart = getWindowStart(Date.now(), duration);
        return selectEarliestWindowSnapshot(currentWindowStart, duration);
      }

      function windowPriceChange(symbol, interval) {
        const old = comparison(interval);
        const oldPrice = old?.prices?.[symbol];
        const currentPrice = marketMap[symbol]?.price;
        if (
          !Number.isFinite(oldPrice) ||
          !Number.isFinite(currentPrice) ||
          oldPrice === 0
        ) {
          return null;
        }
        return ((currentPrice - oldPrice) / oldPrice) * 100;
      }

      function hasWindowGain(symbol, interval) {
        const change = windowPriceChange(symbol, interval);
        return Number.isFinite(change) && change > 0;
      }

      function updateWatchPool() {
        const list = ranking();
        const blocked = blacklistSymbols();
        if (!list.length) return;
        for (const symbol of [...watchPool]) {
          const rank = list.indexOf(symbol) + 1;
          if (blocked.has(symbol) || !rank || rank > CONFIG.WATCH_POOL_RANK) {
            watchPool.delete(symbol);
          }
        }
        for (const symbol of list.slice(0, CONFIG.WATCH_POOL_RANK)) {
          if (blocked.has(symbol)) continue;
          if (hasWindowGain(symbol, "4h")) watchPool.add(symbol);
        }
      }

      function getRisingSymbols() {
        const interval = CONFIG.KLINE_INTERVAL;
        const blocked = blacklistSymbols();
        const list = ranking();
        const ranked = list.filter((symbol) => watchPool.has(symbol));
        const unranked = [...watchPool].filter(
          (symbol) =>
            marketMap[symbol] &&
            !list.includes(symbol) &&
            !blocked.has(symbol),
        );
        return [...ranked, ...unranked].filter(
          (symbol) =>
            !blocked.has(symbol) && hasWindowGain(symbol, interval),
        );
      }

      function getFavoriteRisingSymbols(risingSymbols) {
        const rising = new Set(risingSymbols);
        const blocked = blacklistSymbols();
        const interval = CONFIG.KLINE_INTERVAL;
        return favoriteItems
          .map((item) => item.symbol)
          .filter(
            (symbol) =>
              marketMap[symbol] &&
              !rising.has(symbol) &&
              !blocked.has(symbol) &&
              hasWindowGain(symbol, interval),
          );
      }

      // Session-stable random colors for favorites that also appear in rising.
      const pairColorBySymbol = new Map();

      function getPairBorderColor(symbol) {
        const existing = pairColorBySymbol.get(symbol);
        if (existing) return existing;
        const hue = Math.floor(Math.random() * 360);
        const color = `hsl(${hue} 40% 46%)`;
        pairColorBySymbol.set(symbol, color);
        return color;
      }

      function buildPairColorMap(rising) {
        const favSet = favoriteSymbols();
        const map = new Map();
        rising.forEach((symbol) => {
          if (favSet.has(symbol)) {
            map.set(symbol, getPairBorderColor(symbol));
          }
        });
        return map;
      }

      async function loadGithubStorage() {
        const url = `${CONFIG.OBS_BASE}/${CONFIG.GITHUB_PATH}?t=${Date.now()}`;
        const response = await fetch(url, { cache: "no-store" });
        if (response.status === 404) {
          history = [];
          watchPool = new Set();
          favoriteItems = [];
          blacklistItems = [];
          return;
        }
        if (!response.ok) {
          throw new Error(`读取 OBS 失败: ${response.status}`);
        }
        const data = await response.json();
        history = Array.isArray(data.history) ? data.history : [];
        watchPool = new Set(
          Array.isArray(data.watchPool) ? data.watchPool : [],
        );
        try {
          const favState = await WatchFavorites.loadFavoritesRaw({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.FAVORITES_PATH,
          });
          favoriteItems = favState.favorites;
        } catch (error) {
          console.warn(error);
          favoriteItems = [];
        }
        try {
          const blackState = await WatchFavorites.loadBlacklistRaw({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.BLACKLIST_PATH,
          });
          blacklistItems = blackState.blacklist;
          const blocked = blacklistSymbols();
          for (const symbol of [...watchPool]) {
            if (blocked.has(symbol)) watchPool.delete(symbol);
          }
        } catch (error) {
          console.warn(error);
          blacklistItems = [];
        }
        pruneHistory();
      }

      async function loadBinanceTicker() {
        const endpoints = [
          "https://data-api.binance.vision/api/v3/ticker/24hr",
          "https://api.binance.com/api/v3/ticker/24hr",
        ];
        let lastError = null;
        for (const url of endpoints) {
          try {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) {
              lastError = new Error(`HTTP ${response.status}`);
              continue;
            }
            const data = await response.json();
            Object.keys(marketMap).forEach((key) => delete marketMap[key]);
            data.forEach((ticker) => {
              if (!ticker.symbol.endsWith("USDT")) return;
              const price = Number(ticker.lastPrice);
              const change = Number(ticker.priceChangePercent);
              if (Number.isFinite(price) && Number.isFinite(change)) {
                marketMap[ticker.symbol] = {
                  price,
                  change24h: change,
                };
              }
            });
            return;
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("行情请求失败");
      }

      async function fetchKlines(symbol, interval, signal, limitOverride) {
        const limit = limitOverride || klineLimit(interval);
        const query = `symbol=${symbol}&interval=${interval}&limit=${limit}`;
        const endpoints = [
          `https://data-api.binance.vision/api/v3/klines?${query}`,
          `https://api.binance.com/api/v3/klines?${query}`,
        ];
        let lastError = null;
        for (const url of endpoints) {
          try {
            const response = await fetch(url, { signal, cache: "no-store" });
            if (!response.ok) {
              lastError = new Error(`HTTP ${response.status}`);
              continue;
            }
            const rows = await response.json();
            if (!Array.isArray(rows) || !rows.length) {
              lastError = new Error("K线为空");
              continue;
            }
            return rows.map((row) => ({
              time: Number(row[0]),
              open: Number(row[1]),
              high: Number(row[2]),
              low: Number(row[3]),
              close: Number(row[4]),
              volume: Number(row[5]),
            }));
          } catch (error) {
            if (error.name === "AbortError") throw error;
            lastError = error;
          }
        }
        throw lastError || new Error("K线请求失败");
      }

      function scoreEarlyMomentum(candles) {
        if (!Array.isArray(candles) || candles.length < 12) return null;
        const recent10 = candles.slice(-10);
        const look = candles.slice(-Math.min(20, candles.length));
        if (look.length < 5) return null;

        const green = recent10.filter((c) => c.close >= c.open).length;
        let higherHighs = 0;
        let higherLows = 0;
        for (let index = 1; index < recent10.length; index += 1) {
          if (recent10[index].high > recent10[index - 1].high) higherHighs += 1;
          if (recent10[index].low > recent10[index - 1].low) higherLows += 1;
        }

        const price = recent10[recent10.length - 1].close;
        const maxHigh = Math.max(...look.map((c) => c.high));
        const priorHigh = Math.max(
          ...look.slice(0, -1).map((c) => c.high),
          look[0].high,
        );
        const nearBreak = price >= maxHigh * 0.98;
        const broke = price > priorHigh;
        const avgVol =
          look.reduce((sum, c) => sum + (Number.isFinite(c.volume) ? c.volume : 0), 0) /
          look.length;
        const lastVol = Number.isFinite(recent10[recent10.length - 1].volume)
          ? recent10[recent10.length - 1].volume
          : 0;
        const volRatio = avgVol > 0 ? lastVol / avgVol : 0;

        const dayBars = candles.slice(-Math.min(192, candles.length));
        const dayHigh = Math.max(...dayBars.map((c) => c.high));
        const dayLow = Math.min(...dayBars.map((c) => c.low));
        const dayPos =
          dayHigh === dayLow ? 0 : (price - dayLow) / (dayHigh - dayLow);

        let score = 0;
        const reasons = [];
        if (green >= 6) {
          score += 1;
          reasons.push(`阳${green}/10`);
        }
        if (higherLows >= 5 || (higherHighs >= 4 && higherLows >= 4)) {
          score += 1;
          reasons.push("抬结构");
        }
        if (nearBreak || broke) {
          score += 1;
          reasons.push(broke ? "破高" : "近高");
        }
        if (volRatio >= 1.5) {
          score += 1;
          reasons.push(`量${volRatio.toFixed(1)}x`);
        }
        if (dayPos >= 0.85) {
          score -= 1;
          reasons.push("过热");
        }

        return {
          score,
          hit: score >= CONFIG.EARLY_SCORE_MIN,
          detail: reasons.length ? reasons.join(" · ") : "无加分项",
        };
      }

      function applyEarlyBadge(card, early) {
        card.classList.remove("is-early");
        const old = card.querySelector(".early-badge");
        if (old) old.remove();
        if (!early || !early.hit) return;
        card.classList.add("is-early");
        const badge = document.createElement("span");
        badge.className = "early-badge";
        badge.textContent = `启动 ${early.score}`;
        badge.title = `15m 启动分 ${early.score}/4 · ${early.detail}`;
        card.appendChild(badge);
      }

      function drawKline(canvas, candles) {
        const rect = canvas.getBoundingClientRect();
        const width = Math.max(1, Math.floor(rect.width));
        const height = Math.max(1, Math.floor(rect.height));
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        if (!candles.length) return;

        const pad = { top: 6, right: 4, bottom: 6, left: 4 };
        const chartW = width - pad.left - pad.right;
        const chartH = height - pad.top - pad.bottom;
        const highs = candles.map((item) => item.high);
        const lows = candles.map((item) => item.low);
        const max = Math.max(...highs);
        const min = Math.min(...lows);
        const range = max - min || max * 0.01 || 1;
        const slot = chartW / candles.length;
        const bodyW = Math.max(1, slot * 0.62);
        const yOf = (price) => pad.top + ((max - price) / range) * chartH;

        candles.forEach((candle, index) => {
          const x = pad.left + slot * index + slot / 2;
          const up = candle.close >= candle.open;
          ctx.strokeStyle = up ? "#718b88" : "#8d7771";
          ctx.fillStyle = up ? "#718b88" : "#8d7771";
          ctx.beginPath();
          ctx.moveTo(x, yOf(candle.high));
          ctx.lineTo(x, yOf(candle.low));
          ctx.stroke();
          const y1 = yOf(candle.open);
          const y2 = yOf(candle.close);
          const bodyH = Math.max(1, Math.abs(y2 - y1));
          ctx.fillRect(x - bodyW / 2, Math.min(y1, y2), bodyW, bodyH);
        });
      }

      async function renderKlineCard(card, symbol, interval, signal) {
        const canvas = card.querySelector("canvas");
        const status = card.querySelector("[data-kline-status]");
        if (!canvas || !status) return;
        try {
          const [candles, signalCandles] = await Promise.all([
            fetchKlines(symbol, interval, signal),
            fetchKlines(
              symbol,
              CONFIG.SIGNAL_INTERVAL,
              signal,
              CONFIG.SIGNAL_LIMIT,
            ),
          ]);
          const last = candles[candles.length - 1];
          const first = candles[0];
          const change =
            first && first.open
              ? ((last.close - first.open) / first.open) * 100
              : null;
          status.textContent = Number.isFinite(change)
            ? `${formatPercent(change)} · ${interval}`
            : interval;
          status.className =
            change > 0 ? "up" : change < 0 ? "price-down" : "neutral";
          drawKline(canvas, candles);
          applyEarlyBadge(card, scoreEarlyMomentum(signalCandles));
        } catch (error) {
          if (error.name === "AbortError") return;
          status.textContent = "加载失败";
          status.className = "price-down";
          canvas.replaceWith(
            Object.assign(document.createElement("div"), {
              className: "empty",
              textContent: error.message || "K线加载失败",
            }),
          );
        }
      }

      function buildCardHtml(symbol, options) {
        const label = symbol.replace("USDT", "");
        const change = windowPriceChange(symbol, CONFIG.KLINE_INTERVAL);
        const favClass = options.isFavorite ? " is-favorite" : "";
        const pairClass = options.pairColor ? " is-pair" : "";
        const pairStyle = options.pairColor
          ? ` style="--pair-color:${options.pairColor}"`
          : "";
        const mark = options.showMark ? '<span class="fav-mark">★</span>' : "";
        return `<div class="kline-card${favClass}${pairClass}" data-symbol="${symbol}" data-section="${options.section}"${pairStyle}><div class="kline-card-head"><button type="button" class="symbol-copy" data-name="${label}" title="点击复制">${label}</button><span style="display:inline-flex;align-items:center;gap:6px"><span data-kline-status>${Number.isFinite(change) ? formatPercent(change) : "--"}</span><button type="button" class="blacklist-card-btn" data-symbol="${symbol}" title="加入黑名单" aria-label="加入黑名单">⊖</button></span></div>${mark}<canvas></canvas></div>`;
      }

      function bindCardInteractions(root) {
        root.querySelectorAll(".symbol-copy").forEach((btn) => {
          btn.addEventListener("click", (event) => {
            event.stopPropagation();
            copyName(btn.dataset.name);
          });
        });
        root.querySelectorAll(".blacklist-card-btn").forEach((btn) => {
          btn.addEventListener("click", (event) => {
            event.stopPropagation();
            addToBlacklist(btn.dataset.symbol);
          });
        });
        root.querySelectorAll(".kline-card").forEach((card) => {
          bindLongPress(card);
        });
      }

      function bindLongPress(card) {
        let timer = null;
        let triggered = false;

        const clear = () => {
          if (timer) {
            clearTimeout(timer);
            timer = null;
          }
          card.classList.remove("is-pressed");
        };

        const start = (event) => {
          if (event.target.closest(".symbol-copy, .blacklist-card-btn")) return;
          if (event.pointerType === "mouse" && event.button !== 0) return;
          triggered = false;
          card.classList.add("is-pressed");
          timer = setTimeout(async () => {
            triggered = true;
            clear();
            if (navigator.vibrate) navigator.vibrate(20);
            await toggleFavoriteForSymbol(card.dataset.symbol);
          }, CONFIG.LONG_PRESS_MS);
        };

        card.addEventListener("pointerdown", start);
        card.addEventListener("pointerup", clear);
        card.addEventListener("pointerleave", clear);
        card.addEventListener("pointercancel", clear);
        card.addEventListener("contextmenu", (event) => {
          event.preventDefault();
        });
        card.addEventListener(
          "click",
          (event) => {
            if (triggered) {
              event.preventDefault();
              event.stopPropagation();
              triggered = false;
            }
          },
          true,
        );
      }

      async function fillGrid(grid, symbols, section, signal, pairColors) {
        const favSet = favoriteSymbols();
        const colors = pairColors || new Map();
        grid.innerHTML = symbols.length
          ? symbols
              .map((symbol) =>
                buildCardHtml(symbol, {
                  section,
                  isFavorite: favSet.has(symbol),
                  showMark: section === "rising" && favSet.has(symbol),
                  pairColor: colors.get(symbol) || "",
                }),
              )
              .join("")
          : `<div class="empty">${section === "rising" ? "暂无上涨币种" : "暂无窗口上涨的收藏"}</div>`;

        bindCardInteractions(grid);

        const cards = [...grid.querySelectorAll(".kline-card")];
        const batchSize = 4;
        for (let index = 0; index < cards.length; index += batchSize) {
          if (signal.aborted) return;
          const batch = cards.slice(index, index + batchSize);
          await Promise.all(
            batch.map((card) =>
              renderKlineCard(
                card,
                card.dataset.symbol,
                CONFIG.KLINE_INTERVAL,
                signal,
              ),
            ),
          );
        }
      }

      async function renderKlines() {
        const interval = CONFIG.KLINE_INTERVAL;
        const bars = klineLimit(interval);
        const rangeText = klineRangeLabel();
        const rising = getRisingSymbols();
        const favRising = getFavoriteRisingSymbols(rising);
        const pairColors = buildPairColorMap(rising);
        const overlap = pairColors.size;
        const blocked = blacklistSymbols();
        const fallingHidden = favoriteItems.filter((item) => {
          const symbol = item.symbol;
          return (
            marketMap[symbol] &&
            !blocked.has(symbol) &&
            !hasWindowGain(symbol, interval) &&
            !rising.includes(symbol)
          );
        }).length;

        if (klineAbort) klineAbort.abort();
        klineAbort = new AbortController();
        const { signal } = klineAbort;

        document.getElementById("risingMeta").textContent = rising.length
          ? `窗口上涨 ${rising.length} / 观察池 ${watchPool.size} · ${interval} · ${rangeText} ${bars} 根`
          : `当前没有窗口上涨的观察池币种 · 观察池 ${watchPool.size} 个`;

        if (!favoriteItems.length) {
          document.getElementById("favMeta").textContent =
            "还没有收藏 · 长按上方 K 线卡片即可加入";
        } else {
          const parts = [
            `收藏 ${favoriteItems.length}`,
            `窗口上涨展示 ${favRising.length}`,
          ];
          if (overlap > 0) {
            parts.push(`另有 ${overlap} 个在上方 · 彩色边框标记`);
          }
          if (fallingHidden > 0) parts.push(`已隐藏下跌 ${fallingHidden}`);
          document.getElementById("favMeta").textContent = parts.join(" · ");
        }

        await fillGrid(
          document.getElementById("risingGrid"),
          rising,
          "rising",
          signal,
          pairColors,
        );
        if (signal.aborted) return;
        await fillGrid(
          document.getElementById("favGrid"),
          favRising,
          "favorite",
          signal,
          pairColors,
        );
        if (signal.aborted) return;
        const earlyCount = document.querySelectorAll(".early-badge").length;
        if (earlyCount > 0) {
          const risingMeta = document.getElementById("risingMeta");
          risingMeta.textContent = `${risingMeta.textContent} · 启动标记 ${earlyCount}`;
        }
      }

      async function toggleFavoriteForSymbol(symbol) {
        if (!symbol || favoriteSaving) return;
        favoriteSaving = true;
        const label = symbol.replace("USDT", "");
        try {
          setStatus(false, `正在保存 ${label} 收藏到 GitHub...`);
          const result = await WatchFavorites.patchFavorites({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.FAVORITES_PATH,
            message: `Update favorite ${symbol}`,
            mutate: (list) =>
              WatchFavorites.toggleFavorite(list, symbol, "kline"),
          });
          favoriteItems = result.favorites;
          const added = result.meta && result.meta.added;
          showToast(added ? `${label} 已收藏` : `${label} 已取消收藏`);
          await renderKlines();
          setStatus(
            true,
            added ? `${label} 已同步到 GitHub` : `${label} 已从 GitHub 移除`,
          );
        } catch (error) {
          console.error(error);
          showToast(error.message || "收藏保存失败");
          setStatus(false, error.message || "收藏保存失败");
          window.alert(error.message || "收藏保存失败");
        } finally {
          favoriteSaving = false;
        }
      }

      async function addToBlacklist(symbol) {
        if (!symbol || blacklistSaving) return;
        const label = symbol.replace("USDT", "");
        if (!window.confirm(`确定将 ${label} 加入黑名单？`)) return;
        blacklistSaving = true;
        try {
          setStatus(false, `正在拉黑 ${label}...`);
          const result = await WatchFavorites.patchBlacklist({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.BLACKLIST_PATH,
            message: `Add blacklist ${symbol}`,
            mutate: (list) => {
              if (WatchFavorites.hasBlacklist(list, symbol)) {
                return { list, added: false };
              }
              return {
                list: WatchFavorites.addBlacklist(list, symbol, "kline"),
                added: true,
              };
            },
          });
          blacklistItems = result.blacklist;
          watchPool.delete(symbol);
          if (favoriteSymbols().has(symbol)) {
            try {
              const favResult = await WatchFavorites.patchFavorites({
                repo: CONFIG.GITHUB_REPO,
                path: CONFIG.FAVORITES_PATH,
                message: `Remove favorite ${symbol} after blacklist`,
                mutate: (list) => ({
                  list: WatchFavorites.removeFavorite(list, symbol),
                  added: false,
                }),
              });
              favoriteItems = favResult.favorites;
            } catch (error) {
              console.warn("拉黑后移除收藏失败", error);
            }
          }
          showToast(`${label} 已加入黑名单`);
          await renderKlines();
          setStatus(true, `${label} 已拉黑并同步`);
        } catch (error) {
          console.error(error);
          showToast(error.message || "黑名单保存失败");
          setStatus(false, error.message || "黑名单保存失败");
          window.alert(error.message || "黑名单保存失败");
        } finally {
          blacklistSaving = false;
        }
      }

      async function refreshAll() {
        if (loading) return;
        loading = true;
        const btn = document.getElementById("refreshBtn");
        btn.disabled = true;
        try {
          setStatus(false, "1/3 读取 GitHub 快照 / 观察池 / 收藏...");
          await loadGithubStorage();

          setStatus(false, "2/3 拉取币安最新行情...");
          await loadBinanceTicker();

          setStatus(false, "3/3 重算观察池并加载 K 线...");
          updateWatchPool();
          await renderKlines();
          const rising = getRisingSymbols().length;
          setStatus(
            true,
            `已更新 · 上涨 ${rising} · 收藏 ${favoriteItems.length} · ${new Date().toLocaleTimeString("zh-CN")}`,
          );
        } catch (error) {
          console.error(error);
          setStatus(false, error.message || "刷新失败");
          document.getElementById("risingMeta").textContent = "";
          document.getElementById("favMeta").textContent = "";
          document.getElementById("risingGrid").innerHTML =
            `<div class="empty">${error.message || "加载失败"}</div>`;
          document.getElementById("favGrid").innerHTML = "";
        } finally {
          loading = false;
          btn.disabled = false;
        }
      }

      document.getElementById("refreshBtn").addEventListener("click", refreshAll);
      document.getElementById("rangeBtn").addEventListener("click", async () => {
        if (loading) return;
        const extended = CONFIG.KLINE_RANGE_DAYS_EXTENDED;
        const defaults = CONFIG.KLINE_RANGE_DAYS_DEFAULT;
        klineRangeDays =
          klineRangeDays === extended ? defaults : extended;
        syncRangeButton();
        setStatus(false, `正在加载${klineRangeLabel()} ${CONFIG.KLINE_INTERVAL} K线...`);
        try {
          await renderKlines();
          setStatus(
            true,
            `已切换为${klineRangeLabel()} · ${CONFIG.KLINE_INTERVAL} · ${new Date().toLocaleTimeString("zh-CN")}`,
          );
        } catch (error) {
          console.error(error);
          setStatus(false, error.message || "切换 K 线范围失败");
        }
      });
      document.addEventListener("dblclick", (event) => {
        if (event.target.closest("button, a, input, select, textarea, label")) {
          return;
        }
        window.location.href = "./watch.html";
      });
      syncRangeButton();
      refreshAll();
    </script>
  </body>
</html>
