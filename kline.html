      async function loadBinanceTicker() {
        const endpoints = [
          "https://data-api.binance.vision/api/v3/ticker/24hr",
          "https://api.binance.com/api/v3/ticker/24hr",
        ];
        let lastError = null;
        for (const url of endpoints) {
          try {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) {
              lastError = new Error(`HTTP ${response.status}`);
              continue;
            }
            const data = await response.json();
            Object.keys(marketMap).forEach((key) => delete marketMap[key]);
            data.forEach((ticker) => {
              if (!ticker.symbol.endsWith("USDT")) return;
              const price = Number(ticker.lastPrice);
              const change = Number(ticker.priceChangePercent);
              if (Number.isFinite(price) && Number.isFinite(change)) {
                marketMap[ticker.symbol] = {
                  price,
                  change24h: change,
                };
              }
            });
            return;
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("行情请求失败");
      }

      async function fetchKlines(symbol, interval, signal, limitOverride) {
        const limit = limitOverride || klineLimit(interval);
        const query = `symbol=${symbol}&interval=${interval}&limit=${limit}`;
        const endpoints = [
          `https://data-api.binance.vision/api/v3/klines?${query}`,
          `https://api.binance.com/api/v3/klines?${query}`,
        ];
        let lastError = null;
        for (const url of endpoints) {
          try {
            const response = await fetch(url, { signal, cache: "no-store" });
            if (!response.ok) {
              lastError = new Error(`HTTP ${response.status}`);
              continue;
            }
            const rows = await response.json();
            if (!Array.isArray(rows) || !rows.length) {
              lastError = new Error("K线为空");
              continue;
            }
            return rows.map((row) => ({
              time: Number(row[0]),
              open: Number(row[1]),
              high: Number(row[2]),
              low: Number(row[3]),
              close: Number(row[4]),
              volume: Number(row[5]),
            }));
          } catch (error) {
            if (error.name === "AbortError") throw error;
            lastError = error;
          }
        }
        throw lastError || new Error("K线请求失败");
      }

      /** Drop forming candle; closed closes only (same as WeCom notify). */
      function closedCloses(candles) {
        if (!Array.isArray(candles) || candles.length < 2) return [];
        return candles
          .slice(0, -1)
          .map((bar) => Number(bar && bar.close))
          .filter((value) => Number.isFinite(value));
      }

      /**
       * % change over `bars` 15m steps ending at closes[endIndex].
       * past index matches changeOverHours: closes[(endIndex+1) - bars].
       * livePrice only for the latest point (v4); historical ends must omit it
       * so past trail points are never polluted by the current ticker.
       */
      function changeAtClosedEnd(closes, bars, endIndex, livePrice) {
        if (!Array.isArray(closes) || bars < 1) return null;
        if (endIndex < 0 || endIndex >= closes.length) return null;
        const pastIndex = endIndex + 1 - bars;
        if (pastIndex < 0 || pastIndex > endIndex) return null;
        const past = closes[pastIndex];
        const now = Number.isFinite(livePrice) ? livePrice : closes[endIndex];
        if (!Number.isFinite(past) || past === 0 || !Number.isFinite(now)) {
          return null;
        }
        return ((now - past) / past) * 100;
      }

      /** % change vs closed 15m close from `hours` ago; now prefers live ticker. */
      function changeOverHours(candles, hours, currentPrice) {
        const closes = closedCloses(candles);
        const bars = Math.max(1, Math.round(Number(hours) * 4));
        if (!closes.length) return null;
        return changeAtClosedEnd(
          closes,
          bars,
          closes.length - 1,
          currentPrice,
        );
      }

      /**
       * Five 2h-momentum samples: 60m ago → now (15m steps).
       * v0…v3 = closed-vs-closed; v4 = ticker (or last close) vs close 8 bars back.
       */
      function build2hTrail(candles, currentPrice) {
        const cfg = CONFIG.MOMENTUM_TREND;
        const closes = closedCloses(candles);
        const points = cfg.trailPoints;
        const bars = cfg.bars2h;
        const need = bars + (points - 2);
        if (closes.length < Math.max(need, bars)) return null;
        const last = closes.length - 1;
        const trail = [];
        for (let i = 0; i < points; i += 1) {
          const endIndex = last - (points - 1 - i);
          const live = i === points - 1 ? currentPrice : undefined;
          trail.push(changeAtClosedEnd(closes, bars, endIndex, live));
        }
        if (trail.some((value) => !Number.isFinite(value))) return null;
        return trail;
      }

      const MOMENTUM_STATUS_RANK = {
        climb: 0,
        flat: 1,
        fade: 2,
        other: 3,
      };

      /** Stronger signal first (climb → flat → fade → other, then Δ / 2h / 1h). */
      function compareMomentumSignal(symbolA, symbolB, scores) {
        const scoreA = (scores && scores.get(symbolA)) || {};
        const scoreB = (scores && scores.get(symbolB)) || {};
        const trendA =
          scoreA.trend || classifyMomentumTrend(scoreA.trail2h, scoreA.change1h);
        const trendB =
          scoreB.trend || classifyMomentumTrend(scoreB.trail2h, scoreB.change1h);
        const ra =
          MOMENTUM_STATUS_RANK[trendA && trendA.status] ??
          MOMENTUM_STATUS_RANK.other;
        const rb =
          MOMENTUM_STATUS_RANK[trendB && trendB.status] ??
          MOMENTUM_STATUS_RANK.other;
        if (ra !== rb) return ra - rb;
        const aInc = !!(trendA && trendA.incomplete);
        const bInc = !!(trendB && trendB.incomplete);
        if (aInc !== bInc) return aInc ? 1 : -1;
        const da = Number.isFinite(trendA && trendA.delta)
          ? trendA.delta
          : -Infinity;
        const db = Number.isFinite(trendB && trendB.delta)
          ? trendB.delta
          : -Infinity;
        if (db !== da) return db - da;
        const va = Number.isFinite(scoreA.change2h) ? scoreA.change2h : -Infinity;
        const vb = Number.isFinite(scoreB.change2h) ? scoreB.change2h : -Infinity;
        if (vb !== va) return vb - va;
        const a1 = Number.isFinite(scoreA.change1h) ? scoreA.change1h : -Infinity;
        const b1 = Number.isFinite(scoreB.change1h) ? scoreB.change1h : -Infinity;
        if (b1 !== a1) return b1 - a1;
        return String(symbolA).localeCompare(String(symbolB));
      }

      /**
       * V1: climb is the only precise label; flat/fade/other stay loose.
       * 1h is carry only (not trail). Peak veto is hard.
       *
       * Incomplete trail (null / wrong length / any non-finite) → status "other"
       * with delta null; sort rank is lowest (见 MOMENTUM_STATUS_RANK).
       *
       * Acceptance shapes (change1h ≥ 0):
       *   A +4→+6→+8→+10→+12 → 爬升
       *   B +5→+8→+13→+11→+9 → 衰减 (peakDrop≥2)
       *   C +5→+8→+13→+11→+12 → 边界：peakDrop=1 < 2，V1 仍可能为爬升
       *   D +10→+11→+11→+12→+11 → 横盘 (|Δ|<minDeltaPts)
       *   E +5→+3→+6→+4→+5 → 横盘或其它（|Δ|小则横盘）
       */
      function classifyMomentumTrend(trail, change1h) {
        const cfg = CONFIG.MOMENTUM_TREND;
        const empty = {
          status: "other",
          label: "其它",
          delta: null,
          recentUpSteps: 0,
          peakDrop: null,
          incomplete: true,
        };
        if (!Array.isArray(trail) || trail.length !== cfg.trailPoints) {
          return empty;
        }
        if (trail.some((value) => !Number.isFinite(value))) return empty;

        const v0 = trail[0];
        const v2 = trail[2];
        const v3 = trail[3];
        const v4 = trail[4];
        const delta = v4 - v0;
        const minStep = cfg.minStepPts;
        let recentUpSteps = 0;
        if (v3 - v2 >= minStep) recentUpSteps += 1;
        if (v4 - v3 >= minStep) recentUpSteps += 1;

        const peakBefore = Math.max(trail[0], trail[1], trail[2], trail[3]);
        const peakDrop = peakBefore - v4;
        const peakVeto = peakDrop >= cfg.dropFromPeakPts;
        const h1Ok = !Number.isFinite(change1h) || change1h >= 0;

        if (
          v4 > 0 &&
          h1Ok &&
          delta >= cfg.minDeltaPts &&
          recentUpSteps >= 1 &&
          !peakVeto
        ) {
          return {
            status: "climb",
            label: "爬升",
            delta,
            recentUpSteps,
            peakDrop,
            incomplete: false,
          };
        }

        // Loose non-climb buckets — tune later from live cases.
        if (
          peakVeto ||
          delta <= -cfg.minDeltaPts ||
          (v4 < v3 - minStep && v3 < v2 - minStep)
        ) {
          return {
            status: "fade",
            label: "衰减",
            delta,
            recentUpSteps,
            peakDrop,
            incomplete: false,
          };
        }
        // 横盘: 近2h 仍正，且 abs(Δ) < minDeltaPts（与爬升门槛共用配置）。
        if (v4 > 0 && Math.abs(delta) < cfg.minDeltaPts) {
          return {
            status: "flat",
            label: "横盘",
            delta,
            recentUpSteps,
            peakDrop,
            incomplete: false,
          };
        }
        return {
          status: "other",
          label: "其它",
          delta,
          recentUpSteps,
          peakDrop,
          incomplete: false,
        };
      }

      function formatTrailTip(trail, trend) {
        if (!Array.isArray(trail) || !trail.length) return "";
        const parts = trail.map((value) => formatPercent(value)).join(" → ");
        const deltaText = Number.isFinite(trend && trend.delta)
          ? ` · Δ ${trend.delta >= 0 ? "+" : ""}${trend.delta.toFixed(1)}pt`
          : "";
        return `${parts}${deltaText}`;
      }

      function renderTrailStepsHtml(trail, trend) {
        if (!Array.isArray(trail) || !trail.length) return "";
        const maxAbs = Math.max(...trail.map((value) => Math.abs(value)), 0.01);
        const steps = trail
          .map((value, index) => {
            const h = Math.max(0.14, Math.min(1, Math.abs(value) / maxAbs));
            const classes = [
              "mom-step",
              index === trail.length - 1 ? "is-last" : "",
              value < 0 ? "is-neg" : "",
            ]
              .filter(Boolean)
              .join(" ");
            return `<span class="${classes}" style="--h:${h.toFixed(3)}"></span>`;
          })
          .join("");
        const tip = escapeHtml(formatTrailTip(trail, trend));
        return `<div class="mom-trail" title="${tip}">${steps}</div>`;
      }

      async function loadPinHourScores(symbols, signal, onProgress) {
        const scores = new Map();
        const list = [...new Set((symbols || []).filter(Boolean))];
        const batchSize = Math.max(1, CONFIG.MOMENTUM_FETCH_CONCURRENCY || 12);
        const limit = CONFIG.MOMENTUM_TREND.klineLimit;
        if (typeof onProgress === "function") onProgress(0, list.length);
        for (let index = 0; index < list.length; index += batchSize) {
          if (signal && signal.aborted) return scores;
          const batch = list.slice(index, index + batchSize);
          await Promise.all(
            batch.map(async (symbol) => {
              try {
                const candles = await fetchKlines(
                  symbol,
                  "15m",
                  signal,
                  limit,
                );
                const price = marketMap[symbol]?.price;
                const change1h = changeOverHours(candles, 1, price);
                const change2h = changeOverHours(candles, 2, price);
                const trail2h = build2hTrail(candles, price);
                const trend = classifyMomentumTrend(trail2h, change1h);
                scores.set(symbol, {
                  change1h,
                  change2h,
                  trail2h,
                  trend,
                });
              } catch (error) {
                if (error && error.name === "AbortError") throw error;
                scores.set(symbol, {
                  change1h: null,
                  change2h: null,
                  trail2h: null,
                  trend: classifyMomentumTrend(null, null),
                });
              }
            }),
          );
          if (typeof onProgress === "function") {
            onProgress(Math.min(list.length, index + batch.length), list.length);
          }
        }
        return scores;
      }

      function shouldComputeMomentum(options) {
        if (options && options.force) return true;
        if (isNotesView()) return true;
        if (pinSortMode === "momentum") return true;
        if (isFloatPanelOpen("momentum")) return true;
        return false;
      }

      function setMomentumUiBusy(busy, label) {
        const tab = document.getElementById("momentumFloatTab");
        const total = momentumProgress.total || 0;
        const done = momentumProgress.done || 0;
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;
        const text =
          label ||
          (total > 0 ? `计算近2h/1h ${done}/${total}` : "计算近2h/1h…");
        if (tab) {
          if (!tab.dataset.idleText) {
            tab.dataset.idleText = "近2h/1h";
          }
          tab.classList.toggle("is-computing", !!busy);
          tab.hidden = false;
          tab.disabled = !!busy;
          tab.style.setProperty("--mom-pct", busy ? `${pct}%` : "0%");
          tab.textContent = busy
            ? total > 0
              ? `近2h/1h ${done}/${total}`
              : "近2h/1h…"
            : tab.dataset.idleText || "近2h/1h";
          tab.title = busy
            ? text
            : "近2h/1h（爬升优先 · 含2h轨迹）";
        }
        syncPinSortUi();
        if (!loading) {
          if (busy) {
            setTopProgress(true, { overlay: false, label: text });
            if (total > 0) setTopProgressValue(done / total, text);
          } else {
            setTopProgress(false);
          }
        }
        const panel = document.getElementById("momentumFloat");
        const body = document.getElementById("momentumFloatBody");
        const timeEl = document.getElementById("momentumFloatTime");
        const hasRows =
          lastMomentumSnapshot &&
          Array.isArray(lastMomentumSnapshot.rows) &&
          lastMomentumSnapshot.rows.length;
        if (busy && timeEl) {
          timeEl.textContent = ` · ${done}/${total || "…"}`;
        }
        if (busy && panel && !panel.hidden && body && !hasRows) {
          body.innerHTML = `<div class="notify-col-empty">${escapeHtml(text)}</div>`;
        }
      }

      function scoresMapFromSnapshot(snapshot) {
        const map = new Map();
        const rows = (snapshot && snapshot.rows) || [];
        rows.forEach((row) => {
          if (!row || !row.symbol) return;
          map.set(row.symbol, {
            change1h: row.change1h,
            change2h: row.change2h,
            trail2h: row.trail2h,
            trend: row.trend,
          });
        });
        return map;
      }

      function currentMomentumUniverse() {
        if (lastScoreUniverse.length) return lastScoreUniverse.slice();
        if (isNotesView()) {
          const blocked = blacklistSymbols();
          return [
            ...new Set([
              ...listWindowUpPinSymbols(),
              ...noteSymbolList().filter((symbol) => !blocked.has(symbol)),
            ]),
          ];
        }
        const recentAutoList = listRecentAutoPins().map((item) => item.symbol);
        return [
          ...new Set([
            ...recentAutoList,
            ...listWindowUpPinSymbols().filter(
              (symbol) => !recentAutoList.includes(symbol),
            ),
          ]),
        ];
      }

      function applyPinGridOrder(symbols) {
        const grid = document.getElementById("pinGrid");
        if (!grid || !symbols || !symbols.length) return;
        symbols.forEach((symbol) => {
          const card = grid.querySelector(
            `.kline-card[data-section="pin"][data-symbol="${symbol}"]`,
          );
          if (card) grid.appendChild(card);
        });
      }

      function reorderPinGridByMomentum(scores) {
        const scoreMap = scores || scoresMapFromSnapshot(lastMomentumSnapshot);
        if (isNotesView()) {
          const blocked = blacklistSymbols();
          const list = noteSymbolList()
            .filter((symbol) => !blocked.has(symbol))
            .slice()
            .sort((a, b) => compareMomentumSignal(a, b, scoreMap));
          applyPinGridOrder(list);
          return;
        }
        const recentAutoSet = new Set(
          listRecentAutoPins().map((item) => item.symbol),
        );
        const list = listWindowUpPinSymbols()
          .filter((symbol) => !recentAutoSet.has(symbol))
          .slice()
          .sort((a, b) => compareMomentumSignal(a, b, scoreMap));
        applyPinGridOrder(list);
      }

      function reorderPinGridByPinChange() {
        if (isNotesView()) return;
        const recentAutoSet = new Set(
          listRecentAutoPins().map((item) => item.symbol),
        );
        applyPinGridOrder(
          listWindowUpPinSymbols().filter(
            (symbol) => !recentAutoSet.has(symbol),
          ),
        );
      }

      async function schedulePinMomentum(symbols, options) {
        const opts = options || {};
        const list = [...new Set((symbols || []).filter(Boolean))];
        lastScoreUniverse = list;
        if (!shouldComputeMomentum(opts)) {
          updateMomentumFloatPanel();
          return null;
        }
        if (!list.length) {
          updatePinMomentumMeta(new Map(), []);
          return new Map();
        }
        if (momentumAbort) momentumAbort.abort();
        momentumAbort = new AbortController();
        const { signal } = momentumAbort;
        momentumBusy = true;
        momentumProgress = { done: 0, total: list.length };
        setMomentumUiBusy(true, `计算近2h/1h 0/${list.length}`);
        try {
          const scores = await loadPinHourScores(
            list,
            signal,
            (done, total) => {
              momentumProgress = { done, total };
              setMomentumUiBusy(true, `计算近2h/1h ${done}/${total}`);
            },
          );
          if (signal.aborted) return null;
          updatePinMomentumMeta(scores, list);
          if (pinSortMode === "momentum" || isNotesView()) {
            reorderPinGridByMomentum(scores);
          }
          return scores;
        } catch (error) {
          if (error && error.name === "AbortError") return null;
          console.warn(error);
          showToast(error.message || "近2h/1h 计算失败");
          return null;
        } finally {
          if (!signal.aborted) {
            momentumBusy = false;
            setMomentumUiBusy(false);
          }
        }
      }

      async function ensureMomentumThenReorder(options) {
        const list = currentMomentumUniverse();
        const snap = lastMomentumSnapshot;
        const hasSnap =
          snap && Array.isArray(snap.rows) && snap.rows.length > 0;
        if (hasSnap && !(options && options.force)) {
          reorderPinGridByMomentum();
          updateMomentumFloatPanel();
          return;
        }
        await schedulePinMomentum(list, { force: true });
      }

      function formatHourRankLine(scores, symbols, key, limit) {
        const rows = symbols
          .map((symbol) => {
            const score = scores.get(symbol);
            const value = score ? score[key] : null;
            return {
              symbol,
              label: String(symbol).replace(/USDT$/i, ""),
              value,
            };
          })
          .filter((row) => Number.isFinite(row.value))
          .sort((a, b) => b.value - a.value)
          .slice(0, limit || 5);
        if (!rows.length) return "暂无";
        return rows
          .map((row, index) => {
            const cls =
              row.value >= 2 ? "mom-hot" : row.value < 0 ? "mom-cool" : "";
            const text = `${row.label} ${formatPercent(row.value)}`;
            return cls
              ? `<span class="${cls}">${index === 0 && key === "change2h" ? "① " : ""}${text}</span>`
              : `${index === 0 && key === "change2h" ? "① " : ""}${text}`;
          })
          .join(" · ");
      }

      function buildMomentumSnapshot(scores, symbols) {
        const at = Date.now();
        const rows = symbols
          .map((symbol) => {
            const score = scores.get(symbol) || {};
            const pinItem = pinItemBySymbol(symbol);
            const trend = score.trend || classifyMomentumTrend(null, null);
            return {
              symbol,
              label: String(symbol).replace(/USDT$/i, ""),
              change24h: marketMap[symbol]?.change24h ?? null,
              pinChange: pinItem ? pinChangePercent(pinItem) : null,
              pinPrice: pinItem ? Number(pinItem.pinPrice) : null,
              current: marketMap[symbol]?.price ?? null,
              change1h: score.change1h ?? null,
              change2h: score.change2h ?? null,
              trail2h: score.trail2h ?? null,
              trend,
            };
          })
          .filter(
            (row) =>
              Number.isFinite(row.change2h) || Number.isFinite(row.change1h),
          )
          .sort((a, b) => {
            // Incomplete trail stays in "other" (lowest rank); never climb.
            const ra =
              MOMENTUM_STATUS_RANK[a.trend && a.trend.status] ??
              MOMENTUM_STATUS_RANK.other;
            const rb =
              MOMENTUM_STATUS_RANK[b.trend && b.trend.status] ??
              MOMENTUM_STATUS_RANK.other;
            if (ra !== rb) return ra - rb;
            // Within same status, incomplete (no Δ) sorts after complete trails.
            const aInc = !!(a.trend && a.trend.incomplete);
            const bInc = !!(b.trend && b.trend.incomplete);
            if (aInc !== bInc) return aInc ? 1 : -1;
            const da = Number.isFinite(a.trend && a.trend.delta)
              ? a.trend.delta
              : -Infinity;
            const db = Number.isFinite(b.trend && b.trend.delta)
              ? b.trend.delta
              : -Infinity;
            if (db !== da) return db - da;
            const va = Number.isFinite(a.change2h) ? a.change2h : -Infinity;
            const vb = Number.isFinite(b.change2h) ? b.change2h : -Infinity;
            if (vb !== va) return vb - va;
            const a1 = Number.isFinite(a.change1h) ? a.change1h : -Infinity;
            const b1 = Number.isFinite(b.change1h) ? b.change1h : -Infinity;
            return b1 - a1;
          });
        return { at, rows };
      }

      function hourClass(value) {
        if (!Number.isFinite(value)) return "";
        if (value >= 2) return "is-hot";
        if (value < 0) return "is-cool";
        return "";
      }

      function loadMomNotes() {
        return Array.isArray(momNoteItems) ? momNoteItems : [];
      }

      function formatMomNoteTime(at) {
        const date = new Date(Number(at) || Date.now());
        const hh = String(date.getHours()).padStart(2, "0");
        const mm = String(date.getMinutes()).padStart(2, "0");
        return `${hh}:${mm}`;
      }

      function groupMomNotesBySymbol(notes) {
        const map = new Map();
        (notes || []).forEach((note) => {
          const symbol = String(note && note.symbol ? note.symbol : "")
            .trim()
            .toUpperCase();
          if (!symbol) return;
          if (!map.has(symbol)) map.set(symbol, []);
          map.get(symbol).push(note);
        });
        const groups = [...map.entries()].map(([symbol, list]) => {
          const sorted = list
            .slice()
            .sort((a, b) => Number(a.at) - Number(b.at));
          const latestAt = sorted.length
            ? Number(sorted[sorted.length - 1].at) || 0
            : 0;
          const label =
            (sorted[sorted.length - 1] && sorted[sorted.length - 1].label) ||
            symbol.replace(/USDT$/i, "");
          return { symbol, label, notes: sorted, latestAt };
        });
        groups.sort((a, b) => b.latestAt - a.latestAt);
        return groups;
      }

      function renderMomNotesHtml() {
        const notes = loadMomNotes();
        const groups = groupMomNotesBySymbol(notes);
        const expanded = momNotesExpanded;
        const clearBtn = notes.length
          ? `<button type="button" class="mom-notes-clear" data-mom-notes-clear title="清空记一笔">清空</button>`
          : "";
        const summary = notes.length
          ? `${groups.length} 币 · ${notes.length} 条`
          : "";
        const caret = expanded ? "▾" : "▸";
        const toggleLabel = notes.length
          ? `记一笔${summary ? ` · ${summary}` : ""}`
          : "记一笔";
        const head = [
          `<div class="mom-notes-head">`,
          `<button type="button" class="mom-notes-toggle" data-mom-notes-toggle aria-expanded="${expanded ? "true" : "false"}">`,
          `<span class="mom-notes-caret" aria-hidden="true">${caret}</span>`,
          escapeHtml(toggleLabel),
          `</button>`,
          `<span class="mom-notes-head-actions">${clearBtn}</span>`,
          `</div>`,
        ].join("");

        if (!notes.length) {
          return `<div class="mom-notes${expanded ? "" : " is-collapsed"}">${head}${
            expanded
              ? `<div class="mom-notes-empty">点行内「记」同步到 GitHub</div>`
              : ""
          }</div>`;
        }

        if (!expanded) {
          return `<div class="mom-notes is-collapsed">${head}</div>`;
        }

        const body = groups
          .map((group) => {
            const label = escapeHtml(group.label);
            const count =
              group.notes.length > 1
                ? `<span class="mom-note-count">${group.notes.length}</span>`
                : "";
            const lines = group.notes
              .map((note) => {
                const st = note.statusLabel || note.status || "";
                const stClass = note.status ? `is-${note.status}` : "is-other";
                const c2 = Number.isFinite(note.change2h)
                  ? formatPercent(note.change2h)
                  : "";
                return [
                  `<div class="mom-note-item">`,
                  `<span class="mom-note-time">${escapeHtml(formatMomNoteTime(note.at))}</span>`,
                  `<span class="mom-note-main">`,
                  st
                    ? `<span class="mom-status ${stClass}">${escapeHtml(st)}</span>`
                    : "",
                  c2
                    ? `<span class="${hourClass(note.change2h)}">${escapeHtml(c2)}</span>`
                    : "",
                  `</span>`,
                  `<button type="button" class="mom-note-del" data-mom-note-del="${escapeHtml(note.id)}" title="删除这条" aria-label="删除">×</button>`,
                  `</div>`,
                ].join("");
              })
              .join("");
            return [
              `<div class="mom-note-group">`,
              `<div class="mom-note-group-head">`,
              `<a href="#card-pin-${escapeHtml(group.symbol)}" class="notify-coin mom-note-sym" data-jump="${escapeHtml(group.symbol)}">${label}</a>`,
              `<span aria-hidden="true">：</span>`,
              count,
              `</div>`,
              lines,
              `</div>`,
            ].join("");
          })
          .join("");
        return `<div class="mom-notes">${head}<div class="mom-notes-list">${body}</div></div>`;
      }

      async function addMomNoteFromRow(row) {
        if (!row || !row.symbol || momNotesSaving) return;
        const trend = row.trend || {};
        const notes = loadMomNotes();
        const recent = notes[0];
        if (
          recent &&
          recent.symbol === row.symbol &&
          Date.now() - Number(recent.at) < 2 * 60 * 1000
        ) {
          showToast(`刚记过 ${row.label || row.symbol}`);
          return;
        }
        const entry = {
          id: `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`,
          at: Date.now(),
          symbol: row.symbol,
          label: row.label || String(row.symbol).replace(/USDT$/i, ""),
          status: trend.status || null,
          statusLabel: trend.label || null,
          change2h: Number.isFinite(row.change2h) ? row.change2h : null,
          change1h: Number.isFinite(row.change1h) ? row.change1h : null,
          delta: Number.isFinite(trend.delta) ? trend.delta : null,
        };
        momNotesSaving = true;
        try {
          const result = await WatchFavorites.patchMomNotes({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.MOM_NOTES_PATH,
            message: `Note momentum ${entry.symbol}`,
            mutate: (list) => [entry, ...list],
          });
          momNoteItems = result.notes || [];
          showToast(`已记 ${entry.label}`);
          refreshMomentumFloatBody();
        } catch (error) {
          console.warn(error);
          showToast(error.message || "记一笔失败");
        } finally {
          momNotesSaving = false;
        }
      }

        const panel = document.getElementById("momentumFloat");
        const tab = document.getElementById("momentumFloatTab");
        const body = document.getElementById("momentumFloatBody");
        const timeEl = document.getElementById("momentumFloatTime");
        if (!panel || !tab || !body) return;

        const snap = lastMomentumSnapshot;
        const hasRows = snap && Array.isArray(snap.rows) && snap.rows.length;
        tab.hidden = false;
        tab.disabled = momentumBusy || !hasRows;
        if (momentumBusy) {
          tab.classList.add("is-computing");

          const done = momentumProgress.done || 0;
          const pct = total > 0 ? Math.round((done / total) * 100) : 0;
          tab.style.setProperty("--mom-pct", `${pct}%`);
        }
        if (!hasRows) {
          if (!momentumBusy && !panel.hidden) panel.hidden = true;
          if (momentumBusy) {
            const total = momentumProgress.total || 0;
            const done = momentumProgress.done || 0;
            const text =
              total > 0
                ? `正在计算近2h/1h ${done}/${total}`
                : "正在计算近2h/1h…";

        // Top meta strip retired — keep snapshot for the 近2h/1h float.

      function lastBarRises(closes, bars) {
        const need = bars + 1;
        if (!Array.isArray(closes) || closes.length < need) return [];
        const slice = closes.slice(-need);
        const rises = [];
        for (let i = 1; i < slice.length; i += 1) {
          rises.push(slice[i] > slice[i - 1]);
        }
        return rises;
      }

      function momentumFromCloses(closes5, closes15) {
        const rises5 = lastBarRises(closes5, 3);
        const rises15 = lastBarRises(closes15, 3);
        return {
          streak5: rises5.length === 3 && rises5.every(Boolean),
          heat15: rises15.length === 3 && rises15.filter(Boolean).length >= 2,
        };
      }

      function applyPinMomentum(card, flags) {
        const nameBtn = card.querySelector(".symbol-copy");
        const status = card.querySelector("[data-kline-status]");
        const inlinePinStats =
          status && status.classList.contains("pin-stats");
        card.classList.remove("is-streak5", "is-heat15", "is-price-up-last");
        if (nameBtn) {
          nameBtn.classList.remove("is-streak5", "is-heat15");
        }
        const oldBadge = card.querySelector(".mom-badge");
        if (oldBadge) oldBadge.remove();
        const oldMark = card.querySelector(".price-up-last-mark");
        if (oldMark) oldMark.remove();

        if (!flags) return;
        const { streak5, heat15, priceUpVsLast } = flags;

        if (streak5) {
          card.classList.add("is-streak5");
          if (nameBtn) nameBtn.classList.add("is-streak5");
        } else if (heat15) {
          card.classList.add("is-heat15");
          if (nameBtn) nameBtn.classList.add("is-heat15");
        }

        // Pin cards fold 5m / @@@ into the multi-line status block.
        if (inlinePinStats) {
          if (priceUpVsLast) card.classList.add("is-price-up-last");
          return;
        }

        if (streak5 || heat15) {
          const badge = document.createElement("span");
          badge.className = `mom-badge ${streak5 ? "is-streak5" : "is-heat15"}`;
          const parts = [];
          if (streak5) parts.push("5m连阳");
          if (heat15) parts.push("15m热");
          badge.textContent = parts.join(" · ");
          badge.title = streak5
            ? "近 3 根已收盘 5m 收盘价连续高于前收（与企微绿名一致）"
            : "近 3 根已收盘 15m 至少 2 根收涨（与企微橙名一致）";
          if (streak5 && heat15) {
            badge.title =
              "5m 三连阳 + 15m 热度（名称按企微规则显示绿色）";
          }
          badge.addEventListener("pointerdown", (event) =>
            event.stopPropagation(),
          );
          card.appendChild(badge);
        }

        if (priceUpVsLast && status) {
          card.classList.add("is-price-up-last");
          const mark = document.createElement("span");
          mark.className = "price-up-last-mark";
          mark.textContent = "@@@";
          mark.title = "现价高于上次企微推送价";
          status.appendChild(mark);
        }
      }

      function drawKline(canvas, candles, pinPrice) {
        const rect = canvas.getBoundingClientRect();
        const width = Math.max(1, Math.floor(rect.width));
        const height = Math.max(1, Math.floor(rect.height));
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        if (!candles.length) return;

        const pad = { top: 6, right: 4, bottom: 6, left: 4 };
        const chartW = width - pad.left - pad.right;
        const chartH = height - pad.top - pad.bottom;
        const highs = candles.map((item) => item.high);
        const lows = candles.map((item) => item.low);
        let max = Math.max(...highs);
        let min = Math.min(...lows);
        const pin = Number(pinPrice);
        const hasPin = Number.isFinite(pin) && pin > 0;
        if (hasPin) {
          max = Math.max(max, pin);
          min = Math.min(min, pin);
        }
        const range = max - min || max * 0.01 || 1;
        const slot = chartW / candles.length;
        const bodyW = Math.max(1, slot * 0.62);
        const yOf = (price) => pad.top + ((max - price) / range) * chartH;

        if (hasPin) {
          const y = yOf(pin);
          ctx.save();
          ctx.strokeStyle = "#5a6a68";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(pad.left, y);
          ctx.lineTo(pad.left + chartW, y);
          ctx.stroke();
          ctx.restore();
        }

        candles.forEach((candle, index) => {
          const x = pad.left + slot * index + slot / 2;
          const up = candle.close >= candle.open;
          ctx.strokeStyle = up ? "#718b88" : "#8d7771";
          ctx.fillStyle = up ? "#718b88" : "#8d7771";
          ctx.beginPath();
          ctx.moveTo(x, yOf(candle.high));
          ctx.lineTo(x, yOf(candle.low));
          ctx.stroke();
          const y1 = yOf(candle.open);
          const y2 = yOf(candle.close);
          const bodyH = Math.max(1, Math.abs(y2 - y1));
          ctx.fillRect(x - bodyW / 2, Math.min(y1, y2), bodyW, bodyH);
        });
      }

      async function renderKlineCard(card, symbol, interval, signal, pinItem) {
        const canvas = card.querySelector("canvas");
        const status = card.querySelector("[data-kline-status]");
        if (!canvas || !status) return;
        try {
          const tasks = [fetchKlines(symbol, interval, signal)];
          if (pinItem) {
            tasks.push(
              fetchKlines(
                symbol,
                CONFIG.SIGNAL_INTERVAL,
                signal,
                CONFIG.SIGNAL_LIMIT,
              ),
              fetchKlines(symbol, "5m", signal, CONFIG.MOMENTUM_5M_LIMIT),
            );
          }
          const results = await Promise.all(tasks);
          const candles = results[0];
          if (pinItem) {
            const signalCandles = results[1];
            const candles5 = results[2];
            const mom = momentumFromCloses(
              closedCloses(candles5),
              closedCloses(signalCandles),
            );
            const last = Number(lastPinPrices[symbol]);
            const current = marketMap[symbol]?.price;
            const priceUpVsLast =
              Number.isFinite(last) &&
              Number.isFinite(current) &&
              current > last;
            const flags = {
              streak5: mom.streak5,
              heat15: mom.heat15,
              priceUpVsLast,
            };
            status.className = "pin-stats";
            status.innerHTML = buildPinStatusHtml(pinItem, symbol, flags);
            status.title = [
              `盯住价 ${formatPinPrice(pinItem.pinPrice)}`,
              `现价 ${formatPinPrice(current)}`,
              `盯幅 ${formatPercent(pinChangePercent(pinItem))}`,
              `24h ${formatPercent(marketMap[symbol]?.change24h)}`,
              formatRemaining(pinItem.expiresAt) || "",
            ]
              .filter(Boolean)
              .join(" · ");
            applyPinMomentum(card, flags);
          } else {
            const change24h = marketMap[symbol]?.change24h;
            status.textContent = Number.isFinite(change24h)
              ? `${formatPercent(change24h)} · 24h`
              : "24h";
            status.className =
              change24h > 0 ? "up" : change24h < 0 ? "price-down" : "neutral";
            applyPinMomentum(card, null);
          }
          drawKline(canvas, candles, pinItem ? pinItem.pinPrice : null);
        } catch (error) {
          if (error.name === "AbortError") return;
          status.textContent = "加载失败";
          status.className = "price-down";
          canvas.replaceWith(
            Object.assign(document.createElement("div"), {
              className: "empty",
              textContent: error.message || "K线加载失败",
            }),
          );
        }
      }

      function buildCardHtml(symbol, options) {
        const label = symbol.replace("USDT", "");
        const change24h = marketMap[symbol]?.change24h;
        const favClass = options.isFavorite ? " is-favorite" : "";
        const pairClass = options.isPair ? " is-pair" : "";
        const pinClass = options.isPin ? " is-pin" : "";
        const noteClass = options.isNote ? " is-note" : "";
        const selectClass =
          options.selectMode && options.isPinSection ? " is-select-mode" : "";
        const selectedClass =
          options.selectMode &&
          options.isPinSection &&
          options.isSelected
            ? " is-selected"
            : "";
        const posClass = options.hasPosition ? " is-position" : "";
        const expiredClass = options.isExpired ? " is-expired" : "";
        const marks = [];
        if (options.showMark) marks.push('<span class="fav-mark">★</span>');
        // Notes view: only show 盯 when there is a real pin row.
        if (options.isPin && (options.pinItem || !options.isNote)) {
          marks.push(
            `<span class="pin-mark">${options.isExpired ? "过期" : "盯"}</span>`,
          );
        }
        if (options.hasPosition) {
          marks.push('<span class="pos-mark">持仓</span>');
        }
        const checkHtml =
          options.selectMode && options.isPinSection
            ? `<input type="checkbox" class="pin-check" ${
                options.isSelected ? "checked" : ""
              } aria-label="选择 ${label}" />`
            : "";
        const statusText = options.pinItem
          ? buildPinStatusHtml(options.pinItem, symbol, null)
          : Number.isFinite(change24h)
            ? formatPercent(change24h)
            : "--";
        const headClass = options.pinItem
          ? "kline-card-head is-pin-head"
          : "kline-card-head";
        const statusClass = options.pinItem ? ' class="pin-stats"' : "";
        return `<div class="kline-card${favClass}${pairClass}${pinClass}${noteClass}${selectClass}${selectedClass}${posClass}${expiredClass}" id="card-${options.section}-${symbol}" data-symbol="${symbol}" data-section="${options.section}"><div class="${headClass}"><button type="button" class="symbol-copy" data-name="${label}" title="点击复制">${label}</button><span data-kline-status${statusClass}>${statusText}</span></div>${marks.join("")}${checkHtml}<canvas></canvas></div>`;
      }

      function closeCardActions(force) {
        document.querySelectorAll(".card-actions").forEach((el) => {
          if (!force && el.classList.contains("is-busy")) return;
          el.remove();
        });
      }

      function setCardActionsBusy(sheet, activeBtn, busyLabel) {
        sheet.classList.add("is-busy");
        sheet.querySelectorAll("button").forEach((btn) => {
          btn.disabled = true;
          if (btn === activeBtn) {
            btn.classList.add("is-loading");
            btn.dataset.labelBefore = btn.textContent;
            btn.textContent = busyLabel || "处理中";
          }
        });
      }

      function clearCardActionsBusy(sheet) {
        sheet.classList.remove("is-busy");
        sheet.querySelectorAll("button").forEach((btn) => {
          btn.disabled = false;
          if (btn.classList.contains("is-loading")) {
            btn.classList.remove("is-loading");
            if (btn.dataset.labelBefore) {
              btn.textContent = btn.dataset.labelBefore;
              delete btn.dataset.labelBefore;
            }
          }
        });
      }

      function openCardActions(card) {
        closeCardActions(true);
        const symbol = card.dataset.symbol;
        if (!symbol) return;
        const pinned = pinSymbols().has(symbol);
        const favored = favoriteSymbols().has(symbol);
        const held = positionSymbols().has(symbol);
        const expired = (() => {
          const item = pinItemBySymbol(symbol);
          return item ? WatchFavorites.isPinExpired(item) : false;
        })();
        const sheet = document.createElement("div");
        sheet.className = "card-actions";
        sheet.innerHTML = [
          expired
            ? `<button type="button" data-action="renew">续盯（现价起算）</button>`
            : "",
          `<button type="button" data-action="pin">${
            pinned
              ? expired
                ? "清除过期盯一下"
                : "取消盯一下"
              : "盯一下"
          }</button>`,
          `<button type="button" data-action="buy">${held ? "更新买入价" : "购买"}</button>`,
          held
            ? `<button type="button" data-action="sell">卖出</button>`
            : "",
          `<button type="button" data-action="fav">${favored ? "取消收藏" : "收藏"}</button>`,
          isNotesView()
            ? `<button type="button" data-action="remove-note" class="is-danger">去掉记一笔</button>`
            : "",
          `<button type="button" data-action="blacklist" class="is-danger">拉黑</button>`,
          `<button type="button" data-action="close" class="is-muted">关闭</button>`,
        ].join("");
        sheet.addEventListener("pointerdown", (event) => event.stopPropagation());
        sheet.addEventListener("click", async (event) => {
          const btn = event.target.closest("button[data-action]");
          if (!btn || sheet.classList.contains("is-busy")) return;
          event.stopPropagation();
          const action = btn.dataset.action;
          if (action === "close") {
            closeCardActions(true);
            return;
          }

          const busyLabels = {
            renew: "续盯中",
            pin: pinned ? (expired ? "清除中" : "取消中") : "盯住中",
            buy: "保存中",
            sell: "卖出中",
            fav: favored ? "取消中" : "收藏中",
            "remove-note": "去掉中",
            blacklist: "拉黑中",
          };
          const needsConfirm = action === "buy" || action === "sell" || action === "blacklist";
          const markBusy = () =>
            setCardActionsBusy(sheet, btn, busyLabels[action] || "处理中");
          if (!needsConfirm) markBusy();
          try {
            let done = true;
            if (action === "renew") {
              done = await renewPinForSymbol(symbol);
            } else if (action === "pin") {
              if (pinned) await clearPinForSymbol(symbol);
              else await togglePinForSymbol(symbol);
            } else if (action === "buy") {
              done = await buyPositionForSymbol(symbol, { onSaving: markBusy });
            } else if (action === "sell") {
              done = await sellPositionForSymbol(symbol, { onSaving: markBusy });
            } else if (action === "fav") {
              await toggleFavoriteForSymbol(symbol);
            } else if (action === "remove-note") {
              done = await removeNotesForSymbol(symbol);
            } else if (action === "blacklist") {
              done = await addToBlacklist(symbol, { onSaving: markBusy });
            }
            if (done === false) {
              if (sheet.classList.contains("is-busy")) clearCardActionsBusy(sheet);
              return;
            }
            // Successful actions usually re-render and remove the card sheet.
            if (document.body.contains(sheet)) closeCardActions(true);
          } catch (error) {
            console.error(error);
            clearCardActionsBusy(sheet);
            showToast(error.message || "操作失败");
          }
        });
        card.appendChild(sheet);
      }

      function bindCardInteractions(root) {
        root.querySelectorAll(".symbol-copy").forEach((btn) => {
          btn.addEventListener("click", (event) => {
            if (pinSelectMode && !isNotesView()) {
              event.preventDefault();
              event.stopPropagation();
              const card = btn.closest(".kline-card");
              if (card && isPinCardSection(card.dataset.section)) {
                togglePinSelection(card.dataset.symbol);
              }
              return;
            }
            event.stopPropagation();
            closeCardActions();
            copyName(btn.dataset.name);
          });
        });
        root.querySelectorAll(".kline-card").forEach((card) => {
          bindLongPress(card);
        });
      }

      function isPinCardSection(section) {
        return section === "pin" || section === "pin-hidden";
      }

      function updatePinSelectUi() {
        for (const symbol of [...selectedPinSymbols]) {
          if (!pinSymbols().has(symbol)) selectedPinSymbols.delete(symbol);
        }
        const btn = document.getElementById("pinSelectBtn");
        const bar = document.getElementById("pinBatchBar");
        const countEl = document.getElementById("pinBatchCount");
        if (btn) {
          btn.classList.toggle("is-active", pinSelectMode);
          btn.setAttribute("aria-pressed", pinSelectMode ? "true" : "false");
          btn.textContent = pinSelectMode ? "选中" : "多选";
        }
        if (bar) {
          bar.hidden = !pinSelectMode || isNotesView();
        }
        if (countEl) {
          countEl.textContent = String(selectedPinSymbols.size);
        }
        const renewBtn = document.getElementById("pinBatchRenewBtn");
        const unpinBtn = document.getElementById("pinBatchUnpinBtn");
        const clearBtn = document.getElementById("pinBatchClearBtn");
        const disabled = pinSaving || selectedPinSymbols.size === 0;
        if (renewBtn) renewBtn.disabled = disabled;
        if (unpinBtn) unpinBtn.disabled = disabled;
        if (clearBtn) clearBtn.disabled = selectedPinSymbols.size === 0;
      }

      function setPinSelectMode(on) {
        if (isNotesView()) on = false;
        const next = !!on;
        if (next === pinSelectMode) {
          updatePinSelectUi();
          return;
        }
        pinSelectMode = next;
        if (!pinSelectMode) selectedPinSymbols.clear();
        closeCardActions(true);
        applyPinSelectChrome();
        updatePinSelectUi();
      }

      function applyPinSelectChrome() {
        const wantSelect = pinSelectMode && !isNotesView();
        document
          .querySelectorAll(
            "#pinGrid .kline-card[data-symbol], #hiddenPinGrid .kline-card[data-symbol]",
          )
          .forEach((card) => {
            const symbol = String(card.dataset.symbol || "").toUpperCase();
            card.classList.toggle("is-select-mode", wantSelect);
            const selected = wantSelect && selectedPinSymbols.has(symbol);
            card.classList.toggle("is-selected", selected);
            let check = card.querySelector(".pin-check");
            if (wantSelect) {
              if (!check) {
                check = document.createElement("input");
                check.type = "checkbox";
                check.className = "pin-check";
                check.setAttribute(
                  "aria-label",
                  `选择 ${symbol.replace(/USDT$/i, "")}`,
                );
                card.appendChild(check);
              }
              check.checked = selected;
            } else if (check) {
              check.remove();
            }
          });
        if (wantSelect) bindPinSelectDelegation();
      }

      function togglePinSelection(symbol) {
        const key = String(symbol || "")
          .trim()
          .toUpperCase();
        if (!key || !pinSymbols().has(key)) return;
        if (selectedPinSymbols.has(key)) selectedPinSymbols.delete(key);
        else selectedPinSymbols.add(key);
        document
          .querySelectorAll(`.kline-card[data-symbol="${key}"]`)
          .forEach((card) => {
            if (!isPinCardSection(card.dataset.section)) return;
            const on = selectedPinSymbols.has(key);
            card.classList.toggle("is-selected", on);
            const check = card.querySelector(".pin-check");
            if (check) check.checked = on;
          });
        updatePinSelectUi();
      }

      function onPinSelectPointer(event) {
        if (!pinSelectMode || isNotesView()) return;
        const card = event.target.closest(
          "#pinGrid .kline-card.is-select-mode, #hiddenPinGrid .kline-card.is-select-mode",
        );
        if (!card) return;
        if (event.target.closest(".card-actions, .mom-badge")) return;
        if (event.type === "change") {
          if (!event.target.classList.contains("pin-check")) return;
          togglePinSelection(card.dataset.symbol);
          return;
        }
        if (event.type === "click") {
          if (event.target.closest(".pin-check")) return;
          event.preventDefault();
          togglePinSelection(card.dataset.symbol);
        }
      }

      function bindPinSelectDelegation() {
        const pinGrid = document.getElementById("pinGrid");
        const hiddenGrid = document.getElementById("hiddenPinGrid");
        for (const root of [pinGrid, hiddenGrid]) {
          if (!root || root.dataset.pinSelectBound === "1") continue;
          root.dataset.pinSelectBound = "1";
          root.addEventListener("click", onPinSelectPointer);
          root.addEventListener("change", onPinSelectPointer);
        }
      }

      async function batchUnpinSelected() {
        if (pinSaving || !selectedPinSymbols.size) return;
        const symbols = [...selectedPinSymbols];
        if (
          !window.confirm(
            `确定取消盯住选中的 ${symbols.length} 个币？`,
          )
        ) {
          return;
        }
        pinSaving = true;
        updatePinSelectUi();
        try {
          setStatus(false, `正在批量取消盯住 ${symbols.length} 个...`);
          const result = await WatchFavorites.patchPins({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.PINS_PATH,
            message: `Batch unpin ${symbols.length} symbols`,
            mutate: (list) => {
              let next = list;
              for (const symbol of symbols) {
                next = WatchFavorites.removePin(next, symbol);
              }
              return { list: next, added: false };
            },
          });
          pinItems = result.pins;
          selectedPinSymbols.clear();
          showToast(`已取消盯住 ${symbols.length} 个`);
          await renderKlines();
          setStatus(true, `已批量取消盯住 ${symbols.length} 个`);
        } catch (error) {
          console.error(error);
          showToast(error.message || "批量取消失败");
          setStatus(false, error.message || "批量取消失败");
          window.alert(error.message || "批量取消失败");
        } finally {
          pinSaving = false;
          updatePinSelectUi();
        }
      }

      async function batchRenewSelected() {
        if (pinSaving || !selectedPinSymbols.size) return;
        const symbols = [...selectedPinSymbols];
        const withPrice = [];
        const noPrice = [];
        for (const symbol of symbols) {
          const price = marketMap[symbol]?.price;
          if (Number.isFinite(price) && price > 0) withPrice.push(symbol);
          else noPrice.push(symbol);
        }
        if (!withPrice.length) {
          window.alert("选中币种暂无现价，无法续盯");
          return;
        }
        if (
          !window.confirm(
            `按现价续盯 ${withPrice.length} 个` +
              (noPrice.length ? `（跳过无价 ${noPrice.length} 个）` : "") +
              "？",
          )
        ) {
          return;
        }
        pinSaving = true;
        updatePinSelectUi();
        try {
          setStatus(false, `正在批量续盯 ${withPrice.length} 个...`);
          const result = await WatchFavorites.patchPins({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.PINS_PATH,
            message: `Batch renew ${withPrice.length} pins`,
            mutate: (list) => {
              let next = list;
              for (const symbol of withPrice) {
                const price = marketMap[symbol]?.price;
                next = WatchFavorites.addPin(next, symbol, price, "batch-renew");
              }
              return { list: next, added: true };
            },
          });
          pinItems = result.pins;
          selectedPinSymbols.clear();
          showToast(
            `已续盯 ${withPrice.length} 个` +
              (noPrice.length ? ` · 跳过 ${noPrice.length}` : ""),
          );
          await renderKlines();
          setStatus(true, `已批量续盯 ${withPrice.length} 个`);
        } catch (error) {
          console.error(error);
          showToast(error.message || "批量续盯失败");
          setStatus(false, error.message || "批量续盯失败");
          window.alert(error.message || "批量续盯失败");
        } finally {
          pinSaving = false;
          updatePinSelectUi();
        }
      }

      function bindLongPress(card) {
        let timer = null;
        let triggered = false;

        const clear = () => {
          if (timer) {
            clearTimeout(timer);
            timer = null;
          }
          card.classList.remove("is-pressed");
        };

        const start = (event) => {
          if (
            event.target.closest(
              ".symbol-copy, .card-actions, .mom-badge, .price-up-last-mark, .pin-check",
            )
          ) {
            return;
          }
          if (pinSelectMode && isPinCardSection(card.dataset.section)) {
            return;
          }
          if (event.pointerType === "mouse" && event.button !== 0) return;
          triggered = false;
          card.classList.add("is-pressed");
          timer = setTimeout(() => {
            triggered = true;
            clear();
            if (navigator.vibrate) navigator.vibrate(20);
            openCardActions(card);
          }, CONFIG.LONG_PRESS_MS);
        };

        card.addEventListener("pointerdown", start);
        card.addEventListener("pointerup", clear);
        card.addEventListener("pointerleave", clear);
        card.addEventListener("pointercancel", clear);
        card.addEventListener("contextmenu", (event) => {
          event.preventDefault();
        });
        card.addEventListener(
          "click",
          (event) => {
            if (triggered) {
              event.preventDefault();
              event.stopPropagation();
              triggered = false;
            }
          },
          true,
        );
      }

      async function fillGrid(
        grid,
        symbols,
        section,
        signal,
        pairSet,
        pinMap,
        onBatchDone,
      ) {
        const favSet = favoriteSymbols();
        const pairs = pairSet || new Set();
        const pins = pinMap || new Map();
        const isPinSection = section === "pin" || section === "pin-hidden";
        grid.innerHTML = symbols.length
          ? symbols
              .map((symbol) => {
                const pinItem = pins.get(symbol) || null;
                const expired = pinItem
                  ? WatchFavorites.isPinExpired(pinItem)
                  : false;
                return buildCardHtml(symbol, {
                  section,
                  isFavorite: favSet.has(symbol),
                  isPair: pairs.has(symbol),
                  isPin: isPinSection || pinSymbols().has(symbol),
                  isNote: isNotesView() && section === "pin",
                  isPinSection,
                  selectMode: pinSelectMode && isPinSection && !isNotesView(),
                  isSelected: selectedPinSymbols.has(symbol),
                  hasPosition: positionSymbols().has(symbol),
                  isExpired: isPinSection && expired,
                  pinItem: isPinSection ? pinItem : null,
                  showMark: section === "rising" && favSet.has(symbol),
                });
              })
              .join("")
          : `<div class="empty">${
              section === "rising"
                ? "暂无上涨币种"
                : section === "pin"
                  ? isNotesView()
                    ? "暂无记一笔 · 去币安观察近2h/1h 浮窗点「记」"
                    : "暂无当前窗口上涨的盯一下 · 右侧可看窗口回落项"
                  : section === "pin-hidden"
                    ? "当前没有隐藏的盯一下（窗口回落）"
                    : "暂无窗口上涨的收藏"
            }</div>`;

        bindCardInteractions(grid);

        const cards = [...grid.querySelectorAll(".kline-card")];
        const batchSize = Math.max(1, CONFIG.KLINE_CARD_CONCURRENCY || 10);
        for (let index = 0; index < cards.length; index += batchSize) {
          if (signal.aborted) return;
          const batch = cards.slice(index, index + batchSize);
          await Promise.all(
            batch.map((card) =>
              renderKlineCard(
                card,
                card.dataset.symbol,
                chartInterval(),
                signal,
                isPinSection ? pinItemBySymbol(card.dataset.symbol) : null,
              ),
            ),
          );
          if (typeof onBatchDone === "function") onBatchDone(batch.length);
        }
      }

      function notifyDismissStorageKey() {
        return "kline.notifyFloat.dismissAt";
      }

      function escapeHtml(text) {
        return String(text || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeRegExp(text) {
        return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function formatNotifyAt(at) {
        const ts = Number(at);
        if (!Number.isFinite(ts) || ts <= 0) return "";
        try {
          return new Date(ts).toLocaleString("zh-CN", { hour12: false });
        } catch (error) {
          return "";
        }
      }

      function renderWecomNotifyHtml(markdown, symbols) {
        const labelMap = new Map();
        (Array.isArray(symbols) ? symbols : []).forEach((symbol) => {
          const key = String(symbol || "")
            .trim()
            .toUpperCase();
          if (!key) return;
          const label = key.replace(/USDT$/i, "");
          if (label) labelMap.set(label.toUpperCase(), key);
        });
        // Longer tickers first so BTT wins over T / BT, etc.
        const labels = [...labelMap.keys()].sort((a, b) => b.length - a.length);

        const linkify = (escaped) => {
          const slots = [];
          let out = String(escaped || "");
          labels.forEach((label) => {
            const symbol = labelMap.get(label);
            // Ticker boundary only — never touch already-inserted markup.
            const re = new RegExp(
              `(^|[^A-Za-z0-9])(${escapeRegExp(label)})(?=[^A-Za-z0-9]|$)`,
              "g",
            );
            out = out.replace(re, (full, pre, match) => {
              const index = slots.length;
              slots.push(
                `<a href="#card-pin-${symbol}" class="notify-coin" data-jump="${symbol}">${match}</a>`,
              );
              return `${pre}\u0001${index}\u0001`;
            });
          });
          return out.replace(/\u0001(\d+)\u0001/g, (_, index) => {
            return slots[Number(index)] || "";
          });
        };

        const src = String(markdown || "");
        const fontRe =
          /<font\s+color="(info|warning|comment)">([\s\S]*?)<\/font>/gi;
        const parts = [];
        let last = 0;
        let match = fontRe.exec(src);
        while (match) {
          parts.push(linkify(escapeHtml(src.slice(last, match.index))));
          parts.push(
            `<span class="nc-${match[1]}">${linkify(escapeHtml(match[2]))}</span>`,
          );
          last = match.index + match[0].length;
          match = fontRe.exec(src);
        }
        parts.push(linkify(escapeHtml(src.slice(last))));
        return parts.join("").replace(/\n/g, "<br>");
      }

      function jumpToNotifySymbol(symbol) {
        const key = String(symbol || "")
          .trim()
          .toUpperCase();
        if (!key) return;
        const order = ["pin", "rising", "favorite", "pin-hidden"];
        const cards = [
          ...document.querySelectorAll(`.kline-card[data-symbol="${key}"]`),
        ].sort(
          (a, b) =>
            order.indexOf(a.dataset.section) - order.indexOf(b.dataset.section),
        );
        const card = cards[0];
        if (!card) {
          showToast(`${key.replace(/USDT$/i, "")} 当前页面未展示`);
          return;
        }
        if (card.dataset.section === "pin-hidden") {
          setHiddenPinDrawerOpen(true);
        }
        card.scrollIntoView({ behavior: "smooth", block: "start" });
        card.classList.add("is-jump-target");
        window.setTimeout(() => card.classList.remove("is-jump-target"), 1600);
      }

      function renderPlainNotifyHtml(text, symbols) {
        return renderWecomNotifyHtml(String(text || ""), symbols || []);
      }

      function isNotifyFloatDismissed() {
        const at = notifyContentAt({
          lastPinNotify,
          lastPositionNotify,
        });
        if (!at) return true;
        const dismissed = Number(
          localStorage.getItem(notifyDismissStorageKey()) || 0,
        );
        return dismissed === at;
      }

      function updateNotifyFloatPanel() {
        const panel = document.getElementById("notifyFloat");
        const tab = document.getElementById("notifyFloatTab");
        const pinsEl = document.getElementById("notifyFloatPins");
        const posEl = document.getElementById("notifyFloatPositions");
        const timeEl = document.getElementById("notifyFloatTime");
        if (!panel || !tab || !pinsEl || !posEl) return;

        const hasContent = hasNotifyContent(lastPinNotify, lastPositionNotify);
        tab.hidden = false;
        tab.disabled = !hasContent;

        if (!hasContent) {
          if (!panel.hidden) panel.hidden = true;
          tab.classList.remove("is-active");
          pinsEl.innerHTML = `<div class="notify-col-empty">暂无盯一下推送</div>`;
          posEl.innerHTML = `<div class="notify-col-empty">暂无持仓推送</div>`;
          if (timeEl) timeEl.textContent = "";
          return;
        }

        // Keep open state only if this panel is the active float.
        if (panel.hidden) {
          tab.classList.remove("is-active");
        } else {
          tab.classList.add("is-active");
        }

        if (timeEl) {
          const label = formatNotifyAt(
            notifyContentAt({ lastPinNotify, lastPositionNotify }),
          );
          timeEl.textContent = label ? ` · ${label}` : "";
        }

        const pinMd =
          lastPinNotify && typeof lastPinNotify.markdown === "string"
            ? lastPinNotify.markdown.trim()
            : "";
        const posText =
          lastPositionNotify && typeof lastPositionNotify.text === "string"
            ? lastPositionNotify.text.trim()
            : "";

        pinsEl.innerHTML = pinMd
          ? renderWecomNotifyHtml(pinMd, lastPinNotify.symbols || [])
          : `<div class="notify-col-empty">暂无盯一下推送</div>`;
        posEl.innerHTML = posText
          ? renderPlainNotifyHtml(posText, lastPositionNotify.symbols || [])
          : `<div class="notify-col-empty">暂无持仓推送</div>`;
      }

      function dismissNotifyFloat() {
        const at = notifyContentAt({
          lastPinNotify,
          lastPositionNotify,
        });
        if (at) {
          localStorage.setItem(notifyDismissStorageKey(), String(at));
        }
        closeAllFloatPanels();
      }

        openFloatPanel("notify");
      }

      async function renderKlines(options) {
        const onProgress = options && options.onProgress;
        const interval = CONFIG.KLINE_INTERVAL;
        const chartIv = chartInterval();
        const bars = klineLimit(chartIv);
        const rangeText = klineRangeLabel();
        const notesMode = isNotesView();
        let klineDone = 0;
        let klineTotal = 0;
        const bumpKline = (n) => {
          klineDone += n;
          if (typeof onProgress === "function") {
            onProgress(klineDone, klineTotal);
          }
        };

        if (notesMode) {
          if (klineAbort) klineAbort.abort();
          klineAbort = new AbortController();
          const { signal } = klineAbort;
          if (momentumAbort) {
            momentumAbort.abort();
            momentumAbort = null;
            momentumBusy = false;
            setMomentumUiBusy(false);
          }
          const noteSymbols = noteSymbolList();
          const blocked = blacklistSymbols();
          const pinMap = new Map(pinItems.map((item) => [item.symbol, item]));
          const visibleNotes = noteSymbols.filter(
            (symbol) => !blocked.has(symbol),
          );
          // 近2h/1h 浮窗与币安观察一致：全部窗口上涨盯一下，不限记一笔。
          const floatPinSymbols = listWindowUpPinSymbols(interval);
          const scoreSymbols = [
            ...new Set([...floatPinSymbols, ...visibleNotes]),
          ];

          const clearExpiredBtn = document.getElementById("clearExpiredPinsBtn");
          const clearPositionsBtn = document.getElementById(
            "clearAllPositionsBtn",
          );
          const maintEmptyHint = document.getElementById("maintEmptyHint");
          const expiredPins = pinItems.filter((item) =>
            WatchFavorites.isPinExpired(item),
          ).length;
          const positionCount = positionItems.length;
          if (clearExpiredBtn) clearExpiredBtn.hidden = expiredPins <= 0;
          if (clearPositionsBtn) clearPositionsBtn.hidden = positionCount <= 0;
          if (maintEmptyHint) {
            maintEmptyHint.hidden = expiredPins > 0 || positionCount > 0;
          }

          updateHiddenPinTab(0);

          // 先出记一笔 K 线；近2h/1h 后台算完再按信号重排 + 更新浮窗。
          const pinSymbolsList = visibleNotes.slice();
          klineTotal = pinSymbolsList.length;
          if (typeof onProgress === "function") onProgress(0, klineTotal);

          const pinMeta = document.getElementById("pinMeta");
          if (pinMeta) {
            pinMeta.textContent = [
              `记一笔 ${momNoteItems.length} 条`,
              `追踪 ${pinSymbolsList.length} 币`,
              `浮窗盯一下 ${floatPinSymbols.length}`,
              "按信号强弱排序",
              rangeText,
              `${bars} 根`,
              "长按去掉记一笔",
            ].join(" · ");
          }

          await fillGrid(
            document.getElementById("pinGrid"),
            pinSymbolsList,
            "pin",
            signal,
            new Set(),
            pinMap,
            bumpKline,
          );
          const recentSection = document.getElementById("recentAutoPinSection");
          if (recentSection) {
            recentSection.hidden = true;
            const recentGrid = document.getElementById("recentAutoPinGrid");
            if (recentGrid) recentGrid.innerHTML = "";
          }
          void schedulePinMomentum(scoreSymbols);
          return;
        }

        const risingRaw = getRisingSymbols();
        const autoPinned = await autoPinNewRising(risingRaw);
        if (autoPinned.length) {
          showToast(
            `自动盯 ${autoPinned.length} 个新上涨：${autoPinned
              .slice(0, 4)
              .map((s) => s.replace(/USDT$/i, ""))
              .join(" · ")}${autoPinned.length > 4 ? "…" : ""}`,
          );
        }
        const rising = getRisingSymbols();
        const favRising = getFavoriteRisingSymbols(rising);
        const pairSet = buildPairSet(rising);
        const overlap = pairSet.size;
        const blocked = blacklistSymbols();
        const fallingHidden = favoriteItems.filter((item) => {
          const symbol = item.symbol;
          return (
            marketMap[symbol] &&
            !blocked.has(symbol) &&
            !pinSymbols().has(symbol) &&
            !hasWindowGain(symbol, interval) &&
            !rising.includes(symbol)
          );
        }).length;
        const pinnedHiddenFav = favoriteItems.filter((item) =>
          pinSymbols().has(item.symbol),
        ).length;
        const pinMap = new Map(pinItems.map((item) => [item.symbol, item]));
        const pinCandidates = pinItems.filter(
          (item) => !blocked.has(item.symbol),
        );
        const pinHiddenItems = pinCandidates
          .filter((item) => !hasWindowGain(item.symbol, interval))
          .slice()
          .sort((a, b) => {
            const expA = WatchFavorites.isPinExpired(a) ? 1 : 0;
            const expB = WatchFavorites.isPinExpired(b) ? 1 : 0;
            if (expA !== expB) return expB - expA;
            const changeA = pinChangePercent(a);
            const changeB = pinChangePercent(b);
            const hasA = Number.isFinite(changeA);
            const hasB = Number.isFinite(changeB);
            if (hasA && hasB && changeB !== changeA) return changeB - changeA;
            if (hasA !== hasB) return hasA ? -1 : 1;
            return b.pinnedAt - a.pinnedAt;
          });
        const pinHiddenDown = pinHiddenItems.length;
        const pinHiddenList = pinHiddenItems.map((item) => item.symbol);
        const recentAutoList = listRecentAutoPins().map((item) => item.symbol);
        const recentAutoSet = new Set(recentAutoList);
        let pinSymbolsList = listWindowUpPinSymbols(interval).filter(
          (symbol) => !recentAutoSet.has(symbol),
        );
        const scoreUniverse = [
          ...new Set([...recentAutoList, ...pinSymbolsList]),
        ];
        const activePins = pinItems.filter(
          (item) =>
            !blocked.has(item.symbol) && !WatchFavorites.isPinExpired(item),
        ).length;
        const expiredPins = pinItems.filter(
          (item) =>
            !blocked.has(item.symbol) && WatchFavorites.isPinExpired(item),
        ).length;
        const expiredHidden = pinCandidates.filter((item) => {
          if (!WatchFavorites.isPinExpired(item)) return false;
          return !hasWindowGain(item.symbol, interval);
        }).length;

        if (klineAbort) klineAbort.abort();
        klineAbort = new AbortController();
        const { signal } = klineAbort;
        if (momentumAbort) {
          momentumAbort.abort();
          momentumAbort = null;
          momentumBusy = false;
          setMomentumUiBusy(false);
        }

        // 先按盯幅出卡片；爬升排序 / 浮窗所需动量放到后台。
        lastScoreUniverse = scoreUniverse.slice();

        document.getElementById("risingMeta").textContent = rising.length
          ? `窗口上涨 ${rising.length} / 观察池 ${watchPool.size} · ${rangeText} · ${bars} 根`
          : `当前没有窗口上涨的观察池币种 · 观察池 ${watchPool.size} 个`;

        const clearExpiredBtn = document.getElementById("clearExpiredPinsBtn");
        const clearPositionsBtn = document.getElementById("clearAllPositionsBtn");
        const maintEmptyHint = document.getElementById("maintEmptyHint");
        const positionCount = positionItems.length;
        if (clearExpiredBtn) clearExpiredBtn.hidden = expiredPins <= 0;
        if (clearPositionsBtn) clearPositionsBtn.hidden = positionCount <= 0;
        if (maintEmptyHint) {
          maintEmptyHint.hidden = expiredPins > 0 || positionCount > 0;
        }

        if (!pinItems.length) {
          document.getElementById("pinMeta").textContent = "";
          updatePinMomentumMeta(new Map(), []);
        } else {
          const heldInPins = pinItems.filter((item) =>
            positionSymbols().has(item.symbol),
          ).length;
          const pinShownWindow = pinCandidates.filter((item) =>
            hasWindowGain(item.symbol, interval),
          ).length;
          const pinShownBelowPin = pinCandidates.filter((item) => {
            if (!hasWindowGain(item.symbol, interval)) return false;
            const change = pinChangePercent(item);
            return Number.isFinite(change) && change <= 0;
          }).length;
          const parts = [
            `盯一下 ${pinItems.length}`,
            `窗口上涨展示 ${pinShownWindow}`,
            pinSortMode === "momentum" ? "排序爬升" : "排序盯幅",
          ];
          if (recentAutoList.length) {
            parts.push(`新自动盯 ${recentAutoList.length}`);
          }
          if (pinShownBelowPin > 0) {
            parts.push(`其中低于盯住价 ${pinShownBelowPin}`);
          }
          if (pinHiddenDown > 0) {
            parts.push(`已隐藏窗口回落 ${pinHiddenDown}`);
          }
          if (heldInPins > 0) parts.push(`其中持仓 ${heldInPins}`);
          if (activePins > 0) parts.push(`有效 ${activePins}`);
          if (expiredPins > 0) {
            parts.push(
              expiredHidden > 0
                ? `过期 ${expiredPins}（隐藏 ${expiredHidden}）`
                : `过期 ${expiredPins}`,
            );
          }
          document.getElementById("pinMeta").textContent = parts.join(" · ");
        }

        updateHiddenPinTab(pinHiddenDown);
        const hiddenPinMeta = document.getElementById("hiddenPinMeta");
        if (hiddenPinMeta) {
          // 指引文案已收起；仅保留数量
          hiddenPinMeta.textContent = pinHiddenDown
            ? `${pinHiddenDown} 个当前窗口未涨`
            : "";
        }

        if (!favoriteItems.length) {
          // document.getElementById("favMeta").textContent =
          //   "还没有收藏 · 长按卡片选「收藏」即可加入";
          document.getElementById("favMeta").textContent = "";
        } else {
          const parts = [
            `收藏 ${favoriteItems.length}`,
            `窗口上涨展示 ${favRising.length}`,
          ];
          if (pinnedHiddenFav > 0) {
            parts.push(`已盯住不重复展示 ${pinnedHiddenFav}`);
          }
          if (overlap > 0) {
            parts.push(`另有 ${overlap} 个在上方 · 黑色边框标记`);
          }
          if (fallingHidden > 0) parts.push(`已隐藏下跌 ${fallingHidden}`);
          document.getElementById("favMeta").textContent = parts.join(" · ");
        }

        klineTotal =
          pinSymbolsList.length +
          recentAutoList.length +
          pinHiddenList.length +
          rising.length +
          favRising.length;
        if (typeof onProgress === "function") onProgress(0, klineTotal);

        await fillGrid(
          document.getElementById("pinGrid"),
          pinSymbolsList,
          "pin",
          signal,
          pairSet,
          pinMap,
          bumpKline,
        );
        if (signal.aborted) return;
        const recentSection = document.getElementById("recentAutoPinSection");
        const recentMeta = document.getElementById("recentAutoPinMeta");
        const recentGrid = document.getElementById("recentAutoPinGrid");
        if (recentSection && recentGrid) {
          if (recentAutoList.length) {
            recentSection.hidden = false;
            if (recentMeta) {
              recentMeta.textContent = `新自动盯 · 近30分钟 ${recentAutoList.length} 个`;
            }
            await fillGrid(
              recentGrid,
              recentAutoList,
              "pin",
              signal,
              pairSet,
              pinMap,
              bumpKline,
            );
          } else {
            recentSection.hidden = true;
            recentGrid.innerHTML = "";
          }
        }
        if (signal.aborted) return;
        await fillGrid(
          document.getElementById("hiddenPinGrid"),
          pinHiddenList,
          "pin-hidden",
          signal,
          pairSet,
          pinMap,
          bumpKline,
        );
        if (signal.aborted) return;
        await fillGrid(
          document.getElementById("risingGrid"),
          rising,
          "rising",
          signal,
          pairSet,
          null,
          bumpKline,
        );
        if (signal.aborted) return;
        await fillGrid(
          document.getElementById("favGrid"),
          favRising,
          "favorite",
          signal,
          pairSet,
          null,
          bumpKline,
        );
        if (signal.aborted) return;
        updateNotifyFloatPanel();
        updatePinSelectUi();
        void schedulePinMomentum(scoreUniverse);
      }
