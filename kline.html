<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>观察池 K 线</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f5f3;
        color: #28323a;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .page {
        width: min(1400px, calc(100% - 20px));
        margin: 12px auto 24px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      h2.section-title {
        margin: 16px 0 6px;
        font-size: 15px;
      }
      .nav-link {
        color: #5a6a68;
        font-size: 13px;
        text-decoration: none;
      }
      .nav-link:hover {
        text-decoration: underline;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button {
        border: 1px solid #c9d0d0;
        background: #fbfcfa;
        color: #28323a;
        padding: 8px 13px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #eef1ee;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      select.range-select {
        border: 1px solid #c9d0d0;
        background: #fbfcfa;
        color: #28323a;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        max-width: min(220px, 52vw);
      }
      select.range-select:hover {
        background: #eef1ee;
      }
      select.range-select:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #78817f;
        margin-bottom: 10px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #a39d95;
        flex-shrink: 0;
      }
      .dot.online {
        background: #718b88;
        box-shadow: 0 0 8px rgba(113, 139, 136, 0.35);
      }
      .dot.offline {
        background: #8d7771;
      }
      .meta {
        color: #78817f;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .pin-meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .pin-meta-row .meta {
        margin-bottom: 0;
        flex: 1;
        min-width: 0;
      }
      .pin-momentum-meta {
        margin: -2px 0 10px;
        font-size: 12px;
        line-height: 1.45;
        color: #3d4a48;
      }
      .pin-momentum-meta[hidden] {
        display: none !important;
      }
      .pin-momentum-meta .mom-label {
        color: #78817f;
      }
      .pin-momentum-meta .mom-hot {
        color: #2f8f6e;
        font-weight: 650;
      }
      .pin-momentum-meta .mom-cool {
        color: #8d7771;
      }
      .pin-meta-row button,
      .maint-panel button {
        flex-shrink: 0;
        font-size: 12px;
        padding: 6px 10px;
      }
      .maint-toggle {
        color: #78817f;
        border-color: transparent;
        background: transparent;
        padding: 4px 8px;
      }
      .maint-toggle:hover {
        background: #eef1ee;
        border-color: #c9d0d0;
      }
      .maint-toggle[aria-expanded="true"] {
        color: #3d4a48;
        border-color: #c9d0d0;
        background: #eef1ee;
      }
      .maint-panel {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
        margin: -4px 0 10px;
      }
      .maint-panel[hidden] {
        display: none !important;
      }
      .maint-panel .maint-empty {
        font-size: 12px;
        color: #9aa3a0;
      }
      .maint-panel button.is-danger {
        color: #7a4a42;
        border-color: #d4b8b2;
      }
      .hidden-pin-tab {
        position: fixed;
        top: 42%;
        right: 0;
        z-index: 40;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        letter-spacing: 0.12em;
        border: 1px solid #c9d0d0;
        border-right: 0;
        border-radius: 8px 0 0 8px;
        background: #eef2ef;
        color: #3d4a48;
        padding: 14px 8px;
        font-size: 13px;
        cursor: pointer;
        box-shadow: -2px 2px 10px rgba(40, 50, 48, 0.08);
      }
      .hidden-pin-tab:hover {
        background: #e4ebe6;
      }
      .hidden-pin-tab[data-count="0"] {
        opacity: 0.55;
      }
      .hidden-pin-tab .tab-count {
        display: inline-block;
        margin-top: 8px;
        writing-mode: horizontal-tb;
        font-size: 12px;
        color: #5a6a68;
      }
      .hidden-pin-drawer {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
      }
      .hidden-pin-drawer.is-open {
        pointer-events: auto;
      }
      .hidden-pin-mask {
        position: absolute;
        inset: 0;
        background: rgba(28, 34, 32, 0.35);
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .hidden-pin-drawer.is-open .hidden-pin-mask {
        opacity: 1;
      }
      .hidden-pin-panel {
        position: absolute;
        top: 0;
        right: 0;
        width: min(420px, 92vw);
        height: 100%;
        background: #f4f5f3;
        border-left: 1px solid #d0d6d2;
        box-shadow: -8px 0 28px rgba(20, 28, 26, 0.18);
        transform: translateX(104%);
        transition: transform 0.22s ease;
        display: flex;
        flex-direction: column;
      }
      .hidden-pin-drawer.is-open .hidden-pin-panel {
        transform: translateX(0);
      }
      .hidden-pin-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 14px 10px;
        border-bottom: 1px solid #dce2de;
      }
      .hidden-pin-head h3 {
        margin: 0;
        font-size: 16px;
      }
      .hidden-pin-head p {
        margin: 4px 0 0;
        font-size: 12px;
        color: #78817f;
      }
      .hidden-pin-body {
        flex: 1;
        overflow: auto;
        padding: 12px;
      }
      .hidden-pin-body .kline-grid {
        grid-template-columns: 1fr;
      }
      .hint {
        color: #9aa3a0;
        font-size: 12px;
        margin: -2px 0 10px;
      }
      .kline-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 10px;
      }
      .kline-card {
        position: relative;
        min-width: 0;
        padding: 8px 10px 10px;
        background: #fbfcfa;
        border: 1px solid #d8ddda;
        border-radius: 8px;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .kline-card.is-pressed {
        transform: scale(0.98);
        box-shadow: 0 0 0 2px rgba(113, 139, 136, 0.35);
      }
      .kline-card.is-favorite {
        border-color: #b7c4b8;
      }
      .kline-card.is-pair {
        border-width: 2px;
        border-color: #1a1a1a;
      }
      .kline-card.is-pin {
        border-color: #5a6a68;
      }
      .kline-card.is-expired {
        opacity: 0.48;
        filter: grayscale(0.55);
      }
      .kline-card.is-expired:hover {
        opacity: 0.72;
      }
      .kline-card.is-position {
        border-color: #6b7f6e;
      }
      .pin-mark,
      .pos-mark {
        position: absolute;
        top: 6px;
        right: 8px;
        color: #5a6a68;
        font-size: 11px;
        line-height: 1;
        pointer-events: none;
      }
      .pos-mark {
        right: 8px;
        top: 22px;
        color: #4f7a6e;
      }
      .kline-card.is-early .early-badge {
        position: absolute;
        left: 8px;
        bottom: 8px;
        z-index: 1;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(74, 108, 98, 0.9);
        color: #f4f7f5;
        font-size: 11px;
        line-height: 1.3;
        cursor: help;
      }
      /* Align with WeCom: 5m three-up = green, 15m 2/3 = orange */
      .kline-card-head .symbol-copy.is-streak5 {
        color: #2f8f6e;
      }
      .kline-card-head .symbol-copy.is-heat15 {
        color: #c47a3a;
      }
      .mom-badge {
        position: absolute;
        right: 8px;
        bottom: 8px;
        z-index: 1;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
        line-height: 1.3;
        cursor: help;
        color: #f4f7f5;
        pointer-events: auto;
      }
      .mom-badge.is-streak5 {
        background: rgba(47, 143, 110, 0.92);
      }
      .mom-badge.is-heat15 {
        background: rgba(196, 122, 58, 0.92);
      }
      .price-up-last-mark {
        color: #2f8f6e;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .pin-stats {
        display: block;
        width: 100%;
        margin: 0;
        padding: 0;
        font-size: 10px;
        line-height: 1.4;
        color: #5a6a68;
        font-weight: 400;
        white-space: normal;
      }
      .pin-stats .pin-stat-row {
        display: block;
      }
      .pin-stats .pin-flags {
        margin-top: 1px;
        color: #78817f;
      }
      .pin-stats .pin-flag {
        font-weight: 650;
      }
      .pin-stats .pin-flag.is-remain {
        color: #5a6a68;
      }
      .pin-stats .pin-flag.is-at {
        color: #2f8f6e;
      }
      .pin-stats .pin-flag.is-5m {
        color: #2f8f6e;
      }
      .pin-stats .pin-flag.is-15m {
        color: #c47a3a;
      }
      .pin-stats .pin-flag.is-expired {
        color: #8d7771;
      }
      .kline-card-head.is-pin-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        padding-right: 28px;
      }
      .kline-card-head.is-pin-head .symbol-copy {
        font-size: 13px;
      }
      .kline-card.is-jump-target {
        outline: 2px solid #2f8f6e;
        outline-offset: 2px;
        box-shadow: 0 0 0 4px rgba(47, 143, 110, 0.18);
        transition: outline 0.2s ease, box-shadow 0.2s ease;
      }
      .notify-float {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 40;
        width: min(360px, calc(100vw - 24px));
        max-height: min(48vh, 440px);
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(90, 106, 104, 0.22);
        border-radius: 12px;
        background: rgba(244, 245, 243, 0.42);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 8px 24px rgba(40, 50, 58, 0.1);
      }
      .notify-float[hidden] {
        display: none !important;
      }
      .notify-float-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid rgba(220, 226, 222, 0.55);
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 12px 12px 0 0;
      }
      .notify-float-head strong {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 650;
      }
      .notify-float-head .notify-time {
        margin-left: 6px;
        font-size: 11px;
        color: #78817f;
        font-weight: 400;
      }
      .notify-float-refresh,
      .notify-float-close {
        border: none;
        background: rgba(90, 106, 104, 0.08);
        color: #5a6a68;
        padding: 4px 10px;
        min-width: 36px;
        min-height: 32px;
        font-size: 14px;
        line-height: 1;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .notify-float-close {
        font-size: 18px;
      }
      .notify-float-refresh:hover,
      .notify-float-close:hover {
        background: rgba(90, 106, 104, 0.16);
      }
      .notify-float-refresh:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .notify-float-body {
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        padding: 10px 12px 12px;
        font-size: 12px;
        line-height: 1.55;
        color: #28323a;
        white-space: pre-wrap;
        word-break: break-word;
        overscroll-behavior: contain;
      }
      .notify-float-body .nc-info {
        color: #2f8f6e;
        font-weight: 650;
      }
      .notify-float-body .nc-warning {
        color: #c47a3a;
        font-weight: 650;
      }
      .notify-float-body .nc-comment {
        color: #9aa3a0;
      }
      .notify-float-body .notify-coin {
        display: inline;
        border: none;
        background: transparent;
        padding: 0;
        margin: 0;
        color: inherit;
        font: inherit;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .notify-float-body .notify-coin:hover,
      .notify-float-body .notify-coin:active {
        color: #1f6b52;
      }
      .notify-float-tab {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 40;
        border: 1px solid rgba(90, 106, 104, 0.28);
        background: rgba(244, 245, 243, 0.5);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #5a6a68;
        padding: 10px 14px;
        min-height: 40px;
        border-radius: 999px;
        font-size: 12px;
        box-shadow: 0 6px 18px rgba(40, 50, 58, 0.1);
      }
      .notify-float-tab[hidden] {
        display: none !important;
      }
      @media (max-width: 640px) {
        .notify-float {
          left: 8px;
          right: 8px;
          bottom: 8px;
          width: auto;
          max-height: min(42vh, 360px);
          background: rgba(244, 245, 243, 0.38);
        }
        .notify-float-body {
          font-size: 11px;
          padding: 8px 10px 10px;
        }
        .notify-float-tab {
          left: 8px;
          bottom: 8px;
          padding: 10px 14px;
        }
      }
      .fav-mark {
        position: absolute;
        top: 6px;
        right: 8px;
        color: #7a8f7c;
        font-size: 12px;
        line-height: 1;
        pointer-events: none;
      }
      .card-actions {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 12px 14px;
        background: rgba(244, 245, 243, 0.94);
        border-radius: 8px;
      }
      .card-actions button {
        width: 100%;
        border: 1px solid #c9d0d0;
        background: #fbfcfa;
        color: #28323a;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }
      .card-actions button:hover {
        background: #eef1ee;
      }
      .card-actions button.is-danger {
        color: #8d7771;
        border-color: #d5cbc6;
      }
      .card-actions button.is-muted {
        color: #78817f;
        background: transparent;
      }
      .card-actions.is-busy {
        pointer-events: none;
      }
      .card-actions button.is-loading {
        opacity: 0.9;
        position: relative;
        color: #5a6a68;
      }
      .card-actions button.is-loading::after {
        content: "";
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-left: 8px;
        border: 2px solid #c9d0d0;
        border-top-color: #5a6a68;
        border-radius: 50%;
        vertical-align: -1px;
        animation: card-action-spin 0.7s linear infinite;
      }
      .card-actions button:disabled {
        opacity: 0.45;
      }
      @keyframes card-action-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .kline-card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 13px;
        padding-right: 14px;
      }
      .kline-card-head .symbol-copy {
        color: inherit;
        font-weight: 700;
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
        font: inherit;
      }
      .kline-card-head .symbol-copy:hover {
        text-decoration: underline;
      }
      .kline-card canvas {
        display: block;
        width: 100%;
        height: 150px;
        pointer-events: none;
      }
      .up {
        color: #4f7a6e;
      }
      .price-down {
        color: #8d7771;
      }
      .neutral {
        color: #78817f;
      }
      .empty {
        padding: 28px 12px;
        text-align: center;
        color: #78817f;
        font-size: 13px;
        background: #fbfcfa;
        border: 1px dashed #d8ddda;
        border-radius: 8px;
      }
      .kline-card .empty {
        padding: 40px 8px;
        border: none;
        background: transparent;
        font-size: 12px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: rgba(40, 50, 58, 0.92);
        color: #f7f8f6;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        z-index: 20;
        pointer-events: none;
      }
      @media (max-width: 768px) {
        .page {
          width: calc(100% - 12px);
          margin: 8px auto 16px;
        }
        h1 {
          font-size: 17px;
        }
        .kline-grid {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
        .kline-card {
          padding: 6px 7px 8px;
        }
        .kline-card-head {
          font-size: 12px;
          margin-bottom: 4px;
        }
        .kline-card canvas {
          height: 120px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div class="topbar-left">
          <h1>币安观察</h1>
          <a class="nav-link" href="./trade.html">模拟交易</a>
          <a class="nav-link" href="./okx/kline.html">OKX 自选</a>
        </div>
        <div class="topbar-actions">
          <select
            id="rangeSelect"
            class="range-select"
            title="切换 K 线范围与周期（观察池/窗口涨跌仍按 4h）"
          >
            <option value="3d-4h">近3天 · 4h</option>
            <option value="10d-4h">近10天 · 4h</option>
            <option value="10d-1d">近10天 · 1天</option>
          </select>
          <button id="refreshBtn" type="button">刷新</button>
        </div>
      </div>
      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">等待启动...</span>
      </div>
      <p class="hint">长按选 盯/购买/卖出/收藏/拉黑 · 盯一下展示当前窗口上涨（可低于盯住价）· 右侧看窗口回落 · 企微同步</p>

      <h2 class="section-title">盯一下</h2>
      <div class="pin-meta-row">
        <div id="pinMeta" class="meta"></div>
        <button
          id="maintToggleBtn"
          class="maint-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="maintPanel"
          title="展开低频清理操作"
        >
          清理 ▾
        </button>
      </div>
      <div
        id="pinMomentumMeta"
        class="meta pin-momentum-meta"
        hidden
        title="主看近2小时谁高；近1小时用来判断有没有熄火。仅作排行提示，不改变下方卡片顺序"
      ></div>
      <div id="maintPanel" class="maint-panel" hidden>
        <span id="maintEmptyHint" class="maint-empty" hidden>暂无可清理项</span>
        <button id="clearExpiredPinsBtn" type="button" hidden>
          清除全部过期
        </button>
        <button
          id="clearAllPositionsBtn"
          class="is-danger"
          type="button"
          hidden
          title="清空 GitHub 上全部持仓记录（不影响盯一下）"
        >
          清除全部持仓
        </button>
      </div>
      <div id="pinGrid" class="kline-grid"></div>

      <h2 class="section-title">窗口上涨</h2>
      <div id="risingMeta" class="meta"></div>
      <div id="risingGrid" class="kline-grid"></div>

      <h2 class="section-title">我的收藏</h2>
      <div id="favMeta" class="meta"></div>
      <div id="favGrid" class="kline-grid"></div>
    </div>

    <button
      type="button"
      id="hiddenPinTab"
      class="hidden-pin-tab"
      data-count="0"
      title="查看当前窗口未涨、已从盯一下区隐藏的币"
    >
      隐藏盯一下<span class="tab-count" id="hiddenPinTabCount">0</span>
    </button>
    <div id="hiddenPinDrawer" class="hidden-pin-drawer" aria-hidden="true">

            <h3>隐藏的盯一下</h3>

              当前窗口未涨 · 长按可取消/续盯 · 企微不推送

      <div class="notify-float-head">
        <button
          type="button"
          class="notify-float-refresh"
          id="notifyFloatRefresh"

          aria-label="刷新企微通知"

          刷新
        </button>
        <strong
          >最近企微通知<span class="notify-time" id="notifyFloatTime"></span
        ></strong>
        <button
          type="button"

      type="button"

          title="打开并刷新最近企微通知"

      企微通知
    </button>

    <script src="./watch-favorites.js"></script>
    <script>
      "use strict";

      const CONFIG = {
        HISTORY_DURATION: 3 * 24 * 60 * 60 * 1000,
        KLINE_RANGE_DAYS_DEFAULT: 3,
        KLINE_RANGE_DAYS_EXTENDED: 10,
        GITHUB_REPO: "betterma/pages",
        GITHUB_PATH: "watch-data.json",
        OBS_BASE: "https://mpctest.obs.cn-north-4.myhuaweicloud.com",
        FAVORITES_PATH: "watch-favorites.json",
        BLACKLIST_PATH: "watch-blacklist.json",
        PINS_PATH: "watch-pins.json",
        POSITIONS_PATH: "watch-positions.json",
        WATCH_POOL_RANK: 30,
        WINDOW_TOLERANCE_MS: 2 * 60 * 1000,
        KLINE_MAX_LIMIT: 1000,
        KLINE_INTERVAL: "4h",
        SIGNAL_INTERVAL: "15m",
        SIGNAL_LIMIT: 200,
        EARLY_SCORE_MIN: 2,
        LONG_PRESS_MS: 550,
        MOMENTUM_5M_LIMIT: 5,
        NOTIFY_STATE_PATH: "watch-notify-state.json",
        // WeCom notify runs ~5m; poll often enough without hammering GitHub.
        NOTIFY_POLL_MS: 60 * 1000,
      };
      const DURATION_MS = {
        "15m": 15 * 60 * 1000,
        "30m": 30 * 60 * 1000,
        "1h": 60 * 60 * 1000,
        "2h": 2 * 60 * 60 * 1000,
        "4h": 4 * 60 * 60 * 1000,
        "1d": 24 * 60 * 60 * 1000,
      };
      const KLINE_VIEWS = {
        "3d-4h": {
          days: 3,
          chartInterval: "4h",
          label: "近3天 · 4h",
        },
        "10d-4h": {
          days: 10,
          chartInterval: "4h",
          label: "近10天 · 4h",
        },
        "10d-1d": {
          days: 10,
          chartInterval: "1d",
          label: "近10天 · 1天",
        },
      };

      const marketMap = {};
      let history = [];
      let watchPool = new Set();
      let favoriteItems = [];
      let blacklistItems = [];
      let pinItems = [];
      let positionItems = [];
      let lastPinPrices = {};
      let lastPinNotify = null;
      let notifyFloatRefreshing = false;
      let notifyPollTimer = null;
      let klineAbort = null;
      let loading = false;
      let favoriteSaving = false;
      let blacklistSaving = false;
      let pinSaving = false;
      let positionSaving = false;
      let klineViewKey = "3d-4h";

      function currentKlineView() {
        return KLINE_VIEWS[klineViewKey] || KLINE_VIEWS["3d-4h"];
      }

      function chartInterval() {
        return currentKlineView().chartInterval;
      }

      function klineRangeDays() {
        return currentKlineView().days;
      }

      function setStatus(ok, text) {
        document.getElementById("statusDot").className =
          `dot ${ok ? "online" : "offline"}`;
        document.getElementById("statusText").textContent = text;
      }

      function showToast(message) {
        const existing = document.querySelector(".toast");
        if (existing) existing.remove();
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1600);
      }

      function formatPercent(value) {
        return Number.isFinite(value)
          ? `${value > 0 ? "+" : ""}${value.toFixed(2)}%`
          : "--";
      }

      function favoriteSymbols() {
        return WatchFavorites.favoritesToSymbolSet(favoriteItems);
      }

      function blacklistSymbols() {
        return WatchFavorites.blacklistToSymbolSet(blacklistItems);
      }

      function pinSymbols() {
        return WatchFavorites.pinsToSymbolSet(pinItems);
      }

      function positionSymbols() {
        return WatchFavorites.positionsToSymbolSet(positionItems);
      }

      function positionItemBySymbol(symbol) {
        const key = String(symbol || "")
          .trim()
          .toUpperCase();
        return positionItems.find((item) => item.symbol === key) || null;
      }

      function pinItemBySymbol(symbol) {
        const key = String(symbol || "")
          .trim()
          .toUpperCase();
        return pinItems.find((item) => item.symbol === key) || null;
      }

      function pinChangePercent(item) {
        const current = marketMap[item.symbol]?.price;
        const base = Number(item.pinPrice);
        if (
          !Number.isFinite(current) ||
          !Number.isFinite(base) ||
          base === 0
        ) {
          return null;
        }
        return ((current - base) / base) * 100;
      }

      function formatPinPrice(value) {
        if (!Number.isFinite(value)) return "--";
        if (value >= 1000) return value.toFixed(2);
        if (value >= 1) return value.toFixed(4);
        if (value >= 0.01) return value.toFixed(5);
        return value.toPrecision(4);
      }

      function formatRemaining(expiresAt) {
        const ms = Number(expiresAt) - Date.now();
        if (!Number.isFinite(ms)) return "";
        if (ms <= 0) return "已过期";
        const hours = Math.floor(ms / (60 * 60 * 1000));
        const mins = Math.floor((ms % (60 * 60 * 1000)) / (60 * 1000));
        if (hours >= 1) return `剩 ${hours}h${mins ? ` ${mins}m` : ""}`;
        return `剩 ${Math.max(1, mins)}m`;
      }

      function formatRemainCompact(expiresAt) {
        const ms = Number(expiresAt) - Date.now();
        if (!Number.isFinite(ms)) return "--";
        if (ms <= 0) return "已过期";
        const hours = Math.floor(ms / (60 * 60 * 1000));
        const mins = Math.floor((ms % (60 * 60 * 1000)) / (60 * 1000));
        if (hours >= 1) return mins ? `${hours}h${mins}m` : `${hours}h`;
        return `${Math.max(1, mins)}m`;
      }

      function pctClass(value) {
        if (!Number.isFinite(value) || value === 0) return "neutral";
        return value > 0 ? "up" : "price-down";
      }

      function buildPinStatusHtml(pinItem, symbol, flags) {
        const rel = pinChangePercent(pinItem);
        const current = marketMap[symbol]?.price;
        const change24h = marketMap[symbol]?.change24h;
        const expired = WatchFavorites.isPinExpired(pinItem);
        const remain = formatRemainCompact(pinItem.expiresAt);
        const flagParts = [];
        flagParts.push(
          `<span class="pin-flag ${expired ? "is-expired" : "is-remain"}" title="观察剩余时间">${escapeHtml(remain)}</span>`,
        );
        if (flags && flags.priceUpVsLast) {
          flagParts.push(
            `<span class="pin-flag is-at" title="现价高于上次企微推送价">@@@</span>`,
          );
        }
        if (flags && flags.streak5) {
          flagParts.push(
            `<span class="pin-flag is-5m" title="近 3 根已收盘 5m 收盘价连续高于前收">5m</span>`,
          );
        } else if (flags && flags.heat15) {
          flagParts.push(
            `<span class="pin-flag is-15m" title="近 3 根已收盘 15m 至少 2 根收涨">15m</span>`,
          );
        }
        return [
          `<span class="pin-stat-row">盯住价格：${escapeHtml(formatPinPrice(pinItem.pinPrice))}</span>`,
          `<span class="pin-stat-row">现在价格：${escapeHtml(formatPinPrice(current))}</span>`,
          `<span class="pin-stat-row">盯住涨幅：<span class="${pctClass(rel)}">${escapeHtml(formatPercent(rel))}</span></span>`,
          `<span class="pin-stat-row">24h涨幅：<span class="${pctClass(change24h)}">${escapeHtml(formatPercent(change24h))}</span></span>`,
          `<span class="pin-stat-row pin-flags">${flagParts.join(" / ")}</span>`,
        ].join("");
      }

      async function copyName(name) {
        try {
          await navigator.clipboard.writeText(name);
        } catch (error) {
          const textarea = document.createElement("textarea");
          textarea.value = name;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }
        setStatus(true, `${name} 已复制`);
      }

      function klineRangeLabel() {
        return currentKlineView().label;
      }

      function klineLimit(interval) {
        const duration = DURATION_MS[interval];
        if (!duration) return 1;
        const rangeMs = klineRangeDays() * 24 * 60 * 60 * 1000;
        return Math.min(
          CONFIG.KLINE_MAX_LIMIT,
          Math.max(1, Math.ceil(rangeMs / duration)),
        );
      }

      function syncRangeSelect() {
        const select = document.getElementById("rangeSelect");
        if (!select) return;
        if (!KLINE_VIEWS[klineViewKey]) klineViewKey = "3d-4h";
        select.value = klineViewKey;
      }

      function pruneHistory() {
        const cutoff = Date.now() - CONFIG.HISTORY_DURATION;
        history = history.filter((item) => item.timestamp >= cutoff);
      }

      function ranking() {
        const blocked = blacklistSymbols();
        return Object.entries(marketMap)
          .sort((a, b) => b[1].change24h - a[1].change24h)
          .map(([symbol]) => symbol)
          .filter((symbol) => !blocked.has(symbol));
      }

      function getWindowStart(timestamp, duration) {
        return Math.floor(timestamp / duration) * duration;
      }

      function selectEarliestWindowSnapshot(windowStart, duration) {
        const windowEnd = windowStart + duration;
        const strictCandidates = history.filter(
          (snapshot) =>
            snapshot.timestamp >= windowStart &&
            snapshot.timestamp < windowEnd,
        );
        const candidates = strictCandidates.length
          ? strictCandidates
          : history.filter(
              (snapshot) =>
                snapshot.timestamp >= windowStart &&
                snapshot.timestamp <
                  windowEnd + CONFIG.WINDOW_TOLERANCE_MS,
            );
        if (!candidates.length) return null;
        return candidates.reduce((earliest, item) =>
          item.timestamp < earliest.timestamp ? item : earliest,
        );
      }

      function comparison(interval) {
        if (!history.length) return null;
        const duration = DURATION_MS[interval];
        if (!duration) return null;
        const currentWindowStart = getWindowStart(Date.now(), duration);
        return selectEarliestWindowSnapshot(currentWindowStart, duration);
      }

      function windowPriceChange(symbol, interval) {
        const old = comparison(interval);
        const oldPrice = old?.prices?.[symbol];
        const currentPrice = marketMap[symbol]?.price;
        if (
          !Number.isFinite(oldPrice) ||
          !Number.isFinite(currentPrice) ||
          oldPrice === 0
        ) {
          return null;
        }
        return ((currentPrice - oldPrice) / oldPrice) * 100;
      }

      function hasWindowGain(symbol, interval) {
        const change = windowPriceChange(symbol, interval);
        return Number.isFinite(change) && change > 0;
      }

      function updateWatchPool() {
        const list = ranking();
        const blocked = blacklistSymbols();
        if (!list.length) return;
        for (const symbol of [...watchPool]) {
          const rank = list.indexOf(symbol) + 1;
          if (blocked.has(symbol) || !rank || rank > CONFIG.WATCH_POOL_RANK) {
            watchPool.delete(symbol);
          }
        }
        for (const symbol of list.slice(0, CONFIG.WATCH_POOL_RANK)) {
          if (blocked.has(symbol)) continue;
          if (hasWindowGain(symbol, "4h")) watchPool.add(symbol);
        }
      }

      function getRisingSymbols() {
        const interval = CONFIG.KLINE_INTERVAL;
        const blocked = blacklistSymbols();
        const pinned = pinSymbols();
        const list = ranking();
        const ranked = list.filter((symbol) => watchPool.has(symbol));
        const unranked = [...watchPool].filter(
          (symbol) =>
            marketMap[symbol] &&
            !list.includes(symbol) &&
            !blocked.has(symbol),
        );
        return [...ranked, ...unranked].filter(
          (symbol) =>
            !blocked.has(symbol) &&
            !pinned.has(symbol) &&
            hasWindowGain(symbol, interval),
        );
      }

      function getFavoriteRisingSymbols(risingSymbols) {
        const rising = new Set(risingSymbols);
        const blocked = blacklistSymbols();
        const pinned = pinSymbols();
        const interval = CONFIG.KLINE_INTERVAL;
        const favSet = new Set(
          favoriteItems
            .map((item) => item.symbol)
            .filter(
              (symbol) =>
                marketMap[symbol] &&
                !rising.has(symbol) &&
                !blocked.has(symbol) &&
                !pinned.has(symbol) &&
                hasWindowGain(symbol, interval),
            ),
        );
        // Same order as the rising section: 24h change descending.
        return ranking().filter((symbol) => favSet.has(symbol));
      }

      // Favorites that also appear in rising get a black border.
      function buildPairSet(rising) {
        const favSet = favoriteSymbols();
        return new Set(rising.filter((symbol) => favSet.has(symbol)));
      }

      async function loadGithubStorage() {
        const url = `${CONFIG.OBS_BASE}/${CONFIG.GITHUB_PATH}?t=${Date.now()}`;
        const response = await fetch(url, { cache: "no-store" });
        if (response.status === 404) {
          history = [];
          watchPool = new Set();
          favoriteItems = [];
          blacklistItems = [];
          pinItems = [];
          positionItems = [];
          return;
        }
        if (!response.ok) {
          throw new Error(`读取 OBS 失败: ${response.status}`);
        }
        const data = await response.json();
        history = Array.isArray(data.history) ? data.history : [];
        watchPool = new Set(
          Array.isArray(data.watchPool) ? data.watchPool : [],
        );
        try {
          const favState = await WatchFavorites.loadFavoritesRaw({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.FAVORITES_PATH,
          });
          favoriteItems = favState.favorites;
        } catch (error) {
          console.warn(error);
          favoriteItems = [];
        }
        try {
          const blackState = await WatchFavorites.loadBlacklistRaw({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.BLACKLIST_PATH,
          });
          blacklistItems = blackState.blacklist;
          const blocked = blacklistSymbols();
          for (const symbol of [...watchPool]) {
            if (blocked.has(symbol)) watchPool.delete(symbol);
          }
        } catch (error) {
          console.warn(error);
          blacklistItems = [];
        }
        try {
          const pinState = await WatchFavorites.loadPinsRaw({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.PINS_PATH,
          });
          pinItems = pinState.pins;
        } catch (error) {
          console.warn(error);
          pinItems = [];
        }
        try {
          const posState = await WatchFavorites.loadPositionsRaw({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.POSITIONS_PATH,
          });
          positionItems = posState.positions;
        } catch (error) {
          console.warn(error);
          positionItems = [];
        }
        try {
          const notifyState = await loadNotifyState();
          lastPinPrices = notifyState.lastPinPrices || {};
          lastPinNotify = notifyState.lastPinNotify || null;
        } catch (error) {
          console.warn(error);
          lastPinPrices = {};
          lastPinNotify = null;
        }
        pruneHistory();
      }

      function parseNotifyStateData(data) {
        return {
          lastPinPrices:
            data && typeof data.lastPinPrices === "object"
              ? data.lastPinPrices
              : {},
          lastPinNotify:
            data && data.lastPinNotify && typeof data.lastPinNotify === "object"
              ? data.lastPinNotify
              : null,
        };
      }

      function applyNotifyState(state, options) {
        const prevAt =
          lastPinNotify && Number.isFinite(Number(lastPinNotify.at))
            ? Number(lastPinNotify.at)
            : 0;
        lastPinPrices = (state && state.lastPinPrices) || {};
        lastPinNotify = (state && state.lastPinNotify) || null;
        const nextAt =
          lastPinNotify && Number.isFinite(Number(lastPinNotify.at))
            ? Number(lastPinNotify.at)
            : 0;
        const isNewer = prevAt > 0 && nextAt > prevAt;
        if (isNewer || (options && options.forceOpen)) {
          // New push supersedes a previous dismiss.
          localStorage.removeItem(notifyDismissStorageKey());
        }
        updateNotifyFloatPanel();
        return { isNewer, at: nextAt };
      }

      async function loadNotifyState() {
        const path = CONFIG.NOTIFY_STATE_PATH;
        const repo = CONFIG.GITHUB_REPO;

        // 1) GitHub Contents API — freshest (no raw CDN lag).
        try {
          const current = await WatchFavorites.fetchJsonFile({ repo, path });
          if (current && current.data) {
            return parseNotifyStateData(current.data);
          }
        } catch (error) {
          console.warn("loadNotifyState via API failed", error);
        }

        // 2) raw pinned to latest main commit sha — bypasses /main CDN cache.
        try {
          const commitSha = await WatchFavorites.getMainCommitSha({ repo });
          const response = await WatchFavorites.fetchRawJsonByCommit({
            repo,
            path,
            commitSha,
          });
          if (response.ok) {
            return parseNotifyStateData(await response.json());
          }
        } catch (error) {
          console.warn("loadNotifyState via commit-raw failed", error);
        }

        // 3) last resort: raw /main with cache buster.
        try {
          const url = `https://raw.githubusercontent.com/${repo}/main/${path}?t=${Date.now()}`;
          const response = await fetch(url, {
            cache: "no-store",
            headers: {
              "Cache-Control": "no-cache",
              Pragma: "no-cache",
            },
          });
          if (!response.ok) {
            return { lastPinPrices: {}, lastPinNotify: null };
          }
          return parseNotifyStateData(await response.json());
        } catch (error) {
          console.warn("loadNotifyState failed", error);
          return { lastPinPrices: {}, lastPinNotify: null };
        }
      }

      async function refreshNotifyFloat(options) {
        if (notifyFloatRefreshing) return;
        notifyFloatRefreshing = true;
        const btn = document.getElementById("notifyFloatRefresh");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "…";
        }
        try {
          const state = await loadNotifyState();
          const result = applyNotifyState(state, {
            forceOpen: !!(options && options.forceOpen),
          });
          if (options && options.silent) return result;
          if (result.isNewer) {
            showToast("已更新到最新企微通知");
          } else if (lastPinNotify && lastPinNotify.markdown) {
            showToast("已是最新企微文案");
          } else {
            showToast("暂无企微通知文案");
          }
          return result;
        } catch (error) {
          console.warn(error);
          if (!(options && options.silent)) {
            showToast(error.message || "刷新企微通知失败");
          }
          return null;
        } finally {
          notifyFloatRefreshing = false;
          if (btn) {
            btn.disabled = false;
            btn.textContent = "刷新";
          }
        }
      }

      function startNotifyPoll() {
        if (notifyPollTimer) return;
        notifyPollTimer = window.setInterval(() => {
          if (document.visibilityState === "hidden") return;
          refreshNotifyFloat({ silent: true });
        }, CONFIG.NOTIFY_POLL_MS);
      }

      async function loadBinanceTicker() {
        const endpoints = [
          "https://data-api.binance.vision/api/v3/ticker/24hr",
          "https://api.binance.com/api/v3/ticker/24hr",
        ];
        let lastError = null;
        for (const url of endpoints) {
          try {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) {
              lastError = new Error(`HTTP ${response.status}`);
              continue;
            }
            const data = await response.json();
            Object.keys(marketMap).forEach((key) => delete marketMap[key]);
            data.forEach((ticker) => {
              if (!ticker.symbol.endsWith("USDT")) return;
              const price = Number(ticker.lastPrice);
              const change = Number(ticker.priceChangePercent);
              if (Number.isFinite(price) && Number.isFinite(change)) {
                marketMap[ticker.symbol] = {
                  price,
                  change24h: change,
                };
              }
            });
            return;
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("行情请求失败");
      }

      async function fetchKlines(symbol, interval, signal, limitOverride) {
        const limit = limitOverride || klineLimit(interval);
        const query = `symbol=${symbol}&interval=${interval}&limit=${limit}`;
        const endpoints = [
          `https://data-api.binance.vision/api/v3/klines?${query}`,
          `https://api.binance.com/api/v3/klines?${query}`,
        ];
        let lastError = null;
        for (const url of endpoints) {
          try {
            const response = await fetch(url, { signal, cache: "no-store" });
            if (!response.ok) {
              lastError = new Error(`HTTP ${response.status}`);
              continue;
            }
            const rows = await response.json();
            if (!Array.isArray(rows) || !rows.length) {
              lastError = new Error("K线为空");
              continue;
            }
            return rows.map((row) => ({
              time: Number(row[0]),
              open: Number(row[1]),
              high: Number(row[2]),
              low: Number(row[3]),
              close: Number(row[4]),
              volume: Number(row[5]),
            }));
          } catch (error) {
            if (error.name === "AbortError") throw error;
            lastError = error;
          }
        }
        throw lastError || new Error("K线请求失败");
      }

      function scoreEarlyMomentum(candles) {
        if (!Array.isArray(candles) || candles.length < 12) return null;
        const recent10 = candles.slice(-10);
        const look = candles.slice(-Math.min(20, candles.length));
        if (look.length < 5) return null;

        const green = recent10.filter((c) => c.close >= c.open).length;
        let higherHighs = 0;
        let higherLows = 0;
        for (let index = 1; index < recent10.length; index += 1) {
          if (recent10[index].high > recent10[index - 1].high) higherHighs += 1;
          if (recent10[index].low > recent10[index - 1].low) higherLows += 1;
        }

        const price = recent10[recent10.length - 1].close;
        const maxHigh = Math.max(...look.map((c) => c.high));
        const priorHigh = Math.max(
          ...look.slice(0, -1).map((c) => c.high),
          look[0].high,
        );
        const nearBreak = price >= maxHigh * 0.98;
        const broke = price > priorHigh;
        const avgVol =
          look.reduce((sum, c) => sum + (Number.isFinite(c.volume) ? c.volume : 0), 0) /
          look.length;
        const lastVol = Number.isFinite(recent10[recent10.length - 1].volume)
          ? recent10[recent10.length - 1].volume
          : 0;
        const volRatio = avgVol > 0 ? lastVol / avgVol : 0;

        const dayBars = candles.slice(-Math.min(192, candles.length));
        const dayHigh = Math.max(...dayBars.map((c) => c.high));
        const dayLow = Math.min(...dayBars.map((c) => c.low));
        const dayPos =
          dayHigh === dayLow ? 0 : (price - dayLow) / (dayHigh - dayLow);

        let score = 0;
        const reasons = [];
        if (green >= 6) {
          score += 1;
          reasons.push(`阳${green}/10`);
        }
        if (higherLows >= 5 || (higherHighs >= 4 && higherLows >= 4)) {
          score += 1;
          reasons.push("抬结构");
        }
        if (nearBreak || broke) {
          score += 1;
          reasons.push(broke ? "破高" : "近高");
        }
        if (volRatio >= 1.5) {
          score += 1;
          reasons.push(`量${volRatio.toFixed(1)}x`);
        }
        if (dayPos >= 0.85) {
          score -= 1;
          reasons.push("过热");
        }

        return {
          score,
          hit: score >= CONFIG.EARLY_SCORE_MIN,
          detail: reasons.length ? reasons.join(" · ") : "无加分项",
        };
      }

      function applyEarlyBadge(card, early) {
        card.classList.remove("is-early");
        card.removeAttribute("title");
        const old = card.querySelector(".early-badge");
        if (old) old.remove();
        if (!early || !early.hit) return;
        card.classList.add("is-early");
        const tip = `15m 启动分 ${early.score}/4 · ${early.detail}`;
        const badge = document.createElement("span");
        badge.className = "early-badge";
        badge.textContent = `启动 ${early.score}`;
        badge.title = tip;
        badge.addEventListener("pointerdown", (event) => event.stopPropagation());
        card.appendChild(badge);
      }

      /** Drop forming candle; closed closes only (same as WeCom notify). */
      function closedCloses(candles) {
        if (!Array.isArray(candles) || candles.length < 2) return [];
        return candles
          .slice(0, -1)
          .map((bar) => Number(bar && bar.close))
          .filter((value) => Number.isFinite(value));
      }

      /** % change vs closed 15m close from `hours` ago; now prefers live ticker. */
      function changeOverHours(candles, hours, currentPrice) {
        const closes = closedCloses(candles);
        const bars = Math.max(1, Math.round(Number(hours) * 4));
        if (closes.length < bars) return null;
        const past = closes[closes.length - bars];
        const now = Number.isFinite(currentPrice)
          ? currentPrice
          : closes[closes.length - 1];
        if (!Number.isFinite(past) || past === 0 || !Number.isFinite(now)) {
          return null;
        }
        return ((now - past) / past) * 100;
      }

      async function loadPinHourScores(symbols, signal) {
        const scores = new Map();
        const list = [...new Set((symbols || []).filter(Boolean))];
        const batchSize = 4;
        for (let index = 0; index < list.length; index += batchSize) {
          if (signal && signal.aborted) return scores;
          const batch = list.slice(index, index + batchSize);
          await Promise.all(
            batch.map(async (symbol) => {
              try {
                const candles = await fetchKlines(
                  symbol,
                  "15m",
                  signal,
                  20,
                );
                const price = marketMap[symbol]?.price;
                scores.set(symbol, {
                  change1h: changeOverHours(candles, 1, price),
                  change2h: changeOverHours(candles, 2, price),
                });
              } catch (error) {
                if (error && error.name === "AbortError") throw error;
                scores.set(symbol, { change1h: null, change2h: null });
              }
            }),
          );
        }
        return scores;
      }

      function formatHourRankLine(scores, symbols, key, limit) {
        const rows = symbols
          .map((symbol) => {
            const score = scores.get(symbol);
            const value = score ? score[key] : null;
            return {
              symbol,
              label: String(symbol).replace(/USDT$/i, ""),
              value,
            };
          })
          .filter((row) => Number.isFinite(row.value))
          .sort((a, b) => b.value - a.value)
          .slice(0, limit || 5);
        if (!rows.length) return "暂无";
        return rows
          .map((row, index) => {
            const cls =
              row.value >= 2 ? "mom-hot" : row.value < 0 ? "mom-cool" : "";
            const text = `${row.label} ${formatPercent(row.value)}`;
            return cls
              ? `<span class="${cls}">${index === 0 && key === "change2h" ? "① " : ""}${text}</span>`
              : `${index === 0 && key === "change2h" ? "① " : ""}${text}`;
          })
          .join(" · ");
      }

      function updatePinMomentumMeta(scores, symbols) {
        const el = document.getElementById("pinMomentumMeta");
        if (!el) return;
        if (!symbols.length) {
          el.hidden = true;
          el.innerHTML = "";
          return;
        }
        const line2h = formatHourRankLine(scores, symbols, "change2h", 6);
        const line1h = formatHourRankLine(scores, symbols, "change1h", 6);
        el.hidden = false;
        el.innerHTML = [
          `<div><span class="mom-label">近2h谁高（主看·仅排行，不改卡片顺序）</span> ${line2h}</div>`,
          `<div><span class="mom-label">近1h（瞟一眼有没有熄火）</span> ${line1h}</div>`,
        ].join("");
      }

      function lastBarRises(closes, bars) {
        const need = bars + 1;
        if (!Array.isArray(closes) || closes.length < need) return [];
        const slice = closes.slice(-need);
        const rises = [];
        for (let i = 1; i < slice.length; i += 1) {
          rises.push(slice[i] > slice[i - 1]);
        }
        return rises;
      }

      function momentumFromCloses(closes5, closes15) {
        const rises5 = lastBarRises(closes5, 3);
        const rises15 = lastBarRises(closes15, 3);
        return {
          streak5: rises5.length === 3 && rises5.every(Boolean),
          heat15: rises15.length === 3 && rises15.filter(Boolean).length >= 2,
        };
      }

      function applyPinMomentum(card, flags) {
        const nameBtn = card.querySelector(".symbol-copy");
        const status = card.querySelector("[data-kline-status]");
        const inlinePinStats =
          status && status.classList.contains("pin-stats");
        card.classList.remove("is-streak5", "is-heat15", "is-price-up-last");
        if (nameBtn) {
          nameBtn.classList.remove("is-streak5", "is-heat15");
        }
        const oldBadge = card.querySelector(".mom-badge");
        if (oldBadge) oldBadge.remove();
        const oldMark = card.querySelector(".price-up-last-mark");
        if (oldMark) oldMark.remove();

        if (!flags) return;
        const { streak5, heat15, priceUpVsLast } = flags;

        if (streak5) {
          card.classList.add("is-streak5");
          if (nameBtn) nameBtn.classList.add("is-streak5");
        } else if (heat15) {
          card.classList.add("is-heat15");
          if (nameBtn) nameBtn.classList.add("is-heat15");
        }

        // Pin cards fold 5m / @@@ into the multi-line status block.
        if (inlinePinStats) {
          if (priceUpVsLast) card.classList.add("is-price-up-last");
          return;
        }

        if (streak5 || heat15) {
          const badge = document.createElement("span");
          badge.className = `mom-badge ${streak5 ? "is-streak5" : "is-heat15"}`;
          const parts = [];
          if (streak5) parts.push("5m连阳");
          if (heat15) parts.push("15m热");
          badge.textContent = parts.join(" · ");
          badge.title = streak5
            ? "近 3 根已收盘 5m 收盘价连续高于前收（与企微绿名一致）"
            : "近 3 根已收盘 15m 至少 2 根收涨（与企微橙名一致）";
          if (streak5 && heat15) {
            badge.title =
              "5m 三连阳 + 15m 热度（名称按企微规则显示绿色）";
          }
          badge.addEventListener("pointerdown", (event) =>
            event.stopPropagation(),
          );
          card.appendChild(badge);
        }

        if (priceUpVsLast && status) {
          card.classList.add("is-price-up-last");
          const mark = document.createElement("span");
          mark.className = "price-up-last-mark";
          mark.textContent = "@@@";
          mark.title = "现价高于上次企微推送价";
          status.appendChild(mark);
        }
      }

      function drawKline(canvas, candles, pinPrice) {
        const rect = canvas.getBoundingClientRect();
        const width = Math.max(1, Math.floor(rect.width));
        const height = Math.max(1, Math.floor(rect.height));
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        if (!candles.length) return;

        const pad = { top: 6, right: 4, bottom: 6, left: 4 };
        const chartW = width - pad.left - pad.right;
        const chartH = height - pad.top - pad.bottom;
        const highs = candles.map((item) => item.high);
        const lows = candles.map((item) => item.low);
        let max = Math.max(...highs);
        let min = Math.min(...lows);
        const pin = Number(pinPrice);
        const hasPin = Number.isFinite(pin) && pin > 0;
        if (hasPin) {
          max = Math.max(max, pin);
          min = Math.min(min, pin);
        }
        const range = max - min || max * 0.01 || 1;
        const slot = chartW / candles.length;
        const bodyW = Math.max(1, slot * 0.62);
        const yOf = (price) => pad.top + ((max - price) / range) * chartH;

        if (hasPin) {
          const y = yOf(pin);
          ctx.save();
          ctx.strokeStyle = "#5a6a68";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(pad.left, y);
          ctx.lineTo(pad.left + chartW, y);
          ctx.stroke();
          ctx.restore();
        }

        candles.forEach((candle, index) => {
          const x = pad.left + slot * index + slot / 2;
          const up = candle.close >= candle.open;
          ctx.strokeStyle = up ? "#718b88" : "#8d7771";
          ctx.fillStyle = up ? "#718b88" : "#8d7771";
          ctx.beginPath();
          ctx.moveTo(x, yOf(candle.high));
          ctx.lineTo(x, yOf(candle.low));
          ctx.stroke();
          const y1 = yOf(candle.open);
          const y2 = yOf(candle.close);
          const bodyH = Math.max(1, Math.abs(y2 - y1));
          ctx.fillRect(x - bodyW / 2, Math.min(y1, y2), bodyW, bodyH);
        });
      }

      async function renderKlineCard(card, symbol, interval, signal, pinItem) {
        const canvas = card.querySelector("canvas");
        const status = card.querySelector("[data-kline-status]");
        if (!canvas || !status) return;
        try {
          const tasks = [
            fetchKlines(symbol, interval, signal),
            fetchKlines(
              symbol,
              CONFIG.SIGNAL_INTERVAL,
              signal,
              CONFIG.SIGNAL_LIMIT,
            ),
          ];
          if (pinItem) {
            tasks.push(
              fetchKlines(symbol, "5m", signal, CONFIG.MOMENTUM_5M_LIMIT),
            );
          }
          const [candles, signalCandles, candles5] = await Promise.all(tasks);
          if (pinItem) {
            const mom = momentumFromCloses(
              closedCloses(candles5),
              closedCloses(signalCandles),
            );
            const last = Number(lastPinPrices[symbol]);
            const current = marketMap[symbol]?.price;
            const priceUpVsLast =
              Number.isFinite(last) &&
              Number.isFinite(current) &&
              current > last;
            const flags = {
              streak5: mom.streak5,
              heat15: mom.heat15,
              priceUpVsLast,
            };
            status.className = "pin-stats";
            status.innerHTML = buildPinStatusHtml(pinItem, symbol, flags);
            status.title = [
              `盯住价 ${formatPinPrice(pinItem.pinPrice)}`,
              `现价 ${formatPinPrice(current)}`,
              `盯幅 ${formatPercent(pinChangePercent(pinItem))}`,
              `24h ${formatPercent(marketMap[symbol]?.change24h)}`,
              formatRemaining(pinItem.expiresAt) || "",
            ]
              .filter(Boolean)
              .join(" · ");
            applyPinMomentum(card, flags);
          } else {
            const change24h = marketMap[symbol]?.change24h;
            status.textContent = Number.isFinite(change24h)
              ? `${formatPercent(change24h)} · 24h`
              : "24h";
            status.className =
              change24h > 0 ? "up" : change24h < 0 ? "price-down" : "neutral";
            applyPinMomentum(card, null);
          }
          drawKline(canvas, candles, pinItem ? pinItem.pinPrice : null);
          applyEarlyBadge(card, scoreEarlyMomentum(signalCandles));
        } catch (error) {
          if (error.name === "AbortError") return;
          status.textContent = "加载失败";
          status.className = "price-down";
          canvas.replaceWith(
            Object.assign(document.createElement("div"), {
              className: "empty",
              textContent: error.message || "K线加载失败",
            }),
          );
        }
      }

      function buildCardHtml(symbol, options) {
        const label = symbol.replace("USDT", "");
        const change24h = marketMap[symbol]?.change24h;
        const favClass = options.isFavorite ? " is-favorite" : "";
        const pairClass = options.isPair ? " is-pair" : "";
        const pinClass = options.isPin ? " is-pin" : "";
        const posClass = options.hasPosition ? " is-position" : "";
        const expiredClass = options.isExpired ? " is-expired" : "";
        const marks = [];
        if (options.showMark) marks.push('<span class="fav-mark">★</span>');
        if (options.isPin) {
          marks.push(
            `<span class="pin-mark">${options.isExpired ? "过期" : "盯"}</span>`,
          );
        }
        if (options.hasPosition) {
          marks.push('<span class="pos-mark">持仓</span>');
        }
        const statusText = options.pinItem
          ? buildPinStatusHtml(options.pinItem, symbol, null)
          : Number.isFinite(change24h)
            ? formatPercent(change24h)
            : "--";
        const headClass = options.pinItem
          ? "kline-card-head is-pin-head"
          : "kline-card-head";
        const statusClass = options.pinItem ? ' class="pin-stats"' : "";
        return `<div class="kline-card${favClass}${pairClass}${pinClass}${posClass}${expiredClass}" id="card-${options.section}-${symbol}" data-symbol="${symbol}" data-section="${options.section}"><div class="${headClass}"><button type="button" class="symbol-copy" data-name="${label}" title="点击复制">${label}</button><span data-kline-status${statusClass}>${statusText}</span></div>${marks.join("")}<canvas></canvas></div>`;
      }

      function closeCardActions(force) {
        document.querySelectorAll(".card-actions").forEach((el) => {
          if (!force && el.classList.contains("is-busy")) return;
          el.remove();
        });
      }

      function setCardActionsBusy(sheet, activeBtn, busyLabel) {
        sheet.classList.add("is-busy");
        sheet.querySelectorAll("button").forEach((btn) => {
          btn.disabled = true;
          if (btn === activeBtn) {
            btn.classList.add("is-loading");
            btn.dataset.labelBefore = btn.textContent;
            btn.textContent = busyLabel || "处理中";
          }
        });
      }

      function clearCardActionsBusy(sheet) {
        sheet.classList.remove("is-busy");
        sheet.querySelectorAll("button").forEach((btn) => {
          btn.disabled = false;
          if (btn.classList.contains("is-loading")) {
            btn.classList.remove("is-loading");
            if (btn.dataset.labelBefore) {
              btn.textContent = btn.dataset.labelBefore;
              delete btn.dataset.labelBefore;
            }
          }
        });
      }

      function openCardActions(card) {
        closeCardActions(true);
        const symbol = card.dataset.symbol;
        if (!symbol) return;
        const pinned = pinSymbols().has(symbol);
        const favored = favoriteSymbols().has(symbol);
        const held = positionSymbols().has(symbol);
        const expired = (() => {
          const item = pinItemBySymbol(symbol);
          return item ? WatchFavorites.isPinExpired(item) : false;
        })();
        const sheet = document.createElement("div");
        sheet.className = "card-actions";
        sheet.innerHTML = [
          expired
            ? `<button type="button" data-action="renew">续盯（现价起算）</button>`
            : "",
          `<button type="button" data-action="pin">${
            pinned
              ? expired
                ? "清除过期盯一下"
                : "取消盯一下"
              : "盯一下"
          }</button>`,
          `<button type="button" data-action="buy">${held ? "更新买入价" : "购买"}</button>`,
          held
            ? `<button type="button" data-action="sell">卖出</button>`
            : "",
          `<button type="button" data-action="fav">${favored ? "取消收藏" : "收藏"}</button>`,
          `<button type="button" data-action="blacklist" class="is-danger">拉黑</button>`,
          `<button type="button" data-action="close" class="is-muted">关闭</button>`,
        ].join("");
        sheet.addEventListener("pointerdown", (event) => event.stopPropagation());
        sheet.addEventListener("click", async (event) => {
          const btn = event.target.closest("button[data-action]");
          if (!btn || sheet.classList.contains("is-busy")) return;
          event.stopPropagation();
          const action = btn.dataset.action;
          if (action === "close") {
            closeCardActions(true);
            return;
          }

          const busyLabels = {
            renew: "续盯中",
            pin: pinned ? (expired ? "清除中" : "取消中") : "盯住中",
            buy: "保存中",
            sell: "卖出中",
            fav: favored ? "取消中" : "收藏中",
            blacklist: "拉黑中",
          };
          const needsConfirm = action === "buy" || action === "sell" || action === "blacklist";
          const markBusy = () =>
            setCardActionsBusy(sheet, btn, busyLabels[action] || "处理中");
          if (!needsConfirm) markBusy();
          try {
            let done = true;
            if (action === "renew") {
              done = await renewPinForSymbol(symbol);
            } else if (action === "pin") {
              if (pinned) await clearPinForSymbol(symbol);
              else await togglePinForSymbol(symbol);
            } else if (action === "buy") {
              done = await buyPositionForSymbol(symbol, { onSaving: markBusy });
            } else if (action === "sell") {
              done = await sellPositionForSymbol(symbol, { onSaving: markBusy });
            } else if (action === "fav") {
              await toggleFavoriteForSymbol(symbol);
            } else if (action === "blacklist") {
              done = await addToBlacklist(symbol, { onSaving: markBusy });
            }
            if (done === false) {
              if (sheet.classList.contains("is-busy")) clearCardActionsBusy(sheet);
              return;
            }
            // Successful actions usually re-render and remove the card sheet.
            if (document.body.contains(sheet)) closeCardActions(true);
          } catch (error) {
            console.error(error);
            clearCardActionsBusy(sheet);
            showToast(error.message || "操作失败");
          }
        });
        card.appendChild(sheet);
      }

      function bindCardInteractions(root) {
        root.querySelectorAll(".symbol-copy").forEach((btn) => {
          btn.addEventListener("click", (event) => {
            event.stopPropagation();
            closeCardActions();
            copyName(btn.dataset.name);
          });
        });
        root.querySelectorAll(".kline-card").forEach((card) => {
          bindLongPress(card);
        });
      }

      function bindLongPress(card) {
        let timer = null;
        let triggered = false;

        const clear = () => {
          if (timer) {
            clearTimeout(timer);
            timer = null;
          }
          card.classList.remove("is-pressed");
        };

        const start = (event) => {
          if (event.target.closest(".symbol-copy, .card-actions, .early-badge, .mom-badge, .price-up-last-mark")) {
            return;
          }
          if (event.pointerType === "mouse" && event.button !== 0) return;
          triggered = false;
          card.classList.add("is-pressed");
          timer = setTimeout(() => {
            triggered = true;
            clear();
            if (navigator.vibrate) navigator.vibrate(20);
            openCardActions(card);
          }, CONFIG.LONG_PRESS_MS);
        };

        card.addEventListener("pointerdown", start);
        card.addEventListener("pointerup", clear);
        card.addEventListener("pointerleave", clear);
        card.addEventListener("pointercancel", clear);
        card.addEventListener("contextmenu", (event) => {
          event.preventDefault();
        });
        card.addEventListener(
          "click",
          (event) => {
            if (triggered) {
              event.preventDefault();
              event.stopPropagation();
              triggered = false;
            }
          },
          true,
        );
      }

      async function fillGrid(grid, symbols, section, signal, pairSet, pinMap) {
        const favSet = favoriteSymbols();
        const pairs = pairSet || new Set();
        const pins = pinMap || new Map();
        const isPinSection = section === "pin" || section === "pin-hidden";
        grid.innerHTML = symbols.length
          ? symbols
              .map((symbol) => {
                const pinItem = pins.get(symbol) || null;
                const expired = pinItem
                  ? WatchFavorites.isPinExpired(pinItem)
                  : false;
                return buildCardHtml(symbol, {
                  section,
                  isFavorite: favSet.has(symbol),
                  isPair: pairs.has(symbol),
                  isPin: isPinSection || pinSymbols().has(symbol),
                  hasPosition: positionSymbols().has(symbol),
                  isExpired: isPinSection && expired,
                  pinItem: isPinSection ? pinItem : null,
                  showMark: section === "rising" && favSet.has(symbol),
                });
              })
              .join("")
          : `<div class="empty">${
              section === "rising"
                ? "暂无上涨币种"
                : section === "pin"
                  ? "暂无当前窗口上涨的盯一下 · 右侧可看窗口回落项"
                  : section === "pin-hidden"
                    ? "当前没有隐藏的盯一下（窗口回落）"
                    : "暂无窗口上涨的收藏"
            }</div>`;

        bindCardInteractions(grid);

        const cards = [...grid.querySelectorAll(".kline-card")];
        const batchSize = 4;
        for (let index = 0; index < cards.length; index += batchSize) {
          if (signal.aborted) return;
          const batch = cards.slice(index, index + batchSize);
          await Promise.all(
            batch.map((card) =>
              renderKlineCard(
                card,
                card.dataset.symbol,
                chartInterval(),
                signal,
                isPinSection ? pinItemBySymbol(card.dataset.symbol) : null,
              ),
            ),
          );
        }
      }

        return "kline.notifyFloat.dismissAt";
      }

      function escapeHtml(text) {
        return String(text || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeRegExp(text) {
        return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function formatNotifyAt(at) {
        const ts = Number(at);
        if (!Number.isFinite(ts) || ts <= 0) return "";
        try {
          return new Date(ts).toLocaleString("zh-CN", { hour12: false });
        } catch (error) {
          return "";
        }
      }

      function renderWecomNotifyHtml(markdown, symbols) {
        const labelMap = new Map();
        (Array.isArray(symbols) ? symbols : []).forEach((symbol) => {
          const key = String(symbol || "")
            .trim()
            .toUpperCase();
          if (!key) return;
          const label = key.replace(/USDT$/i, "");
          if (label) labelMap.set(label.toUpperCase(), key);
        });
        // Longer tickers first so BTT wins over T / BT, etc.
        const labels = [...labelMap.keys()].sort((a, b) => b.length - a.length);

        const linkify = (escaped) => {
          const slots = [];
          let out = String(escaped || "");
          labels.forEach((label) => {
            const symbol = labelMap.get(label);
            // Ticker boundary only — never touch already-inserted markup.
            const re = new RegExp(
              `(^|[^A-Za-z0-9])(${escapeRegExp(label)})(?=[^A-Za-z0-9]|$)`,
              "g",
            );
            out = out.replace(re, (full, pre, match) => {
              const index = slots.length;
              slots.push(
                `<a href="#card-pin-${symbol}" class="notify-coin" data-jump="${symbol}">${match}</a>`,
              );
              return `${pre}\u0001${index}\u0001`;
            });
          });
          return out.replace(/\u0001(\d+)\u0001/g, (_, index) => {
            return slots[Number(index)] || "";
          });
        };

        const src = String(markdown || "");
        const fontRe =
          /<font\s+color="(info|warning|comment)">([\s\S]*?)<\/font>/gi;
        const parts = [];
        let last = 0;
        let match = fontRe.exec(src);
        while (match) {
          parts.push(linkify(escapeHtml(src.slice(last, match.index))));
          parts.push(
            `<span class="nc-${match[1]}">${linkify(escapeHtml(match[2]))}</span>`,
          );
          last = match.index + match[0].length;
          match = fontRe.exec(src);
        }
        parts.push(linkify(escapeHtml(src.slice(last))));
        return parts.join("").replace(/\n/g, "<br>");
      }

      function jumpToNotifySymbol(symbol) {
        const key = String(symbol || "")
          .trim()
          .toUpperCase();
        if (!key) return;
        const order = ["pin", "rising", "favorite", "pin-hidden"];
        const cards = [
          ...document.querySelectorAll(`.kline-card[data-symbol="${key}"]`),
        ].sort(
          (a, b) =>
            order.indexOf(a.dataset.section) - order.indexOf(b.dataset.section),
        );
        const card = cards[0];
        if (!card) {
          showToast(`${key.replace(/USDT$/i, "")} 当前页面未展示`);
          return;
        }
        if (card.dataset.section === "pin-hidden") {
          setHiddenPinDrawerOpen(true);
        }
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        card.classList.add("is-jump-target");
        window.setTimeout(() => card.classList.remove("is-jump-target"), 1600);
      }

      function isNotifyFloatDismissed(notify) {
        if (!notify || !Number.isFinite(Number(notify.at))) return true;
        const dismissed = Number(
          localStorage.getItem(notifyDismissStorageKey()) || 0,
        );
        return dismissed === Number(notify.at);
      }

      function updateNotifyFloatPanel() {
        const panel = document.getElementById("notifyFloat");
        const tab = document.getElementById("notifyFloatTab");
        const body = document.getElementById("notifyFloatBody");
        const timeEl = document.getElementById("notifyFloatTime");
        if (!panel || !tab || !body) return;

        const notify = lastPinNotify;
        const hasText =
          notify &&
          typeof notify.markdown === "string" &&
          notify.markdown.trim();
        if (!hasText) {
          panel.hidden = true;
          tab.hidden = true;
          body.innerHTML = "";
          if (timeEl) timeEl.textContent = "";
          return;
        }

        const dismissed = isNotifyFloatDismissed(notify);
        panel.hidden = dismissed;
        tab.hidden = !dismissed;
        if (timeEl) {
          const label = formatNotifyAt(notify.at);
          timeEl.textContent = label ? ` · ${label}` : "";
        }
        body.innerHTML = renderWecomNotifyHtml(
          notify.markdown,
          notify.symbols || [],
        );
      }

      function dismissNotifyFloat() {
        if (lastPinNotify && Number.isFinite(Number(lastPinNotify.at))) {
          localStorage.setItem(
            notifyDismissStorageKey(),
            String(lastPinNotify.at),
          );
        }
        updateNotifyFloatPanel();
      }

      function reopenNotifyFloat() {
        localStorage.removeItem(notifyDismissStorageKey());
        updateNotifyFloatPanel();
