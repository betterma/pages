      async function renderKlines() {
        const interval = CONFIG.KLINE_INTERVAL;
        const chartIv = chartInterval();
        const bars = klineLimit(chartIv);
        const rangeText = klineRangeLabel();
        const rising = getRisingSymbols();
        const favRising = getFavoriteRisingSymbols(rising);
        const pairSet = buildPairSet(rising);
        const overlap = pairSet.size;
        const blocked = blacklistSymbols();
        const fallingHidden = favoriteItems.filter((item) => {
          const symbol = item.symbol;
          return (
            marketMap[symbol] &&
            !blocked.has(symbol) &&
            !pinSymbols().has(symbol) &&
            !hasWindowGain(symbol, interval) &&
            !rising.includes(symbol)
          );
        }).length;
        const pinnedHiddenFav = favoriteItems.filter((item) =>
          pinSymbols().has(item.symbol),
        ).length;
        const pinMap = new Map(pinItems.map((item) => [item.symbol, item]));
        const pinCandidates = pinItems.filter(
          (item) => !blocked.has(item.symbol),
        );
        const pinHiddenItems = pinCandidates
          .filter((item) => !hasWindowGain(item.symbol, interval))
          .slice()
          .sort((a, b) => {
            const expA = WatchFavorites.isPinExpired(a) ? 1 : 0;
            const expB = WatchFavorites.isPinExpired(b) ? 1 : 0;
            if (expA !== expB) return expB - expA;
            const changeA = pinChangePercent(a);
            const changeB = pinChangePercent(b);
            const hasA = Number.isFinite(changeA);
            const hasB = Number.isFinite(changeB);
            if (hasA && hasB && changeB !== changeA) return changeB - changeA;
            if (hasA !== hasB) return hasA ? -1 : 1;
            return b.pinnedAt - a.pinnedAt;
          });
        const pinHiddenDown = pinHiddenItems.length;
        const pinHiddenList = pinHiddenItems.map((item) => item.symbol);
        let pinSymbolsList = pinCandidates
          .filter((item) => hasWindowGain(item.symbol, interval))
          .slice()
          .sort((a, b) => {
            const changeA = pinChangePercent(a);
            const changeB = pinChangePercent(b);
            const hasA = Number.isFinite(changeA);
            const hasB = Number.isFinite(changeB);
            // Window-up pins: pin-up first, then by pin change desc.
            const upA = hasA && changeA > 0 ? 1 : 0;
            const upB = hasB && changeB > 0 ? 1 : 0;
            if (upA !== upB) return upB - upA;
            if (hasA && hasB && changeB !== changeA) return changeB - changeA;
            if (hasA !== hasB) return hasA ? -1 : 1;
            return b.pinnedAt - a.pinnedAt;
          })
          .map((item) => item.symbol);
        const activePins = pinItems.filter(
          (item) =>
            !blocked.has(item.symbol) && !WatchFavorites.isPinExpired(item),
        ).length;
        const expiredPins = pinItems.filter(
          (item) =>
            !blocked.has(item.symbol) && WatchFavorites.isPinExpired(item),
        ).length;
        const expiredHidden = pinCandidates.filter((item) => {
          if (!WatchFavorites.isPinExpired(item)) return false;
          return !hasWindowGain(item.symbol, interval);
        }).length;

        if (klineAbort) klineAbort.abort();
        klineAbort = new AbortController();
        const { signal } = klineAbort;

        let pinHourScores = new Map();
        if (pinSymbolsList.length) {
          setStatus(false, "计算盯一下近1h/2h动量...");
          pinHourScores = await loadPinHourScores(pinSymbolsList, signal);
          if (signal.aborted) return;
        }
        updatePinMomentumMeta(pinHourScores, pinSymbolsList);

        document.getElementById("risingMeta").textContent = rising.length
          ? `窗口上涨 ${rising.length} / 观察池 ${watchPool.size} · ${rangeText} · ${bars} 根`
          : `当前没有窗口上涨的观察池币种 · 观察池 ${watchPool.size} 个`;

        const clearExpiredBtn = document.getElementById("clearExpiredPinsBtn");
        const clearPositionsBtn = document.getElementById("clearAllPositionsBtn");
        const maintEmptyHint = document.getElementById("maintEmptyHint");
        const positionCount = positionItems.length;
        if (clearExpiredBtn) clearExpiredBtn.hidden = expiredPins <= 0;
        if (clearPositionsBtn) clearPositionsBtn.hidden = positionCount <= 0;
        if (maintEmptyHint) {
          maintEmptyHint.hidden = expiredPins > 0 || positionCount > 0;
        }

        if (!pinItems.length) {
          document.getElementById("pinMeta").textContent =
            "还没有盯一下 · 长按选「盯一下」· 当前窗口上涨即展示（可低于盯住价）";
          updatePinMomentumMeta(new Map(), []);
        } else {
          const heldInPins = pinItems.filter((item) =>
            positionSymbols().has(item.symbol),
          ).length;
          const pinShownWindow = pinCandidates.filter((item) =>
            hasWindowGain(item.symbol, interval),
          ).length;
          const pinShownBelowPin = pinCandidates.filter((item) => {
            if (!hasWindowGain(item.symbol, interval)) return false;
            const change = pinChangePercent(item);
            return Number.isFinite(change) && change <= 0;
          }).length;
          const parts = [
            `盯一下 ${pinItems.length}`,
            `窗口上涨展示 ${pinShownWindow}`,
            "窗口涨即可显示（含低于盯住价）",
          ];
          if (pinShownBelowPin > 0) {
            parts.push(`其中低于盯住价 ${pinShownBelowPin}`);
          }
          if (pinHiddenDown > 0) {
            parts.push(`已隐藏窗口回落 ${pinHiddenDown}`);
          }
          if (heldInPins > 0) parts.push(`其中持仓 ${heldInPins}`);
          if (activePins > 0) parts.push(`有效 ${activePins}`);
          if (expiredPins > 0) {
            parts.push(
              expiredHidden > 0
                ? `过期 ${expiredPins}（隐藏 ${expiredHidden}）`
                : `过期 ${expiredPins}`,
            );
          }
          document.getElementById("pinMeta").textContent = parts.join(" · ");
        }

        updateHiddenPinTab(pinHiddenDown);
        const hiddenPinMeta = document.getElementById("hiddenPinMeta");
        if (hiddenPinMeta) {
          hiddenPinMeta.textContent = pinHiddenDown
            ? `${pinHiddenDown} 个当前窗口未涨（企微不会推送）· 长按可取消/续盯`
            : "当前没有隐藏的盯一下";
        }

        if (!favoriteItems.length) {
          document.getElementById("favMeta").textContent =
            "还没有收藏 · 长按卡片选「收藏」即可加入";
        } else {
          const parts = [
            `收藏 ${favoriteItems.length}`,
            `窗口上涨展示 ${favRising.length}`,
          ];
          if (pinnedHiddenFav > 0) {
            parts.push(`已盯住不重复展示 ${pinnedHiddenFav}`);
          }
          if (overlap > 0) {
            parts.push(`另有 ${overlap} 个在上方 · 黑色边框标记`);
          }
          if (fallingHidden > 0) parts.push(`已隐藏下跌 ${fallingHidden}`);
          document.getElementById("favMeta").textContent = parts.join(" · ");
        }

        await fillGrid(
          document.getElementById("pinGrid"),
          pinSymbolsList,
          "pin",
          signal,
          pairSet,
          pinMap,
        );
        if (signal.aborted) return;
        await fillGrid(
          document.getElementById("hiddenPinGrid"),
          pinHiddenList,
          "pin-hidden",
          signal,
          pairSet,
          pinMap,
        );
        if (signal.aborted) return;
        await fillGrid(
          document.getElementById("risingGrid"),
          rising,
          "rising",
          signal,
          pairSet,
        );
        if (signal.aborted) return;
        await fillGrid(
          document.getElementById("favGrid"),
          favRising,
          "favorite",
          signal,
          pairSet,
        );
        if (signal.aborted) return;
        const earlyCount = document.querySelectorAll(".early-badge").length;
        if (earlyCount > 0) {
          const risingMeta = document.getElementById("risingMeta");
          risingMeta.textContent = `${risingMeta.textContent} · 启动标记 ${earlyCount}`;
        }
        updateNotifyFloatPanel();
      }

        } catch (error) {
          console.error(error);
          showToast(error.message || "卖出保存失败");
          setStatus(false, error.message || "卖出保存失败");
          window.alert(error.message || "卖出保存失败");
          throw error;
        } finally {
          positionSaving = false;
        }
      }

      async function addToBlacklist(symbol, options) {
        if (!symbol || blacklistSaving) return false;
        const label = symbol.replace("USDT", "");
        if (!window.confirm(`确定将 ${label} 加入黑名单？`)) return false;
        if (options && typeof options.onSaving === "function") options.onSaving();
        blacklistSaving = true;
        try {
          setStatus(false, `正在拉黑 ${label}...`);
          const result = await WatchFavorites.patchBlacklist({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.BLACKLIST_PATH,
            message: `Add blacklist ${symbol}`,
            mutate: (list) => {
              if (WatchFavorites.hasBlacklist(list, symbol)) {
                return { list, added: false };
              }
              return {
                list: WatchFavorites.addBlacklist(list, symbol, "kline"),
                added: true,
              };
            },
          });
          blacklistItems = result.blacklist;
          watchPool.delete(symbol);
          if (favoriteSymbols().has(symbol)) {
            try {
              const favResult = await WatchFavorites.patchFavorites({
                repo: CONFIG.GITHUB_REPO,
                path: CONFIG.FAVORITES_PATH,
                message: `Remove favorite ${symbol} after blacklist`,
                mutate: (list) => ({
                  list: WatchFavorites.removeFavorite(list, symbol),
                  added: false,
                }),
              });
              favoriteItems = favResult.favorites;
            } catch (error) {
              console.warn("拉黑后移除收藏失败", error);
            }
          }
          if (pinSymbols().has(symbol)) {
            try {
              const pinResult = await WatchFavorites.patchPins({
                repo: CONFIG.GITHUB_REPO,
                path: CONFIG.PINS_PATH,
                message: `Remove pin ${symbol} after blacklist`,
                mutate: (list) => ({
                  list: WatchFavorites.removePin(list, symbol),
                  added: false,
                }),
              });
              pinItems = pinResult.pins;
            } catch (error) {
              console.warn("拉黑后移除盯一下失败", error);
            }
          }
          if (positionSymbols().has(symbol)) {
            try {
              const posResult = await WatchFavorites.patchPositions({
                repo: CONFIG.GITHUB_REPO,
                path: CONFIG.POSITIONS_PATH,
                message: `Remove position ${symbol} after blacklist`,
                mutate: (list) => ({
                  list: WatchFavorites.removePosition(list, symbol),
                  added: false,
                }),
              });
              positionItems = posResult.positions;
            } catch (error) {
              console.warn("拉黑后移除持仓失败", error);
            }
          }
          showToast(`${label} 已加入黑名单`);
          await renderKlines();
          setStatus(true, `${label} 已拉黑并同步`);
          return true;
        } catch (error) {
          console.error(error);
          showToast(error.message || "黑名单保存失败");
          setStatus(false, error.message || "黑名单保存失败");
          window.alert(error.message || "黑名单保存失败");
          throw error;
        } finally {
          blacklistSaving = false;
        }
      }

      async function refreshAll() {
        if (loading) return;
        loading = true;
        const btn = document.getElementById("refreshBtn");
        const rangeSelect = document.getElementById("rangeSelect");
        btn.disabled = true;
        if (rangeSelect) rangeSelect.disabled = true;
        try {
          setStatus(false, "1/3 读取 GitHub 快照 / 观察池 / 收藏...");
          await loadGithubStorage();
          updateNotifyFloatPanel();

          setStatus(false, "2/3 拉取币安最新行情...");
          await loadBinanceTicker();

          setStatus(false, "3/3 重算观察池并加载 K 线...");
          updateWatchPool();
          await renderKlines();
          const rising = getRisingSymbols().length;
          setStatus(
            true,
            `已更新 · 上涨 ${rising} · 盯 ${pinItems.length} · 持仓 ${positionItems.length} · 收藏 ${favoriteItems.length} · ${new Date().toLocaleTimeString("zh-CN")}`,
          );
        } catch (error) {
          console.error(error);
          setStatus(false, error.message || "刷新失败");
          document.getElementById("risingMeta").textContent = "";
          document.getElementById("pinMeta").textContent = "";
          document.getElementById("favMeta").textContent = "";
          const pinMom = document.getElementById("pinMomentumMeta");
          if (pinMom) {
            pinMom.hidden = true;
            pinMom.innerHTML = "";
          }
          document.getElementById("risingGrid").innerHTML =
            `<div class="empty">${error.message || "加载失败"}</div>`;
          document.getElementById("pinGrid").innerHTML = "";
          document.getElementById("favGrid").innerHTML = "";
          document.getElementById("hiddenPinGrid").innerHTML = "";
          updateHiddenPinTab(0);
          setHiddenPinDrawerOpen(false);
        } finally {
          loading = false;
          btn.disabled = false;
          if (rangeSelect) rangeSelect.disabled = false;
        }
      }

      document.getElementById("refreshBtn").addEventListener("click", () => {
        closeCardActions();
        refreshAll();
      });
      document
        .getElementById("notifyFloatClose")
        .addEventListener("click", () => {
          dismissNotifyFloat();
        });
      document
        .getElementById("notifyFloatRefresh")
        .addEventListener("click", () => {
          refreshNotifyFloat();
        });
      document.getElementById("notifyFloatTab").addEventListener("click", () => {
        reopenNotifyFloat();
        refreshNotifyFloat({ silent: true });
      });
      document
        .getElementById("notifyFloatBody")
        .addEventListener("click", (event) => {
          const link = event.target.closest(".notify-coin");
          if (!link) return;
          event.preventDefault();
          jumpToNotifySymbol(link.dataset.jump);
        });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          refreshNotifyFloat({ silent: true });
        }
      });
      startNotifyPoll();
      document
        .getElementById("clearExpiredPinsBtn")
        .addEventListener("click", () => {
          closeCardActions();
          clearAllExpiredPins();
        });
      document
        .getElementById("clearAllPositionsBtn")
        .addEventListener("click", () => {
          closeCardActions();
          clearAllPositions();
        });
      document.getElementById("maintToggleBtn").addEventListener("click", () => {
        closeCardActions();
        const panel = document.getElementById("maintPanel");
        setMaintPanelOpen(panel && panel.hidden);
      });
      document.getElementById("hiddenPinTab").addEventListener("click", () => {
        closeCardActions();
        setHiddenPinDrawerOpen(true);
      });
      document.getElementById("hiddenPinDrawer").addEventListener("click", (event) => {
        if (event.target && event.target.hasAttribute("data-close-hidden-pins")) {
          closeCardActions();
          setHiddenPinDrawerOpen(false);
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeCardActions();
          setHiddenPinDrawerOpen(false);
          setMaintPanelOpen(false);
        }
      });
      document
        .getElementById("rangeSelect")
        .addEventListener("change", async (event) => {
          closeCardActions();
          const select = event.target;
          if (loading) {
            syncRangeSelect();
            return;
          }
          const next = select.value;
          if (!KLINE_VIEWS[next] || next === klineViewKey) {
            syncRangeSelect();
            return;
          }
          const prev = klineViewKey;
          klineViewKey = next;
          syncRangeSelect();
          const view = currentKlineView();
          select.disabled = true;
          setStatus(false, `正在加载${view.label} K线...`);
          try {
            await renderKlines();
            setStatus(
              true,
              `已切换为${view.label} · ${new Date().toLocaleTimeString("zh-CN")}`,
            );
          } catch (error) {
            console.error(error);
            klineViewKey = prev;
            syncRangeSelect();
            setStatus(false, error.message || "切换 K 线范围失败");
          } finally {
            select.disabled = false;
          }
        });
      document.addEventListener("pointerdown", (event) => {
        if (event.target.closest(".card-actions")) return;
        const open = document.querySelector(".card-actions");
        if (open && open.classList.contains("is-busy")) return;
        if (open) closeCardActions();
      });
      document.addEventListener("dblclick", (event) => {
        if (event.target.closest("button, a, input, select, textarea, label")) {
          return;
        }
        window.location.href = "./watch.html";
      });
      syncRangeSelect();
      refreshAll();
    </script>
  </body>
</html>
