      async function refreshAll(options) {
        if (loading) return;
        loading = true;
        const reason = options && options.reason ? options.reason : "manual";
        const btn = document.getElementById("refreshBtn");
        const rangeSelect = document.getElementById("rangeSelect");
        btn.disabled = true;
        if (rangeSelect) rangeSelect.disabled = true;
        setTopProgress(true, {
          overlay: false,
          label:
            reason === "focus"
              ? "正在刷新…"
              : reason === "boot"
                ? "正在加载…"
                : "正在刷新…",
        });
        try {
          if (reason === "focus") {
            setStatus(false, "切回页面 · 正在刷新最新行情与 K 线...");
          } else {
            setStatus(false, "1/3 读取 GitHub 快照 / 观察池 / 收藏...");
          }
          await loadGithubStorage();
          updateNotifyFloatPanel();

          setStatus(false, "2/3 拉取行情…");
          await loadBinanceTicker();

          setStatus(false, "3/3 加载K线…");
          updateWatchPool();
          await renderKlines({
            onProgress: (done, total) => {
              const label =
                total > 0 ? `3/3 加载K线 ${done}/${total}` : "3/3 加载K线…";
              setStatus(false, label);
              if (total > 0) setTopProgressValue(done / total, label);
            },
          });
          const rising = getRisingSymbols().length;
          const now = Date.now();
          updateDataAsOf(now);
          setStatus(
            true,
            `已更新 · 上涨 ${rising} · 盯 ${pinItems.length} · 持仓 ${positionItems.length} · 收藏 ${favoriteItems.length}`,
          );
        } catch (error) {
          console.error(error);
          setStatus(false, error.message || "刷新失败");
          document.getElementById("risingMeta").textContent = "";
          document.getElementById("pinMeta").textContent = "";
          document.getElementById("favMeta").textContent = "";
          const pinMom = document.getElementById("pinMomentumMeta");
          if (pinMom) {
            pinMom.hidden = true;
            pinMom.innerHTML = "";
          }
          document.getElementById("risingGrid").innerHTML =
            `<div class="empty">${error.message || "加载失败"}</div>`;
          document.getElementById("pinGrid").innerHTML = "";
          document.getElementById("favGrid").innerHTML = "";
          document.getElementById("hiddenPinGrid").innerHTML = "";
          updateHiddenPinTab(0);
          setHiddenPinDrawerOpen(false);
        } finally {
          setTopProgress(false);
          loading = false;
          btn.disabled = false;
          if (rangeSelect) rangeSelect.disabled = false;
          // 主加载结束后若后台还在算动量，接上顶部进度。
          if (momentumBusy) {
            const total = momentumProgress.total || 0;
            const done = momentumProgress.done || 0;
            setMomentumUiBusy(
              true,
              total > 0
                ? `计算近2h/1h ${done}/${total}`
                : "计算近2h/1h…",
            );
          }
        }
      }

      function maybeRefreshDataOnFocus() {
        if (document.visibilityState !== "visible") return;
        if (loading) return;
        if (
          lastDataAt > 0 &&
          Date.now() - lastDataAt < CONFIG.DATA_FOCUS_REFRESH_MIN_MS
        ) {
          return;
        }
        refreshAll({ reason: "focus" });
      }

      document.getElementById("refreshBtn").addEventListener("click", () => {
        closeCardActions();
        refreshAll({ reason: "manual" });
      });
      document.addEventListener("click", (event) => {
        const open = document.querySelector("details.friend-links[open]");
        if (!open) return;
        if (!open.contains(event.target)) open.removeAttribute("open");
      });
      document
        .getElementById("notifyFloatClose")
        .addEventListener("click", () => {
          dismissNotifyFloat();
        });
      document
        .getElementById("notifyFloatRefresh")
        .addEventListener("click", () => {
          refreshNotifyFloat();
        });
      document.querySelector(".float-tabs").addEventListener("click", (event) => {
        const btn = event.target.closest("button[data-float]");
        if (!btn || btn.disabled) return;
        closeCardActions();
        const name = btn.dataset.float;
        toggleFloatPanel(name);
        if (name === "notify" && isFloatPanelOpen("notify")) {
          refreshNotifyFloat({ silent: true });
        }
        if (name === "momentum" && isFloatPanelOpen("momentum")) {
          const hasRows =
            lastMomentumSnapshot &&
            Array.isArray(lastMomentumSnapshot.rows) &&
            lastMomentumSnapshot.rows.length;
          if (!hasRows && !momentumBusy) {
            void schedulePinMomentum(currentMomentumUniverse(), {
              force: true,
            });
          }
        }
      });
      document
        .getElementById("notifyFloatBody")
        .addEventListener("click", (event) => {
          const link = event.target.closest(".notify-coin");
          if (!link) return;
          event.preventDefault();
          jumpToNotifySymbol(link.dataset.jump);
        });
      document
        .getElementById("momentumFloatClose")
        .addEventListener("click", () => {
          setMomentumFloatOpen(false);
        });
      document
        .getElementById("momentumFloatRefresh")
        .addEventListener("click", async () => {
          if (momentumFloatRefreshing || loading || momentumBusy) return;
          const symbols = currentMomentumUniverse();
          if (!symbols.length) {
            showToast("暂无盯一下可计算");
            return;
          }
          momentumFloatRefreshing = true;
          const btn = document.getElementById("momentumFloatRefresh");
          if (btn) {
            btn.disabled = true;
            btn.textContent = "…";
          }
          try {
            const scores = await schedulePinMomentum(symbols, { force: true });
            if (scores) {
              setMomentumFloatOpen(true);
              showToast("近2h/1h 已更新");
            }
          } catch (error) {
            console.warn(error);
            showToast(error.message || "刷新近2h/1h 失败");
          } finally {
            momentumFloatRefreshing = false;
            if (btn) {
              btn.disabled = false;
              btn.textContent = "刷新";
            }
          }
        });
      document
        .getElementById("momentumFloatBody")
        .addEventListener("click", (event) => {
          const noteBtn = event.target.closest("[data-mom-note]");
          if (noteBtn) {
            event.preventDefault();
            const symbol = noteBtn.getAttribute("data-mom-note");
            const row =
              (lastMomentumSnapshot &&
                lastMomentumSnapshot.rows &&
                lastMomentumSnapshot.rows.find(
                  (item) => item.symbol === symbol,
                )) ||
              null;
            if (row) addMomNoteFromRow(row);
            return;
          }
          const delBtn = event.target.closest("[data-mom-note-del]");
          if (delBtn) {
            event.preventDefault();
            removeMomNote(delBtn.getAttribute("data-mom-note-del"));
            return;
          }
          if (event.target.closest("[data-mom-notes-clear]")) {
            event.preventDefault();
            clearMomNotes();
            return;
          }
          if (event.target.closest("[data-mom-notes-toggle]")) {
            event.preventDefault();
            momNotesExpanded = !momNotesExpanded;
            refreshMomentumFloatBody();
            return;
          }
          const link = event.target.closest(".notify-coin");
          if (!link) return;
          event.preventDefault();
          jumpToNotifySymbol(link.dataset.jump);
        });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          refreshNotifyFloat({ silent: true });
          maybeRefreshDataOnFocus();
        }
      });
      startNotifyPoll();
      document
        .getElementById("clearExpiredPinsBtn")
        .addEventListener("click", () => {
          closeCardActions();
          clearAllExpiredPins();
        });
      document
        .getElementById("clearAllPositionsBtn")
        .addEventListener("click", () => {
          closeCardActions();
          clearAllPositions();
        });
      document.getElementById("maintToggleBtn").addEventListener("click", () => {
        closeCardActions();
        const panel = document.getElementById("maintPanel");
        setMaintPanelOpen(panel && panel.hidden);
      });
      document.getElementById("pinSelectBtn").addEventListener("click", () => {
        closeCardActions();
        setPinSelectMode(!pinSelectMode);
      });
      bindPinSelectDelegation();
      document.getElementById("pinBatchExitBtn").addEventListener("click", () => {
        setPinSelectMode(false);
      });
      document.getElementById("pinBatchClearBtn").addEventListener("click", () => {
        selectedPinSymbols.clear();
        document.querySelectorAll(".kline-card.is-selected").forEach((card) => {
          card.classList.remove("is-selected");
          const check = card.querySelector(".pin-check");
          if (check) check.checked = false;
        });
        updatePinSelectUi();
      });
      document
        .getElementById("pinBatchSelectAllBtn")
        .addEventListener("click", () => {
          document
            .querySelectorAll(
              "#pinGrid .kline-card[data-symbol], #hiddenPinGrid .kline-card[data-symbol]",
            )
            .forEach((card) => {
              const symbol = String(card.dataset.symbol || "").toUpperCase();
              if (!symbol || !pinSymbols().has(symbol)) return;
              selectedPinSymbols.add(symbol);
              card.classList.add("is-selected");
              const check = card.querySelector(".pin-check");
              if (check) check.checked = true;
            });
          updatePinSelectUi();
        });
      document
        .getElementById("pinBatchUnpinBtn")
        .addEventListener("click", () => {
          batchUnpinSelected();
        });
      document
        .getElementById("pinBatchRenewBtn")
        .addEventListener("click", () => {
          batchRenewSelected();
        });
      document.getElementById("hiddenPinTab").addEventListener("click", () => {
        closeCardActions();
        setHiddenPinDrawerOpen(true);
      });
      document.getElementById("hiddenPinDrawer").addEventListener("click", (event) => {
        if (event.target && event.target.hasAttribute("data-close-hidden-pins")) {
          closeCardActions();
          setHiddenPinDrawerOpen(false);
        }
      });
      document.getElementById("actionLogClose").addEventListener("click", () => {
        setActionLogOpen(false);
      });
      document.getElementById("actionLogClear").addEventListener("click", () => {
        writeActionLog([]);
        renderActionLogBody();
      });
      document
        .getElementById("actionLogBody")
        .addEventListener("click", (event) => {
          const link = event.target.closest(".notify-coin");
          if (!link) return;
          event.preventDefault();
          jumpToNotifySymbol(link.dataset.jump);
        });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeCardActions();
          setHiddenPinDrawerOpen(false);
          setMaintPanelOpen(false);
          if (pinSelectMode) setPinSelectMode(false);
          closeAllFloatPanels();
        }
      });
      renderActionLogBody();
      document
        .getElementById("rangeSelect")
        .addEventListener("change", async (event) => {
          closeCardActions();
          const select = event.target;
          if (loading) {
            syncRangeSelect();
            return;
          }
          const next = select.value;
          if (!KLINE_VIEWS[next] || next === klineViewKey) {
            syncRangeSelect();
            return;
          }
          const prev = klineViewKey;
          klineViewKey = next;
          syncRangeSelect();
          const view = currentKlineView();
          select.disabled = true;
          setTopProgress(true, {
            overlay: false,
            label: `加载${view.label}…`,
          });
          setStatus(false, `加载K线…`);
          try {
            await renderKlines({
              onProgress: (done, total) => {
                const label =
                  total > 0 ? `加载K线 ${done}/${total}` : "加载K线…";
                setStatus(false, label);
                if (total > 0) setTopProgressValue(done / total, label);
              },
            });
            updateDataAsOf(Date.now());
            setStatus(true, `已切换为${view.label}`);
          } catch (error) {
            console.error(error);
            klineViewKey = prev;
            syncRangeSelect();
            setStatus(false, error.message || "切换 K 线范围失败");
          } finally {
            setTopProgress(false);
            select.disabled = false;
          }
        });
      document.getElementById("modeSwitch").addEventListener("click", (event) => {
        const btn = event.target.closest("button[data-mode]");
        if (!btn || btn.disabled) return;
        const nextNotes = btn.dataset.mode === "notes";
        if (nextNotes === isNotesView()) return;
        closeCardActions();
        setNotesView(nextNotes);
      });
      document.getElementById("pinSortSwitch").addEventListener("click", (event) => {
        const btn = event.target.closest("button[data-pin-sort]");
        if (!btn || loading || btn.disabled) return;
        closeCardActions();
        setPinSortMode(btn.dataset.pinSort);
      });
      syncPinSortUi();
      document.addEventListener("pointerdown", (event) => {
        if (event.target.closest(".card-actions")) return;
        const open = document.querySelector(".card-actions");
        if (open && open.classList.contains("is-busy")) return;
        if (open) closeCardActions();
      });
      document.addEventListener("dblclick", (event) => {
        if (
          event.target.closest(
            "button, a, input, select, textarea, label, .card-actions, summary, .mode-switch",
          )
        ) {
          return;
        }
        setNotesView(!isNotesView());
      });
      applyNotesViewChrome();
      syncRangeSelect();
      refreshAll({ reason: "boot" });
    </script>
  </body>
</html>
