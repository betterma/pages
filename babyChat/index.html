<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>宝宝日记</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./baby-chat.css" />
  </head>
  <body>
    <div class="app">
      <main class="stage">
        <div class="compose-wrap">
          <p class="flash" id="flash" hidden></p>
          <textarea
            id="inputText"
            rows="3"
            placeholder="随便说，例如：刚才尿了一次 / 上午拉了两次 / 喂了一次奶"
          ></textarea>
          <div class="compose-actions">
            <button type="button" class="btn-text" id="btnSendText">发送</button>
            <button type="button" class="btn-voice" id="btnVoice">按住说话</button>
          </div>
          <p class="voice-meta" id="voiceMeta"></p>
        </div>
      </main>

      <section class="summary-panel" id="summaryPanel">
        <div class="summary-label">截至目前</div>
        <div class="summary-body" id="summaryBody">今天还没有记录</div>
      </section>

      <section class="evening-panel" id="eveningPanel">
        <div class="summary-label">晚间总结</div>
        <div class="evening-body" id="eveningBody">今晚 22:00 后生成，也会推到企业微信</div>
      </section>
    </div>

    <div class="sheet" id="detailSheet" hidden>
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <div class="sheet-card">
        <div class="sheet-head">
          <h2>今日明细</h2>
          <button type="button" class="sheet-close" id="sheetClose">关闭</button>
        </div>
        <div class="list" id="todayList"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <div
      class="loading-overlay"
      id="loadingOverlay"
      hidden
      aria-live="polite"
      aria-busy="true"
    >
      <div class="loading-card">
        <div class="loading-spinner" aria-hidden="true"></div>
        <div class="loading-title" id="loadingTitle">处理中</div>
        <div class="loading-sub" id="loadingSub">请稍候…</div>
      </div>
    </div>

    <script src="../github-token-vault.js"></script>
    <script src="./baby-chat-config.js"></script>
    <script src="./baby-chat-ai.js"></script>
    <script src="./baby-chat-store.js"></script>
    <script src="./baby-chat-app.js"></script>
  </body>
</html>
