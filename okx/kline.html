<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OKX 自选 K 线</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f5f3;
        color: #28323a;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .page {
        width: min(1400px, calc(100% - 20px));
        margin: 12px auto 24px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      h2.section-title {
        margin: 16px 0 6px;
        font-size: 15px;
      }
      .nav-link {
        color: #5a6a68;
        font-size: 13px;
        text-decoration: none;
      }
      .nav-link:hover {
        text-decoration: underline;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      button,
      select,
      input,
      textarea {
        border: 1px solid #c9d0d0;
        background: #fbfcfa;
        color: #28323a;
        padding: 8px 13px;
        border-radius: 6px;
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #eef1ee;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #78817f;
        margin-bottom: 10px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #a39d95;
        flex-shrink: 0;
      }
      .dot.online {
        background: #718b88;
        box-shadow: 0 0 8px rgba(113, 139, 136, 0.35);
      }
      .dot.offline {
        background: #8d7771;
      }
      .meta {
        color: #78817f;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .hint {
        color: #9aa3a0;
        font-size: 12px;
        margin: -2px 0 10px;
      }
      .panel {
        margin-bottom: 14px;
        padding: 0;
        background: #fbfcfa;
        border: 1px solid #d8ddda;
        border-radius: 8px;
        overflow: hidden;
      }
      .panel-toggle {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        border: 0;
        border-radius: 0;
        background: transparent;
        text-align: left;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .panel-toggle:hover {
        background: #eef1ee;
      }
      .panel-toggle .chevron {
        color: #78817f;
        font-weight: 400;
        font-size: 12px;
      }
      .panel-body {
        padding: 0 12px 12px;
      }
      .panel.is-collapsed .panel-body {
        display: none;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
        align-items: center;
      }
      .row input[type="text"] {
        min-width: 180px;
        flex: 1;
      }
      .row textarea {
        width: 100%;
        min-height: 88px;
        resize: vertical;
      }
      .chain-tag {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 5px;
        border-radius: 4px;
        background: #e8ece9;
        color: #5a6a68;
        font-size: 11px;
        font-weight: 600;
      }
      .dext-score {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin: 0;
        padding: 0;
        border: none;
        background: transparent;
        color: #5a6a68;
        font-size: 12px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        line-height: 1.35;
        text-align: left;
      }
      .dext-score:hover {
        opacity: 0.8;
      }
      .dext-score .dext-score-val {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 18px;
        padding: 0 5px;
        border: 1px solid #c9d0d0;
        border-radius: 4px;
        background: #eef1ee;
        font-weight: 700;
        font-size: 11px;
      }
      .dext-score.is-high .dext-score-val {
        background: #dfece6;
        border-color: #9ebdb0;
        color: #3d6b5c;
      }
      .dext-score.is-mid .dext-score-val {
        background: #f3ecd8;
        border-color: #d4c49a;
        color: #7a6540;
      }
      .dext-score.is-low .dext-score-val {
        background: #f0e4e0;
        border-color: #d0b5ae;
        color: #8d5f56;
      }
      .chain-tabs {
        display: flex;
        gap: 0;
        margin: 0 0 12px;
        border: 1px solid #d8ddda;
        border-radius: 8px;
        overflow: hidden;
        background: #fbfcfa;
      }
      .chain-tabs button {
        flex: 1;
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        color: #5a6a68;
      }
      .chain-tabs button + button {
        border-left: 1px solid #d8ddda;
      }
      .chain-tabs button:hover {
        background: #eef1ee;
      }
      .chain-tabs button.active {
        background: #dfe8e4;
        color: #28323a;
      }
      .chain-tabs .tab-count {
        margin-left: 6px;
        font-size: 12px;
        font-weight: 500;
        color: #78817f;
      }
      .chain-tabs button.active .tab-count {
        color: #5a6a68;
      }
      .interval-bar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 0 0 10px;
        align-items: center;
      }
      .interval-bar .label {
        font-size: 12px;
        color: #78817f;
        margin-right: 2px;
      }
      .interval-bar button.active {
        background: #dfe8e4;
        border-color: #9eb0aa;
        font-weight: 600;
      }
      .kline-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 10px;
      }
      .kline-card {
        position: relative;
        min-width: 0;
        padding: 8px 10px 10px;
        background: #fbfcfa;
        border: 1px solid #d8ddda;
        border-radius: 8px;
        cursor: pointer;
      }
      .kline-card.is-focus {
        outline: 2px solid #718b88;
        outline-offset: 1px;
        box-shadow: 0 0 0 1px rgba(113, 139, 136, 0.28);
      }
      .remove-card-btn {
        border: 0;
        background: transparent;
        color: #9aa3a0;
        padding: 0 2px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        flex-shrink: 0;
      }
      .remove-card-btn:hover {
        color: #8d7771;
      }
      .kline-card-head {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
        margin-bottom: 8px;
        font-size: 13px;
      }
      .kline-card-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }
      .kline-card-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        min-width: 0;
      }
      .card-focus-bar {
        position: fixed;
        left: 50%;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 8px;
        width: min(520px, calc(100vw - 16px));
        min-height: 52px;
        padding: 8px 28px 8px 10px;
        border-radius: 12px;
        border: 1px solid #d8ddda;
        background: rgba(251, 252, 250, 0.96);
        color: #5a6a68;
        box-shadow: 0 6px 18px rgba(40, 50, 48, 0.14);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-sizing: border-box;
      }
      .card-focus-bar[hidden] {
        display: none !important;
      }
      .card-focus-close {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 22px;
        height: 22px;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #8a9692;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }
      .card-focus-close:hover {
        color: #5a6a68;
        background: rgba(90, 106, 104, 0.12);
      }
      .card-focus-label {
        flex: 0 1 auto;
        min-width: 3em;
        max-width: 7em;
        padding: 0 4px;
        font-size: 14px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card-focus-bar button,
      .card-focus-bar a.card-focus-link {
        flex: 1 1 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: rgba(90, 106, 104, 0.1);
        color: inherit;
        height: 36px;
        padding: 0 10px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        white-space: nowrap;
        text-decoration: none;
        box-sizing: border-box;
      }
      .card-focus-bar button.is-okx,
      .card-focus-bar a.is-okx {
        background: #1a1a1a;
        color: #f0b90b;
      }
      .card-focus-bar button.is-dt,
      .card-focus-bar a.is-dt {
        background: #05a3c7;
        color: #fff;
      }
      .card-focus-bar button.is-danger {
        background: rgba(141, 119, 113, 0.16);
        color: #8d7771;
      }
      .confirm-gate {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(40, 50, 58, 0.45);
        box-sizing: border-box;
      }
      .confirm-gate[hidden] {
        display: none !important;
      }
      .confirm-panel {
        width: min(360px, 100%);
        padding: 16px 16px 12px;
        border-radius: 12px;
        border: 1px solid #d8ddda;
        background: #fbfcfa;
        box-shadow: 0 10px 28px rgba(40, 50, 48, 0.22);
      }
      .confirm-panel p {
        margin: 0 0 14px;
        font-size: 14px;
        line-height: 1.45;
        color: #28323a;
        word-break: break-word;
      }
      .confirm-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .confirm-actions button {
        min-width: 72px;
        height: 34px;
        padding: 0 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
      }
      .confirm-actions .is-danger {
        background: #8d7771;
        border-color: #8d7771;
        color: #f7f8f6;
      }
      .confirm-actions .is-danger:hover {
        background: #7a6661;
      }
      .busy-gate {
        position: fixed;
        inset: 0;
        z-index: 95;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(40, 50, 48, 0.4);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        box-sizing: border-box;
      }
      .busy-gate[hidden] {
        display: none !important;
      }
      .busy-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        min-width: 160px;
        padding: 20px 24px;
        border-radius: 12px;
        border: 1px solid #d8ddda;
        background: #fbfcfa;
        box-shadow: 0 10px 28px rgba(40, 50, 48, 0.2);
      }
      .busy-spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid #d8ddda;
        border-top-color: #718b88;
        border-radius: 50%;
        animation: okx-busy-spin 0.7s linear infinite;
      }
      @keyframes okx-busy-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .busy-panel p {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        color: #28323a;
      }
      body.is-page-busy {
        overflow: hidden;
      }
      body.is-page-busy .card-focus-bar {
        pointer-events: none;
        opacity: 0.55;
      }
      .kline-card-head .symbol-left {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .kline-card-head .token-logo {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        background: #e8e4df;
      }
      .kline-card-head .symbol-copy {
        color: inherit;
        font-weight: 700;
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
        font: inherit;
        text-align: left;
      }
      .kline-card-head .price {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: #28323a;
        font-size: 12px;
        line-height: 1.35;
      }
      .kline-card-head .mcap {
        font-variant-numeric: tabular-nums;
        color: #6a6360;
        font-size: 12px;
        line-height: 1.35;
      }
      .kline-card-head .change-line {
        font-size: 12px;
        line-height: 1.35;
        white-space: nowrap;
      }
      .kline-card canvas {
        display: block;
        width: 100%;
        height: 150px;
        pointer-events: none;
      }
      .up {
        color: #4f7a6e;
      }
      .price-down {
        color: #8d7771;
      }
      .neutral {
        color: #78817f;
      }
      .empty {
        padding: 28px 12px;
        text-align: center;
        color: #78817f;
        font-size: 13px;
        background: #fbfcfa;
        border: 1px dashed #d8ddda;
        border-radius: 8px;
      }
      .kline-card .empty {
        padding: 40px 8px;
        border: none;
        background: transparent;
        font-size: 12px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: rgba(40, 50, 58, 0.92);
        color: #f7f8f6;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        z-index: 20;
        pointer-events: none;
      }
      @media (max-width: 768px) {
        .page {
          width: calc(100% - 12px);
          margin: 8px auto 16px;
        }
        h1 {
          font-size: 17px;
        }
        .kline-grid {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
        .kline-card canvas {
          height: 120px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div class="topbar-left">
          <h1>OKX 自选</h1>
          <a class="nav-link" href="../index.html">总导航</a>
          <a class="nav-link" href="../kline.html">币安观察</a>
          <a class="nav-link" href="https://betterma.github.io/">蚂蚱导航</a>
        </div>
        <div class="topbar-actions">
          <button id="refreshBtn" type="button">刷新</button>
        </div>
      </div>

      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">等待启动...</span>
      </div>
      <p class="hint">
        自选按 Solana / Robinhood 分 tab · 按当前周期涨跌分区 · 点名称复制合约 · 操作栏「评分」填 DexTools 分（有分才显示）· 点 K 线出操作栏 · ⊖ 移出自选 ·
        K 线由定时云函数写入缓存（新加币 / 新周期需等下一轮）
      </p>

      <div class="interval-bar" id="intervalBar">
        <span class="label">周期</span>
        <button type="button" class="interval-btn" data-bar="15m">15分</button>
        <button type="button" class="interval-btn" data-bar="2H">2小时</button>
        <button type="button" class="interval-btn active" data-bar="4H">
          4小时
        </button>
        <button type="button" class="interval-btn" data-bar="1D">1天</button>
        <button type="button" class="interval-btn" data-bar="3D">3天</button>
        <button type="button" class="interval-btn" data-bar="1W">1周</button>
      </div>

      <div class="panel is-collapsed" id="addPanel">
        <button
          type="button"
          class="panel-toggle"
          id="addPanelToggle"
          aria-expanded="false"
        >
          <span>添加自选（Solana / Robinhood）</span>
          <span class="chevron" id="addPanelChevron">展开</span>
        </button>
        <div class="panel-body" id="addPanelBody">
          <div class="row">
            <select id="chainSelect" aria-label="链">
              <option value="501">Solana (501)</option>
              <option value="4663">Robinhood (4663)</option>
            </select>
            <input
              id="addressInput"
              type="text"
              placeholder="合约地址"
              autocomplete="off"
            />
            <input
              id="symbolInput"
              type="text"
              placeholder="代号（可选）"
              style="max-width: 140px"
              autocomplete="off"
            />
            <button id="addOneBtn" type="button">添加</button>
          </div>
          <div class="row">
            <textarea
              id="batchInput"
              placeholder="批量粘贴，一行一个&#10;501,合约,SYMBOL&#10;4663,0x...&#10;或仅合约（用上方所选链）"
            ></textarea>
          </div>
          <div class="row">
            <button id="addBatchBtn" type="button">批量添加</button>
            <span class="meta" style="margin: 0"
              >不会自动同步 OKX 站内自选，名单存在本仓库 okx/favorites.json</span
            >
          </div>
        </div>
      </div>

      <div class="chain-tabs" role="tablist" aria-label="链分类">
        <button
          type="button"
          class="chain-tab active"
          role="tab"
          aria-selected="true"
          data-chain="501"
          id="tabSol"
        >
          Solana<span class="tab-count" id="tabSolCount">(0)</span>
        </button>
        <button
          type="button"
          class="chain-tab"
          role="tab"
          aria-selected="false"
          data-chain="4663"
          id="tabRh"
        >
          Robinhood<span class="tab-count" id="tabRhCount">(0)</span>
        </button>
      </div>

      <h2 class="section-title">周期上涨</h2>
      <div id="risingMeta" class="meta"></div>
      <div id="risingGrid" class="kline-grid"></div>

      <h2 class="section-title">周期下跌</h2>
      <div id="fallingMeta" class="meta"></div>
      <div id="fallingGrid" class="kline-grid"></div>
    </div>

    <div id="cardFocusBar" class="card-focus-bar" hidden>
      <button
        type="button"
        class="card-focus-close"
        id="cardFocusClose"
        title="关闭"
        aria-label="关闭操作栏"
      >
        ×
      </button>
      <span class="card-focus-label" id="cardFocusLabel">—</span>
      <a
        class="card-focus-link is-okx"
        id="cardFocusOkx"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        hidden
        >OKX</a
      >
      <a
        class="card-focus-link is-dt"
        id="cardFocusDex"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        hidden
        >Dex</a
      >
      <button type="button" id="cardFocusScore" title="填写 DexTools 评分">
        评分
      </button>
      <button type="button" id="cardFocusCopy">复制</button>
      <button type="button" class="is-danger" id="cardFocusRemove">移出</button>
    </div>

    <div
      id="confirmGate"
      class="confirm-gate"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirmGateText"
    >
      <div class="confirm-panel">
        <p id="confirmGateText">确定移出？</p>
        <div class="confirm-actions">
          <button type="button" id="confirmGateCancel">取消</button>
          <button type="button" class="is-danger" id="confirmGateOk">
            确定移出
          </button>
        </div>
      </div>
    </div>

    <div
      id="busyGate"
      class="busy-gate"
      hidden
      role="status"
      aria-live="polite"
      aria-busy="true"
    >
      <div class="busy-panel">
        <div class="busy-spinner" aria-hidden="true"></div>
        <p id="busyGateText">处理中…</p>
      </div>
    </div>

    <script src="./favorites.js"></script>
    <script>
      "use strict";

      const CONFIG = {
        GITHUB_REPO: "betterma/pages",
        FAVORITES_PATH: "okx/favorites.json",
        CANDLES_PATH: "okx/candles-cache.json",
        BARS: [
          { id: "15m", label: "15分", ms: 15 * 60 * 1000 },
          { id: "2H", label: "2小时", ms: 2 * 60 * 60 * 1000 },
          { id: "4H", label: "4小时", ms: 4 * 60 * 60 * 1000 },
          { id: "1D", label: "1天", ms: 24 * 60 * 60 * 1000 },
          { id: "3D", label: "3天", ms: 3 * 24 * 60 * 60 * 1000 },
          { id: "1W", label: "1周", ms: 7 * 24 * 60 * 60 * 1000 },
        ],
        DEFAULT_BAR: "4H",
      };

      let items = [];
      let candleCache = new Map();
      const CHAIN_TABS = ["501", "4663"];
      let chainFilter = (() => {
        const saved = localStorage.getItem("okxChainTab");
        return CHAIN_TABS.includes(saved) ? saved : "501";
      })();
      let activeBar =
        localStorage.getItem("okxKlineBar") || CONFIG.DEFAULT_BAR;
      let loading = false;
      let saving = false;
      let busyDepth = 0;
      let klineAbort = null;
      let focusCardKey = null;

      function barMeta(barId) {
        return (
          CONFIG.BARS.find((item) => item.id === barId) ||
          CONFIG.BARS.find((item) => item.id === CONFIG.DEFAULT_BAR)
        );
      }

      function setStatus(ok, text) {
        document.getElementById("statusDot").className =
          `dot ${ok ? "online" : "offline"}`;
        document.getElementById("statusText").textContent = text;
      }

      function setPageBusy(on, label) {
        const gate = document.getElementById("busyGate");
        const textEl = document.getElementById("busyGateText");
        const refreshBtn = document.getElementById("refreshBtn");
        const addOneBtn = document.getElementById("addOneBtn");
        const addBatchBtn = document.getElementById("addBatchBtn");
        if (on) {
          busyDepth += 1;
          if (textEl && label) textEl.textContent = String(label);
          if (gate) {
            gate.hidden = false;
            gate.setAttribute("aria-busy", "true");
          }
          document.body.classList.add("is-page-busy");
        } else {
          busyDepth = Math.max(0, busyDepth - 1);
          if (busyDepth === 0) {
            if (gate) {
              gate.hidden = true;
              gate.setAttribute("aria-busy", "false");
            }
            document.body.classList.remove("is-page-busy");
            if (textEl) textEl.textContent = "处理中…";
          }
        }
        const blocked = busyDepth > 0 || loading || saving;
        if (refreshBtn) refreshBtn.disabled = blocked;
        if (addOneBtn) addOneBtn.disabled = blocked;
        if (addBatchBtn) addBatchBtn.disabled = blocked;
      }

      async function withPageBusy(label, fn) {
        setPageBusy(true, label || "处理中…");
        try {
          return await fn();
        } finally {
          setPageBusy(false);
        }
      }

      function showToast(message) {
        const existing = document.querySelector(".toast");
        if (existing) existing.remove();
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1600);
      }

      function formatPercent(value) {
        return Number.isFinite(value)
          ? `${value > 0 ? "+" : ""}${value.toFixed(2)}%`
          : "--";
      }

      function formatPrice(value) {
        if (!Number.isFinite(value)) return "--";
        const abs = Math.abs(value);
        if (abs >= 1000) {
          return value.toLocaleString("en-US", {
            maximumFractionDigits: 2,
          });
        }
        if (abs >= 1) return value.toFixed(4);
        if (abs >= 0.01) return value.toFixed(5);
        if (abs >= 0.0001) return value.toFixed(6);
        if (abs >= 1e-8) return value.toFixed(8);
        return value.toExponential(2);
      }

      function formatMarketCap(value) {
        if (!Number.isFinite(value) || value <= 0) return "--";
        if (value >= 1e9) return `$${(value / 1e9).toFixed(2)}B`;
        if (value >= 1e6) return `$${(value / 1e6).toFixed(2)}M`;
        if (value >= 1e3) return `$${(value / 1e3).toFixed(1)}K`;
        return `$${Math.round(value)}`;
      }

      function safeLogoUrl(url) {
        const text = String(url || "").trim();
        if (!text) return "";
        try {
          const parsed = new URL(text);
          if (parsed.protocol === "https:" || parsed.protocol === "http:") {
            return parsed.href;
          }
        } catch (_) {}
        return "";
      }

      function hydrateCandle(candle) {
        if (Array.isArray(candle) && candle.length >= 5) {
          return {
            time: Number(candle[0]) || 0,
            open: Number(candle[1]),
            high: Number(candle[2]),
            low: Number(candle[3]),
            close: Number(candle[4]),
            volume: Number(candle[5]) || 0,
          };
        }
        if (
          candle &&
          typeof candle === "object" &&
          Number.isFinite(Number(candle.close))
        ) {
          return candle;
        }
        return null;
      }

      function hydrateCandleList(list) {
        return (Array.isArray(list) ? list : [])
          .map(hydrateCandle)
          .filter((item) => item && Number.isFinite(item.close));
      }

      function hydrateTokenRow(row) {
        if (!row || typeof row !== "object") return row;
        const byBar = {};
        const src =
          row.candlesByBar && typeof row.candlesByBar === "object"
            ? row.candlesByBar
            : {};
        Object.keys(src).forEach((bar) => {
          byBar[bar] = hydrateCandleList(src[bar]);
        });
        if (
          !Object.keys(byBar).length &&
          Array.isArray(row.candles) &&
          row.candles.length
        ) {
          byBar["4H"] = hydrateCandleList(row.candles);
        }
        return { ...row, candlesByBar: byBar };
      }

      /** 现价优先用更短周期最新收盘，图表周期仍按 activeBar */
      function latestPrice(row) {
        if (!row) return null;
        const prefer = ["15m", "2H", "4H", "1D", "3D", "1W"];
        if (row.candlesByBar && typeof row.candlesByBar === "object") {
          for (const bar of prefer) {
            const candles = row.candlesByBar[bar];
            if (!Array.isArray(candles) || !candles.length) continue;
            const close = Number(candles[candles.length - 1].close);
            if (Number.isFinite(close)) return close;
          }
        }
        const fallback = candlesForToken(row);
        if (fallback.length) {
          const close = Number(fallback[fallback.length - 1].close);
          if (Number.isFinite(close)) return close;
        }
        return null;
      }

      function tokenId(item) {
        return OkxFavorites.tokenKey(
          item.chainIndex,
          item.tokenContractAddress,
        );
      }

      function chainCode(chainIndex) {
        return (OkxFavorites.CHAINS[chainIndex] || {}).code || chainIndex;

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (error) {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }
        showToast("已复制");
      }

      function windowChangeFromCandles(candles) {
        if (!Array.isArray(candles) || !candles.length) return null;
        const meta = barMeta(activeBar);
        const windowMs = meta.ms;
        const now = Date.now();
        const windowStart = Math.floor(now / windowMs) * windowMs;
        const inWindow = candles.filter(
          (candle) =>
            Number.isFinite(candle.time) && candle.time >= windowStart,
        );
        const series = inWindow.length
          ? inWindow
          : [candles[candles.length - 1]];
        const open = series[0].open;
        const close = series[series.length - 1].close;
        if (!Number.isFinite(open) || !Number.isFinite(close) || open === 0) {
          return null;
        }
        return ((close - open) / open) * 100;
      }

      function drawKline(canvas, candles) {
        const rect = canvas.getBoundingClientRect();
        const width = Math.max(1, Math.floor(rect.width));
        const height = Math.max(1, Math.floor(rect.height));
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        if (!candles.length) return;

        const pad = { top: 6, right: 4, bottom: 6, left: 4 };
        const chartW = width - pad.left - pad.right;
        const chartH = height - pad.top - pad.bottom;
        const highs = candles.map((item) => item.high);
        const lows = candles.map((item) => item.low);
        const max = Math.max(...highs);
        const min = Math.min(...lows);
        const range = max - min || max * 0.01 || 1;
        const slot = chartW / candles.length;
        const bodyW = Math.max(1, slot * 0.62);
        const yOf = (price) => pad.top + ((max - price) / range) * chartH;

        candles.forEach((candle, index) => {
          const x = pad.left + slot * index + slot / 2;
          const up = candle.close >= candle.open;
          ctx.strokeStyle = up ? "#718b88" : "#8d7771";
          ctx.fillStyle = up ? "#718b88" : "#8d7771";
          ctx.beginPath();
          ctx.moveTo(x, yOf(candle.high));
          ctx.lineTo(x, yOf(candle.low));
          ctx.stroke();
          const y1 = yOf(candle.open);
          const y2 = yOf(candle.close);
          const bodyH = Math.max(1, Math.abs(y2 - y1));
          ctx.fillRect(x - bodyW / 2, Math.min(y1, y2), bodyW, bodyH);
        });
      }

      async function loadCandlesCache(signal) {
        try {
          const file = await OkxFavorites.fetchJsonFile({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.CANDLES_PATH,
          });
          if (signal && signal.aborted) {
            throw new DOMException("Aborted", "AbortError");
          }
          if (file && file.data && file.data.updatedAt) {
            return parseCandlesPayload(file.data, "github");
          }
        } catch (error) {
          if (error && error.name === "AbortError") throw error;
          console.warn("GitHub candles-cache failed", error);
        }

        // 本地占位仅作开发回退
        try {
          const response = await fetch(`./candles-cache.json?t=${Date.now()}`, {
            signal,
            cache: "no-store",
          });
          if (response.ok) {
            const data = await response.json();
            if (data && data.updatedAt) {
              return parseCandlesPayload(data, "local");
            }
          }
        } catch (error) {
          if (error && error.name === "AbortError") throw error;
        }

        throw new Error(
          "读不到 GitHub K 线缓存。请确认定时函数已写入 okx/candles-cache.json",
        );
      }

      function parseCandlesPayload(data, source) {
        const tokens =
          data && data.tokens && typeof data.tokens === "object"
            ? data.tokens
            : {};
        const map = new Map();
        Object.keys(tokens).forEach((key) => {
          map.set(key, hydrateTokenRow(tokens[key]));
        });
        return {
          map,
          source,
          updatedAt: Number(data.updatedAt) || null,
          okCount: Number(data.okCount) || 0,
          failCount: Number(data.failCount) || 0,
          quotaExhausted: Boolean(data.quotaExhausted),
        };
      }

      function splitByWindow(list) {
        const rising = [];
        const falling = [];
        list.forEach((item) => {
          const key = tokenId(item);
          const row = candleCache.get(key);
          const candles = candlesForToken(row);
          const change =
            row && (row.ok || candles.length)
              ? windowChangeFromCandles(candles)
              : null;
          const packed = { item, change, key };
          if (Number.isFinite(change) && change > 0) rising.push(packed);
          else falling.push(packed);
        });
        rising.sort((a, b) => (b.change || 0) - (a.change || 0));
        falling.sort((a, b) => (a.change || 0) - (b.change || 0));
        return { rising, falling };
      }

      function buildCardHtml(packed) {
        const { item, change } = packed;
        const cacheRow = candleCache.get(packed.key);
        let label =
          item.symbol ||
          OkxFavorites.shortLabel(item.tokenContractAddress);
        if (
          OkxFavorites.isPlaceholderSymbol(
            label,
            item.tokenContractAddress,
          ) &&
          cacheRow &&
          cacheRow.symbol &&
          !OkxFavorites.isPlaceholderSymbol(
            cacheRow.symbol,
            item.tokenContractAddress,
          )
        ) {
          label = cacheRow.symbol;
        }
        const chain = chainCode(item.chainIndex);
        const changeText = formatPercent(change);
        const changeClass =
          change > 0 ? "up" : change < 0 ? "price-down" : "neutral";
        const barLabel = barMeta(activeBar).label;
        const price = latestPrice(cacheRow);
        const priceText = formatPrice(price);
        const mcap = cacheRow ? Number(cacheRow.marketCap) : NaN;
        const mcapText = formatMarketCap(mcap);
        const logoUrl = safeLogoUrl(cacheRow && cacheRow.tokenLogoUrl);
        const logoAttr = logoUrl
          ? logoUrl.replace(/&/g, "&amp;").replace(/"/g, "&quot;")
          : "";
        const logoHtml = logoAttr
          ? `<img class="token-logo" src="${logoAttr}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`
          : "";
        const focused =
          focusCardKey && focusCardKey === packed.key ? " is-focus" : "";
        const score = OkxFavorites.normalizeDextScore(item.dextScore);
        const hasScore = score != null;
        const scoreClass =
          !hasScore
            ? ""
            : score >= 80
              ? "is-high"
              : score >= 50
                ? "is-mid"
                : "is-low";
        const scoreHtml = hasScore
          ? `<button type="button" class="dext-score ${scoreClass}" data-score-edit title="DexTools 评分 ${score}（点击修改）">评分 <span class="dext-score-val">${score}</span></button>`
          : "";
        return [
          `<div class="kline-card${focused}" data-key="${packed.key}" data-chain="${item.chainIndex}" data-address="${item.tokenContractAddress}">`,
          `<div class="kline-card-head">`,
          `<div class="kline-card-title">`,
          `<span class="symbol-left">${logoHtml}<button type="button" class="symbol-copy" data-copy="${item.tokenContractAddress}" title="点击复制合约">${label}<span class="chain-tag">${chain}</span></button></span>`,
          `<button type="button" class="remove-card-btn" title="移出自选" aria-label="移出自选">⊖</button>`,
          `</div>`,
          `<div class="kline-card-meta">`,
          `<span class="price" title="最新价（USD）">$${priceText}</span>`,
          `<span class="mcap" title="市值（USD）">市值 ${mcapText}</span>`,
          `<span data-kline-status class="change-line ${changeClass}">${changeText} · ${barLabel}</span>`,
          scoreHtml,
          `</div>`,
          `</div>`,
          `<canvas></canvas>`,
          `</div>`,
        ].join("");
      }

      async function editTokenScore(chainIndex, address) {
        if (saving || loading || busyDepth > 0) return false;
        const key = OkxFavorites.tokenKey(chainIndex, address);
        const hit = (items || []).find(
          (item) =>
            OkxFavorites.tokenKey(item.chainIndex, item.tokenContractAddress) ===
            key,
        );
        const label =
          (hit && hit.symbol) ||
          OkxFavorites.shortLabel(address) ||
          String(address || "").slice(0, 8);
        const current =
          hit && hit.dextScore != null ? String(hit.dextScore) : "";
        const input = window.prompt(
          `${label} · DexTools 评分（0–99，留空清除）`,
          current,
        );
        if (input == null) return false;
        const text = String(input).trim();
        let nextScore = null;
        if (text) {
          nextScore = OkxFavorites.normalizeDextScore(text);
          if (nextScore == null) {
            showToast("请输入 0–99 的整数");
            return false;
          }
        }
        if (
          (hit && hit.dextScore == null && nextScore == null) ||
          (hit && hit.dextScore === nextScore)
        ) {
          return false;
        }
        const next = OkxFavorites.setItemScore(
          items,
          chainIndex,
          address,
          nextScore,
        );
        await persist(
          next,
          nextScore != null
            ? `OKX score ${label} ${nextScore}`
            : `Clear OKX score ${label}`,
          nextScore != null ? "保存评分…" : "清除评分…",
        );
        showToast(
          nextScore != null
            ? `${label} 评分 ${nextScore}`
            : `${label} 已清除评分`,
        );
        return true;
      }

      function bindCardInteractions(root) {
        root.querySelectorAll(".symbol-copy").forEach((btn) => {
          btn.addEventListener("click", (event) => {
            event.stopPropagation();
            copyText(btn.dataset.copy);
          });
        });
        root.querySelectorAll("[data-score-edit]").forEach((btn) => {
          btn.addEventListener("click", async (event) => {
            event.stopPropagation();
            const card = btn.closest(".kline-card");
            if (!card) return;
            await editTokenScore(card.dataset.chain, card.dataset.address);
          });
        });
        root.querySelectorAll(".remove-card-btn").forEach((btn) => {
          btn.addEventListener("click", async (event) => {
            event.stopPropagation();
            const card = btn.closest(".kline-card");
            if (!card) return;
            clearCardFocus();
            await removeToken(card.dataset.chain, card.dataset.address);
          });
        });
        root.querySelectorAll(".kline-card").forEach((card) => {
          card.addEventListener("click", (event) => {
            if (
              event.target.closest(
                ".symbol-copy, .remove-card-btn, [data-score-edit], a, button",
              )
            ) {
              return;
            }
            toggleCardFocus(card);
          });
        });
      }

      async function fillGrid(grid, packedList, emptyText) {
        grid.innerHTML = packedList.length
          ? packedList.map(buildCardHtml).join("")
          : `<div class="empty">${emptyText}</div>`;
        bindCardInteractions(grid);
        packedList.forEach((packed) => {
          const card = grid.querySelector(
            `.kline-card[data-key="${CSS.escape(packed.key)}"]`,
          );
          if (!card) return;
          const canvas = card.querySelector("canvas");
          const row = candleCache.get(packed.key);
          const candles = candlesForToken(row);
          if (!row || (!row.ok && !candles.length) || !candles.length) {
            const status = card.querySelector("[data-kline-status]");
            const rawErr =
              (row && row.errors && row.errors[activeBar]) ||
              (row && row.error) ||
              "";
            const rateLimited = /429|Too Many Requests|50011/i.test(rawErr);
            if (status) {
              status.textContent = rateLimited
                ? "接口限流"
                : row && row.error
                  ? "加载失败"
                  : rawErr
                    ? "周期无数据"
                    : "--";
              status.className = "price-down";
            }
            if (canvas) {
              canvas.replaceWith(
                Object.assign(document.createElement("div"), {
                  className: "empty",
                  textContent: rateLimited
                    ? "OKX 限流，等下一轮定时"
                    : rawErr || `无 ${barMeta(activeBar).label} K线`,
                }),
              );
            }
            return;
          }
          drawKline(canvas, candles);
        });
      }

      async function renderAll() {
        syncChainTabs();
        const list = filteredItems();
        const { rising, falling } = splitByWindow(list);
        const barLabel = barMeta(activeBar).label;
        const chainLabel = chainCode(chainFilter);
        document.getElementById("risingMeta").textContent = rising.length
          ? `${chainLabel} 上涨 ${rising.length} · 周期 ${barLabel}`
          : `当前没有 ${chainLabel} ${barLabel} 上涨的自选`;
        document.getElementById("fallingMeta").textContent = falling.length
          ? `${chainLabel} 下跌/持平 ${falling.length} · 周期 ${barLabel}`
          : `当前没有 ${chainLabel} ${barLabel} 下跌的自选`;
        await fillGrid(
          document.getElementById("risingGrid"),
          rising,
          "暂无上涨",
        );
        await fillGrid(
          document.getElementById("fallingGrid"),
          falling,
          "暂无下跌",
        );
        if (focusCardKey) {
          const card = document.querySelector(
            `.kline-card[data-key="${CSS.escape(focusCardKey)}"]`,
          );
          if (card) showFocusBarForCard(card);
          else clearCardFocus();
        }
      }

      async function loadAndRender(options) {
        if (loading) return;
        loading = true;
        const opts = options || {};
        const ownBusy = !opts.quiet;
        const busyLabel = opts.busyLabel || "加载中…";
        if (ownBusy) {
          setPageBusy(true, busyLabel);
        } else {
          // Parent (persist) already holds the overlay — only refresh the label.
          const textEl = document.getElementById("busyGateText");
          if (textEl) textEl.textContent = busyLabel;
        }
        try {
          setStatus(true, "读取自选…");
          const state = await OkxFavorites.loadFavorites({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.FAVORITES_PATH,
          });
          items = state.items;
          if (klineAbort) klineAbort.abort();
          klineAbort = new AbortController();

          if (!items.length) {
            candleCache = new Map();
            await renderAll();
            setStatus(true, "自选为空 · 先添加合约");
            return;
          }

          setStatus(true, `读取定时缓存（${items.length} 自选）…`);
          const cache = await loadCandlesCache(klineAbort.signal);
          candleCache = cache.map;
          await renderAll();
          const ageMin = cache.updatedAt
            ? Math.max(0, Math.round((Date.now() - cache.updatedAt) / 60000))
            : null;
          const missing = items.filter((item) => {
            const row = candleCache.get(tokenId(item));
            const candles = candlesForToken(row);
            return !candles.length;
          }).length;
          const ageText =
            ageMin == null ? "缓存时间未知" : `缓存约 ${ageMin} 分钟前`;
          const barLabel = barMeta(activeBar).label;
          const quotaText = cache.quotaExhausted
            ? " · OKX 月额度用尽，K 线暂用旧缓存"
            : "";
          setStatus(
            true,
            missing
              ? `${ageText} · ${barLabel} · ${items.length - missing} 有K线 / ${missing} 待刷新${quotaText}`
              : `${ageText} · ${barLabel} · ${items.length} 个自选${quotaText}`,
          );
          if (!cache.updatedAt && !cache.map.size) {
            setStatus(
              false,
              "GitHub K 线缓存为空 · 请先让定时函数写入 okx/candles-cache.json",
            );
          }
        } catch (error) {
          if (error.name === "AbortError") return;
          console.error(error);
          setStatus(false, error.message || "加载失败");
          await renderAll();
        } finally {
          loading = false;
          if (ownBusy) setPageBusy(false);
        }
      }

      async function persist(nextItems, message, busyLabel) {
        if (saving || loading) return;
        saving = true;
        setPageBusy(true, busyLabel || "保存中…");
        try {
          await OkxFavorites.saveFavorites(nextItems, {
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.FAVORITES_PATH,
            message,
          });
          items = OkxFavorites.normalizeList(nextItems);
          showToast("自选已保存");
          await loadAndRender({ quiet: true, busyLabel: "刷新列表…" });
        } catch (error) {
          console.error(error);
          setStatus(false, error.message || "保存失败");
          showToast(error.message || "保存失败");
        } finally {
          saving = false;
          setPageBusy(false);
        }
      }

      async function addOne() {
        if (saving || loading || busyDepth > 0) return;
        const chainIndex = document.getElementById("chainSelect").value;
        const address = document.getElementById("addressInput").value;
        const symbol = document.getElementById("symbolInput").value;
        const result = OkxFavorites.addItems(
          items,
          [{ chainIndex, tokenContractAddress: address, symbol }],
          "manual",
        );
        if (!result.added.length) {
          showToast("已在自选中或地址无效");
          return;
        }
        document.getElementById("addressInput").value = "";
        document.getElementById("symbolInput").value = "";
        await persist(result.items, "Add OKX watch token", "添加自选…");
      }

      async function addBatch() {
        if (saving || loading || busyDepth > 0) return;
        const defaultChain = document.getElementById("chainSelect").value;
        const text = document.getElementById("batchInput").value;
        const parsed = OkxFavorites.parseBatchText(text, defaultChain);
        if (parsed.errors.length) {
          showToast(parsed.errors[0]);
        }
        if (!parsed.items.length) {
          showToast("没有可添加的行");
          return;
        }
        const result = OkxFavorites.addItems(items, parsed.items, "batch");
        if (!result.added.length) {
          showToast("全部已在自选中");
          return;
        }
        document.getElementById("batchInput").value = "";
        await persist(
          result.items,
          `Add ${result.added.length} OKX watch tokens`,
          `批量添加 ${result.added.length}…`,
        );
      }

      function askConfirm(message) {
        const gate = document.getElementById("confirmGate");
        const textEl = document.getElementById("confirmGateText");
        const okBtn = document.getElementById("confirmGateOk");
        const cancelBtn = document.getElementById("confirmGateCancel");
        if (!gate || !textEl || !okBtn || !cancelBtn) {
          return Promise.resolve(window.confirm(String(message || "确定？")));
        }
        textEl.textContent = String(message || "确定？");
        gate.hidden = false;
        return new Promise((resolve) => {
          const finish = (ok) => {
            gate.hidden = true;
            okBtn.removeEventListener("click", onOk);
            cancelBtn.removeEventListener("click", onCancel);
            gate.removeEventListener("click", onBackdrop);
            document.removeEventListener("keydown", onKey);
            resolve(!!ok);
          };
          const onOk = () => finish(true);
          const onCancel = () => finish(false);
          const onBackdrop = (event) => {
            if (event.target === gate) finish(false);
          };
          const onKey = (event) => {
            if (event.key === "Escape") finish(false);
          };
          okBtn.addEventListener("click", onOk);
          cancelBtn.addEventListener("click", onCancel);
          gate.addEventListener("click", onBackdrop);
          document.addEventListener("keydown", onKey);
          okBtn.focus();
        });
      }

      async function removeToken(chainIndex, address) {
        const key = OkxFavorites.tokenKey(chainIndex, address);
        const hit = (items || []).find(
          (item) =>
            OkxFavorites.tokenKey(item.chainIndex, item.tokenContractAddress) ===
            key,
        );
        const label =
          (hit && hit.symbol) ||
          OkxFavorites.shortLabel(address) ||
          String(address || "").slice(0, 8);
        if (saving || loading || busyDepth > 0) return false;
        const ok = await askConfirm(`确定移出自选「${label}」？`);
        if (!ok) return false;
        const next = OkxFavorites.removeItem(items, chainIndex, address);
        await persist(next, "Remove OKX watch token", `移出 ${label}…`);
        return true;
      }

      function syncAddPanel(open) {
        const panel = document.getElementById("addPanel");
        const toggle = document.getElementById("addPanelToggle");
        const chevron = document.getElementById("addPanelChevron");
        panel.classList.toggle("is-collapsed", !open);
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        chevron.textContent = open ? "收起" : "展开";
        localStorage.setItem("okxAddPanelOpen", open ? "1" : "0");
      }

      document.getElementById("addPanelToggle").addEventListener("click", () => {
        const open = document
          .getElementById("addPanel")
          .classList.contains("is-collapsed");
        syncAddPanel(open);
      });

      document.getElementById("addOneBtn").addEventListener("click", addOne);
      document.getElementById("addBatchBtn").addEventListener("click", addBatch);
      document.getElementById("refreshBtn").addEventListener("click", loadAndRender);

      document.querySelectorAll(".interval-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeBar = btn.dataset.bar;
          localStorage.setItem("okxKlineBar", activeBar);
          syncIntervalButtons();
          renderAll();
        });
      });

      document.querySelectorAll(".chain-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          clearCardFocus();
          setChainTab(btn.dataset.chain);
        });
      });

      const cardFocusClose = document.getElementById("cardFocusClose");
      if (cardFocusClose) {
        cardFocusClose.addEventListener("click", () => clearCardFocus());
      }
      const cardFocusScore = document.getElementById("cardFocusScore");
      if (cardFocusScore) {
        cardFocusScore.addEventListener("click", async () => {
          const card = document.querySelector(".kline-card.is-focus");
          if (!card) return;
          await editTokenScore(card.dataset.chain, card.dataset.address);
        });
      }
      const cardFocusCopy = document.getElementById("cardFocusCopy");
      if (cardFocusCopy) {
        cardFocusCopy.addEventListener("click", () => {
          const card = document.querySelector(".kline-card.is-focus");
          if (!card) return;
          copyText(card.dataset.address);
        });
      }
      const cardFocusRemove = document.getElementById("cardFocusRemove");
      if (cardFocusRemove) {
        cardFocusRemove.addEventListener("click", async () => {
          const card = document.querySelector(".kline-card.is-focus");
          if (!card) return;
          const chain = card.dataset.chain;
          const address = card.dataset.address;
          clearCardFocus();
          await removeToken(chain, address);
        });
      }
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") clearCardFocus();
      });

      if (!CONFIG.BARS.some((item) => item.id === activeBar)) {
        activeBar = CONFIG.DEFAULT_BAR;
      }
      syncAddPanel(localStorage.getItem("okxAddPanelOpen") === "1");
      syncIntervalButtons();
      syncChainTabs();
      loadAndRender();
    </script>
  </body>
</html>
