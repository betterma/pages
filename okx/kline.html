<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OKX 自选 K 线</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f5f3;
        color: #28323a;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .page {
        width: min(1400px, calc(100% - 20px));
        margin: 12px auto 24px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      h2.section-title {
        margin: 16px 0 6px;
        font-size: 15px;
      }
      .nav-link {
        color: #5a6a68;
        font-size: 13px;
        text-decoration: none;
      }
      .nav-link:hover {
        text-decoration: underline;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      button,
      select,
      input,
      textarea {
        border: 1px solid #c9d0d0;
        background: #fbfcfa;
        color: #28323a;
        padding: 8px 13px;
        border-radius: 6px;
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #eef1ee;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #78817f;
        margin-bottom: 10px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #a39d95;
        flex-shrink: 0;
      }
      .dot.online {
        background: #718b88;
        box-shadow: 0 0 8px rgba(113, 139, 136, 0.35);
      }
      .dot.offline {
        background: #8d7771;
      }
      .meta {
        color: #78817f;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .hint {
        color: #9aa3a0;
        font-size: 12px;
        margin: -2px 0 10px;
      }
      .panel {
        margin-bottom: 14px;
        padding: 0;
        background: #fbfcfa;
        border: 1px solid #d8ddda;
        border-radius: 8px;
        overflow: hidden;
      }
      .panel-toggle {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        border: 0;
        border-radius: 0;
        background: transparent;
        text-align: left;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .panel-toggle:hover {
        background: #eef1ee;
      }
      .panel-toggle .chevron {
        color: #78817f;
        font-weight: 400;
        font-size: 12px;
      }
      .panel-body {
        padding: 0 12px 12px;
      }
      .panel.is-collapsed .panel-body {
        display: none;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
        align-items: center;
      }
      .row input[type="text"] {
        min-width: 180px;
        flex: 1;
      }
      .row textarea {
        width: 100%;
        min-height: 88px;
        resize: vertical;
      }
      .chain-tag {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 5px;
        border-radius: 4px;
        background: #e8ece9;
        color: #5a6a68;
        font-size: 11px;
        font-weight: 600;
      }
      .filters {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .filters button.active {
        background: #dfe8e4;
        border-color: #9eb0aa;
      }
      .interval-bar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 0 0 10px;
        align-items: center;
      }
      .interval-bar .label {
        font-size: 12px;
        color: #78817f;
        margin-right: 2px;
      }
      .interval-bar button.active {
        background: #dfe8e4;
        border-color: #9eb0aa;
        font-weight: 600;
      }
      .kline-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 10px;
      }
      .kline-card {
        position: relative;
        min-width: 0;
        padding: 8px 10px 10px;
        background: #fbfcfa;
        border: 1px solid #d8ddda;
        border-radius: 8px;
      }
      .remove-card-btn {
        border: 0;
        background: transparent;
        color: #9aa3a0;
        padding: 0 2px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        flex-shrink: 0;
      }
      .remove-card-btn:hover {
        color: #8d7771;
      }
      .kline-card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .kline-card-head .symbol-copy {
        color: inherit;
        font-weight: 700;
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
        font: inherit;
        text-align: left;
      }
      .kline-card-head .meta-right {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        min-width: 0;
      }
      .kline-card-head .price {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: #28323a;
        font-size: 12px;
      }
      .kline-card-head .change-line {
        font-size: 12px;
        white-space: nowrap;
      }
      .kline-card canvas {
        display: block;
        width: 100%;
        height: 150px;
        pointer-events: none;
      }
      .up {
        color: #4f7a6e;
      }
      .price-down {
        color: #8d7771;
      }
      .neutral {
        color: #78817f;
      }
      .empty {
        padding: 28px 12px;
        text-align: center;
        color: #78817f;
        font-size: 13px;
        background: #fbfcfa;
        border: 1px dashed #d8ddda;
        border-radius: 8px;
      }
      .kline-card .empty {
        padding: 40px 8px;
        border: none;
        background: transparent;
        font-size: 12px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: rgba(40, 50, 58, 0.92);
        color: #f7f8f6;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        z-index: 20;
        pointer-events: none;
      }
      @media (max-width: 768px) {
        .page {
          width: calc(100% - 12px);
          margin: 8px auto 16px;
        }
        h1 {
          font-size: 17px;
        }
        .kline-grid {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
        .kline-card canvas {
          height: 120px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div class="topbar-left">
          <h1>OKX 自选 K 线</h1>
          <a class="nav-link" href="../kline.html">币安观察池</a>
          <a
            class="nav-link"
            href="https://web3.okx.com/zh-hans/tracker"
            target="_blank"
            rel="noopener noreferrer"
            >OKX Tracker</a
          >
        </div>
        <div class="topbar-actions">
          <button id="refreshBtn" type="button">刷新</button>
        </div>
      </div>

      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">等待启动...</span>
      </div>
      <p class="hint">
        自选 = 全部卡片 · 按当前周期涨跌分区 · 点名称复制合约 · ⊖ 移出自选 ·
        K 线由定时云函数写入缓存（新加币 / 新周期需等下一轮）
      </p>

      <div class="interval-bar" id="intervalBar">
        <span class="label">周期</span>
        <button type="button" class="interval-btn" data-bar="15m">15分</button>
        <button type="button" class="interval-btn" data-bar="2H">2小时</button>
        <button type="button" class="interval-btn active" data-bar="4H">
          4小时
        </button>
        <button type="button" class="interval-btn" data-bar="1D">1天</button>
        <button type="button" class="interval-btn" data-bar="3D">3天</button>
        <button type="button" class="interval-btn" data-bar="1W">1周</button>
      </div>

      <div class="panel is-collapsed" id="addPanel">
        <button
          type="button"
          class="panel-toggle"
          id="addPanelToggle"
          aria-expanded="false"
        >
          <span>添加自选（Solana / Robinhood）</span>
          <span class="chevron" id="addPanelChevron">展开</span>
        </button>
        <div class="panel-body" id="addPanelBody">
          <div class="row">
            <select id="chainSelect" aria-label="链">
              <option value="501">Solana (501)</option>
              <option value="4663">Robinhood (4663)</option>
            </select>
            <input
              id="addressInput"
              type="text"
              placeholder="合约地址"
              autocomplete="off"
            />
            <input
              id="symbolInput"
              type="text"
              placeholder="代号（可选）"
              style="max-width: 140px"
              autocomplete="off"
            />
            <button id="addOneBtn" type="button">添加</button>
          </div>
          <div class="row">
            <textarea
              id="batchInput"
              placeholder="批量粘贴，一行一个&#10;501,合约,SYMBOL&#10;4663,0x...&#10;或仅合约（用上方所选链）"
            ></textarea>
          </div>
          <div class="row">
            <button id="addBatchBtn" type="button">批量添加</button>
            <span class="meta" style="margin: 0"
              >不会自动同步 OKX 站内自选，名单存在本仓库 okx/favorites.json</span
            >
          </div>
        </div>
      </div>

      <div class="filters">
        <button type="button" class="filter-btn active" data-filter="all">
          全部
        </button>
        <button type="button" class="filter-btn" data-filter="501">
          Solana
        </button>
        <button type="button" class="filter-btn" data-filter="4663">
          Robinhood
        </button>
      </div>

      <h2 class="section-title">周期上涨</h2>
      <div id="risingMeta" class="meta"></div>
      <div id="risingGrid" class="kline-grid"></div>

      <h2 class="section-title">周期下跌</h2>
      <div id="fallingMeta" class="meta"></div>
      <div id="fallingGrid" class="kline-grid"></div>
    </div>

    <script src="./favorites.js"></script>
    <script>
      "use strict";

      const CONFIG = {
        GITHUB_REPO: "betterma/pages",
        FAVORITES_PATH: "okx/favorites.json",
        OBS_BASE: "https://mpctest.obs.cn-north-4.myhuaweicloud.com",
        CANDLES_OBS_KEY: "okx-candles-cache.json",
        CANDLES_URLS: [
          "https://mpctest.obs.cn-north-4.myhuaweicloud.com/okx-candles-cache.json",
          "./candles-cache.json",
        ],
        BARS: [
          { id: "15m", label: "15分", ms: 15 * 60 * 1000 },
          { id: "2H", label: "2小时", ms: 2 * 60 * 60 * 1000 },
          { id: "4H", label: "4小时", ms: 4 * 60 * 60 * 1000 },
          { id: "1D", label: "1天", ms: 24 * 60 * 60 * 1000 },
          { id: "3D", label: "3天", ms: 3 * 24 * 60 * 60 * 1000 },
          { id: "1W", label: "1周", ms: 7 * 24 * 60 * 60 * 1000 },
        ],
        DEFAULT_BAR: "4H",
      };

      let items = [];
      let candleCache = new Map();
      let chainFilter = "all";
      let activeBar =
        localStorage.getItem("okxKlineBar") || CONFIG.DEFAULT_BAR;
      let loading = false;
      let saving = false;
      let klineAbort = null;

      function barMeta(barId) {
        return (
          CONFIG.BARS.find((item) => item.id === barId) ||
          CONFIG.BARS.find((item) => item.id === CONFIG.DEFAULT_BAR)
        );
      }

      function setStatus(ok, text) {
        document.getElementById("statusDot").className =
          `dot ${ok ? "online" : "offline"}`;
        document.getElementById("statusText").textContent = text;
      }

      function showToast(message) {
        const existing = document.querySelector(".toast");
        if (existing) existing.remove();
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1600);
      }

      function formatPercent(value) {
        return Number.isFinite(value)
          ? `${value > 0 ? "+" : ""}${value.toFixed(2)}%`
          : "--";
      }

      function formatPrice(value) {
        if (!Number.isFinite(value)) return "--";
        const abs = Math.abs(value);
        if (abs >= 1000) {
          return value.toLocaleString("en-US", {
            maximumFractionDigits: 2,
          });
        }
        if (abs >= 1) return value.toFixed(4);
        if (abs >= 0.01) return value.toFixed(5);
        if (abs >= 0.0001) return value.toFixed(6);
        if (abs >= 1e-8) return value.toFixed(8);
        return value.toExponential(2);
      }

      /** 现价优先用更短周期最新收盘，图表周期仍按 activeBar */
      function latestPrice(row) {
        if (!row) return null;
        const prefer = ["15m", "2H", "4H", "1D", "3D", "1W"];
        if (row.candlesByBar && typeof row.candlesByBar === "object") {
          for (const bar of prefer) {
            const candles = row.candlesByBar[bar];
            if (!Array.isArray(candles) || !candles.length) continue;
            const close = Number(candles[candles.length - 1].close);
            if (Number.isFinite(close)) return close;
          }
        }
        const fallback = candlesForToken(row);
        if (fallback.length) {
          const close = Number(fallback[fallback.length - 1].close);
          if (Number.isFinite(close)) return close;
        }
        return null;
      }

      function tokenId(item) {
        return OkxFavorites.tokenKey(
          item.chainIndex,
          item.tokenContractAddress,
        );
      }

      function chainCode(chainIndex) {
        return (OkxFavorites.CHAINS[chainIndex] || {}).code || chainIndex;
      }

      function syncIntervalButtons() {
        document.querySelectorAll(".interval-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.bar === activeBar);
        });
      }

      function candlesForToken(row) {
        if (!row) return [];
        if (row.candlesByBar && Array.isArray(row.candlesByBar[activeBar])) {
          return row.candlesByBar[activeBar];
        }
        // 旧缓存：只有单一 candles 数组，仅在 4H 时可用
        if (
          activeBar === "4H" &&
          Array.isArray(row.candles) &&
          row.candles.length
        ) {
          return row.candles;
        }
        return [];
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (error) {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }
        showToast("已复制");
      }

      function windowChangeFromCandles(candles) {
        if (!Array.isArray(candles) || !candles.length) return null;
        const meta = barMeta(activeBar);
        const windowMs = meta.ms;
        const now = Date.now();
        const windowStart = Math.floor(now / windowMs) * windowMs;
        const inWindow = candles.filter(
          (candle) =>
            Number.isFinite(candle.time) && candle.time >= windowStart,
        );
        const series = inWindow.length
          ? inWindow
          : [candles[candles.length - 1]];
        const open = series[0].open;
        const close = series[series.length - 1].close;
        if (!Number.isFinite(open) || !Number.isFinite(close) || open === 0) {
          return null;
        }
        return ((close - open) / open) * 100;
      }

      function drawKline(canvas, candles) {
        const rect = canvas.getBoundingClientRect();
        const width = Math.max(1, Math.floor(rect.width));
        const height = Math.max(1, Math.floor(rect.height));
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        if (!candles.length) return;

        const pad = { top: 6, right: 4, bottom: 6, left: 4 };
        const chartW = width - pad.left - pad.right;
        const chartH = height - pad.top - pad.bottom;
        const highs = candles.map((item) => item.high);
        const lows = candles.map((item) => item.low);
        const max = Math.max(...highs);
        const min = Math.min(...lows);
        const range = max - min || max * 0.01 || 1;
        const slot = chartW / candles.length;
        const bodyW = Math.max(1, slot * 0.62);
        const yOf = (price) => pad.top + ((max - price) / range) * chartH;

        candles.forEach((candle, index) => {
          const x = pad.left + slot * index + slot / 2;
          const up = candle.close >= candle.open;
          ctx.strokeStyle = up ? "#718b88" : "#8d7771";
          ctx.fillStyle = up ? "#718b88" : "#8d7771";
          ctx.beginPath();
          ctx.moveTo(x, yOf(candle.high));
          ctx.lineTo(x, yOf(candle.low));
          ctx.stroke();
          const y1 = yOf(candle.open);
          const y2 = yOf(candle.close);
          const bodyH = Math.max(1, Math.abs(y2 - y1));
          ctx.fillRect(x - bodyW / 2, Math.min(y1, y2), bodyW, bodyH);
        });
      }

      async function loadCandlesCache(signal) {
        let lastError = null;
        const urls = CONFIG.CANDLES_URLS.filter(
          (base) => !base.startsWith("./") && !base.startsWith("../"),
        );
        // 本地占位只作最后回退，且 updatedAt 为空时不算有效缓存
        const localFallback = CONFIG.CANDLES_URLS.find((base) =>
          base.startsWith("./"),
        );

        for (const base of urls) {
          const url = `${base}${base.includes("?") ? "&" : "?"}t=${Date.now()}`;
          try {
            const response = await fetch(url, { signal, cache: "no-store" });
            if (!response.ok) {
              lastError = new Error(`OBS ${response.status}（${base}）`);
              continue;
            }
            const data = await response.json();
            return parseCandlesPayload(data, base);
          } catch (error) {
            if (error.name === "AbortError") throw error;
            lastError = error;
          }
        }

        if (localFallback) {
          try {
            const response = await fetch(
              `${localFallback}?t=${Date.now()}`,
              { signal, cache: "no-store" },
            );
            if (response.ok) {
              const data = await response.json();
              if (data && data.updatedAt) {
                return parseCandlesPayload(data, localFallback);
              }
            }
          } catch (error) {
            if (error.name === "AbortError") throw error;
          }
        }

        throw (
          lastError ||
          new Error(
            "读不到 OBS K 线缓存。请确认定时函数已成功写入，且对象为公共读",
          )
        );
      }

      function parseCandlesPayload(data, source) {
        const tokens =
          data && data.tokens && typeof data.tokens === "object"
            ? data.tokens
            : {};
        const map = new Map();
        Object.keys(tokens).forEach((key) => {
          map.set(key, tokens[key]);
        });
        return {
          map,
          source,
          updatedAt: Number(data.updatedAt) || null,
          okCount: Number(data.okCount) || 0,
          failCount: Number(data.failCount) || 0,
        };
      }

      function filteredItems() {
        if (chainFilter === "all") return items.slice();
        return items.filter((item) => item.chainIndex === chainFilter);
      }

      function splitByWindow(list) {
        const rising = [];
        const falling = [];
        list.forEach((item) => {
          const key = tokenId(item);
          const row = candleCache.get(key);
          const candles = candlesForToken(row);
          const change =
            row && (row.ok || candles.length)
              ? windowChangeFromCandles(candles)
              : null;
          const packed = { item, change, key };
          if (Number.isFinite(change) && change > 0) rising.push(packed);
          else falling.push(packed);
        });
        rising.sort((a, b) => (b.change || 0) - (a.change || 0));
        falling.sort((a, b) => (a.change || 0) - (b.change || 0));
        return { rising, falling };
      }

      function buildCardHtml(packed) {
        const { item, change } = packed;
        const cacheRow = candleCache.get(packed.key);
        let label =
          item.symbol ||
          OkxFavorites.shortLabel(item.tokenContractAddress);
        if (
          OkxFavorites.isPlaceholderSymbol(
            label,
            item.tokenContractAddress,
          ) &&
          cacheRow &&
          cacheRow.symbol &&
          !OkxFavorites.isPlaceholderSymbol(
            cacheRow.symbol,
            item.tokenContractAddress,
          )
        ) {
          label = cacheRow.symbol;
        }
        const chain = chainCode(item.chainIndex);
        const changeText = formatPercent(change);
        const changeClass =
          change > 0 ? "up" : change < 0 ? "price-down" : "neutral";
        const barLabel = barMeta(activeBar).label;
        const price = latestPrice(cacheRow);
        const priceText = formatPrice(price);
        return `<div class="kline-card" data-key="${packed.key}" data-chain="${item.chainIndex}" data-address="${item.tokenContractAddress}"><div class="kline-card-head"><button type="button" class="symbol-copy" data-copy="${item.tokenContractAddress}" title="点击复制合约">${label}<span class="chain-tag">${chain}</span></button><span style="display:inline-flex;align-items:center;gap:6px"><span class="meta-right"><span class="price" title="最新价（USD）">$${priceText}</span><span data-kline-status class="change-line ${changeClass}">${changeText} · ${barLabel}</span></span><button type="button" class="remove-card-btn" title="移出自选" aria-label="移出自选">⊖</button></span></div><canvas></canvas></div>`;
      }

      function bindCardInteractions(root) {
        root.querySelectorAll(".symbol-copy").forEach((btn) => {
          btn.addEventListener("click", (event) => {
            event.stopPropagation();
            copyText(btn.dataset.copy);
          });
        });
        root.querySelectorAll(".remove-card-btn").forEach((btn) => {
          btn.addEventListener("click", async (event) => {
            event.stopPropagation();
            const card = btn.closest(".kline-card");
            if (!card) return;
            await removeToken(card.dataset.chain, card.dataset.address);
          });
        });
      }

      async function fillGrid(grid, packedList, emptyText) {
        grid.innerHTML = packedList.length
          ? packedList.map(buildCardHtml).join("")
          : `<div class="empty">${emptyText}</div>`;
        bindCardInteractions(grid);
        packedList.forEach((packed) => {
          const card = grid.querySelector(
            `.kline-card[data-key="${CSS.escape(packed.key)}"]`,
          );
          if (!card) return;
          const canvas = card.querySelector("canvas");
          const row = candleCache.get(packed.key);
          const candles = candlesForToken(row);
          if (!row || (!row.ok && !candles.length) || !candles.length) {
            const status = card.querySelector("[data-kline-status]");
            const rawErr =
              (row && row.errors && row.errors[activeBar]) ||
              (row && row.error) ||
              "";
            const rateLimited = /429|Too Many Requests|50011/i.test(rawErr);
            if (status) {
              status.textContent = rateLimited
                ? "接口限流"
                : row && row.error
                  ? "加载失败"
                  : rawErr
                    ? "周期无数据"
                    : "--";
              status.className = "price-down";
            }
            if (canvas) {
              canvas.replaceWith(
                Object.assign(document.createElement("div"), {
                  className: "empty",
                  textContent: rateLimited
                    ? "OKX 限流，等下一轮定时"
                    : rawErr || `无 ${barMeta(activeBar).label} K线`,
                }),
              );
            }
            return;
          }
          drawKline(canvas, candles);
        });
      }

      async function renderAll() {
        const list = filteredItems();
        const { rising, falling } = splitByWindow(list);
        const barLabel = barMeta(activeBar).label;
        document.getElementById("risingMeta").textContent = rising.length
          ? `上涨 ${rising.length} · 周期 ${barLabel}`
          : `当前没有 ${barLabel} 上涨的自选`;
        document.getElementById("fallingMeta").textContent = falling.length
          ? `下跌/持平 ${falling.length} · 周期 ${barLabel}`
          : `当前没有 ${barLabel} 下跌的自选`;
        await fillGrid(
          document.getElementById("risingGrid"),
          rising,
          "暂无上涨",
        );
        await fillGrid(
          document.getElementById("fallingGrid"),
          falling,
          "暂无下跌",
        );
      }

      async function loadAndRender() {
        if (loading) return;
        loading = true;
        document.getElementById("refreshBtn").disabled = true;
        try {
          setStatus(true, "读取自选…");
          const state = await OkxFavorites.loadFavorites({
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.FAVORITES_PATH,
          });
          items = state.items;
          if (klineAbort) klineAbort.abort();
          klineAbort = new AbortController();

          if (!items.length) {
            candleCache = new Map();
            await renderAll();
            setStatus(true, "自选为空 · 先添加合约");
            return;
          }

          setStatus(true, `读取定时缓存（${items.length} 自选）…`);
          const cache = await loadCandlesCache(klineAbort.signal);
          candleCache = cache.map;
          await renderAll();
          const ageMin = cache.updatedAt
            ? Math.max(0, Math.round((Date.now() - cache.updatedAt) / 60000))
            : null;
          const missing = items.filter((item) => {
            const row = candleCache.get(tokenId(item));
            const candles = candlesForToken(row);
            return !candles.length;
          }).length;
          const ageText =
            ageMin == null ? "缓存时间未知" : `缓存约 ${ageMin} 分钟前`;
          const barLabel = barMeta(activeBar).label;
          setStatus(
            true,
            missing
              ? `${ageText} · ${barLabel} · ${items.length - missing} 有K线 / ${missing} 待刷新`
              : `${ageText} · ${barLabel} · ${items.length} 个自选`,
          );
          if (!cache.updatedAt && !cache.map.size) {
            setStatus(
              false,
              "OBS 缓存为空或不可读 · 请先让定时函数成功跑完并确认公共读",
            );
          }
        } catch (error) {
          if (error.name === "AbortError") return;
          console.error(error);
          setStatus(false, error.message || "加载失败");
          await renderAll();
        } finally {
          loading = false;
          document.getElementById("refreshBtn").disabled = false;
        }
      }

      async function persist(nextItems, message) {
        if (saving) return;
        saving = true;
        try {
          await OkxFavorites.saveFavorites(nextItems, {
            repo: CONFIG.GITHUB_REPO,
            path: CONFIG.FAVORITES_PATH,
            message,
          });
          items = OkxFavorites.normalizeList(nextItems);
          showToast("自选已保存");
          await loadAndRender();
        } catch (error) {
          console.error(error);
          setStatus(false, error.message || "保存失败");
          showToast(error.message || "保存失败");
        } finally {
          saving = false;
        }
      }

      async function addOne() {
        const chainIndex = document.getElementById("chainSelect").value;
        const address = document.getElementById("addressInput").value;
        const symbol = document.getElementById("symbolInput").value;
        const result = OkxFavorites.addItems(
          items,
          [{ chainIndex, tokenContractAddress: address, symbol }],
          "manual",
        );
        if (!result.added.length) {
          showToast("已在自选中或地址无效");
          return;
        }
        document.getElementById("addressInput").value = "";
        document.getElementById("symbolInput").value = "";
        await persist(result.items, "Add OKX watch token");
      }

      async function addBatch() {
        const defaultChain = document.getElementById("chainSelect").value;
        const text = document.getElementById("batchInput").value;
        const parsed = OkxFavorites.parseBatchText(text, defaultChain);
        if (parsed.errors.length) {
          showToast(parsed.errors[0]);
        }
        if (!parsed.items.length) {
          showToast("没有可添加的行");
          return;
        }
        const result = OkxFavorites.addItems(items, parsed.items, "batch");
        if (!result.added.length) {
          showToast("全部已在自选中");
          return;
        }
        document.getElementById("batchInput").value = "";
        await persist(
          result.items,
          `Add ${result.added.length} OKX watch tokens`,
        );
      }

      async function removeToken(chainIndex, address) {
        const next = OkxFavorites.removeItem(items, chainIndex, address);
        await persist(next, "Remove OKX watch token");
      }

      function syncAddPanel(open) {
        const panel = document.getElementById("addPanel");
        const toggle = document.getElementById("addPanelToggle");
        const chevron = document.getElementById("addPanelChevron");
        panel.classList.toggle("is-collapsed", !open);
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        chevron.textContent = open ? "收起" : "展开";
        localStorage.setItem("okxAddPanelOpen", open ? "1" : "0");
      }

      document.getElementById("addPanelToggle").addEventListener("click", () => {
        const open = document
          .getElementById("addPanel")
          .classList.contains("is-collapsed");
        syncAddPanel(open);
      });

      document.getElementById("addOneBtn").addEventListener("click", addOne);
      document.getElementById("addBatchBtn").addEventListener("click", addBatch);
      document.getElementById("refreshBtn").addEventListener("click", loadAndRender);

      document.querySelectorAll(".interval-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeBar = btn.dataset.bar;
          localStorage.setItem("okxKlineBar", activeBar);
          syncIntervalButtons();
          renderAll();
        });
      });

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((node) => node.classList.remove("active"));
          btn.classList.add("active");
          chainFilter = btn.dataset.filter;
          renderAll();
        });
      });

      if (!CONFIG.BARS.some((item) => item.id === activeBar)) {
        activeBar = CONFIG.DEFAULT_BAR;
      }
      syncAddPanel(localStorage.getItem("okxAddPanelOpen") === "1");
      syncIntervalButtons();
      loadAndRender();
    </script>
  </body>
</html>
