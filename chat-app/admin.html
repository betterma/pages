<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f5f3" />
    <title>聊天后台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="admin-page" id="gateView">
      <div class="gate">
        <h1>聊天后台</h1>
        <p class="meta" style="color: #78817f; font-size: 13px; margin: 0 0 12px">
          输入口令后可编辑会话与消息（写入 GitHub）
        </p>
        <label for="passInput">口令</label>
        <input id="passInput" type="password" autocomplete="current-password" />
        <div class="admin-row">
          <button type="button" class="primary" id="unlockBtn">进入</button>
          <a href="./chats.html" style="align-self: center; font-size: 13px"
            >打开聊天前端</a
          >
        </div>
        <div class="status-line" id="gateStatus"></div>
      </div>
    </div>

    <div class="admin-page" id="adminView" hidden>
      <div class="admin-card">
        <h2>会话列表</h2>
        <div class="admin-row">
          <button type="button" id="reloadBtn">重新加载</button>
          <button type="button" class="primary" id="saveAllBtn">
            保存到 GitHub
          </button>
          <a href="./chats.html" style="align-self: center; font-size: 13px"
            >预览前端</a
          >
        </div>
        <div class="status-line" id="adminStatus"></div>
        <ul class="admin-list" id="threadAdminList"></ul>
      </div>

      <div class="admin-card">
        <h2 id="threadFormTitle">新建会话</h2>
        <input type="hidden" id="threadId" />
        <label>类型</label>
        <select id="threadType">
          <option value="direct">单聊</option>
          <option value="group">群聊</option>
        </select>
        <label>昵称 / 群名</label>
        <input id="threadTitle" type="text" placeholder="张三 / 项目群" />
        <label>头像 URL（可空，用彩色字）</label>
        <input id="threadAvatar" type="url" placeholder="https://..." />
        <label>置顶 / 免打扰</label>
        <label><input id="threadPinned" type="checkbox" /> 置顶</label>
        <label><input id="threadMuted" type="checkbox" /> 免打扰</label>
        <div id="membersBox">
          <label>成员（「我」会自动保留）</label>
          <ul class="admin-list" id="memberAdminList"></ul>
          <div class="admin-row">
            <input id="newMemberName" type="text" placeholder="新成员姓名" />
            <button type="button" id="addMemberBtn">添加成员</button>
          </div>
        </div>
        <div class="admin-row">
          <button type="button" class="primary" id="upsertThreadBtn">
            写入列表（未落盘）
          </button>
          <button type="button" id="newThreadBtn">清空表单</button>
          <button type="button" class="danger" id="deleteThreadBtn">
            删除会话
          </button>
        </div>
      </div>

      <div class="admin-card">
        <h2>消息 · <span id="msgThreadLabel">未选择</span></h2>
        <ul class="admin-list" id="msgAdminList"></ul>
        <label>发送成员</label>
        <select id="msgRole"></select>
        <label>时间（本地）</label>
        <input id="msgAt" type="datetime-local" />
        <label>正文</label>
        <textarea id="msgText" placeholder="消息内容"></textarea>
        <div class="admin-row">
          <button type="button" class="primary" id="addMsgBtn">追加消息</button>
          <button type="button" id="clearMsgFormBtn">清空</button>
        </div>
      </div>
    </div>

    <script src="./chat-store.js"></script>
    <script src="./app.js"></script>
    <script src="./admin.js"></script>
  </body>
</html>
