<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ededed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>聊天</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="chat-page">
      <header class="top-nav">
        <button
          type="button"
          class="nav-btn"
          id="backBtn"
          aria-label="返回"
        >
          ‹
        </button>
        <h1 id="chatTitle">聊天</h1>
        <button type="button" class="nav-btn" style="visibility: hidden">
          ·
        </button>
      </header>
      <div id="msgScroller" class="msg-scroller"></div>
      <div class="composer">
        <input
          id="composerInput"
          type="text"
          placeholder="演示版不可发送"
          autocomplete="off"
        />
        <button type="button" class="send-btn" id="sendBtn">发送</button>
      </div>
    </div>
    <script src="./chat-store.js"></script>
    <script src="./app.js"></script>
    <script>
      document.getElementById("backBtn").addEventListener("click", () => {
        window.location.href = "./chats.html";
      });
      ChatApp.runChatPage();
    </script>
  </body>
</html>
