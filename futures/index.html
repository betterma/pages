<!DOCTYPE html>
<html lang="zh-CN" data-theme="terminal">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>合约 · 钉子</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("kline-theme-v1");
          if (t === "daylight" || t === "night" || t === "terminal") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root,
      html[data-theme="terminal"] {
        --bg: #111214;
        --grouped: #181a1e;
        --elevated: #22252a;
        --label: #f5f7fa;
        --secondary: #9aa1ac;
        --separator: #30343b;
        --accent: #4c9aff;
        --fill: #2a2e35;
        --up: #3dcf8e;
        --down: #f07178;
      }
      html[data-theme="daylight"] {
        --bg: #f2f3f5;
        --grouped: #ffffff;
        --elevated: #ffffff;
        --label: #17181a;
        --secondary: #6b7280;
        --separator: #e5e7eb;
        --accent: #2563eb;
        --fill: #eef0f3;
        --up: #16a34a;
        --down: #dc2626;
      }
      html[data-theme="night"] {
        --bg: #0b0c0f;
        --grouped: #12141a;
        --elevated: #1a1d24;
        --label: #eef1f6;
        --secondary: #8b93a3;
        --separator: #2a2f3a;
        --accent: #5b9fd4;
        --fill: #232833;
        --up: #3dcf8e;
        --down: #f07178;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--label);
        font-family: "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei",
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      button,
      input,
      a {
        font: inherit;
      }
      /* 全屏钉子壳（合约无行情底页） */
      .fut-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: var(--grouped);
        overflow: hidden;
      }
      .fut-head {
        position: relative;
        flex: 0 0 auto;
        padding: 14px 14px 10px;
        border-bottom: 0.5px solid var(--separator);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .fut-head-title-line {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .fut-head h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }
      .fut-settings-btn {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }
      .fut-settings-btn[aria-expanded="true"],
      .fut-settings-btn:hover {
        background: var(--fill);
        color: var(--label);
      }
      .fut-settings-btn svg {
        width: 18px;
        height: 18px;
      }
      .fut-head-meta {
        margin: 0;
        font-size: 12px;
        color: var(--secondary);
        line-height: 1.4;
      }
      .fut-status {
        font-size: 12px;
        color: var(--secondary);
        font-variant-numeric: tabular-nums;
      }
      .fut-tool-btn {
        border: 0.5px solid var(--separator);
        background: var(--elevated);
        color: var(--label);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }
      .fut-pin-toolbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px 6px;
        border-bottom: 0.5px solid var(--separator);
      }
      .fut-pin-toolbar-left,
      .fut-pin-toolbar-right {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .fut-pin-toolbar button {
        border: 0.5px solid color-mix(in srgb, var(--label) 22%, transparent);
        background: color-mix(in srgb, var(--fill) 55%, transparent);
        color: var(--label);
        height: 26px;
        padding: 0 10px;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .fut-pin-toolbar button.is-active,
      .fut-pin-toolbar button[aria-pressed="true"] {
        border-color: color-mix(in srgb, var(--label) 38%, transparent);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        color: var(--accent);
      }
      .fut-pin-toolbar button:disabled {
        opacity: 0.45;
        cursor: wait;
      }
      .fut-add-form {
        flex: 0 0 auto;
        display: grid;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 0.5px solid var(--separator);
        background: var(--elevated);
      }
      .fut-add-form[hidden] {
        display: none !important;
      }
      .fut-add-form input {
        width: 100%;
        height: 34px;
        border: 0.5px solid var(--separator);
        border-radius: 8px;
        background: var(--bg);
        color: var(--label);
        padding: 0 10px;
      }
      .fut-add-form-row {
        display: flex;
        gap: 8px;
      }
      .fut-add-form-row button {
        border: 0.5px solid var(--separator);
        background: var(--fill);
        color: var(--label);
        height: 30px;
        padding: 0 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }
      .fut-err {
        margin: 0;
        font-size: 12px;
        color: var(--down);
      }
      .fut-err[hidden] {
        display: none !important;
      }

      /* 设置浮窗（对齐钉子：限高可滚） */
      .fut-settings-popover {
        position: absolute;
        top: calc(100% - 2px);
        left: 10px;
        right: 10px;
        z-index: 1000;
        border-radius: 12px;
        border: 0.5px solid var(--separator);
        background: var(--elevated);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
        max-height: min(
          72vh,
          calc(100dvh - env(safe-area-inset-bottom, 0px) - 96px)
        );
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      .fut-settings-popover[hidden] {
        display: none !important;
      }
      .fut-set-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 0.5px solid var(--separator);
      }
      .fut-set-row:last-child {
        border-bottom: 0;
      }
      .fut-set-row > span,
      .fut-set-label span {
        font-size: 13px;
        font-weight: 650;
      }
      .fut-set-label {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .fut-set-label small {
        color: var(--secondary);
        font-size: 11px;
        line-height: 1.35;
      }
      .fut-mode-switch {
        display: inline-flex;
        border: 0.5px solid var(--separator);
        border-radius: 8px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .fut-mode-switch button {
        border: 0;
        background: transparent;
        color: var(--secondary);
        padding: 6px 8px;
        font-size: 11px;
        font-weight: 650;
        cursor: pointer;
      }
      .fut-mode-switch button.is-active {
        background: color-mix(in srgb, var(--accent) 22%, transparent);
        color: var(--label);
      }
      .fut-switch {
        width: 42px;
        height: 24px;
        border-radius: 999px;
        border: 0.5px solid var(--separator);
        background: var(--fill);
        position: relative;
        cursor: pointer;
        flex-shrink: 0;
        padding: 0;
      }
      .fut-switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--secondary);
        transition: transform 0.15s ease;
      }
      .fut-switch[aria-checked="true"]::after {
        transform: translateX(18px);
        background: var(--accent);
      }
      .fut-rank-edit {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .fut-rank-edit input {
        width: 56px;
        height: 28px;
        border: 0.5px solid var(--separator);
        border-radius: 8px;
        background: var(--bg);
        color: var(--label);
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .fut-settings-action {
        border: 0.5px solid var(--separator);
        background: var(--fill);
        color: var(--label);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 650;
        text-decoration: none;
        cursor: pointer;
      }

      /* 分栏 */
      .fut-segments {
        display: flex;
        align-items: stretch;
        gap: 2px;
        padding: 0 6px;
        border-bottom: 0.5px solid var(--separator);
        flex: 0 0 auto;
      }
      .fut-seg-tab {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 8px 2px 10px;
        border: 0;
        background: transparent;
        color: var(--secondary);
        font-size: 13px;
        cursor: pointer;
      }
      .fut-seg-tab.is-active {
        color: var(--label);
        font-weight: 650;
      }
      .fut-seg-tab.is-active::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 3px;
        width: 24px;
        height: 2px;
        border-radius: 2px;
        background: var(--accent);
        transform: translateX(-50%);
      }
      .fut-seg-badge {
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 8px;
        background: #d9534f;
        color: #fff;
        font-size: 10.5px;
        font-weight: 650;
        line-height: 16px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .fut-seg-badge[hidden] {
        display: none !important;
      }
      .fut-seg-host {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        position: relative;
      }
      .fut-seg-panel {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .fut-seg-panel[hidden] {
        display: none !important;
      }
      .fut-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-x: auto;
        overflow-y: scroll;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        padding: 8px 10px 72px;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* 列表表（对齐钉子 nail-prow） */
      .fut-prow-table {
        width: 100%;
        min-width: 320px;
        border-collapse: collapse;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .fut-prow-table thead th {
        color: var(--secondary);
        font-size: 11px;
        font-weight: 600;
        text-align: left;
        padding: 5px 6px;
        border-bottom: 0.5px solid var(--separator);
      }
      .fut-prow-table thead th:nth-child(3) {
        text-align: right;
      }
      .fut-section-row td {
        padding: 0;
      }
      .fut-section-label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin: 6px 0 2px;
        padding: 10px 10px 9px;
        border-radius: 8px;
        border: 0.5px solid var(--separator);
        background: color-mix(in srgb, var(--grouped, var(--bg)) 92%, transparent);
        color: var(--secondary);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .fut-section-label.is-pin {
        border-color: color-mix(in srgb, var(--accent) 42%, var(--separator));
        background: color-mix(
          in srgb,
          var(--accent) 14%,
          var(--grouped, var(--bg))
        );
        color: color-mix(in srgb, var(--accent) 70%, var(--label));
      }
      .fut-section-label.is-always {
        margin-top: 4px;
        padding: 6px 10px;
        border-color: color-mix(in srgb, var(--accent) 28%, transparent);
        background: color-mix(in srgb, var(--elevated, var(--bg)) 42%, transparent);
        color: color-mix(in srgb, var(--accent) 55%, var(--secondary));
        font-size: 10px;
        font-weight: 650;
        cursor: pointer;
        user-select: none;
      }
      .fut-section-label.is-always .fut-sec-caret {
        display: inline-block;
        margin-right: 2px;
        transition: transform 0.15s ease;
      }
      .fut-section-label.is-always.is-collapsed .fut-sec-caret {
        transform: rotate(-90deg);
      }
      .fut-section-label.is-rest {
        border-style: dashed;
      }
      .fut-section-count {
        font-variant-numeric: tabular-nums;
        opacity: 0.85;
      }
      .fut-prow-row td {
        padding: 6px;
        vertical-align: middle;
        border-bottom: 0.5px solid
          color-mix(in srgb, var(--separator) 55%, transparent);
      }
      .fut-prow-row.is-selected,
      .fut-prow-row.is-focus {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }
      .fut-prow-row.is-pool {
        background: color-mix(in srgb, var(--accent, #2f8f6e) 8%, transparent);
      }
      .fut-name-cell {
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .fut-pin-wrap {
        position: relative;
        display: inline-flex;
      }
      .fut-pin {
        border: 0;
        background: var(--fill);
        color: var(--secondary);
        border-radius: 6px;
        min-width: 22px;
        height: 22px;
        padding: 0 5px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }
      .fut-pin.is-on {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 18%, var(--fill));
      }
      .fut-name {
        border: 0;
        background: transparent;
        color: var(--label);
        font-weight: 650;
        padding: 0;
        cursor: pointer;
      }
      .fut-tag {
        margin-left: 4px;
        font-size: 10px;
        color: var(--accent);
        border: 0.5px solid color-mix(in srgb, var(--accent) 45%, transparent);
        border-radius: 999px;
        padding: 0 5px;
      }
      .fut-check {
        width: 16px;
        height: 16px;
        margin: 0 2px 0 0;
      }
      .fut-kline-cell canvas.fut-kline {
        width: 168px;
        height: 62px;
        display: block;
        border-radius: 4px;
        background: color-mix(in srgb, var(--label, #808080) 4%, transparent);
      }
      .fut-prow-table thead th:nth-child(4) {
        text-align: right;
      }
      .fut-prow-ops {
        white-space: nowrap;
        text-align: right;
      }
      .fut-prow-ops button {
        border: none;
        background: var(--fill);
        color: var(--label);
        height: 22px;
        min-width: 22px;
        padding: 0 6px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 650;
        cursor: pointer;
        margin-left: 6px;
      }
      .fut-prow-ops button.fut-del {
        color: var(--down);
        background: color-mix(in srgb, var(--down) 12%, transparent);
      }
      .fut-prow-row.is-focus {
        box-shadow: inset 0 0 0 2px
          color-mix(in srgb, var(--accent) 55%, transparent);
      }
      .fut-chg {
        text-align: right;
        font-weight: 650;
      }
      .fut-chg.is-up,
      .up {
        color: var(--up);
      }
      .fut-chg.is-down,
      .down {
        color: var(--down);
      }
      .fut-sub td {
        padding: 0 6px 8px;
        border-bottom: 0.5px solid
          color-mix(in srgb, var(--separator) 55%, transparent);
        color: var(--secondary);
        font-size: 11px;
      }
      .fut-info {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .fut-ops {
        white-space: nowrap;
      }
      .fut-ops button {
        border: 0.5px solid var(--separator);
        background: var(--elevated);
        color: var(--label);
        border-radius: 7px;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 650;
        cursor: pointer;
      }
      .fut-empty {
        padding: 20px 12px;
        color: var(--secondary);
        font-size: 13px;
      }
      .fut-toolbar-inline {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }

      /* 雷达：对齐钉子页 nail-radar-* */
      .fut-radar-pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100%;
      }
      .fut-radar-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        flex: 0 0 auto;
        padding: 8px 10px;
        border-bottom: 0.5px solid var(--separator);
      }
      .fut-radar-updated {
        flex: 0 0 auto;
        color: var(--secondary);
        font-size: 11px;
        white-space: nowrap;
      }
      .fut-radar-updated.is-stale {
        color: var(--warn, #b07030);
      }
      .fut-radar-toggle {
        flex: 0 0 auto;
        border: 0.5px solid var(--separator);
        border-radius: 999px;
        background: transparent;
        color: var(--secondary);
        font-size: 11px;
        font-weight: 600;
        line-height: 1;
        padding: 4px 8px;
        cursor: pointer;
        white-space: nowrap;
      }
      .fut-radar-toggle.is-active,
      .fut-radar-toggle[aria-pressed="true"] {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        color: var(--accent);
      }
      .fut-radar-refresh {
        flex: 0 0 auto;
        border: none;
        background: none;
        color: var(--accent);
        font-size: 11px;
        font-weight: 650;
        padding: 0;
        cursor: pointer;
      }
      .fut-radar-refresh:hover {
        text-decoration: underline;
      }
      .fut-radar-refresh:disabled {
        opacity: 0.5;
        cursor: default;
        text-decoration: none;
      }
      .fut-radar-wrap {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        padding-bottom: 72px;
      }
      .fut-radar-table {
        width: 100%;
        min-width: 520px;
        border-collapse: collapse;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .fut-radar-table th,
      .fut-radar-table td {
        padding: 7px 8px;
        border-bottom: 0.5px solid var(--separator);
        text-align: left;
        white-space: nowrap;
      }
      .fut-radar-table th {
        color: var(--secondary);
        font-size: 11px;
        font-weight: 650;
        background: transparent;
      }
      .fut-radar-table th:nth-child(1),
      .fut-radar-table td:nth-child(1) {
        width: 52px;
        min-width: 52px;
        max-width: 52px;
        padding-left: 4px;
        padding-right: 2px;
        overflow: hidden;
      }
      .fut-radar-rank-mini {
        display: block;
        font-size: 9.5px;
        line-height: 1.25;
        color: var(--secondary);
        opacity: 0.85;
      }
      .fut-radar-table th:nth-child(2),
      .fut-radar-table td:nth-child(2) {
        width: 182px;
        padding-left: 4px;
        padding-right: 4px;
      }
      .fut-radar-table th:nth-child(3),
      .fut-radar-table td:nth-child(3) {
        text-align: right;
        font-size: 10.5px;
        padding-left: 4px;
        padding-right: 4px;
      }
      .fut-radar-table th:nth-child(4),
      .fut-radar-table td:nth-child(4) {
        text-align: left;
        padding-left: 4px;
        padding-right: 4px;
      }
      .fut-radar-table tr.is-pool {
        background: color-mix(in srgb, var(--accent, #2f8f6e) 8%, transparent);
      }
      .fut-radar-table tr.is-top20 .fut-radar-rank-mini {
        color: var(--warn, #b07030);
        font-weight: 700;
        opacity: 1;
      }
      .fut-radar-symbol {
        border: none;
        background: transparent;
        color: var(--accent);
        padding: 0;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fut-radar-symbol:hover {
        text-decoration: underline;
      }
      .fut-radar-up {
        color: #2f8f6e;
        font-weight: 650;
      }
      .fut-radar-down {
        color: #c04545;
        font-weight: 650;
      }
      .fut-radar-act {
        display: inline-block;
        border: 0.5px solid var(--separator);
        border-radius: 999px;
        background: transparent;
        color: var(--secondary);
        font-size: 10.5px;
        font-weight: 600;
        line-height: 1;
        padding: 4px 7px;
        cursor: pointer;
        white-space: nowrap;
      }
      .fut-radar-act + .fut-radar-act {
        margin-left: 4px;
      }
      .fut-radar-act:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .fut-radar-act.is-danger:hover {
        border-color: #c04545;
        color: #c04545;
      }
      .fut-radar-act.is-fixed {
        border-color: var(--accent);
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      .fut-radar-table tr.is-radar-sep td {
        padding: 8px 8px 6px;
        color: var(--secondary);
        font-size: 11px;
        font-weight: 650;
        background: transparent;
        border-bottom-color: transparent;
      }
      .fut-radar-table tr.is-radar-extra td {
        opacity: 0.92;
      }
      .fut-radar-table tr.is-radar-fixed td {
        background: color-mix(in srgb, var(--accent, #2f8f6e) 18%, transparent);
      }
      .fut-radar-table tr.is-radar-selected td {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }
      .fut-radar-table tr.is-radar-selected {
        box-shadow: inset 0 0 0 2px
          color-mix(in srgb, var(--accent) 55%, transparent);
      }
      .fut-radar-kline {
        display: block;
        width: 168px;
        height: 62px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--label, #808080) 4%, transparent);
        pointer-events: none;
      }
      .fut-radar-empty {
        padding: 18px 12px;
        color: var(--secondary);
        font-size: 12px;
        text-align: center;
      }

      /* ↑/顶 菜单 */
      .fut-pin-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        z-index: 20;
        min-width: 132px;
        padding: 4px;
        border-radius: 10px;
        background: var(--bg);
        border: 1px solid var(--separator);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
        display: grid;
        gap: 2px;
      }
      .fut-pin-menu button {
        border: none;
        background: transparent;
        text-align: left;
        padding: 8px 10px;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 650;
        color: var(--label);
        cursor: pointer;
        white-space: nowrap;
      }
      .fut-pin-menu button:hover {
        background: var(--fill);
      }
      .fut-pin-menu button.is-danger {
        color: var(--down);
      }

      /* 多选底栏 */
      .fut-batch-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        background: color-mix(in srgb, var(--elevated) 92%, transparent);
        border-top: 0.5px solid var(--separator);
        backdrop-filter: blur(8px);
      }
      .fut-batch-bar[hidden] {
        display: none !important;
      }
      .fut-batch-bar .count {
        font-size: 12px;
        color: var(--secondary);
        margin-right: auto;
        font-variant-numeric: tabular-nums;
      }
      .fut-batch-bar button {
        border: 0.5px solid var(--separator);
        background: var(--fill);
        color: var(--label);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }
      .fut-batch-bar button:disabled {
        opacity: 0.45;
      }

      /* 长按浮层（无买卖） */
      .fut-row-float-mask {
        position: fixed;
        inset: 0;
        z-index: 132;
        background: color-mix(in srgb, var(--bg) 28%, transparent);
      }
      .fut-row-float-mask[hidden],
      .fut-row-float-menu[hidden] {
        display: none !important;
      }
      .fut-row-float-menu {
        position: fixed;
        z-index: 133;
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
        max-width: min(92vw, 360px);
        padding: 8px 10px;
        border-radius: 12px;
        border: 0.5px solid var(--separator);
        background: color-mix(in srgb, var(--elevated) 94%, transparent);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
      }
      .fut-row-float-menu button {
        border: none;
        background: transparent;
        color: var(--label);
        height: 32px;
        padding: 0 10px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
      }
      .fut-row-float-menu button:hover {
        background: color-mix(in srgb, var(--fill) 55%, transparent);
      }
      .fut-row-float-menu .close {
        color: var(--secondary);
        min-width: 30px;
      }

      .fut-focus-bar {
        position: fixed;
        left: 50%;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        z-index: 90;
        display: flex;
        align-items: center;
        gap: 8px;
        width: min(420px, calc(100vw - 16px));
        min-height: 52px;
        padding: 8px 28px 8px 12px;
        border-radius: 12px;
        border: 0.5px solid var(--separator);
        background: color-mix(in srgb, var(--elevated) 92%, transparent);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(16px);
      }
      .fut-focus-bar[hidden] {
        display: none !important;
      }
      .fut-focus-close {
        position: absolute;
        top: 4px;
        right: 4px;
        border: none;
        background: transparent;
        color: var(--secondary);
        width: 22px;
        height: 22px;
        cursor: pointer;
        font-size: 16px;
      }
      .fut-focus-bar button:not(.fut-focus-close) {
        border: 0.5px solid var(--separator);
        background: var(--fill);
        color: var(--label);
        height: 30px;
        padding: 0 10px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }
      .fut-focus-bar button:disabled {
        opacity: 0.5;
      }
      .fut-zoom-overlay {
        position: fixed;
        inset: 0;
        z-index: 160;
        background: color-mix(in srgb, var(--bg) 55%, transparent);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .fut-zoom-overlay[hidden] {
        display: none !important;
      }
      .fut-zoom-card {
        width: min(420px, 100%);
        background: var(--elevated);
        border: 0.5px solid var(--separator);
        border-radius: 12px;
        padding: 12px;
      }
      .fut-zoom-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .fut-zoom-head button {
        border: 0.5px solid var(--separator);
        background: var(--fill);
        color: var(--label);
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      #futZoomCanvas {
        width: 100%;
        height: auto;
        display: block;
        background: color-mix(in srgb, var(--label) 4%, transparent);
        border-radius: 6px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: var(--elevated);
        border: 0.5px solid var(--separator);
        color: var(--label);
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        z-index: 200;
        max-width: 90vw;
      }
      #toast[hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="fut-shell" id="futShell">
      <header class="fut-head">
        <div class="fut-head-title-line">
          <h1>合约</h1>
          <button
            type="button"
            class="fut-settings-btn"
            id="futSettingsBtn"
            aria-haspopup="dialog"
            aria-controls="futSettingsPopover"
            aria-expanded="false"
            title="筛选、排序与定时刷新"
            aria-label="设置"
          >
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 3.5v2.2M12 18.3v2.2M4.9 6.4l1.6 1.6M17.5 16l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.9 17.6l1.6-1.6M17.5 8l1.6-1.6"
              />
            </svg>
          </button>
        </div>
        <p class="fut-head-meta" id="futMeta">加载中…</p>
        <p class="fut-err" id="errBox" hidden></p>
        <span class="fut-status" id="statusMeta" hidden>尚未加载</span>

        <div
          class="fut-settings-popover"
          id="futSettingsPopover"
          hidden
          role="dialog"
          aria-label="合约设置"
        >
          <div class="fut-set-row">
            <span>排序</span>
            <div class="fut-mode-switch" id="futSortSwitch" role="group">
              <button type="button" data-fut-sort="order">默认</button>
              <button type="button" data-fut-sort="noteGain" class="is-active">
                便签涨幅
              </button>
              <button type="button" data-fut-sort="change24h">24h</button>
            </div>
          </div>
          <div class="fut-set-row">
            <span>只看置顶区</span>
            <button
              type="button"
              class="fut-switch"
              id="futPinnedOnlySwitch"
              role="switch"
              aria-checked="false"
              aria-label="只看置顶区"
            ></button>
          </div>
          <div class="fut-set-row">
            <div class="fut-set-label">
              <span>定时刷新</span>
              <small>约 15 秒刷现价与 K</small>
            </div>
            <button
              type="button"
              class="fut-switch"
              id="futAutoRefreshSwitch"
              role="switch"
              aria-checked="false"
              aria-label="定时刷新"
            ></button>
          </div>
          <div class="fut-set-row">
            <div class="fut-set-label">
              <span>观察池前 N</span>
              <small>写 fut-prefs · 云约 5 分钟跟上</small>
            </div>
            <div class="fut-rank-edit">
              <input
                type="number"
                id="futWatchPoolRankInput"
                min="10"
                max="100"
                step="1"
                value="35"
                inputmode="numeric"
              />
              <button
                type="button"
                class="fut-settings-action"
                id="futWatchPoolRankSave"
              >
                保存
              </button>
            </div>
          </div>
          <div class="fut-set-row">
            <div class="fut-set-label">
              <span>一键平简</span>
              <small>常看+置顶写现价便签</small>
            </div>
            <button
              type="button"
              class="fut-settings-action"
              id="futFlatSimplifyBtn"
            >
              执行
            </button>
          </div>
          <div class="fut-set-row">
            <div class="fut-set-label">
              <span>现货钉子</span>
              <small>共用 GitHub 密码入口</small>
            </div>
            <a class="fut-settings-action" href="../kline.html">打开</a>
          </div>
        </div>
      </header>

      <nav class="fut-segments" role="tablist" aria-label="合约分栏">
        <button
          type="button"
          class="fut-seg-tab is-active"
          data-fut-tab="pin"
          role="tab"
          aria-selected="true"
        >
          置顶
        </button>
        <button
          type="button"
          class="fut-seg-tab"
          data-fut-tab="auto"
          role="tab"
          aria-selected="false"
        >
          自动盯<span
            class="fut-seg-badge"
            id="futAutoPinBadge"
            hidden
          ></span>
        </button>
        <button
          type="button"
          class="fut-seg-tab"
          data-fut-tab="radar"
          role="tab"
          aria-selected="false"
        >
          雷达
        </button>
      </nav>

      <div class="fut-seg-host">
        <section
          class="fut-seg-panel"
          data-fut-pane="pin"
          id="panePin"
          role="tabpanel"
        >
          <div class="fut-pin-toolbar" id="futPinToolbar">
            <div class="fut-pin-toolbar-left">
              <button type="button" id="futAddBtn" title="钉一个新币种">新增</button>
              <button
                type="button"
                id="futSelectBtn"
                title="多选后批量置顶 / 写便签 / 删除"
                aria-pressed="false"
              >
                多选
              </button>
            </div>
            <div class="fut-pin-toolbar-right">
              <button type="button" id="refreshBtn" title="重新拉取列表与 K 线">
                刷新
              </button>
            </div>
          </div>
          <form class="fut-add-form" id="futAddForm" hidden>
            <input
              id="futAddSymbol"
              type="text"
              autocomplete="off"
              placeholder="名称，如 BTC"
              aria-label="币名"
            />
            <input
              id="futAddNote"
              type="text"
              autocomplete="off"
              placeholder="备注（可选，默认现价）"
              aria-label="便签"
            />
            <div class="fut-add-form-row">
              <button type="submit">保存</button>
              <button type="button" id="futAddCancel">取消</button>
            </div>
          </form>
          <div class="fut-list" id="pinList"></div>
        </section>
        <section
          class="fut-seg-panel"
          data-fut-pane="auto"
          id="paneAuto"
          role="tabpanel"
          hidden
        >
          <div class="fut-list" id="autoList"></div>
        </section>
        <section
          class="fut-seg-panel fut-radar-pane"
          data-fut-pane="radar"
          id="paneRadar"
          role="tabpanel"
          hidden
        >
          <div class="fut-radar-head" id="radarHead">
            <span id="radarUpdated" class="fut-radar-updated"></span>
            <button
              type="button"
              id="radarMainstreamBtn"
              class="fut-radar-toggle"
              title="合约暂无主流放大"
            >
              主流
            </button>
            <button
              type="button"
              id="radarAllKlineBtn"
              class="fut-radar-toggle"
              aria-pressed="false"
              title="当前：只画置顶币，点一下全部币都画"
            >
              全部K线
            </button>
            <button
              type="button"
              id="radarGroupBtn"
              class="fut-radar-toggle"
              aria-pressed="false"
              title="当前：已点「归集」的行留在原排名；点一下把它们提到列表顶部"
            >
              归集
            </button>
            <button type="button" id="radarRefreshBtn" class="fut-radar-refresh">
              刷新
            </button>
          </div>
          <div class="fut-radar-wrap" id="radarTableWrap">
            <table class="fut-radar-table">
              <thead>
                <tr>
                  <th>币</th>
                  <th>K线</th>
                  <th>24h</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="radarBody"></tbody>
            </table>
            <div class="fut-radar-empty" id="radarEmpty" hidden>
              雷达暂无数据
            </div>
          </div>
        </section>
      </div>
    </div>

    <div
      id="futFocusBar"
      class="fut-focus-bar"
      hidden
      role="toolbar"
      aria-label="行操作"
    >
      <button type="button" class="fut-focus-close" id="futFocusClose" title="关闭">
        ×
      </button>
      <strong id="futFocusSym">—</strong>
      <button type="button" id="futFocusPinBtn" data-fut-focus="pin">置顶</button>
      <button type="button" id="futFocusRefreshBtn" data-fut-focus="refresh">
        刷新
      </button>
    </div>

    <div id="futZoomOverlay" class="fut-zoom-overlay" hidden>
      <div class="fut-zoom-card">
        <div class="fut-zoom-head">
          <strong id="futZoomTitle">K 线</strong>
          <button type="button" id="futZoomClose">关闭</button>
        </div>
        <canvas id="futZoomCanvas" width="360" height="200"></canvas>
      </div>
    </div>

    <div class="fut-batch-bar" id="futBatchBar" hidden>
      <span class="count">已选 <strong id="futBatchCount">0</strong></span>
      <button type="button" id="futBatchPinBtn">置顶</button>
      <button type="button" id="futBatchUnpinBtn">取消置顶</button>
      <button type="button" id="futBatchNoteBtn">便签现价</button>
      <button type="button" id="futBatchDeleteBtn">删除</button>
      <button type="button" id="futBatchExitBtn">完成</button>
    </div>

    <div id="futRowFloatMask" class="fut-row-float-mask" hidden></div>
    <div
      id="futRowFloatMenu"
      class="fut-row-float-menu"
      hidden
      role="menu"
      aria-label="行操作"
    >
      <button type="button" class="close" data-fut-row-close>×</button>
      <button type="button" data-fut-float="note">便签</button>
      <button type="button" data-fut-float="pin">置顶</button>
      <button type="button" data-fut-float="always">常看</button>
      <button type="button" data-fut-float="unpin" class="is-danger">
        取消置顶
      </button>
    </div>

    <div id="toast" hidden></div>

    <script src="../github-token-vault.js"></script>
    <script src="./fut-config.js"></script>
    <script src="./fut-store.js"></script>
    <script src="./fut-app.js"></script>
  </body>
</html>
