<!DOCTYPE html>
<html lang="zh-CN" data-theme="terminal">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>合约 · 钉子</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("kline-theme-v1");
          if (t === "daylight" || t === "night" || t === "terminal") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root,
      html[data-theme="terminal"] {
        --bg: #111214;
        --grouped: #181a1e;
        --elevated: #22252a;
        --label: #f5f7fa;
        --secondary: #9aa1ac;
        --separator: #30343b;
        --accent: #4c9aff;
        --fill: #2a2e35;
        --up: #3dcf8e;
        --down: #f07178;
      }
      html[data-theme="daylight"] {
        --bg: #f2f3f5;
        --grouped: #ffffff;
        --elevated: #ffffff;
        --label: #17181a;
        --secondary: #6b7280;
        --separator: #e5e7eb;
        --accent: #2563eb;
        --fill: #eef0f3;
        --up: #16a34a;
        --down: #dc2626;
      }
      html[data-theme="night"] {
        --bg: #0b0c0f;
        --grouped: #12141a;
        --elevated: #1a1d24;
        --label: #eef1f6;
        --secondary: #8b93a3;
        --separator: #2a2f3a;
        --accent: #5b9fd4;
        --fill: #232833;
        --up: #3dcf8e;
        --down: #f07178;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--label);
        font-family: "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei",
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      button,
      input,
      a {
        font: inherit;
      }
      /* 全屏钉子壳（合约无行情底页） */
      .fut-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: var(--grouped);
        overflow: hidden;
      }
      .fut-head {
        position: relative;
        flex: 0 0 auto;
        padding: 14px 14px 10px;
        border-bottom: 0.5px solid var(--separator);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .fut-head-title-line {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .fut-head h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }
      .fut-settings-btn {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }
      .fut-settings-btn[aria-expanded="true"],
      .fut-settings-btn:hover {
        background: var(--fill);
        color: var(--label);
      }
      .fut-settings-btn svg {
        width: 18px;
        height: 18px;
      }
      .fut-head-meta {
        margin: 0;
        font-size: 12px;
        color: var(--secondary);
        line-height: 1.4;
      }
      .fut-status {
        font-size: 12px;
        color: var(--secondary);
        font-variant-numeric: tabular-nums;
      }
      .fut-tool-btn {
        border: 0.5px solid var(--separator);
        background: var(--elevated);
        color: var(--label);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }
      .fut-pin-toolbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px 6px;
        border-bottom: 0.5px solid var(--separator);
      }
      .fut-pin-toolbar-left,
      .fut-pin-toolbar-right {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .fut-pin-toolbar button {
        border: 0.5px solid color-mix(in srgb, var(--label) 22%, transparent);
        background: color-mix(in srgb, var(--fill) 55%, transparent);
        color: var(--label);
        height: 26px;
        padding: 0 10px;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .fut-pin-toolbar button.is-active,
      .fut-pin-toolbar button[aria-pressed="true"] {
        border-color: color-mix(in srgb, var(--label) 38%, transparent);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        color: var(--accent);
      }
      .fut-pin-toolbar button:disabled {
        opacity: 0.45;
        cursor: wait;
      }
      .fut-add-form {
        flex: 0 0 auto;
        display: grid;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 0.5px solid var(--separator);
        background: var(--elevated);
      }
      .fut-add-form[hidden] {
        display: none !important;
      }
      .fut-add-form input {
        width: 100%;
        height: 34px;
        border: 0.5px solid var(--separator);
        border-radius: 8px;
        background: var(--bg);
        color: var(--label);
        padding: 0 10px;
      }
      .fut-add-form-row {
        display: flex;
        gap: 8px;
      }
      .fut-add-form-row button {
        border: 0.5px solid var(--separator);
        background: var(--fill);
        color: var(--label);
        height: 30px;
        padding: 0 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }
      .fut-err {
        margin: 0;
        font-size: 12px;
        color: var(--down);
      }
      .fut-err[hidden] {
        display: none !important;
      }

      /* 设置浮窗（对齐钉子：限高可滚） */
      .fut-settings-popover {
        position: absolute;
        top: calc(100% - 2px);
        left: 10px;
        right: 10px;
        z-index: 1000;
        border-radius: 12px;
        border: 0.5px solid var(--separator);
        background: var(--elevated);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
        max-height: min(
          72vh,
          calc(100dvh - env(safe-area-inset-bottom, 0px) - 96px)
        );
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      .fut-settings-popover[hidden] {
        display: none !important;
      }
      .fut-set-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 0.5px solid var(--separator);
      }
      .fut-set-row:last-child {
        border-bottom: 0;
      }
      .fut-set-row > span,
      .fut-set-label span {
        font-size: 13px;
        font-weight: 650;
      }
      .fut-set-label {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .fut-set-label small {
        color: var(--secondary);
        font-size: 11px;
        line-height: 1.35;
      }
      .fut-mode-switch {
        display: inline-flex;
        border: 0.5px solid var(--separator);
        border-radius: 8px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .fut-mode-switch button {
        border: 0;
        background: transparent;
        color: var(--secondary);
        padding: 6px 8px;
        font-size: 11px;
        font-weight: 650;
        cursor: pointer;
      }
      .fut-mode-switch button.is-active {
        background: color-mix(in srgb, var(--accent) 22%, transparent);
        color: var(--label);
      }
      .fut-switch {
        width: 42px;
        height: 24px;
        border-radius: 999px;
        border: 0.5px solid var(--separator);
        background: var(--fill);
        position: relative;
        cursor: pointer;
        flex-shrink: 0;
        padding: 0;
      }
      .fut-switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--secondary);
        transition: transform 0.15s ease;
      }
      .fut-switch[aria-checked="true"]::after {
        transform: translateX(18px);
        background: var(--accent);
      }
      .fut-rank-edit {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .fut-rank-edit input {
        width: 56px;
        height: 28px;
        border: 0.5px solid var(--separator);
        border-radius: 8px;
        background: var(--bg);
        color: var(--label);
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .fut-settings-action {
        border: 0.5px solid var(--separator);
        background: var(--fill);
        color: var(--label);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 650;
        text-decoration: none;
        cursor: pointer;
      }

      /* 分栏 */
      .fut-segments {
        display: flex;
        align-items: stretch;
        gap: 2px;
        padding: 0 6px;
        border-bottom: 0.5px solid var(--separator);
        flex: 0 0 auto;
      }
      .fut-seg-tab {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 8px 2px 10px;
        border: 0;
        background: transparent;
        color: var(--secondary);
        font-size: 13px;
        cursor: pointer;
      }
      .fut-seg-tab.is-active {
        color: var(--label);
        font-weight: 650;
      }
      .fut-seg-tab.is-active::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 3px;
        width: 24px;
        height: 2px;
        border-radius: 2px;
        background: var(--accent);
        transform: translateX(-50%);
      }
      .fut-seg-badge {
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 8px;
        background: #d9534f;
        color: #fff;
        font-size: 10.5px;
        font-weight: 650;
        line-height: 16px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .fut-seg-badge[hidden] {
        display: none !important;
      }
      .fut-seg-host {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        position: relative;
      }
      /* 保存 / 刷新全局反馈 */
      .fut-saving {
        position: absolute;
        inset: 0;
        z-index: 12;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: color-mix(in srgb, var(--bg) 62%, transparent);
        color: var(--label);
        font-size: 14px;
        font-weight: 650;
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        pointer-events: all;
      }
      .fut-saving[hidden] {
        display: none !important;
      }
      .fut-saving-spin,
      button.is-loading::after {
        content: "";
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid color-mix(in srgb, var(--label) 28%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: fut-spin 0.7s linear infinite;
        vertical-align: -2px;
      }
      button.is-loading {
        position: relative;
        opacity: 0.85;
        pointer-events: none;
      }
      button.is-loading::after {
        margin-left: 8px;
        width: 12px;
        height: 12px;
      }
      @keyframes fut-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .fut-list.is-refreshing,
      .fut-radar-wrap.is-refreshing {
        animation: fut-list-flash 0.55s ease;
      }
      @keyframes fut-list-flash {
        0% {
          opacity: 0.55;
        }
        100% {
          opacity: 1;
        }
      }
      .fut-kline.is-loading,
      .fut-radar-kline.is-loading,
      .fut-zoom-chart.is-loading canvas,
      .fut-zoom-long-chart.is-loading canvas {
        background: linear-gradient(
            100deg,
            transparent 25%,
            color-mix(in srgb, var(--label, #808080) 16%, transparent) 50%,
            transparent 75%
          ),
          color-mix(in srgb, var(--label, #808080) 4%, transparent);
        background-size:
          220% 100%,
          100% 100%;
        animation: fut-kline-shimmer 1.2s linear infinite;
      }
      @keyframes fut-kline-shimmer {
        from {
          background-position:
            130% 0,
            0 0;
        }
        to {
          background-position:
            -90% 0,
            0 0;
        }
      }
      .fut-focus-bar.is-busy button:not(.fut-focus-close) {
        pointer-events: none;
        opacity: 0.7;
      }
      .fut-shell.is-booting .fut-seg-host {
        opacity: 0.55;
      }
      .fut-head-meta.is-busy {
        color: var(--accent);
      }
      .fut-seg-panel {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }
      .fut-seg-panel[hidden] {
        display: none !important;
      }
      .fut-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-x: auto;
        overflow-y: scroll;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        padding: 8px 10px 72px;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .fut-scroll-pct {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%) scale(0.96);
        z-index: 6;
        min-width: 3.2em;
        max-width: 5.5em;
        padding: 10px 9px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--label) 82%, transparent);
        color: var(--bg);
        font-size: 11px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
        text-align: center;
        line-height: 1.15;
        white-space: pre-line;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease,
          visibility 0.18s;
        box-shadow: 0 6px 18px color-mix(in srgb, #000 18%, transparent);
      }
      .fut-scroll-pct.is-visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(-50%) scale(1);
      }

      /* 列表表（对齐钉子 nail-prow） */
      .fut-prow-table {
        width: 100%;
        min-width: 320px;
        border-collapse: collapse;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .fut-prow-table thead th {
        color: var(--secondary);
        font-size: 11px;
        font-weight: 600;
        text-align: left;
        padding: 5px 6px;
        border-bottom: 0.5px solid var(--separator);
      }
      .fut-prow-table thead th:nth-child(3) {
        text-align: right;
      }
      .fut-section-row td {
        padding: 0;
        position: sticky;
        top: 0;
        z-index: 3;
        background: var(--elevated, var(--grouped, var(--bg)));
      }
      .fut-section-label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin: 4px 0 2px;
        padding: 10px 10px 9px;
        border-radius: 8px;
        border: 0.5px solid var(--separator);
        background: color-mix(in srgb, var(--grouped, var(--bg)) 92%, transparent);
        color: var(--secondary);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.2;
      }
      .fut-section-label.is-pin {
        border-color: color-mix(in srgb, var(--accent) 42%, var(--separator));
        background: color-mix(
          in srgb,
          var(--accent) 14%,
          var(--grouped, var(--bg))
        );
        color: color-mix(in srgb, var(--accent) 70%, var(--label));
      }
      .fut-section-label.is-always {
        margin-top: 4px;
        padding: 6px 10px;
        border-color: color-mix(in srgb, var(--accent) 28%, transparent);
        background: color-mix(in srgb, var(--elevated, var(--bg)) 42%, transparent);
        color: color-mix(in srgb, var(--accent) 55%, var(--secondary));
        font-size: 10px;
        font-weight: 650;
        cursor: pointer;
        user-select: none;
      }
      .fut-section-label.is-always .fut-sec-caret {
        display: inline-block;
        margin-right: 2px;
        transition: transform 0.15s ease;
      }
      .fut-section-label.is-always.is-collapsed .fut-sec-caret {
        transform: rotate(-90deg);
      }
      .fut-section-label.is-rest {
        border-style: dashed;
      }
      .fut-section-count {
        font-variant-numeric: tabular-nums;
        opacity: 0.85;
      }
      .fut-prow-row td {
        padding: 4px 6px;
        vertical-align: middle;
        border-bottom: none;
      }
      .fut-prow-row.is-selected,
      .fut-prow-row.is-focus {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }
      .fut-prow-row.is-pool {
        background: color-mix(in srgb, var(--accent, #2f8f6e) 8%, transparent);
      }
      .fut-name-cell {
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .fut-pin-wrap {
        position: relative;
        display: inline-flex;
      }
      .fut-pin {
        border: 0;
        background: var(--fill);
        color: var(--secondary);
        border-radius: 6px;
        min-width: 22px;
        height: 22px;
        padding: 0 5px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }
      .fut-pin.is-on {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 18%, var(--fill));
      }
      .fut-name {
        border: 0;
        background: transparent;
        color: var(--label);
        font-weight: 650;
        padding: 0;
        cursor: pointer;
      }
      @keyframes fut-name-refresh-flash {
        0%,
        100% {
          background: transparent;
          box-shadow: none;
        }
        18%,
        55% {
          background: color-mix(in srgb, var(--accent, #2f8f6e) 28%, transparent);
          box-shadow: 0 0 0 1px
            color-mix(in srgb, var(--accent, #2f8f6e) 45%, transparent);
        }
      }
      @keyframes fut-name-refresh-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        12% {
          transform: translateX(-2px);
        }
        26% {
          transform: translateX(2px);
        }
        40% {
          transform: translateX(-1.6px);
        }
        54% {
          transform: translateX(1.6px);
        }
        68% {
          transform: translateX(-1px);
        }
        82% {
          transform: translateX(1px);
        }
      }
      .fut-name.is-refresh-flash {
        border-radius: 4px;
        animation:
          fut-name-refresh-flash 0.85s ease-in-out 1,
          fut-name-refresh-shake 0.62s cubic-bezier(0.36, 0.07, 0.19, 0.97) 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .fut-name.is-refresh-flash {
          animation: fut-name-refresh-flash 0.85s ease-in-out 1;
        }
      }
      .fut-tag {
        display: inline-block;
        margin-left: 4px;
        padding: 0 5px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: color-mix(in srgb, var(--accent, #2f8f6e) 85%, var(--label));
        background: color-mix(in srgb, var(--accent, #2f8f6e) 14%, transparent);
        vertical-align: middle;
      }
      .fut-check {
        width: 16px;
        height: 16px;
        margin: 0 2px 0 0;
      }
      .fut-kline-cell canvas.fut-kline {
        width: 168px;
        height: 62px;
        display: block;
        border-radius: 4px;
        background: color-mix(in srgb, var(--label, #808080) 4%, transparent);
      }
      .fut-prow-table thead th:nth-child(4) {
        text-align: right;
      }
      .fut-prow-ops {
        white-space: nowrap;
        text-align: right;
      }
      .fut-prow-ops button {
        border: none;
        background: var(--fill);
        color: var(--label);
        height: 22px;
        min-width: 22px;
        padding: 0 6px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 650;
        cursor: pointer;
        margin-left: 6px;
      }
      .fut-prow-ops button.fut-del {
        color: var(--down);
        background: color-mix(in srgb, var(--down) 12%, transparent);
      }
      .fut-prow-row.is-focus {
        box-shadow: inset 0 0 0 2px
          color-mix(in srgb, var(--accent) 55%, transparent);
      }
      .fut-chg {
        text-align: right;
        font-weight: 650;
      }
      .fut-chg.is-up,
      .up {
        color: var(--up);
      }
      .fut-chg.is-down,
      .down {
        color: var(--down);
      }
      .fut-sub td {
        padding-top: 0;
        padding-bottom: 5px;
        padding-left: 6px;
        padding-right: 6px;
        border-bottom: 0.5px solid
          color-mix(in srgb, var(--separator) 55%, transparent);
        vertical-align: top;
      }
      .fut-info {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 10px;
        font-size: 10.5px;
        color: var(--secondary);
        line-height: 1.4;
      }
      .fut-info-note {
        font-variant-numeric: tabular-nums;
      }
      .fut-info-meta {
        color: var(--secondary);
        opacity: 0.9;
      }

      .fut-radar-table {

      .fut-radar-table th:nth-child(1),

      .fut-radar-table tr.is-radar-selected td:nth-child(-n + 2) {

          in srgb,
          var(--accent) 12%,
          var(--elevated, #fff)

      .fut-radar-table tr.is-pool {
        background: color-mix(in srgb, var(--accent, #2f8f6e) 8%, transparent);
      }
      .fut-radar-table tr.is-top20 .fut-radar-rank-mini {

      }
      .fut-radar-symbol {
        border: none;

  <body>
    <div class="fut-shell" id="futShell">
      <header class="fut-head">
        <div class="fut-head-title-line">
          <h1>合约</h1>
          <button
            type="button"
            class="fut-settings-btn"
            id="futSettingsBtn"
            aria-haspopup="dialog"
            aria-controls="futSettingsPopover"
            aria-expanded="false"
            title="筛选、排序与定时刷新"
            aria-label="设置"
          >
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 3.5v2.2M12 18.3v2.2M4.9 6.4l1.6 1.6M17.5 16l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.9 17.6l1.6-1.6M17.5 8l1.6-1.6"
              />
            </svg>
          </button>
        </div>
        <p class="fut-head-meta" id="futMeta">加载中…</p>
        <p class="fut-err" id="errBox" hidden></p>
        <span class="fut-status" id="statusMeta" hidden>尚未加载</span>

        <div
          class="fut-settings-popover"
          id="futSettingsPopover"
          hidden
          role="dialog"
          aria-label="合约设置"
        >
          <div class="fut-set-row">
            <span>排序</span>
            <div class="fut-mode-switch" id="futSortSwitch" role="group">
              <button
                type="button"
                data-fut-sort="order"
                title="置顶/列表顺序"
              >
                默认
              </button>
              <button
                type="button"
                data-fut-sort="noteGain"
                class="is-active"
                title="置顶与其余都按便签涨幅排；无便签沉底"
              >
                便签涨幅
              </button>
              <button
                type="button"
                data-fut-sort="change24h"
                title="置顶保持手动序；其余按 24h 涨幅排"
              >
                24h
              </button>
            </div>
          </div>
          <div class="fut-set-row">
            <span>只看置顶区</span>
            <button
              type="button"
              class="fut-switch"
              id="futPinnedOnlySwitch"
              role="switch"
              aria-checked="false"
              aria-label="只看置顶区"
            ></button>
          </div>
          <div class="fut-set-row">
            <div class="fut-set-label">
              <span>定时刷新</span>
              <small>约 15 秒刷现价与 K</small>
            </div>
            <button
              type="button"
              class="fut-switch"
              id="futAutoRefreshSwitch"
              role="switch"
              aria-checked="false"
              aria-label="定时刷新"
            ></button>
          </div>
          <div class="fut-set-row">
            <div class="fut-set-label">
              <span>观察池前 N</span>
              <small>写 fut-prefs · 云约 5 分钟跟上</small>
            </div>
            <div class="fut-rank-edit">
              <input
                type="number"
                id="futWatchPoolRankInput"
                min="10"
                max="100"
                step="1"
                value="35"
                inputmode="numeric"
              />
              <button
                type="button"
                class="fut-settings-action"
                id="futWatchPoolRankSave"
              >
                保存
              </button>
            </div>
          </div>
          <div class="fut-set-row">
            <div class="fut-set-label">
              <span>一键平简</span>
              <small>常看+置顶写现价便签</small>
            </div>
            <button
              type="button"
              class="fut-settings-action"
              id="futFlatSimplifyBtn"
            >
              执行
            </button>
          </div>
          <div class="fut-set-row">
            <div class="fut-set-label">
              <span>现货钉子</span>
              <small>共用 GitHub 密码入口</small>
            </div>
            <a class="fut-settings-action" href="../kline.html">打开</a>
          </div>
        </div>
      </header>

      <nav class="fut-segments" role="tablist" aria-label="合约分栏">
        <button
          type="button"
          class="fut-seg-tab is-active"
          data-fut-tab="pin"
          role="tab"
          aria-selected="true"
        >
          置顶
        </button>
        <button
          type="button"
          class="fut-seg-tab"
          data-fut-tab="auto"
          role="tab"
          aria-selected="false"
        >
          自动盯<span
            class="fut-seg-badge"
            id="futAutoPinBadge"
            hidden
          ></span>
        </button>
        <button
          type="button"
          class="fut-seg-tab"
          data-fut-tab="radar"
          role="tab"
          aria-selected="false"
        >
          雷达
        </button>
      </nav>

      <div class="fut-seg-host">
        <div class="fut-saving" id="futSaving" hidden aria-live="polite">
          <span class="fut-saving-spin" aria-hidden="true"></span>
          <span id="futSavingText">保存中…</span>
        </div>
        <section
          class="fut-seg-panel"
          data-fut-pane="pin"
          id="panePin"
          role="tabpanel"
        >
          <div class="fut-pin-toolbar" id="futPinToolbar">
            <div class="fut-pin-toolbar-left">
              <button type="button" id="futAddBtn" title="钉一个新币种">新增</button>
              <button
                type="button"
                id="futSelectBtn"
                title="多选后批量置顶 / 写便签 / 删除"
                aria-pressed="false"
              >
                多选
              </button>
            </div>
            <div class="fut-pin-toolbar-right">
              <button type="button" id="refreshBtn" title="重新拉取列表与 K 线">
                刷新
              </button>
            </div>
          </div>
          <form class="fut-add-form" id="futAddForm" hidden>
            <input
              id="futAddSymbol"
              type="text"
              autocomplete="off"
              placeholder="名称，如 BTC"
              aria-label="币名"
            />
            <input
              id="futAddNote"
              type="text"
              autocomplete="off"
              placeholder="备注（可选，默认现价）"
              aria-label="便签"
            />
            <div class="fut-add-form-row">
              <button type="submit">保存</button>
              <button type="button" id="futAddCancel">取消</button>
            </div>
          </form>
          <div class="fut-list" id="pinList"></div>
          <div
            class="fut-scroll-pct"
            id="futScrollPct"
            hidden
            aria-hidden="true"
          >
            0%
          </div>
        </section>
        <section
          class="fut-seg-panel"
          data-fut-pane="auto"
          id="paneAuto"
          role="tabpanel"
          hidden
        >
          <div class="fut-list" id="autoList"></div>
        </section>
        <section
          class="fut-seg-panel fut-radar-pane"
          data-fut-pane="radar"
          id="paneRadar"
          role="tabpanel"
          hidden
        >
          <div class="fut-radar-head" id="radarHead">
            <span class="fut-radar-title">冲榜雷达</span>
            <span id="radarUpdated" class="fut-radar-updated"></span>
            <button
              type="button"
              id="radarAllKlineBtn"
              class="fut-radar-toggle"
              aria-pressed="false"
              title="当前：只画置顶币，点一下全部币都画"
            >
              全部K线
            </button>
            <button
              type="button"
              id="radarGroupBtn"
              class="fut-radar-toggle"
              aria-pressed="false"
              title="当前：已点「归集」的行留在原排名；点一下把它们提到列表顶部"
            >
              归集
            </button>
            <button type="button" id="radarRefreshBtn" class="fut-radar-refresh">
              刷新
            </button>
          </div>
          <div class="fut-radar-wrap" id="radarTableWrap">
            <table class="fut-radar-table">
              <thead>
                <tr>
                  <th>币</th>
                  <th>K线</th>
                  <th>24h</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="radarBody"></tbody>
            </table>
            <div class="fut-radar-empty" id="radarEmpty" hidden>
              雷达暂无数据
            </div>
          </div>
        </section>
      </div>
    </div>

    <div
      id="futFocusBar"
      class="fut-focus-bar"
      hidden
      role="toolbar"
      aria-label="行操作"
    >
      <button type="button" class="fut-focus-close" id="futFocusClose" title="关闭">
        ×
      </button>
      <strong id="futFocusSym">—</strong>
      <!-- 对齐钉子自动盯：只要置顶 / 刷新；便签走置顶列表长按，放大走行内按钮 -->
      <button type="button" id="futFocusPinBtn" data-fut-focus="pin">置顶</button>
      <button type="button" id="futFocusRefreshBtn" data-fut-focus="refresh">
        刷新
      </button>
    </div>

    <div
      id="futZoomOverlay"
      class="fut-zoom-overlay"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="futZoomTitle"
    >
      <div class="fut-zoom-card">
        <div class="fut-zoom-head">
          <div>
            <h2 id="futZoomTitle">K 线</h2>
            <p class="fut-zoom-meta" id="futZoomMeta">按住滑动查看价格</p>
          </div>
          <button type="button" id="futZoomClose">关闭</button>
        </div>
        <div class="fut-zoom-body">
          <div class="fut-zoom-chart">
            <canvas id="futZoomCanvas" width="720" height="280"></canvas>
          </div>
          <p class="fut-zoom-hint">主图为 4h · 与钉子页同色墨线；下方可切长周期</p>
          <section class="fut-zoom-long" aria-label="长周期 K 线">
            <div class="fut-zoom-long-head">
              <h3>长周期走势</h3>
              <div class="fut-zoom-range" role="group" aria-label="长周期范围">
                <button
                  type="button"
                  data-fut-zoom-range="day"
                  aria-pressed="false"
                >
                  一天
                </button>
                <button
                  type="button"
                  data-fut-zoom-range="week"
                  class="is-active"
                  aria-pressed="true"
                >
                  一周
                </button>
                <button
                  type="button"
                  data-fut-zoom-range="month"
                  aria-pressed="false"
                >
                  一月
                </button>
              </div>
            </div>
            <p class="fut-zoom-long-meta" id="futZoomLongMeta">加载周 K…</p>
            <div class="fut-zoom-long-chart">
              <canvas id="futZoomLongCanvas" width="720" height="220"></canvas>
            </div>
          </section>
        </div>
      </div>
    </div>

    <div class="fut-batch-bar" id="futBatchBar" hidden>
      <span class="count">已选 <strong id="futBatchCount">0</strong></span>
      <button type="button" id="futBatchPinBtn">置顶</button>
      <button type="button" id="futBatchUnpinBtn">取消置顶</button>
      <button type="button" id="futBatchNoteBtn">便签现价</button>
      <button type="button" id="futBatchDeleteBtn">删除</button>
      <button type="button" id="futBatchExitBtn">完成</button>
    </div>

    <div id="futRowFloatMask" class="fut-row-float-mask" hidden></div>
    <div
      id="futRowFloatMenu"
      class="fut-row-float-menu"
      hidden
      role="menu"
      aria-label="行操作"
    >
      <button type="button" class="close" data-fut-row-close>×</button>
      <!-- 对齐钉子长按浮层：便签为主；放大走行内按钮，不放浮层 -->
      <button type="button" data-fut-float="note">便签</button>
      <button type="button" data-fut-float="pin">置顶</button>
      <button type="button" data-fut-float="always">常看</button>
      <button type="button" data-fut-float="unpin" class="is-danger">
        取消置顶
      </button>
    </div>

    <div
      id="futNoteEditor"
      class="fut-note-editor"
      role="dialog"
      aria-modal="true"
      aria-labelledby="futNoteEditorTitle"
      hidden
    >
      <form class="fut-note-editor-panel" id="futNoteEditorForm">
        <h3 id="futNoteEditorTitle">编辑便签</h3>
        <textarea
          id="futNoteEditorText"
          maxlength="60"
          placeholder="价格和备注，例如 0.01 到位观察"
          aria-label="便签内容"
        ></textarea>
        <fieldset class="fut-note-time-options">
          <legend>修改后 K 线便签起始时间</legend>
          <label>
            <input type="radio" name="futNoteTimeMode" value="original" />
            保留原时间（默认）
          </label>
          <label>
            <input type="radio" name="futNoteTimeMode" value="current" />
            按照此刻时间
          </label>
        </fieldset>
        <div class="fut-note-editor-actions">
          <button type="button" id="futNoteEditorCancel">取消</button>
          <button type="submit" id="futNoteEditorSave" class="is-primary">
            保存
          </button>
        </div>
      </form>
    </div>

    <div
      id="futDailyResetDialog"
      class="fut-daily-reset-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="futDailyResetTitle"
      hidden
    >
      <div class="fut-daily-reset-panel">
        <h3 id="futDailyResetTitle">即将重置便签</h3>
        <p id="futDailyResetBody">
          请将需要保留的币先置顶。北京时间 0:00 将对非置顶合约钉子写入便签现价。
        </p>
        <p class="fut-daily-reset-count" id="futDailyResetCountdown">
          还有 — 分钟后重置
        </p>
        <div class="fut-daily-reset-actions">
          <button type="button" id="futDailyResetAck">确定</button>
        </div>
      </div>
    </div>

    <div id="toast" hidden></div>

    <script src="../github-token-vault.js"></script>
    <script src="./fut-config.js"></script>
    <script src="./fut-store.js"></script>
    <script src="./fut-app.js"></script>
  </body>
</html>
