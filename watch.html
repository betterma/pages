<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <title>Binance 冲榜雷达</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f5f3;
        color: #28323a;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .container {
        width: 97%;
        max-width: 1800px;
        margin: 20px auto;
      }
      .header,
      .controls,
      .section-header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .header,
      .section-header {
        justify-content: space-between;
      }
      .header {
        margin-bottom: 15px;
      }
      h1,
      h2 {
        margin: 0;
      }
      h1 {
        font-size: 26px;
      }
      h2 {
        font-size: 17px;
      }
      .controls {
        flex-wrap: wrap;
        margin-bottom: 15px;
      }
      button,
      select {
        border: 1px solid #c9d0d0;
        background: #fbfcfa;
        color: #28323a;
        padding: 8px 13px;
        border-radius: 6px;
        cursor: pointer;
      }

        height: 10px;
        border-radius: 50%;

      .dot.online {
        background: #718b88;
        box-shadow: 0 0 8px rgba(113, 139, 136, 0.35);
      }
      .dot.offline {

      }
      .info {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
        margin-bottom: 15px;
      }
      .card,
      .section {
        background: #fbfcfa;
        border: 1px solid #d8ddda;
        border-radius: 8px;
      }
      .card {
        padding: 12px;
      }
      .snapshot-age-card {
        cursor: pointer;
      }
      .snapshot-age-card:hover {
        background: #f1f4f1;
      }
      .card-title {
        color: #78817f;
        font-size: 12px;
        margin-bottom: 5px;
      }
      .card-value {

        font-weight: bold;
      }
      .section {
        margin-bottom: 15px;

      }
      .section-header {

        border-bottom: 1px solid #e1e5e2;
      }
      .badge {
        padding: 3px 7px;
        border-radius: 4px;
        background: #edf0ed;

      .top20-tag {

      }
      .dimension-status {

      }
      .github-token {

      }
      .github-status {
        color: #78817f;

      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 850px;
      }
      th {
        background: #f0f2ef;
        color: #727c7a;
        font-size: 12px;
        font-weight: normal;
        padding: 9px;
        white-space: nowrap;
      }
      td {
        padding: 9px;
        border-top: 1px solid #e5e9e6;
        text-align: left;
        font-size: 13px;
      }
      th {
        text-align: left;
      }
      th.sortable {

      th.sortable:hover {
        background: #e7ebe8;

      tr:hover td {

      .change-tag {
        display: inline-flex;

      .favorite-button {

        padding: 2px 6px;

        max-height: 55vh;
        overflow-y: auto;
        padding: 8px 16px 12px;

      .snapshot-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 0;
        border-bottom: 1px solid #e5e9e6;
        font-size: 13px;
      }
      .snapshot-item:last-child {
        border-bottom: 0;
      }
      .snapshot-index {
        color: #78817f;
      }
      .window-chain {
        min-width: 140px;
        color: #42505a;
        font-size: 12px;
        white-space: nowrap;
      }
      .window-chain-up {
        color: #1f2328;
      }
      .window-chain-down {
        color: #9aa3a1;
      }
      .window-chain-flat {
        color: #78817f;
      }
      @media (max-width: 1100px) {
        .info {
          grid-template-columns: repeat(3, 1fr);

      }
      @media (max-width: 700px) {
        .container {
          width: calc(100% - 20px);

        }
        .header {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
        h1 {
          font-size: 22px;
        }
        .controls {
          align-items: stretch;
          flex-direction: column;
        }
        .controls label,
        .controls select,
        .controls button {
          width: 100%;
        }
        .controls label {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
        }
        .controls select {
          flex: 1;
        }
        .info {
          grid-template-columns: repeat(2, 1fr);
          gap: 8px;
        }
        .card {
          min-width: 0;
          padding: 10px;
        }
        .card-value {
          font-size: 17px;
          overflow-wrap: anywhere;
        }
        .section-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 6px;
          padding: 11px 12px;
        }
        .table-wrap {
          -webkit-overflow-scrolling: touch;
        }
        table {
          min-width: 760px;
        }
        th,
        td {
          padding: 8px 7px;
        }
        .event {
          padding: 10px 12px;
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }

  <body>
    <div class="container">
      <div class="header">
        <h1>Binance 冲榜雷达</h1>
        <div class="status">
          <span id="statusDot" class="dot"></span
          ><span id="apiStatus">等待行情...</span>
        </div>
      </div>
      <div class="controls">
        <label
          >比较维度
          <select id="dimensionSelect">
            <option value="15m">15min</option>
            <option value="30m">30min</option>
            <option value="1h">1h</option>
            <option value="2h">2h</option>
            <option value="4h">4h</option>
          </select></label
        ><span id="dimensionStatus" class="dimension-status"></span
        ><button id="refreshBtn">刷新数据</button
        ><button id="clearBtn" class="danger">清空历史</button>
      </div>
      <div class="info">
        <div class="card">
          <div class="card-title">API 更新时间</div>
          <div class="card-value" id="apiUpdated">--</div>
        </div>
        <div
          class="card snapshot-age-card"
          id="snapshotAgeCard"
          role="button"
          tabindex="0"
          title="点击查看所有快照时间点"
          aria-label="查看所有快照时间点"
        >
          <div class="card-title">快照年龄</div>
          <div class="card-value" id="snapshotAge">--</div>
        </div>
        <div class="card">
          <div class="card-title">历史快照</div>
          <div class="card-value" id="snapshotCount">0</div>
        </div>
      </div>
      <div class="section">
        <div class="section-header">
          <h2>Binance Top20</h2>
          <span class="badge">24h 涨幅排名</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>收藏</th>
                <th>币种</th>
                <th>24h涨幅</th>
                <th id="topPriceHeader" class="sortable" title="点击按价格涨幅排序">15min价格</th>
                <th id="topRankHeader">15min排名</th>
                <th id="topWindowHeader" title="最近 4 个窗口的相邻变化">窗口链</th>
              </tr>
            </thead>
            <tbody id="top20Body"></tbody>
          </table>
        </div>
      </div>
      <div class="section">
        <div class="section-header">
          <h2>冲榜雷达</h2>
          <span class="badge">Top20 之外</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>收藏</th>
                <th>币种</th>
                <th>24h涨幅</th>
                <th id="radarPriceHeader" class="sortable" title="点击按价格涨幅排序">15min价格</th>
                <th id="radarRankHeader">15min排名</th>
                <th id="radarWindowHeader" title="最近 4 个窗口的相邻变化">窗口链</th>
              </tr>
            </thead>
            <tbody id="radarBody"></tbody>
          </table>
        </div>
      </div>
      <div class="section">
        <div class="section-header">
          <h2>重要事件</h2>
          <span class="badge">本地保存</span>
        </div>
        <div id="eventList" class="event-list"></div>
      </div>
      <div class="footer">每15分钟请求并保存快照 · 保存4小时历史</div>
    </div>
    <dialog id="snapshotDialog" aria-labelledby="snapshotDialogTitle">
      <div class="dialog-header">
        <h2 id="snapshotDialogTitle">所有快照时间点</h2>
        <button class="dialog-close" id="snapshotDialogClose" aria-label="关闭">×</button>
      </div>
      <div class="snapshot-list" id="snapshotList"></div>
    </dialog>
    <script>
      "use strict";
      const CONFIG = {
        REST_INTERVAL: 15 * 60 * 1000,
          SNAPSHOT_INTERVAL: 15 * 60 * 1000,
          HISTORY_DURATION: 3 * 24 * 60 * 60 * 1000, // 保存最近 3 天的快照
        GITHUB_REPO: "betterma/pages",
        GITHUB_PATH: "watch-data.json",
        GITHUB_API: "https://api.github.com",
        TOP20: 20,
        RADAR_MAX_RANK: 100,
        MAX_EVENTS: 300,
        PRICE_THRESHOLD: {
          "15m": 0.3,
          "30m": 0.8,
          "1h": 1.5,
          "2h": 2.2,
          "4h": 3,
        },
      };
      const OFFSETS = { "15m": 1, "30m": 2, "1h": 4, "2h": 8, "4h": 16 };
      // 各维度对应的时间长度（毫秒），用于按时间查找比较快照
      const DURATION_MS = {
        "15m": 15 * 60 * 1000,
        "30m": 30 * 60 * 1000,
        "1h": 60 * 60 * 1000,
        "2h": 2 * 60 * 60 * 1000,
        "4h": 4 * 60 * 60 * 1000,
      };
      const WINDOW_TOLERANCE_MS = {
        "15m": 2 * 60 * 1000,
        "30m": 2 * 60 * 1000,
        "1h": 2 * 60 * 1000,
        "2h": 2 * 60 * 1000,
        "4h": 2 * 60 * 1000,
      };
      const marketMap = {};
      let history = [],
        events = [],
        alertState = {},
        selectedDimension = "15m";
      let lastApiUpdate = 0;
      let newTop20Symbols = new Set();
      let favorites = new Set();
      let priceSortDescending = false;
      let githubSha = null;
      let githubReady = false;
      let saveQueue = Promise.resolve();
      function githubHeaders() {
        return {
          Accept: "application/vnd.github+json",
        };
      }
      function encodeBase64(value) {
        const bytes = new TextEncoder().encode(value);
        let binary = "";
        bytes.forEach((byte) => (binary += String.fromCharCode(byte)));
        return btoa(binary);
      }
      function decodeBase64(value) {
        const binary = atob(value.replace(/\n/g, ""));
        return new TextDecoder().decode(
          Uint8Array.from(binary, (character) => character.charCodeAt(0)),
        );
      }
      async function loadGithubStorage() {
        const url = `${CONFIG.GITHUB_API}/repos/${CONFIG.GITHUB_REPO}/contents/${CONFIG.GITHUB_PATH}`;
        const response = await fetch(url, { headers: githubHeaders() });
        if (response.status === 404) {
          githubSha = null;
          return;
        }
        if (!response.ok)
          throw new Error(`读取 GitHub 数据失败: ${response.status}`);
        const file = await response.json();
        githubSha = file.sha;
        const data = JSON.parse(decodeBase64(file.content));
        history = Array.isArray(data.history) ? data.history : [];
        events = Array.isArray(data.events) ? data.events : [];
        alertState = data.alertState || {};
        favorites = new Set(
          Array.isArray(data.favorites) ? data.favorites : [],
        );
        if (
          Object.prototype.hasOwnProperty.call(OFFSETS, data.selectedDimension)
        ) {
          selectedDimension = data.selectedDimension;
          document.getElementById("dimensionSelect").value = selectedDimension;
        }
        pruneHistory();
      }
      async function saveStorage() {
        return saveQueue;
      }
      function pruneHistory() {
        const cutoff = Date.now() - CONFIG.HISTORY_DURATION;
        history = history.filter((item) => item.timestamp >= cutoff);
      }
      function formatTime(value) {
        return value ? new Date(value).toLocaleTimeString("zh-CN") : "--";
      }
      function formatDateTime(value) {
        return value
          ? new Date(value).toLocaleString("zh-CN", {
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
              hour12: false,
            })
          : "--";
      }
      function formatPercent(value) {
        return Number.isFinite(value)
          ? `${value > 0 ? "+" : ""}${value.toFixed(2)}%`
          : "--";
      }
      function formatPrice(value) {
        if (!Number.isFinite(value)) return "--";
        if (value >= 1000) return value.toFixed(2);
        if (value >= 1) return value.toFixed(4);
        if (value >= 0.01) return value.toFixed(6);
        return value.toPrecision(6);
      }
      async function copySymbol(symbol) {
        try {
          await navigator.clipboard.writeText(symbol);
        } catch (error) {
          const textarea = document.createElement("textarea");
          textarea.value = symbol;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }
        document.getElementById("apiStatus").textContent = `${symbol} 已复制`;
      }
      function formatAge(timestamp) {
        if (!timestamp) return "--";
        const minutes = Math.max(0, Math.floor((Date.now() - timestamp) / 60000));
        return minutes < 1 ? "刚刚" : `${formatDurationString(minutes)}前`;
      }

      function formatDurationString(totalMinutes) {
        const h = Math.floor(totalMinutes / 60);
        const m = totalMinutes % 60;
        if (h > 0) return `${h}h${m}min`;
        return `${m}min`;
      }
      function ranking() {
        return Object.entries(marketMap)
          .sort((a, b) => b[1].change24h - a[1].change24h)
          .map(([symbol]) => symbol);
      }
      function getWindowTolerance(duration) {
        return (
          WINDOW_TOLERANCE_MS[selectedDimension] ||
          Math.min(30 * 60 * 1000, Math.max(5 * 60 * 1000, duration / 2))
        );
      }
      function getWindowStart(timestamp, duration) {
        return Math.floor(timestamp / duration) * duration;
      }
      function selectWindowSnapshot(windowStart, duration) {
        const tolerance = getWindowTolerance(duration);
        const windowEnd = windowStart + duration;
        const strictCandidates = history.filter(
          (snapshot) =>
            snapshot.timestamp >= windowStart &&
            snapshot.timestamp < windowEnd,
        );
        const candidates = strictCandidates.length
          ? strictCandidates
          : history.filter(
              (snapshot) =>
                snapshot.timestamp >= windowStart &&
                snapshot.timestamp < windowEnd + tolerance,
            );
        if (candidates.length) {
          return candidates.sort((a, b) => b.timestamp - a.timestamp)[0];
        }
        const previous = [...history]
          .filter((snapshot) => snapshot.timestamp < windowStart)
          .sort((a, b) => b.timestamp - a.timestamp)[0];
        return previous || null;
      }
      function getWindowSeries(limit = 4) {
        const duration = DURATION_MS[selectedDimension] || 0;
        if (!duration) return [];
        const now = Date.now();
        const currentWindowStart = getWindowStart(now, duration);
        const series = [];
        for (let index = 0; index < limit; index++) {
          const windowStart = currentWindowStart - index * duration;
          const snapshot = selectWindowSnapshot(windowStart, duration);
          if (!snapshot) continue;
          series.push({ windowStart, snapshot });
        }
        return series;
      }
      function selectWindowSnapshotByMode(windowStart, duration, mode) {
        const tolerance = getWindowTolerance(duration);
        const windowEnd = windowStart + duration;
        const strictCandidates = history.filter(
          (snapshot) =>
            snapshot.timestamp >= windowStart &&
            snapshot.timestamp < windowEnd,
        );
        const candidates = strictCandidates.length
          ? strictCandidates
          : history.filter(
              (snapshot) =>
                snapshot.timestamp >= windowStart &&
                snapshot.timestamp < windowEnd + tolerance,
            );
        if (!candidates.length) return null;
        return candidates.sort((a, b) =>
          mode === "earliest" ? a.timestamp - b.timestamp : b.timestamp - a.timestamp,
        )[0];
      }
      function getWindowChainSeries() {
        const duration = DURATION_MS[selectedDimension] || 0;
        if (!duration) return [];
        const currentWindowStart = getWindowStart(Date.now(), duration);
        return [0, 1, 2, 3].map((index) => {
          const windowStart = currentWindowStart - (3 - index) * duration;
          return {
            windowStart,
            snapshot: selectWindowSnapshotByMode(windowStart, duration, "earliest"),
          };
        });
      }
      function getAdjacentWindowSeries(limit = 4) {
        const series = getWindowSeries(limit);
        const chain = [];
        for (let i = 1; i < series.length; i++) {
          chain.push({
            current: series[i - 1],
            previous: series[i],
          });
        }
        return chain;
      }
      // 基于固定窗口的比较：重点比较当前窗口和上一窗口之间的差异，允许按维度设置容差
      function comparison() {
        if (!history.length) return null;
        const duration = DURATION_MS[selectedDimension] || 0;
        if (!duration) return null;
        const currentWindowStart = getWindowStart(Date.now(), duration);
        return selectWindowSnapshotByMode(
          currentWindowStart,
          duration,
          "earliest",
        );
      }
      function dimensionLabel() {
        return selectedDimension.endsWith("h")
          ? selectedDimension
          : `${selectedDimension}in`;
      }
      function updateDimensionStatus() {
        const status = document.getElementById("dimensionStatus");
        const comp = comparison();
        const label = dimensionLabel();
        if (!history.length) {
          status.textContent = `${label} 数据积累中（暂无快照）`;
          return;
        }
        if (!comp) {
          status.textContent = `${label} 数据积累中（未找到当前窗口附近的有效快照）`;
          return;
        }
        const tolerance = getWindowTolerance(DURATION_MS[selectedDimension] || 0);
        const compareMinutes = Math.floor(tolerance / 60000);
        const compareTime = new Date(comp.timestamp).toLocaleTimeString("zh-CN", {
          hour12: false,
          hour: "2-digit",
          minute: "2-digit",
        });
        status.textContent = `${label} 对比已启用 · 使用当前窗口 ${compareTime} 快照（允许 ${compareMinutes} 分钟容差）`;
      }
      function updateDimensionHeaders() {
        const label = dimensionLabel();
        document.getElementById("topRankHeader").textContent = `${label}排名`;
        document.getElementById("topPriceHeader").textContent = `${label}价格${priceSortDescending ? " ↓" : ""}`;
        document.getElementById("radarRankHeader").textContent = `${label}排名`;
        document.getElementById("radarPriceHeader").textContent =
          `${label}价格${priceSortDescending ? " ↓" : ""}`;
        document.getElementById("topWindowHeader").textContent = "窗口链";
        document.getElementById("radarWindowHeader").textContent = "窗口链";
      }
      function getWindowChainSummary(symbol) {
        const series = getWindowChainSeries();
        const values = series.map((item) => item.snapshot?.prices[symbol]);
        values.push(marketMap[symbol]?.price);
        const deltas = [];
        for (let index = 1; index < values.length; index += 1) {
          const olderPrice = values[index - 1];
          const newerPrice = values[index];
          if (!Number.isFinite(olderPrice) || !Number.isFinite(newerPrice) || olderPrice === 0) {
            deltas.push(null);
            continue;
          }
          deltas.push(((newerPrice - olderPrice) / olderPrice) * 100);
        }
        return deltas
          .map((delta) => {
            if (delta === null) return "--";
            const sign = delta > 0 ? "↑" : delta < 0 ? "↓" : "→";
            const cls = delta > 0 ? "window-chain-up" : delta < 0 ? "window-chain-down" : "window-chain-flat";
            return `<span class="${cls}">${sign}${Math.abs(delta).toFixed(2)}%</span>`;
          })
          .join(" / ");
      }
      function momentum(symbol) {
        const series = getWindowSeries(2);
        const old = series[1]?.snapshot || comparison();
        const currentRank = ranking().indexOf(symbol) + 1;
        if (!old || !old.ranks[symbol] || !currentRank)
          return { rank: null, price: null };
        const oldPrice = old.prices[symbol],
          currentPrice = marketMap[symbol].price;
        return {
          rank: {
            oldRank: old.ranks[symbol],
            currentRank,
            improvement: old.ranks[symbol] - currentRank,
          },
          price: Number.isFinite(oldPrice)
            ? {
                oldPrice,
                currentPrice,
                change: ((currentPrice - oldPrice) / oldPrice) * 100,
              }
            : null,
        };
      }
      function metric(symbol, type) {
        const item = momentum(symbol)[type];
        if (!comparison() || !item) return "";
        const value = type === "rank" ? item.improvement : item.change;
        if (value <= 0) return "";
        const cls = type === "rank" ? "rank-up" : "up";
        const oldValue =
          type === "rank"
            ? item.oldRank
            : formatPrice(item.oldPrice);
        const currentValue =
          type === "rank"
            ? item.currentRank
            : formatPrice(item.currentPrice);
        return `<span class="change-cell"><span class="${cls}">${type === "rank" ? (value > 0 ? "+" : "") + value : formatPercent(value)}</span><span class="change-tag"><span>${oldValue}</span><span>${currentValue}</span></span></span>`;
      }
      function renderRows(id, items) {
        const body = document.getElementById(id);
        body.innerHTML = items.length
          ? items
              .map((symbol, index) => {
                const data = marketMap[symbol],
                  rank = ranking().indexOf(symbol) + 1;
                const tag =
                  id === "top20Body" && newTop20Symbols.has(symbol)
                    ? '<span class="badge top20-tag">新进 Top20</span>'
                    : "";
                const isFavorite = favorites.has(symbol);
                const favoriteButton = `<button class="favorite-button${isFavorite ? " active" : ""}" data-symbol="${symbol}" aria-label="${isFavorite ? "取消收藏" : "收藏"}">${isFavorite ? "★" : "☆"}</button>`;
                const baseAsset = symbol.replace(/USDT$/, "");
                const tradeUrl = `https://www.binance.com/en/trade/${baseAsset}_USDT?type=spot`;
                const windowChain = getWindowChainSummary(symbol);
                return `<tr><td>${favoriteButton}</td><td class=\"symbol symbol-copy\" data-symbol=\"${symbol}\" title=\"点击复制交易对\">${symbol.replace("USDT", "")} ${tag}</td><td class=\"up\"><a class=\"price-link\" href=\"${tradeUrl}\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"打开 ${symbol.replace("USDT", "")}/USDT 交易页\">${formatPercent(data.change24h)}</a></td><td>${metric(symbol, "price")}</td><td>${metric(symbol, "rank")}</td><td class="window-chain">${windowChain}</td></tr>`;
              })
              .join("")
          : '<tr><td colspan="6"><div class="empty">暂无数据</div></td></tr>';
      }
      function render() {
        const list = ranking();
        const displayList = priceSortDescending
          ? [...list].sort((a, b) => {
              const aChange = momentum(a).price?.change ?? -Infinity;
              const bChange = momentum(b).price?.change ?? -Infinity;
              return bChange - aChange;
            })
          : list;
        document.getElementById("apiUpdated").textContent =
          formatTime(lastApiUpdate);
        document.getElementById("snapshotAge").textContent = formatAge(
          history.length ? history[history.length - 1].timestamp : 0,
        );
        document.getElementById("snapshotCount").textContent = history.length;
        updateDimensionStatus();
        updateDimensionHeaders();
        renderRows("top20Body", displayList.slice(0, 20));
        renderRows("radarBody", displayList.slice(20, 100));
        renderEvents();
      }
      function renderSnapshotList() {
        const list = document.getElementById("snapshotList");
        list.innerHTML = history.length
          ? [...history]
              .reverse()
              .map(
                (snapshot, index) =>
                  `<div class="snapshot-item"><span class="snapshot-index">#${history.length - index}</span><span>${formatDateTime(snapshot.timestamp)}</span></div>`,
              )
              .join("")
          : '<div class="empty">暂无历史快照</div>';
      }
      function renderEvents() {
        document.getElementById("eventList").innerHTML = events.length
          ? events
              .map(
                (event) =>
                  `<div class=\"event\"><div class=\"event-time\">${formatTime(event.timestamp)}</div><div class=\"event-symbol\">${event.symbol.replace("USDT", "")}</div><div><span class=\"badge\">TOP20</span></div><div>当前 #${event.rank} · ${event.description}</div></div>`,
              )
              .join("")
          : '<div class="empty">暂无重要事件</div>';
      }
      function evaluateTop20() {
        const list = ranking();
        newTop20Symbols = new Set();
        for (const symbol of list) {
          const state = alertState[symbol] || { top20: false };
          const currentRank = list.indexOf(symbol) + 1;
          const oldRank = comparison()?.ranks[symbol] || 999;
          if (currentRank > 20) {
            state.top20 = false;
            alertState[symbol] = state;
            continue;
          }
          if (!state.top20 && oldRank > 20 && currentRank <= 20) {
            newTop20Symbols.add(symbol);
            state.top20 = true;
            alertState[symbol] = state;
          }
        }
        events = events.slice(0, CONFIG.MAX_EVENTS);
      }
      function createSnapshot() {
        const list = ranking();
        if (!list.length) return;
        const ranks = {},
          prices = {};
        list.forEach((symbol, index) => {
          ranks[symbol] = index + 1;
          prices[symbol] = marketMap[symbol].price;
        });
        const timestamp = Date.now();
        history.push({ timestamp, ranks, prices });
        pruneHistory();
        render();
      }
      function setStatus(ok, text) {
        document.getElementById("statusDot").className =
          `dot ${ok ? "online" : "offline"}`;
        document.getElementById("apiStatus").textContent = text;
      }
      function loadData() {
        if (!githubReady) {
          setStatus(false, "请先连接 GitHub");
          return;
        }
        setStatus(false, "正在请求 REST 行情...");
        const endpoints = [
          "https://data-api.binance.vision/api/v3/ticker/24hr",
          "https://api.binance.com/api/v3/ticker/24hr",
        ];
        const requestTicker = (index = 0) =>
          fetch(endpoints[index]).then((response) => {
            if (response.ok) return response.json();
            if (index + 1 < endpoints.length) return requestTicker(index + 1);
            throw Error(`HTTP ${response.status}`);
          });
        requestTicker()
          .then((data) => {
            data.forEach((ticker) => {
              if (!ticker.symbol.endsWith("USDT")) return;
              const price = Number(ticker.lastPrice),
                change = Number(ticker.priceChangePercent);
              if (Number.isFinite(price) && Number.isFinite(change))
                marketMap[ticker.symbol] = {
                  price,
                  change24h: change,
                  updateTime: Date.now(),
                };
            });
            lastApiUpdate = Date.now();
            setStatus(
              true,
              `REST 已更新 · ${new Date().toLocaleTimeString("zh-CN")}`,
            );
            render();
          })
          .catch((error) => {
            console.error(error);
            setStatus(false, "REST 请求失败");
          });
      }
      async function clearHistory() {
        if (!confirm("确定清空所有历史快照、事件和报警状态吗？")) return;
        history = [];
        events = [];
        alertState = {};
        await saveStorage();
        render();
      }
      function toggleFavorite(symbol) {
        if (favorites.has(symbol)) favorites.delete(symbol);
        else favorites.add(symbol);
        saveStorage();
        render();
      }
      document
        .getElementById("dimensionSelect")
        .addEventListener("change", (event) => {
          selectedDimension = event.target.value;
          render();
        });
      function togglePriceSort() {
        priceSortDescending = !priceSortDescending;
        render();
      }
      document
        .getElementById("topPriceHeader")
        .addEventListener("click", togglePriceSort);
      document
        .getElementById("radarPriceHeader")
        .addEventListener("click", togglePriceSort);
      document.getElementById("refreshBtn").addEventListener("click", loadData);
      const snapshotDialog = document.getElementById("snapshotDialog");
      const openSnapshotDialog = () => {
        renderSnapshotList();
        snapshotDialog.showModal();
      };
      document
        .getElementById("snapshotAgeCard")
        .addEventListener("click", openSnapshotDialog);
      document
        .getElementById("snapshotAgeCard")
        .addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openSnapshotDialog();
          }
        });
      document
        .getElementById("snapshotDialogClose")
        .addEventListener("click", () => snapshotDialog.close());
      snapshotDialog.addEventListener("click", (event) => {
        if (event.target === snapshotDialog) snapshotDialog.close();
      });
      document.addEventListener("click", (event) => {
        const priceLink = event.target.closest(".price-link");
        if (priceLink) {
          event.preventDefault();
          window.open(priceLink.href, "_blank", "noopener,noreferrer");
          window.focus();
          return;
        }
        const button = event.target.closest(".favorite-button");
        if (button) toggleFavorite(button.dataset.symbol);
        const symbolCell = event.target.closest(".symbol-copy");
        if (symbolCell) copySymbol(symbolCell.dataset.symbol);
      });
      document
        .getElementById("clearBtn")
        .addEventListener("click", clearHistory);
      async function init() {
        try {
          await loadGithubStorage();
          githubReady = true;
          render();
          loadData();
        } catch (error) {
          console.error(error);
          setStatus(false, "GitHub 数据读取失败");
        }
      }
      init();
      setInterval(() => {
        if (githubReady) loadData();
      }, CONFIG.REST_INTERVAL);
    </script>
  </body>
</html>
