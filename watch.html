<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binance 冲榜雷达</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0b0f14;
        color: #e8edf3;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }
      .container {
        width: 97%;
        max-width: 1800px;
        margin: 20px auto;
      }
      .header,
      .controls,
      .section-header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .header,
      .section-header {
        justify-content: space-between;
      }
      .header {
        margin-bottom: 15px;
      }
      h1,
      h2 {
        margin: 0;
      }
      h1 {
        font-size: 26px;
      }
      h2 {
        font-size: 17px;
      }
      .controls {
        flex-wrap: wrap;
        margin-bottom: 15px;
      }
      button,
      select {
        border: 1px solid #303944;
        background: #151b23;
        color: #dfe6ee;
        padding: 8px 13px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover,
      select:hover {
        background: #202833;
      }
      button.danger {
        border-color: #7a2831;
        color: #ff7d88;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #666;
      }
      .dot.online {
        background: #00d084;
        box-shadow: 0 0 10px #00d084;
      }
      .dot.offline {
        background: #ff4757;
      }
      .info {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
        margin-bottom: 15px;
      }
      .card,
      .section {
        background: #111720;
        border: 1px solid #252d37;
        border-radius: 8px;
      }
      .card {
        padding: 12px;
      }
      .card-title {
        color: #8995a4;
        font-size: 12px;
        margin-bottom: 5px;
      }
      .card-value {
        font-size: 20px;
        font-weight: bold;
      }
      .section {
        margin-bottom: 15px;
        overflow: hidden;
      }
      .section-header {
        padding: 12px 15px;
        border-bottom: 1px solid #252d37;
      }
      .badge {
        padding: 3px 7px;
        border-radius: 4px;
        background: #202833;
        color: #929eab;
        font-size: 11px;
      }
      .top20-tag {
        color: #55aaff;
        margin-left: 4px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 850px;
      }
      th {
        background: #171e28;
        color: #8f9baa;
        font-size: 12px;
        font-weight: normal;
        padding: 9px;
        white-space: nowrap;
      }
      td {
        padding: 9px;
        border-top: 1px solid #202731;
        text-align: right;
        font-size: 13px;
      }
      th:first-child,
      th:nth-child(2),
      th:nth-child(3),
      td:first-child,
      td:nth-child(2),
      td:nth-child(3) {
        text-align: left;
      }
      tr:hover td {
        background: #151c25;
      }
      .symbol {
        font-weight: bold;
        color: #f2f5f8;
      }
      .rank {
        color: #8995a4;
      }
      .up,
      .rank-up {
        color: #00d084;
      }
      .rank-down,
      .price-down {
        color: #ff5263;
      }
      .neutral {
        color: #929eab;
      }
      .signal {
        font-size: 12px;
        font-weight: bold;
        white-space: nowrap;
      }
      .signal-up {
        color: #00d084;
      }
      .rank-tag {
        color: #00d084;
        margin-left: 4px;
      }
      .favorite-button {
        border: 0;
        background: transparent;
        color: #687482;
        padding: 0 4px;
        font-size: 18px;
        line-height: 1;
      }
      .favorite-button:hover,
      .favorite-button.active {
        background: transparent;
        color: #ffc107;
      }
      .price-tag {
        color: #00d084;
        margin-left: 4px;
      }
      .event-list {
        max-height: 500px;
        overflow-y: auto;
      }
      .event {
        display: grid;
        grid-template-columns: 90px 100px 130px 1fr;
        gap: 10px;
        padding: 10px 15px;
        border-bottom: 1px solid #202731;
        font-size: 13px;
      }
      .event-time {
        color: #7f8b98;
      }
      .event-symbol {
        font-weight: bold;
      }
      .empty {
        padding: 30px;
        text-align: center;
        color: #687482;
      }
      .footer {
        text-align: center;
        color: #5d6874;
        font-size: 12px;
        margin: 20px 0;
      }
      @media (max-width: 1100px) {
        .info {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 700px) {
        .info {
          grid-template-columns: repeat(2, 1fr);
        }
        .event {
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Binance 冲榜雷达</h1>
        <div class="status">
          <span id="statusDot" class="dot"></span
          ><span id="apiStatus">等待行情...</span>
        </div>
      </div>
      <div class="controls">
        <label
          >比较维度
          <select id="dimensionSelect">
            <option value="15m">15min</option>
            <option value="30m">30min</option>
            <option value="1h">1h</option>
            <option value="2h">2h</option>
            <option value="4h">4h</option>
          </select></label
        ><button id="refreshBtn">刷新数据</button
        ><button id="clearBtn" class="danger">清空历史</button>
      </div>
      <div class="info">
        <div class="card">
          <div class="card-title">API 更新时间</div>
          <div class="card-value" id="apiUpdated">--</div>
        </div>
        <div class="card">
          <div class="card-title">快照年龄</div>
          <div class="card-value" id="snapshotAge">--</div>
        </div>
        <div class="card">
          <div class="card-title">历史快照</div>
          <div class="card-value" id="snapshotCount">0</div>
        </div>
      </div>
      <div class="section">
        <div class="section-header">
          <h2>Binance Top20</h2>
          <span class="badge">24h 涨幅排名</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>收藏</th>
                <th>排名</th>
                <th>币种</th>
                <th>24h涨幅</th>
                <th>信号</th>
                <th id="topRankHeader">15min排名</th>
                <th id="topPriceHeader">15min价格</th>
              </tr>
            </thead>
            <tbody id="top20Body"></tbody>
          </table>
        </div>
      </div>
      <div class="section">
        <div class="section-header">
          <h2>冲榜雷达</h2>
          <span class="badge">Top20 之外</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>收藏</th>
                <th>排名</th>
                <th>币种</th>
                <th>24h涨幅</th>
                <th>信号</th>
                <th id="radarRankHeader">15min排名</th>
                <th id="radarPriceHeader">15min价格</th>
              </tr>
            </thead>
            <tbody id="radarBody"></tbody>
          </table>
        </div>
      </div>
      <div class="section">
        <div class="section-header">
          <h2>重要事件</h2>
          <span class="badge">本地保存</span>
        </div>
        <div id="eventList" class="event-list"></div>
      </div>
      <div class="footer">每15分钟请求并保存快照 · 保存4小时历史</div>
    </div>
    <script>
      "use strict";
      const CONFIG = {
        REST_INTERVAL: 15 * 60 * 1000,
        SNAPSHOT_INTERVAL: 15 * 60 * 1000,
        HISTORY_DURATION: 4 * 60 * 60 * 1000,
        STORAGE_KEY: "binance_radar_v4",
        TOP20: 20,
        RADAR_MAX_RANK: 100,
        MAX_EVENTS: 300,
        PRICE_THRESHOLD: {
          "15m": 0.3,
          "30m": 0.8,
          "1h": 1.5,
          "2h": 2.2,
          "4h": 3,
        },
      };
      const OFFSETS = { "15m": 1, "30m": 2, "1h": 4, "2h": 8, "4h": 16 };
      const marketMap = {};
      let history = [],
        events = [],
        alertState = {},
        selectedDimension = "15m";
      let lastApiUpdate = 0;
      let newTop20Symbols = new Set();
      let favorites = new Set();
      function saveStorage() {
        localStorage.setItem(
          CONFIG.STORAGE_KEY,
          JSON.stringify({
            history,
            events,
            alertState,
            favorites: [...favorites],
            savedAt: Date.now(),
          }),
        );
      }
      function loadStorage() {
        try {
          const data = JSON.parse(
            localStorage.getItem(CONFIG.STORAGE_KEY) || "{}",
          );
          history = Array.isArray(data.history) ? data.history : [];
          events = Array.isArray(data.events) ? data.events : [];
          alertState = data.alertState || {};
          favorites = new Set(
            Array.isArray(data.favorites) ? data.favorites : [],
          );
          pruneHistory();
        } catch (error) {
          console.error(error);
        }
      }
      function pruneHistory() {
        const cutoff = Date.now() - CONFIG.HISTORY_DURATION;
        history = history.filter((item) => item.timestamp >= cutoff);
      }
      function formatTime(value) {
        return value ? new Date(value).toLocaleTimeString("zh-CN") : "--";
      }
      function formatPercent(value) {
        return Number.isFinite(value)
          ? `${value > 0 ? "+" : ""}${value.toFixed(2)}%`
          : "--";
      }
      function formatPrice(value) {
        if (!Number.isFinite(value)) return "--";
        if (value >= 1000) return value.toFixed(2);
        if (value >= 1) return value.toFixed(4);
        if (value >= 0.01) return value.toFixed(6);
        return value.toPrecision(6);
      }
      function formatAge(timestamp) {
        if (!timestamp) return "--";
        const minutes = Math.max(0, Math.floor((Date.now() - timestamp) / 60000));
        return minutes < 1 ? "刚刚" : `${minutes} 分钟前`;
      }
      function ranking() {
        return Object.entries(marketMap)
          .sort((a, b) => b[1].change24h - a[1].change24h)
          .map(([symbol]) => symbol);
      }
      function comparison() {
        const index = history.length - 1 - OFFSETS[selectedDimension];
        return index >= 0 ? history[index] : null;
      }
      function momentum(symbol) {
        const old = comparison(),
          currentRank = ranking().indexOf(symbol) + 1;
        if (!old || !old.ranks[symbol] || !currentRank)
          return { rank: null, price: null };
        const oldPrice = old.prices[symbol],
          currentPrice = marketMap[symbol].price;
        return {
          rank: {
            oldRank: old.ranks[symbol],
            currentRank,
            improvement: old.ranks[symbol] - currentRank,
          },
          price: Number.isFinite(oldPrice)
            ? {
                oldPrice,
                currentPrice,
                change: ((currentPrice - oldPrice) / oldPrice) * 100,
              }
            : null,
        };
      }
      function signal(symbol) {
        const item = momentum(symbol);
        if (!item.price || item.price.change <= 0) return "";
        const rankTag =
          item.rank && item.rank.improvement > 0
            ? ` <span class="rank-tag">${item.rank.oldRank} =&gt; ${item.rank.currentRank}</span>`
            : "";
        const priceTag =
          item.price
            ? ` <span class="price-tag">${formatPrice(item.price.oldPrice)} =&gt; ${formatPrice(item.price.currentPrice)}</span>`
            : "";
        return `<span class="signal signal-up">上涨${rankTag}${priceTag}</span>`;
      }
      function metric(symbol, type) {
        const item = momentum(symbol)[type];
        if (!item) return '<span class="neutral">--</span>';
        const value = type === "rank" ? item.improvement : item.change;
        const cls =
          value > 0
            ? "rank-up"
            : value < 0
              ? type === "rank"
                ? "rank-down"
                : "price-down"
              : "neutral";
        return `<span class=\"${cls}\">${type === "rank" ? (value > 0 ? "+" : "") + value : formatPercent(value)}</span>`;
      }
      function renderRows(id, items) {
        const body = document.getElementById(id);
        body.innerHTML = items.length
          ? items
              .map((symbol, index) => {
                const data = marketMap[symbol],
                  rank = ranking().indexOf(symbol) + 1,
                  text = signal(symbol);
                const tag = id === "top20Body" && newTop20Symbols.has(symbol) ? '<span class="badge top20-tag">新进 Top20</span>' : "";
                const isFavorite = favorites.has(symbol);
                const favoriteButton = `<button class="favorite-button${isFavorite ? " active" : ""}" data-symbol="${symbol}" aria-label="${isFavorite ? "取消收藏" : "收藏"}">${isFavorite ? "★" : "☆"}</button>`;
                return `<tr><td>${favoriteButton}</td><td class=\"rank\">#${id === "top20Body" ? index + 1 : rank}</td><td class=\"symbol\">${symbol.replace("USDT", "")} ${tag}</td><td class=\"up\">${formatPercent(data.change24h)}</td><td>${text}</td><td>${metric(symbol, "rank")}</td><td>${metric(symbol, "price")}</td></tr>`;
              })
              .join("")
          : '<tr><td colspan="8"><div class="empty">暂无数据</div></td></tr>';
      }
      function render() {
        const list = ranking();
        document.getElementById("apiUpdated").textContent = formatTime(lastApiUpdate);
        document.getElementById("snapshotAge").textContent = formatAge(history.length ? history[history.length - 1].timestamp : 0);
        document.getElementById("snapshotCount").textContent = history.length;
        renderRows("top20Body", list.slice(0, 20));
        renderRows("radarBody", list.slice(20, 100));
        renderEvents();
      }
      function renderEvents() {
        document.getElementById("eventList").innerHTML = events.length
          ? events
              .map(
                (event) =>
                  `<div class=\"event\"><div class=\"event-time\">${formatTime(event.timestamp)}</div><div class=\"event-symbol\">${event.symbol.replace("USDT", "")}</div><div><span class=\"badge\">TOP20</span></div><div>当前 #${event.rank} · ${event.description}</div></div>`,
              )
              .join("")
          : '<div class="empty">暂无重要事件</div>';
      }
      function evaluateTop20() {
        const list = ranking();
        newTop20Symbols = new Set();
        for (const symbol of list) {
          const state = alertState[symbol] || { top20: false };
          const currentRank = list.indexOf(symbol) + 1;
          const oldRank = comparison()?.ranks[symbol] || 999;
          if (currentRank > 20) {
            state.top20 = false;
            alertState[symbol] = state;
            continue;
          }
          if (!state.top20 && oldRank > 20 && currentRank <= 20) {
            newTop20Symbols.add(symbol);
            events.unshift({
              timestamp: Date.now(),
              symbol,
              type: "TOP20",
              description: "进入 Top20",
              rank: list.indexOf(symbol) + 1,
            });
            state.top20 = true;
            alertState[symbol] = state;
          }
        }
        events = events.slice(0, CONFIG.MAX_EVENTS);
        saveStorage();
      }
      function createSnapshot() {
        const list = ranking();
        if (!list.length) return;
        const ranks = {},
          prices = {};
        list.forEach((symbol, index) => {
          ranks[symbol] = index + 1;
          prices[symbol] = marketMap[symbol].price;
        });
        const timestamp = Date.now();
        history.push({ timestamp, ranks, prices });
        pruneHistory();
        saveStorage();
        document.getElementById("lastSnapshot").textContent =
          formatTime(timestamp);
        render();
      }
      function setStatus(ok, text) {
        document.getElementById("statusDot").className =
          `dot ${ok ? "online" : "offline"}`;
        document.getElementById("apiStatus").textContent = text;
      }
      function loadData() {
        setStatus(false, "正在请求 REST 行情...");
        fetch("https://api.binance.com/api/v3/ticker/24hr")
          .then((response) => {
            if (!response.ok) throw Error(`HTTP ${response.status}`);
            return response.json();
          })
          .then((data) => {
            data.forEach((ticker) => {
              if (!ticker.symbol.endsWith("USDT")) return;
              const price = Number(ticker.lastPrice),
                change = Number(ticker.priceChangePercent);
              if (Number.isFinite(price) && Number.isFinite(change))
                marketMap[ticker.symbol] = {
                  price,
                  change24h: change,
                  updateTime: Date.now(),
                };
            });
            lastApiUpdate = Date.now();
            setStatus(
              true,
              `REST 已更新 · ${new Date().toLocaleTimeString("zh-CN")}`,
            );
            evaluateTop20();
            if (
              !history.length ||
              Date.now() - history[history.length - 1].timestamp >=
                CONFIG.SNAPSHOT_INTERVAL
            ) {
              createSnapshot();
            } else {
              render();
            }
          })
          .catch((error) => {
            console.error(error);
            setStatus(false, "REST 请求失败");
          });
      }
      function clearHistory() {
        if (!confirm("确定清空所有历史快照、事件和报警状态吗？")) return;
        history = [];
        events = [];
        alertState = {};
        localStorage.removeItem(CONFIG.STORAGE_KEY);
        document.getElementById("lastSnapshot").textContent = "--";
        render();
      }
      function toggleFavorite(symbol) {
        if (favorites.has(symbol)) favorites.delete(symbol);
        else favorites.add(symbol);
        saveStorage();
        render();
      }
      loadStorage();
      document
        .getElementById("dimensionSelect")
        .addEventListener("change", (event) => {
          selectedDimension = event.target.value;
          render();
        });
      document.getElementById("refreshBtn").addEventListener("click", loadData);
      document.addEventListener("click", (event) => {
        const button = event.target.closest(".favorite-button");
        if (button) toggleFavorite(button.dataset.symbol);
      });
      document
        .getElementById("clearBtn")
        .addEventListener("click", clearHistory);
      loadData();
      setInterval(loadData, CONFIG.REST_INTERVAL);
    </script>
  </body>
</html>
