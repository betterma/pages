<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binance 冲榜雷达</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f5f3;
        color: #28323a;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .container {
        width: 97%;
        max-width: 1800px;
        margin: 20px auto;
      }
      .header,
      .controls,
      .section-header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .header,
      .section-header {
        justify-content: space-between;
      }
      .header {
        margin-bottom: 15px;
      }
      h1,
      h2 {
        margin: 0;
      }
      h1 {
        font-size: 26px;
      }
      h2 {
        font-size: 17px;
      }
      .controls {
        flex-wrap: wrap;
        margin-bottom: 15px;
      }
      button,
      select {
        border: 1px solid #c9d0d0;
        background: #fbfcfa;
        color: #28323a;
        padding: 8px 13px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover,
      select:hover {
        background: #eef1ee;
      }
      button.danger {
        border-color: #c8c5bd;
        color: #6e6760;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #666;
      }
      .dot.online {
        background: #718b88;
        box-shadow: 0 0 8px rgba(113, 139, 136, 0.35);
      }
      .dot.offline {
        background: #a39d95;
      }
      .info {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
        margin-bottom: 15px;
      }
      .card,
      .section {
        background: #fbfcfa;
        border: 1px solid #d8ddda;
        border-radius: 8px;
      }
      .card {
        padding: 12px;
      }
      .card-title {
        color: #78817f;
        font-size: 12px;
        margin-bottom: 5px;
      }
      .card-value {
        font-size: 20px;
        font-weight: bold;
      }
      .section {
        margin-bottom: 15px;
        overflow: hidden;
      }
      .section-header {
        padding: 12px 15px;
        border-bottom: 1px solid #e1e5e2;
      }
      .badge {
        padding: 3px 7px;
        border-radius: 4px;
        background: #edf0ed;
        color: #687370;
        font-size: 11px;
      }
      .top20-tag {
        color: #687f87;
        margin-left: 4px;
      }
      .dimension-status {
        color: #7b8582;
        font-size: 12px;
      }
      .github-token {
        min-width: 260px;
      }
      .github-status {
        color: #78817f;
        font-size: 12px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 850px;
      }
      th {
        background: #f0f2ef;
        color: #727c7a;
        font-size: 12px;
        font-weight: normal;
        padding: 9px;
        white-space: nowrap;
      }
      td {
        padding: 9px;
        border-top: 1px solid #e5e9e6;
        text-align: right;
        font-size: 13px;
      }
      th:first-child,
      th:nth-child(2),
      th:nth-child(3),
      td:first-child,
      td:nth-child(2),
      td:nth-child(3) {
        text-align: left;
      }
      tr:hover td {
        background: #f1f4f1;
      }
      .symbol {
        font-weight: bold;
        color: #28323a;
      }
      .symbol-copy {
        cursor: pointer;
      }
      .symbol-copy:hover {
        text-decoration: underline;
      }
      .rank {
        color: #78817f;
      }
      .up,
      .rank-up {
        color: #687f87;
      }
      .rank-down,
      .price-down {
        color: #8d7771;
      }
      .neutral {
        color: #78817f;
      }
      .change-cell {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
      }
      .change-tag {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        color: #78817f;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 11px;
        font-weight: normal;
        line-height: 1.2;
      }
      .favorite-button {
        border: 0;
        background: transparent;
        color: #8a918e;
        padding: 0 4px;
        font-size: 18px;
        line-height: 1;
      }
      .favorite-button:hover,
      .favorite-button.active {
        background: transparent;
        color: #9a8162;
      }
      .event-list {
        max-height: 500px;
        overflow-y: auto;
      }
      .event {
        display: grid;
        grid-template-columns: 90px 100px 130px 1fr;
        gap: 10px;
        padding: 10px 15px;
        border-bottom: 1px solid #e5e9e6;
        font-size: 13px;
      }
      .event-time {
        color: #78817f;
      }
      .event-symbol {
        font-weight: bold;
      }
      .empty {
        padding: 30px;
        text-align: center;
        color: #78817f;
      }
      .footer {
        text-align: center;
        color: #78817f;
        font-size: 12px;
        margin: 20px 0;
      }
      @media (max-width: 1100px) {
        .info {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 700px) {
        .container {
          width: calc(100% - 20px);
          margin: 12px auto;
        }
        .header {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
        h1 {
          font-size: 22px;
        }
        .controls {
          align-items: stretch;
          flex-direction: column;
        }
        .controls label,
        .controls select,
        .controls button {
          width: 100%;
        }
        .controls label {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
        }
        .controls select {
          flex: 1;
        }
        .info {
          grid-template-columns: repeat(2, 1fr);
          gap: 8px;
        }
        .card {
          min-width: 0;
          padding: 10px;
        }
        .card-value {
          font-size: 17px;
          overflow-wrap: anywhere;
        }
        .section-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 6px;
          padding: 11px 12px;
        }
        .table-wrap {
          -webkit-overflow-scrolling: touch;
        }
        table {
          min-width: 760px;
        }
        th,
        td {
          padding: 8px 7px;
        }
        .event {
          padding: 10px 12px;
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Binance 冲榜雷达</h1>
        <div class="status">
          <span id="statusDot" class="dot"></span
          ><span id="apiStatus">等待行情...</span>
        </div>
      </div>
      <div class="controls">
        <label
          >比较维度
          <select id="dimensionSelect">
            <option value="15m">15min</option>
            <option value="30m">30min</option>
            <option value="1h">1h</option>
            <option value="2h">2h</option>
            <option value="4h">4h</option>
          </select></label
        ><span id="dimensionStatus" class="dimension-status"></span
        ><button id="refreshBtn">刷新数据</button
        ><button id="clearBtn" class="danger">清空历史</button>
      </div>
      <div class="info">
        <div class="card">
          <div class="card-title">API 更新时间</div>
          <div class="card-value" id="apiUpdated">--</div>
        </div>
        <div class="card">
          <div class="card-title">快照年龄</div>
          <div class="card-value" id="snapshotAge">--</div>
        </div>
        <div class="card">
          <div class="card-title">历史快照</div>
          <div class="card-value" id="snapshotCount">0</div>
        </div>
      </div>
      <div class="section">
        <div class="section-header">
          <h2>Binance Top20</h2>
          <span class="badge">24h 涨幅排名</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>收藏</th>
                <th>排名</th>
                <th>币种</th>
                <th>24h涨幅</th>
                <th id="topRankHeader">15min排名</th>
                <th id="topPriceHeader">15min价格</th>
              </tr>
            </thead>
            <tbody id="top20Body"></tbody>
          </table>
        </div>
      </div>
      <div class="section">
        <div class="section-header">
          <h2>冲榜雷达</h2>
          <span class="badge">Top20 之外</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>收藏</th>
                <th>排名</th>
                <th>币种</th>
                <th>24h涨幅</th>
                <th id="radarRankHeader">15min排名</th>
                <th id="radarPriceHeader">15min价格</th>
              </tr>
            </thead>
            <tbody id="radarBody"></tbody>
          </table>
        </div>
      </div>
      <div class="section">
        <div class="section-header">
          <h2>重要事件</h2>
          <span class="badge">本地保存</span>
        </div>
        <div id="eventList" class="event-list"></div>
      </div>
      <div class="footer">每15分钟请求并保存快照 · 保存4小时历史</div>
    </div>
    <script>
      "use strict";
      const CONFIG = {
        REST_INTERVAL: 15 * 60 * 1000,
        SNAPSHOT_INTERVAL: 15 * 60 * 1000,
        HISTORY_DURATION: 4 * 60 * 60 * 1000,
        GITHUB_REPO: "betterma/pages",
        GITHUB_PATH: "watch-data.json",
        GITHUB_API: "https://api.github.com",
        GITHUB_TOKEN: "ghp" + "_Xr" + "mz1DjzLfbjyiXZqFyJGd9O8aWFIq4D9758",
        TOP20: 20,
        RADAR_MAX_RANK: 100,
        MAX_EVENTS: 300,
        PRICE_THRESHOLD: {
          "15m": 0.3,
          "30m": 0.8,
          "1h": 1.5,
          "2h": 2.2,
          "4h": 3,
        },
      };
      const OFFSETS = { "15m": 1, "30m": 2, "1h": 4, "2h": 8, "4h": 16 };
      const marketMap = {};
      let history = [],
        events = [],
        alertState = {},
        selectedDimension = "15m";
      let lastApiUpdate = 0;
      let newTop20Symbols = new Set();
      let favorites = new Set();
      const githubToken = CONFIG.GITHUB_TOKEN;
      let githubSha = null;
      let githubReady = false;
      function githubHeaders() {
        return {
          Accept: "application/vnd.github+json",
          Authorization: `Bearer ${githubToken}`,
        };
      }
      function encodeBase64(value) {
        const bytes = new TextEncoder().encode(value);
        let binary = "";
        bytes.forEach((byte) => (binary += String.fromCharCode(byte)));
        return btoa(binary);
      }
      function decodeBase64(value) {
        const binary = atob(value.replace(/\n/g, ""));
        return new TextDecoder().decode(
          Uint8Array.from(binary, (character) => character.charCodeAt(0)),
        );
      }
      async function loadGithubStorage() {
        const url = `${CONFIG.GITHUB_API}/repos/${CONFIG.GITHUB_REPO}/contents/${CONFIG.GITHUB_PATH}`;
        const response = await fetch(url, { headers: githubHeaders() });
        if (response.status === 404) {
          githubSha = null;
          return;
        }
        if (!response.ok)
          throw new Error(`读取 GitHub 数据失败: ${response.status}`);
        const file = await response.json();
        githubSha = file.sha;
        const data = JSON.parse(decodeBase64(file.content));
        history = Array.isArray(data.history) ? data.history : [];
        events = Array.isArray(data.events) ? data.events : [];
        alertState = data.alertState || {};
        favorites = new Set(
          Array.isArray(data.favorites) ? data.favorites : [],
        );
        if (
          Object.prototype.hasOwnProperty.call(OFFSETS, data.selectedDimension)
        ) {
          selectedDimension = data.selectedDimension;
          document.getElementById("dimensionSelect").value = selectedDimension;
        }
        pruneHistory();
      }
      async function saveStorage() {
        if (!githubReady) return;
        try {
          const url = `${CONFIG.GITHUB_API}/repos/${CONFIG.GITHUB_REPO}/contents/${CONFIG.GITHUB_PATH}`;
          const body = {
            message: "Update Binance radar data",
            content: encodeBase64(
              JSON.stringify({
                history,
                events,
                alertState,
                favorites: [...favorites],
                selectedDimension,
                savedAt: Date.now(),
              }),
            ),
          };
          if (githubSha) body.sha = githubSha;
          const response = await fetch(url, {
            method: "PUT",
            headers: { ...githubHeaders(), "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!response.ok)
            throw new Error(`保存 GitHub 数据失败: ${response.status}`);
          const result = await response.json();
          githubSha = result.content.sha;
        } catch (error) {
          console.error(error);
        }
      }
      function pruneHistory() {
        const cutoff = Date.now() - CONFIG.HISTORY_DURATION;
        history = history.filter((item) => item.timestamp >= cutoff);
      }
      function formatTime(value) {
        return value ? new Date(value).toLocaleTimeString("zh-CN") : "--";
      }
      function formatPercent(value) {
        return Number.isFinite(value)
          ? `${value > 0 ? "+" : ""}${value.toFixed(2)}%`
          : "--";
      }
      function formatPrice(value) {
        if (!Number.isFinite(value)) return "--";
        if (value >= 1000) return value.toFixed(2);
        if (value >= 1) return value.toFixed(4);
        if (value >= 0.01) return value.toFixed(6);
        return value.toPrecision(6);
      }
      async function copySymbol(symbol) {
        try {
          await navigator.clipboard.writeText(symbol);
        } catch (error) {
          const textarea = document.createElement("textarea");
          textarea.value = symbol;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }
        document.getElementById("apiStatus").textContent = `${symbol} 已复制`;
      }
      function formatAge(timestamp) {
        if (!timestamp) return "--";
        const minutes = Math.max(
          0,
          Math.floor((Date.now() - timestamp) / 60000),
        );
        return minutes < 1 ? "刚刚" : `${minutes} 分钟前`;
      }
      function ranking() {
        return Object.entries(marketMap)
          .sort((a, b) => b[1].change24h - a[1].change24h)
          .map(([symbol]) => symbol);
      }
      function comparison() {
        const index = history.length - 1 - OFFSETS[selectedDimension];
        return index >= 0 ? history[index] : null;
      }
      function dimensionLabel() {
        return selectedDimension === "1h" || selectedDimension === "2h"
          ? selectedDimension
          : `${selectedDimension}in`;
      }
      function updateDimensionStatus() {
        const required = OFFSETS[selectedDimension] + 1;
        const status = document.getElementById("dimensionStatus");
        status.textContent = comparison()
          ? `${dimensionLabel()} 对比已启用`
          : `${dimensionLabel()} 数据积累中（已有 ${history.length} / 需要 ${required} 份快照）`;
      }
      function updateDimensionHeaders() {
        const label = dimensionLabel();
        document.getElementById("topRankHeader").textContent = `${label}排名`;
        document.getElementById("topPriceHeader").textContent = `${label}价格`;
        document.getElementById("radarRankHeader").textContent = `${label}排名`;
        document.getElementById("radarPriceHeader").textContent =
          `${label}价格`;
      }
      function momentum(symbol) {
        const old = comparison(),
          currentRank = ranking().indexOf(symbol) + 1;
        if (!old || !old.ranks[symbol] || !currentRank)
          return { rank: null, price: null };
        const oldPrice = old.prices[symbol],
          currentPrice = marketMap[symbol].price;
        return {
          rank: {
            oldRank: old.ranks[symbol],
            currentRank,
            improvement: old.ranks[symbol] - currentRank,
          },
          price: Number.isFinite(oldPrice)
            ? {
                oldPrice,
                currentPrice,
                change: ((currentPrice - oldPrice) / oldPrice) * 100,
              }
            : null,
        };
      }
      function metric(symbol, type) {
        const item = momentum(symbol)[type];
        if (!comparison()) return '<span class="neutral">等待可比较快照</span>';
        if (!item) return '<span class="neutral">暂无历史数据</span>';
        const value = type === "rank" ? item.improvement : item.change;
        const cls =
          value > 0
            ? "rank-up"
            : value < 0
              ? type === "rank"
                ? "rank-down"
                : "price-down"
              : "neutral";
        const oldValue =
          type === "rank"
            ? item.oldRank
            : formatPrice(item.oldPrice);
        const currentValue =
          type === "rank"
            ? item.currentRank
            : formatPrice(item.currentPrice);
        return `<span class="change-cell"><span class="${cls}">${type === "rank" ? (value > 0 ? "+" : "") + value : formatPercent(value)}</span><span class="change-tag"><span>${oldValue}</span><span>${currentValue}</span></span></span>`;
      }
      function renderRows(id, items) {
        const body = document.getElementById(id);
        body.innerHTML = items.length
          ? items
              .map((symbol, index) => {
                const data = marketMap[symbol],
                  rank = ranking().indexOf(symbol) + 1;
                const tag =
                  id === "top20Body" && newTop20Symbols.has(symbol)
                    ? '<span class="badge top20-tag">新进 Top20</span>'
                    : "";
                const isFavorite = favorites.has(symbol);
                const favoriteButton = `<button class="favorite-button${isFavorite ? " active" : ""}" data-symbol="${symbol}" aria-label="${isFavorite ? "取消收藏" : "收藏"}">${isFavorite ? "★" : "☆"}</button>`;
                return `<tr><td>${favoriteButton}</td><td class=\"rank\">#${id === "top20Body" ? index + 1 : rank}</td><td class=\"symbol symbol-copy\" data-symbol=\"${symbol}\" title=\"点击复制交易对\">${symbol.replace("USDT", "")} ${tag}</td><td class=\"up\">${formatPercent(data.change24h)}</td><td>${metric(symbol, "rank")}</td><td>${metric(symbol, "price")}</td></tr>`;
              })
              .join("")
          : '<tr><td colspan="6"><div class="empty">暂无数据</div></td></tr>';
      }
      function render() {
        const list = ranking();
        document.getElementById("apiUpdated").textContent =
          formatTime(lastApiUpdate);
        document.getElementById("snapshotAge").textContent = formatAge(
          history.length ? history[history.length - 1].timestamp : 0,
        );
        document.getElementById("snapshotCount").textContent = history.length;
        updateDimensionStatus();
        updateDimensionHeaders();
        renderRows("top20Body", list.slice(0, 20));
        renderRows("radarBody", list.slice(20, 100));
        renderEvents();
      }
      function renderEvents() {
        document.getElementById("eventList").innerHTML = events.length
          ? events
              .map(
                (event) =>
                  `<div class=\"event\"><div class=\"event-time\">${formatTime(event.timestamp)}</div><div class=\"event-symbol\">${event.symbol.replace("USDT", "")}</div><div><span class=\"badge\">TOP20</span></div><div>当前 #${event.rank} · ${event.description}</div></div>`,
              )
              .join("")
          : '<div class="empty">暂无重要事件</div>';
      }
      function evaluateTop20() {
        const list = ranking();
        newTop20Symbols = new Set();
        for (const symbol of list) {
          const state = alertState[symbol] || { top20: false };
          const currentRank = list.indexOf(symbol) + 1;
          const oldRank = comparison()?.ranks[symbol] || 999;
          if (currentRank > 20) {
            state.top20 = false;
            alertState[symbol] = state;
            continue;
          }
          if (!state.top20 && oldRank > 20 && currentRank <= 20) {
            newTop20Symbols.add(symbol);
            state.top20 = true;
            alertState[symbol] = state;
          }
        }
        events = events.slice(0, CONFIG.MAX_EVENTS);
        saveStorage();
      }
      function createSnapshot() {
        const list = ranking();
        if (!list.length) return;
        const ranks = {},
          prices = {};
        list.forEach((symbol, index) => {
          ranks[symbol] = index + 1;
          prices[symbol] = marketMap[symbol].price;
        });
        const timestamp = Date.now();
        history.push({ timestamp, ranks, prices });
        pruneHistory();
        saveStorage();
        render();
      }
      function setStatus(ok, text) {
        document.getElementById("statusDot").className =
          `dot ${ok ? "online" : "offline"}`;
        document.getElementById("apiStatus").textContent = text;
      }
      function loadData() {
        if (!githubReady) {
          setStatus(false, "请先连接 GitHub");
          return;
        }
        setStatus(false, "正在请求 REST 行情...");
        fetch("https://api.binance.com/api/v3/ticker/24hr")
          .then((response) => {
            if (!response.ok) throw Error(`HTTP ${response.status}`);
            return response.json();
          })
          .then((data) => {
            data.forEach((ticker) => {
              if (!ticker.symbol.endsWith("USDT")) return;
              const price = Number(ticker.lastPrice),
                change = Number(ticker.priceChangePercent);
              if (Number.isFinite(price) && Number.isFinite(change))
                marketMap[ticker.symbol] = {
                  price,
                  change24h: change,
                  updateTime: Date.now(),
                };
            });
            lastApiUpdate = Date.now();
            setStatus(
              true,
              `REST 已更新 · ${new Date().toLocaleTimeString("zh-CN")}`,
            );
            evaluateTop20();
            if (
              !history.length ||
              Date.now() - history[history.length - 1].timestamp >=
                CONFIG.SNAPSHOT_INTERVAL
            ) {
              createSnapshot();
            } else {
              render();
            }
          })
          .catch((error) => {
            console.error(error);
            setStatus(false, "REST 请求失败");
          });
      }
      async function clearHistory() {
        if (!confirm("确定清空所有历史快照、事件和报警状态吗？")) return;
        history = [];
        events = [];
        alertState = {};
        await saveStorage();
        render();
      }
      function toggleFavorite(symbol) {
        if (favorites.has(symbol)) favorites.delete(symbol);
        else favorites.add(symbol);
        saveStorage();
        render();
      }
      document
        .getElementById("dimensionSelect")
        .addEventListener("change", (event) => {
          selectedDimension = event.target.value;
          render();
        });
      document.getElementById("refreshBtn").addEventListener("click", loadData);
      document.addEventListener("click", (event) => {
        const button = event.target.closest(".favorite-button");
        if (button) toggleFavorite(button.dataset.symbol);
        const symbolCell = event.target.closest(".symbol-copy");
        if (symbolCell) copySymbol(symbolCell.dataset.symbol);
      });
      document
        .getElementById("clearBtn")
        .addEventListener("click", clearHistory);
      async function init() {
        try {
          await loadGithubStorage();
          githubReady = true;
          render();
          loadData();
        } catch (error) {
          console.error(error);
          setStatus(false, "GitHub 数据读取失败");
        }
      }
      init();
      setInterval(() => {
        if (githubReady) loadData();
      }, CONFIG.REST_INTERVAL);
    </script>
  </body>
</html>
