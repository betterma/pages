<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana 发现工具</title>
    <style>
        :root {
            --primary-color: #0f766e;
            --hover-color: #0d9488;
            --text-color: #134e4a;
            --bg-color: #f0fdfa;
            --border-color: #99f6e4;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .top-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            padding: 1rem 0 0.5rem;
        }

        .top-links a {
            display: inline-block;
            padding: 0.6rem 1.1rem;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s ease;
        }

        .top-links a:hover {
            background: var(--hover-color);
        }

        .top-links a.secondary {
            background: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .top-links a.secondary:hover {
            background: rgba(15, 118, 110, 0.08);
        }
        
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .tab-button {
            padding: 0.8rem 1.5rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 0.2rem;
        }
        
        .tab-button:hover {
            color: var(--primary-color);
        }
        
        .tab-button.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        
        .tab-content {
            display: none;
            padding: 1rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .iframe-container {
            position: relative;
            width: 100%;
            height: 90vh;
            min-height: 500px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 768px) {
            .tabs {
                flex-wrap: wrap;
            }
            
            .tab-button {
                flex: 1;
                margin: 0.2rem;
                padding: 0.8rem;
                font-size: 0.9rem;
            }
            
            .iframe-container {
                height: 90vh;
                min-height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-links">
            <a href="../index.html">返回总导航</a>
            <a class="secondary" href="../eth-index.html">Robinhood 发现</a>
            <a class="secondary" href="https://betterma.github.io/">蚂蚱导航</a>
        </div>
        <div class="tabs">
            <button class="tab-button active" data-tab="url-viewer">资源中心</button>
            <button class="tab-button" data-tab="data-comparison-2">数据对比</button>
            <button class="tab-button" data-tab="get-coin-info">获取详情</button>
        </div>
        
        <div class="tab-content active" id="url-viewer">
            <div class="iframe-container">
                <iframe src="../url-viewer.html" title="资源链接中心"></iframe>
            </div>
        </div>
        
        <div class="tab-content" id="data-comparison-2">
            <div class="iframe-container">
                <iframe src="../findNew.html/new.html" title="数据对比工具"></iframe>
            </div>
        </div>

        <div class="tab-content" id="get-coin-info">
            <div class="iframe-container">
                <iframe src="../getcoininfo.html" title="获取详情工具"></iframe>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));
                    
                    button.classList.add('active');
                    const tabId = button.getAttribute('data-tab');
                    document.getElementById(tabId).classList.add('active');
                });
            });
            
            tabButtons[0].click();
        });
    </script>
</body>
</html>
